within 900 mm of each box, cabinet or fitting and supported at least every 3.0 m.\n- Rigid metal conduit and IMC are secured within 900 mm of each box or fitting. The maximum spacing between supports is 3.0 m for 16 mm to 20 mm trade sizes, 4.5 m for 25 mm to 32 mm and 6.0 m for 40 mm to 50 mm and larger.\n- Metal cable trays must be bonded across joints and connected to the grounding system.\n\n## Grounding and bonding\n- A single ground electrode should have a resistance of 25 ohms or less. If it does not, add an electrode.\n- Equipment grounding conductor sized from the overcurrent device ahead of it (PEC Table 2.50.6.13): 15 A needs 2.0 mm^{2}, 60 A needs 5.5 mm^{2}, 100 A needs 8.0 mm^{2}, 200 A needs 14 mm^{2} and 600 A needs 38 mm^{2}.\n- Bonding joins metal parts together so they stay at the same potential and a fault current finds a low-impedance path back to the source.\n- The grounded conductor (neutral) is white or gray. The equipment grounding conductor is green or bare.\nWatch out: The equipment grounding conductor is sized from the rating of the overcurrent device ahead of it, not from the load.\n\n## Motors in the PEC\n- A conductor to a single continuous-duty motor must have an ampacity of at least 125% of the motor full-load current (PEC 4.30.2.2).\n- A feeder to several motors: 125% of the largest motor full-load current plus the sum of the full-load currents of the others (4.30.2.4).\n- Short-circuit and ground-fault protection of a single-phase motor branch circuit (Table 4.30.4.2), as a percent of the full-load current: non-time-delay fuse 300%, dual-element (time-delay) fuse 175%, instantaneous-trip breaker 800%, inverse-time breaker 250%.\n- The disconnecting means must be in sight of the motor and the machine, within 15 m, and rated at least 115% of the motor full-load current.\n- Overload protection is usually set at 115% of the nameplate current for motors with a service factor of 1.15 or more or a temperature rise of 40 °C or less, and at 125% for other motors.\n- The starting (locked-rotor) current is five to six times the full-load current.\n- Generator conductors from the terminals must carry at least 115% of the nameplate current.\nTip: Use the full-load current from the PEC motor tables, not the nameplate, for sizing conductors and protection. Use the nameplate current for the overload.\n\n## Working space and panelboards\n- Working space in front of equipment of 0 to 600 V: at least 750 mm wide or as wide as the equipment, whichever is greater, at least 2.0 m high, with doors able to open at least 90 degrees.\n- Depth of the working space: for 0 to 150 V to ground, 0.9 m. For 151 to 600 V to ground, 0.9 m (Condition 1, live parts on one side only), 1.0 m (Condition 2, live parts on both sides) and 1.2 m (Condition 3, live parts on both sides with grounded parts between).\n- The main or upstream overcurrent device cannot be rated higher than the busbar of a panelboard.\n\n## Hazardous (classified) locations\n- Class I: flammable gases or vapors. Class II: combustible dust. Class III: easily ignitable fibers and flyings.\n- Division 1: the hazard exists under normal operating conditions. Division 2: the hazard exists only under abnormal conditions, such as a leak or a failure.\n- In Class I Division 1 locations the wiring is rigid metal conduit or equivalent with sealed fittings, and the equipment is explosion-proof.\n- Gasoline stations, paint spray booths, grain elevators and flour mills are the usual examples.\n\n@Section: Notes\n@Source: Claude summary from the text of RA 11058 on lawphil and DOLE study material (verify rules, fines and ratios against the current DOLE issuances)\n@Subject: ESAS\n@Topic: OSH\n\n## Occupational safety and health at a glance\n- RA 11058, \"An Act Strengthening Compliance with Occupational Safety and Health Standards and Providing Penalties for Violations Thereof,\" was approved on August 17, 2018. Its implementing rules are DOLE Department Order 198-18 (DO 198-18).\n- The older Occupational Safety and Health Standards (OSHS, 1978) are still the technical rules. They are numbered in rules, for example Rule 1020 (registration), Rule 1040 (health and safety committee) and Rule 1050 (notification and records of accidents).\n- The law covers all establishments, projects and sites in all branches of economic activity, including those in economic zones. The public sector is covered by separate rules.\n- The employer provides a safe workplace, information, training, protective equipment and a safety program. Workers have the rights to know, to refuse unsafe work and to report. The DOLE can fine a violator per day until the violation is corrected, and can stop the work.\n- Hazard control follows a hierarchy from elimination down to protective equipment. Accident performance is measured with the frequency rate and the severity rate.\nWatch out: A revised IRR, DO 252-25, is reported to take effect on May 16, 2025. Check the DOLE's current issuance for changes in ratios and reports.\n\n## RA 11058: duties of employers and workers\n- Employers must: provide a workplace free of hazardous conditions that are likely to cause death, illness or physical harm; give complete job safety instructions or orientation to all workers, especially first-time entrants; inform workers of the hazards, the preventive measures and the emergency steps; use only approved devices and equipment; comply with the OSH standards, including training, medical examinations and protective devices; let workers and their representatives take part in the safety program; and provide for emergency and accident measures, including first aid.\n- Employers must also prepare and keep a written workplace OSH program, appoint the required safety officers or OH personnel, give every worker a mandatory eight-hour OSH orientation, provide free protective equipment, and organize a health and safety committee.\n- Workers must help ensure compliance, use the safeguards that are provided, follow the emergency procedures, and report to the supervisor any work hazard they find.\n\n## RA 11058: rights of workers\n- Right to know (Sec. 5): workers must be informed by the employer of all types of hazards in the workplace, and trained in how to prevent them.\n- Right to refuse unsafe work (Sec. 6): workers may refuse unsafe work without reprisal when an imminent danger exists and the employer has not corrected it. Imminent danger is a condition or practice that could reasonably be expected to lead to death or serious physical harm.\n- Right to report (Sec. 7): workers may report accidents and hazards to the employer, to the DOLE and to other agencies.\n- Right to protective equipment (Sec. 8): the employer provides it free of charge, based on the evaluation of the safety officer.\nTip: Know, refuse, report, protect. The employer pays for the protective equipment.\n\n## RA 11058: penalties and work stoppage\n- Administrative fine (Sec. 28): up to Php 100,000 per day until the violation is corrected. The highest amount applies where the violation exposes workers to the risk of death, serious injury or serious illness. The fine does not prevent a criminal or civil case in the courts.\n- The DOLE Secretary may order a stoppage of work or suspension of operations where non-compliance poses a grave and imminent danger (Sec. 22). A safety officer may also issue a work stoppage order when necessary.\n- DO 198-18 lists the daily fines by kind of violation, counted from the notice of violation until it is corrected: failure to register Php 20,000; failure to submit the required reports Php 30,000; failure to appoint safety officers or OH personnel Php 40,000; failure to give the eight-hour orientation Php 40,000; failure to provide free protective equipment Php 50,000; failure to organize the health and safety committee Php 50,000; non-compliance with a work stoppage order Php 50,000; refusing the entry of a DOLE inspector Php 100,000; an omission that causes a fatal or catastrophic injury Php 100,000.\n- Fines are added together. They go to an OSH special fund.\nWatch out: The schedule of daily fines is from a study summary of DO 198-18. Check the order for the latest amounts.\n\n## Safety officers, the committee and the program\n- The establishment classifies itself as low, medium or high risk using its hazard identification, risk assessment and control (HIRAC). The risk class and the number of workers decide how many safety officers, OH personnel and medical facilities it needs.\n- Safety officer levels: SO1 has the eight-hour OSH orientation and a short training of trainers. SO2 has the 40-hour BOSH (general industry) or COSH (construction) course. SO3 is an SO2 with 48 more hours of advanced training and two years of experience. SO4 is an SO3 with 80 more hours of advanced training and four years of experience.\n- Higher risk and larger workforces need higher levels and more officers. A certified OSH consultant (SO4) may stand in for up to one year while a designated officer completes the training.\n- Health and safety committee (Rule 1040): organized within one month after the establishment starts operating. The employer or the top official is the chairman, the safety officer is the secretary, and the members are supervisors and worker representatives (from the union, or elected if there is none). It meets at least monthly.\n- The workplace OSH program covers HIRAC, medical surveillance, emergency preparedness and the special policies such as drug-free workplace, HIV/AIDS, tuberculosis and hepatitis B.\n- Registration (Rule 1020): an establishment registers with the DOLE at least 30 days before it starts operating.\n\n## Accident reports and records (Rule 1050)\n- A fatal accident, a permanent total disability or a catastrophic accident must be notified to the DOLE regional office within 24 hours.\n- The work accident/illness report (WAIR) is submitted on or before the 20th day of the month after the accident.\n- The annual exposure data report (AEDR), with the man-hours worked and the injuries, is due on or before January 30 of the next year.\n- Disabling injuries are those that keep a worker away from work (lost time). Days are charged by a standard table: death or permanent total disability 6,000 days, arm above the elbow 4,500, hand at the wrist 3,000, thumb 600.\n- The frequency rate and the severity rate are in the Formulas section.\nWatch out: Forms and deadlines change with new orders. Check the form number and date for the year you are reading.\n\n## Hazard control\n- Hierarchy of controls, from best to last resort: elimination, substitution, engineering controls (guards, ventilation, interlocks), administrative controls (procedures, training, rotation, signs) and protective equipment.\n- HIRAC: identify the hazards, assess the risk (likelihood × severity), then control it and review.\n- Job hazard analysis: break a job into steps, list the hazard of each step and the control.\n- Personal protective equipment is the last line of defense. It does not remove the hazard.\n- Toolbox meetings are short talks at the start of a shift.\n\n## Fire classes and extinguishers\n- Fire needs fuel, heat and oxygen (the fire triangle). The chain reaction is the fourth side of the fire tetrahedron.\n- Class A: ordinary combustibles such as wood, paper, cloth and rubber. Water cools the fuel.\n- Class B: flammable liquids and gases. Use foam, carbon dioxide or dry chemical.\n- Class C: energized electrical equipment. Use a non-conducting agent such as carbon dioxide or dry chemical. Never water.\n- Class D: combustible metals such as magnesium, sodium and titanium. Use a special dry powder.\n- Class K: cooking oils and fats. Use wet chemical.\n- Fire safety in the Philippines follows RA 9514, the Fire Code of the Philippines.\nTip: Class C is the one an electrical engineer meets: de-energize first if possible, and use carbon dioxide or dry chemical.\n\n## Safety colors and signs\n- Red: danger, stop and fire protection equipment.\n- Orange: warning, for dangerous parts of machines and energized equipment.\n- Yellow: caution, for physical hazards such as striking against, stumbling, falling and tripping.\n- Green: safety, first aid and emergency equipment.\n- Blue: information.\n- Black and white: traffic and housekeeping markings.\nWatch out: These are the usual meanings from the ANSI and OSHA safety color standards. A Philippine reviewer table may add purple or magenta for radiation and may differ in detail. Use the table of your reviewer if it differs.\n\n## Electrical safety\n- Current, not voltage alone, decides the injury, and the path through the body matters most. Typical teaching values for 60 Hz: about 1 mA is the threshold of perception, about 10 mA is the let-go limit (the muscles cannot release the wire), 30 mA can stop breathing, and 50 mA to 100 mA or more can cause ventricular fibrillation. Very high currents cause severe burns.\n- Body resistance is about 100,000 ohms for dry skin, about 1,000 ohms when wet, and about 300 to 500 ohms inside the body. Wet skin makes shock far more dangerous.\n- Lockout/tagout: prepare and notify, shut down, isolate the energy source, apply the lock and tag, release the stored energy, then verify with a test before touching. Only the person who put on the lock removes it.\n- Treat every conductor as live until it is tested and proved dead.\n- Approach boundaries around exposed live parts (NFPA 70E): the limited approach boundary (only qualified persons or escorted persons may cross), the restricted approach boundary (only qualified persons with protection), and the arc flash boundary (the distance at which an arc flash would give a second-degree burn).\n- Arc-rated clothing is chosen by the incident energy in cal/cm^{2}. The NFPA 70E categories 1 to 4 have minimum ratings of 4, 8, 25 and 40 cal/cm^{2}.\n- Rubber insulating gloves by class and maximum use voltage (AC): Class 00 500 V, Class 0 1,000 V, Class 1 7,500 V, Class 2 17,000 V, Class 3 26,500 V, Class 4 36,000 V.\n- Ground-fault circuit interrupters protect people. They trip at about 5 mA.\n\n## Noise\n- The permissible exposure limit is 90 dBA for 8 hours. For every 5 dBA increase the allowed time is halved.\n- Hearing protection is required when the exposure goes above the limit. The Formulas section has the time formula.\n\n@Section: Notes\n@Source: Claude starter summary (standard general chemistry and electrical materials: cell voltages are nominal, so check them against your reviewer)\n\n@Subject: ESAS\n@Topic: Chemistry\n\n## Atomic masses: the rounded values and the next few elements\n- Rounded values most problems use: H 1, C 12, N 14, O 16, Na 23, Mg 24, Al 27, Si 28, P 31, S 32, Cl 35.5, K 39, Ca 40, Fe 56, Cu 63.5, Zn 65, Ag 108, Pb 207. If the problem gives its own values, use those.\n- The full values are in the three \"Atomic masses\" formula cards. Learn them in order of atomic number: 1, 3, 6, 7, 8, 9, 11, 12, 13, 14 and then 15, 16, 17, 18, 19, 20, 24, 25, 26, 28 and then 29, 30, 35, 47, 48, 50, 53, 79, 80, 82.\n- Other elements that turn up now and then: He 4.003, Be 9.012, B 10.81, Ne 20.18, Ti 47.87, Co 58.93, As 74.92, Ba 137.33, W 183.84, Pt 195.08, U 238.03.\n- One atomic mass unit is 1.6605 × 10^{-27} kg. The atomic mass of an element in amu is the same number as its molar mass in g/mol.\nTip: write the molar mass of the compound as a sum first, for example H_{2}SO_{4} = 2(1.008) + 32.06 + 4(15.999) = 98.07, so a slip in one term is easy to spot.\n\n## Atoms and the periodic table\n- A period is a row (7 of them) and a group is a column (18 of them). Elements in a group have the same number of valence electrons and behave alike.\n- Group 1 is the alkali metals, group 2 the alkaline earth metals, groups 3 to 12 the transition metals, group 17 the halogens and group 18 the noble gases.\n- Metalloids sit along the staircase: B, Si, Ge, As, Sb and Te. Silicon and germanium are the semiconductor elements.\n- Across a period, atomic radius falls and ionization energy and electronegativity rise. Down a group, radius rises and ionization energy and electronegativity fall. Fluorine is the most electronegative element.\n- Ionic bonds join a metal and a nonmetal by transferring electrons. Covalent bonds share electrons between nonmetals. A metallic bond is a sea of shared electrons, which is why metals conduct.\n- Electron configuration follows the filling order 1s 2s 2p 3s 3p 4s 3d 4p. Sodium is [Ne] 3s^{1}, chlorine is [Ne] 3s^{2} 3p^{5} and iron is [Ar] 4s^{2} 3d^{6}.\n- Isotopes have the same number of protons and a different number of neutrons. The atomic mass on the table is the abundance-weighted average.\n\n## Cells and batteries\n- A primary cell cannot be recharged. A secondary cell (storage battery) can. Cells in series add their voltages. Cells in parallel keep the voltage and add the capacity, which is quoted in ampere-hours.\n- Lead-acid: positive plate PbO_{2}, negative plate spongy lead, electrolyte dilute sulfuric acid, about 2 V per cell (a 12 V battery has 6 cells). On discharge both plates turn into PbSO_{4} and the acid gets weaker, so the specific gravity of the electrolyte falls. Pb + PbO_{2} + 2H_{2}SO_{4} ⇌ 2PbSO_{4} + 2H_{2}O.\n- Nickel-cadmium: nickel oxyhydroxide positive, cadmium negative, potassium hydroxide electrolyte, 1.2 V per cell. It can show the memory effect. Cadmium is toxic. Nickel-metal hydride is also 1.2 V and holds more energy.\n- Nickel-iron (Edison) cell: 1.2 V, potassium hydroxide, a rugged battery with a long life.\n- Lithium-ion: about 3.6 to 3.7 V nominal and 4.2 V when fully charged. It has no memory effect and a high energy density.\n- Zinc-carbon (Leclanché) dry cell: 1.5 V, zinc can as the negative terminal, carbon rod as the positive terminal, manganese dioxide as the depolarizer and ammonium chloride as the electrolyte.\n- Alkaline cell: 1.5 V, zinc and manganese dioxide with potassium hydroxide, lasts longer than zinc-carbon. Silver oxide is 1.55 V, mercury cell 1.35 V, lithium primary cell about 3 V.\n- Daniell cell: zinc and copper, 1.1 V. Weston cell: cadmium and mercury, about 1.018 V, used as a voltage standard.\n- Fuel cell: hydrogen and oxygen react to give water and electricity. The theoretical cell voltage is 1.23 V.\n- Polarization is the build-up of hydrogen bubbles on the positive plate of a primary cell. A depolarizer removes them.\nWatch out: on charge the lead-acid cell gases hydrogen, which is explosive. Keep sparks away and ventilate the battery room.\n\n## Metals, alloys and corrosion\n- Best conductors in order: silver, copper, gold, aluminum. Copper is the standard for wiring and aluminum is used where weight matters.\n- Steel is iron with a little carbon. Stainless steel adds chromium (at least about 10.5%) and usually nickel. Silicon steel (about 3% silicon) is used for transformer and motor cores.\n- Brass is copper and zinc. Bronze is copper and tin. Solder is tin and lead, and lead-free solder is tin with silver and copper.\n- Nichrome (nickel and chromium) is heater wire. Constantan (copper and nickel) and manganin (copper, manganese and nickel) are resistance wires because their resistance hardly changes with temperature.\n- Duralumin is aluminum with copper, magnesium and manganese. Alnico (aluminum, nickel, cobalt) is a permanent magnet alloy. Invar is iron and nickel with very small expansion. An amalgam is an alloy of mercury.\n- Iron rusts only when oxygen and water are both present. Salt and acid speed it up. At the anode Fe → Fe^{2+} + 2e^{−}. At the cathode O_{2} + 2H_{2}O + 4e^{−} → 4OH^{−}.\n- Two different metals in contact in a damp place form a galvanic cell, and the more active metal corrodes. This is why aluminum-to-copper connections need bimetallic lugs or an antioxidant joint compound.\n- Protection: paint or plating, galvanizing (a zinc coating), a sacrificial anode of zinc, magnesium or aluminum, or impressed-current cathodic protection.\nWatch out: a scratched galvanized sheet still protects the iron because zinc is more active than iron. A scratched tin-plated sheet does not, and the iron rusts faster, because iron is more active than tin.\n\n@Section: Notes\n@Source: Claude summary from PEC study material (check section numbers and the 75% fixed-appliance rule against your edition of the Philippine Electrical Code)\n\n@Subject: ESAS\n@Topic: PEC\n\n## Order of work for a dwelling load computation\n- Step 1: general lighting load = floor area × 24 VA/m^{2}.\n- Step 2: add the small-appliance circuits (2 × 1,500 VA) and the laundry circuit (1,500 VA).\n- Step 3: apply the demand steps to that total: the first 3,000 VA at 100%, the next up to 120,000 VA at 35%, and the rest at 25%.\n- Step 4: add the other loads after the demand steps: the range (8 kW demand for a range of 12 kW or less), four or more fixed appliances at 75%, and the motors (125% on the largest one only).\n- Step 5: divide the total VA by the service voltage to get the amperes, which is the service or feeder current.\n- Step 6: choose the next standard ampere rating for the overcurrent device, and a conductor with at least that ampacity after the temperature and number-of-conductor corrections.\n- Step 7: check the voltage drop (3% branch, 3% feeder, 5% total) and size the equipment grounding conductor from the overcurrent device.\nTip: a continuous load goes in at 125% before any of these steps. A question that says \"continuous\" is testing that rule.\nWatch out: demand factors are applied to the loads they are written for. Do not apply the dwelling lighting steps to the range or to motors.\n\n## Which PEC rule answers which question\n- How big is the breaker? Standard ratings (2.40.1.6) and the next-higher rule, with the small-conductor limit of 15, 20 and 30 A for 2.0, 3.5 and 5.5 mm^{2}.\n- How big is the wire? The ampacity table at the right temperature rating, then the temperature factor and the adjustment factor for the number of conductors.\n- How much load can I count? The unit lighting loads (Table 2.20.2.3) and the demand factors (Table 2.20.3.3).\n- How big is the motor feeder? 125% of the largest motor full-load current plus the others at 100%.\n- How big is the ground wire? Sized from the overcurrent device ahead of it.\n- How much room is needed? The working-space width, height and depth for the voltage and condition.\n- Is the device strong enough? Its interrupting rating must be at least the available fault current.\n\n@Section: Formulas\n@Source: Claude summary (standard digital logic and computer fundamentals; check the notation against your reviewer)\n\n@Subject: ESAS\n@Topic: Computer and Logic\n\n## Logic gates and truth tables\nAND: Y = A B. The output is 1 only when all the inputs are 1.\nOR: Y = A + B. The output is 1 when any input is 1.\nNOT: Y = A'. The output is the opposite of the input.\nNAND: Y = (A B)'. It is the opposite of AND. The output is 0 only when all the inputs are 1.\nNOR: Y = (A + B)'. It is the opposite of OR. The output is 1 only when all the inputs are 0.\nXOR: Y = A ⊕ B = A'B + A B'. The output is 1 when an odd number of inputs are 1.\nXNOR: Y = (A ⊕ B)' = A B + A'B'. The output is 1 when the inputs are equal.\nTwo inputs, A B = 00, 01, 10, 11: AND gives 0 0 0 1. OR gives 0 1 1 1. NAND gives 1 1 1 0. NOR gives 1 0 0 0. XOR gives 0 1 1 0.\nNote: n inputs have 2^{n} rows in the truth table.\n\n## More Boolean identities\nCommutative: A + B = B + A, and A B = B A\nDistributive: A (B + C) = A B + A C, and A + B C = (A + B)(A + C)\nA + 1 = 1, and A · 0 = 0\n(A')' = A\nA (A + B) = A\nA (A' + B) = A B\nConsensus: A B + A'C + B C = A B + A'C\nDuality: swap AND and OR, and swap 0 and 1, and an identity stays true.\n\n## Sum of products and product of sums\nMinterm: an AND term with every variable, equal to 1 for exactly one row of the truth table. n variables have 2^{n} minterms.\nMaxterm: an OR term with every variable, equal to 0 for exactly one row.\nSum of products (SOP): OR together the minterms where the output is 1.\nProduct of sums (POS): AND together the maxterms where the output is 0.\nΣm(1, 3, 5, 7) for A B C is the minterms with C = 1, so F = C.\nNote: the minterm of row 5 (A B C = 101) is A B'C. A 0 gets a bar and a 1 does not.\n\n## Karnaugh map rules\nThe rows and columns are in Gray-code order: 00, 01, 11, 10.\nGroup the 1s in rectangles of 1, 2, 4, 8 or 16 cells, as large as possible.\nA group of 2^{k} cells drops k variables from the term.\nCells on opposite edges are adjacent (the map wraps around).\nA don't-care X may be taken as 1 or 0, whichever gives larger groups.\nEvery 1 must be in at least one group, and groups may overlap.\nUse the groups of 1s for SOP. Use the groups of 0s for POS.\n\n## Adders and subtractors\nHalf adder: Sum = A ⊕ B, Carry = A B\nFull adder: Sum = A ⊕ B ⊕ C_{in}, C_{out} = A B + C_{in}(A ⊕ B)\nA full adder is two half adders and an OR gate.\nHalf subtractor: Difference = A ⊕ B, Borrow = A'B\nFull subtractor: D = A ⊕ B ⊕ B_{in}, B_{out} = A'B + (A ⊕ B)' B_{in}\nRipple-carry adder: n full adders in a chain, so the carry delay grows with n.\nSubtraction A − B with an adder: add the two's complement of B.\n\n## Combinational building blocks\nMultiplexer: 2^{n} data inputs need n select lines (a 4:1 mux has 2 select lines, an 8:1 mux has 3).\nDemultiplexer: one input goes to one of 2^{n} outputs chosen by n select lines.\nDecoder: n inputs give 2^{n} outputs, and one output is active (3-to-8 decoder).\nEncoder: 2^{n} inputs give an n-bit code (8-to-3 encoder). A priority encoder picks the highest active input.\nA 2^{n}:1 multiplexer with the n variables on its select lines can produce any function of n variables. Wire each data input to 0 or 1 from the truth table.\nWith only 2^{n-1} data inputs, put n − 1 variables on the select lines and wire the data inputs to 0, 1, the last variable or its complement.\nMagnitude comparator: gives the outputs A > B, A = B and A < B.\n\n## Flip-flops: characteristic equations\nSR: Q_{next} = S + R'Q, with S R = 0 (S = R = 1 is not allowed)\nJK: Q_{next} = J Q' + K'Q. J = K = 0 holds, J = 1 K = 0 sets, J = 0 K = 1 resets, J = K = 1 toggles.\nD: Q_{next} = D\nT: Q_{next} = T ⊕ Q = T Q' + T'Q. T = 1 toggles and T = 0 holds.\nEdge-triggered flip-flops change only at the clock edge. A latch follows its inputs for the whole time it is enabled.\nNote: a JK flip-flop with J = K = 1 and a long clock pulse can race around. A master-slave or edge-triggered design avoids it.\n\n## Counters and shift registers\nn flip-flops count 2^{n} states, from 0 to 2^{n} − 1.\nA mod-N counter needs n = ⌈log_{2} N⌉ flip-flops.\nEach flip-flop divides the frequency by 2. A mod-N counter gives f_{out} = f_{in}/N.\nRing counter: n flip-flops give n states. Johnson (twisted-ring) counter: n flip-flops give 2n states.\nShift register: n flip-flops hold n bits. Loading n bits serially takes n clock pulses.\nAsynchronous (ripple) counter: each flip-flop is clocked by the one before it. Synchronous counter: one common clock.\nExample: a mod-60 counter needs ⌈log_{2} 60⌉ = 6 flip-flops. A 60 Hz clock divided by 60 gives 1 Hz.\n\n## Memory size and addressing\nn address lines give 2^{n} memory locations.\nCapacity = number of locations × bits per location\n1 K = 1,024 and 1 M = 1,048,576\nNumber of chips = (total capacity)/(capacity of one chip)\nExample: 16 address lines and an 8-bit word: 2^{16} = 65,536 locations × 8 bits = 64 KB, with addresses 0000 to FFFF in hexadecimal.\nExample: 1 M × 8 memory needs 20 address lines.\nExample: 16 K × 8 memory built from 4 K × 4 chips needs (16 × 8)/(4 × 4) = 8 chips.\nNote: a 4 K block has 12 address lines, so the address range is 000 to FFF.\n\n## BCD, Gray code and parity\nBCD (8421): each decimal digit is its own 4 bits. 59 is 0101 1001.\nBCD addition: if a 4-bit sum is greater than 9, add 0110 to that group.\nExcess-3 code = BCD + 0011\nGray code: successive values differ in only one bit. For 3 bits: 000, 001, 011, 010, 110, 111, 101, 100.\nBinary to Gray: G_{n} = B_{n}, and G_{i} = B_{i+1} ⊕ B_{i}\nGray to binary: B_{n} = G_{n}, and B_{i} = B_{i+1} ⊕ G_{i}\nExample: binary 1011 gives Gray 1110, and Gray 1110 gives back 1011.\nEven parity: the parity bit makes the total number of 1s even. Odd parity makes it odd. Parity finds a single-bit error.\n\n## ASCII and character codes\nASCII uses 7 bits, which is 128 characters. Extended ASCII uses 8 bits, which is 256.\nSpace = 32 (20h), '0' = 48 (30h), '9' = 57 (39h)\n'A' = 65 (41h), 'Z' = 90 (5Ah), 'a' = 97 (61h), 'z' = 122 (7Ah)\nLine feed = 10 (0Ah), carriage return = 13 (0Dh)\nA lowercase letter = the capital + 32 (change bit 5)\nUnicode (UTF-8) covers other scripts and uses 1 to 4 bytes per character.\n\n## Binary arithmetic and fractions\nBinary addition: 0+0 = 0, 0+1 = 1, 1+1 = 10 (write 0, carry 1), 1+1+1 = 11\nDigit value in base b: the number is Σ (digit × b^{position}), counting from 0 at the right\nFraction to binary: multiply the fraction by 2 again and again and read the whole parts from the first to the last. 0.625 = 0.101_{2}\nOverflow in two's complement: the two numbers have the same sign and the result has the other sign.\nHexadecimal digits: A = 10, B = 11, C = 12, D = 13, E = 14, F = 15\nRange of n bits: unsigned 0 to 2^{n} − 1. Two's complement −2^{n-1} to 2^{n-1} − 1. Sign-magnitude and one's complement −(2^{n-1} − 1) to 2^{n-1} − 1\nExample: 0.625 × 2 = 1.25 (1), 0.25 × 2 = 0.5 (0), 0.5 × 2 = 1.0 (1), so 0.625 = 0.101_{2}.\n\n## Floating point (IEEE 754)\nSingle precision: 1 sign bit, 8 exponent bits (bias 127), 23 fraction bits\nDouble precision: 1 sign bit, 11 exponent bits (bias 1023), 52 fraction bits\nValue = (−1)^{s} × 1.f × 2^{(e − bias)}, where f is the fraction bits and e is the stored exponent.\nAn exponent of all 0s means zero or a tiny (subnormal) number. An exponent of all 1s means infinity or not a number.\nSingle precision gives about 7 decimal digits. Double gives about 15 to 16.\nExample: 6.5 = 110.1_{2} = 1.101_{2} × 2^{2}. Exponent 2 + 127 = 129 = 10000001_{2}. The bits are 0 10000001 10100000000000000000000, which is 40D00000 in hexadecimal.\nExample: −0.75 = −1.1_{2} × 2^{-1}. Exponent −1 + 127 = 126 = 01111110_{2}. The hexadecimal word is BF400000.\n\n## Logic levels and noise margin\nStandard TTL: V_{OH(min)} = 2.4 V, V_{OL(max)} = 0.4 V, V_{IH(min)} = 2.0 V, V_{IL(max)} = 0.8 V, supply 5 V\nHigh-level noise margin: NM_{H} = V_{OH(min)} − V_{IH(min)}\nLow-level noise margin: NM_{L} = V_{IL(max)} − V_{OL(max)}\nFan-out: the number of gate inputs one output can drive.\nPower dissipation of a gate: P = V_{CC} I_{CC}\nPropagation delay: the time for an input change to reach the output.\nExample: standard TTL gives NM_{H} = 2.4 − 2.0 = 0.4 V and NM_{L} = 0.8 − 0.4 = 0.4 V.\nNote: CMOS draws very little power when it is not switching. TTL draws more but was the older standard.\n\n## Clock, frequency and data rate\nFrequency f = 1/T, and period T = 1/f\nBit rate = baud rate × bits per symbol\nTransfer time = file size in bits/bit rate\nA serial byte with a start bit and a stop bit (8N1) takes 10 bits, so bytes per second = baud/10.\nExample: 9,600 baud with 8N1 sends 960 bytes per second.\nExample: a 100 MB file over an 8 Mb/s link takes 100 × 8/8 = 100 s, ignoring overhead.\nNote: bit rates are quoted in bits per second (b/s) and file sizes in bytes (B). Convert before dividing.\n\n## ADC and DAC\nResolution (step size) = V_{FS}/2^{n} for an n-bit converter\nNumber of levels = 2^{n}\nDAC output = V_{ref} × (digital value/2^{n})\nNyquist sampling: the sampling rate must be at least twice the highest signal frequency, f_{s} ≥ 2 f_{max}\nQuantization error is at most half a step.\nExample: an 8-bit ADC with a 5 V full scale has a step of 5/256 = 19.5 mV.\nNote: some books divide by 2^{n} − 1 instead. For 8 bits that gives 19.6 mV. Use the one your reviewer uses.\n\n## Networks: addresses and ports\nIPv4 address: 32 bits, written as four decimal numbers 0 to 255. IPv6: 128 bits. MAC address: 48 bits\nClass A: 1 to 126 (mask 255.0.0.0). Class B: 128 to 191 (mask 255.255.0.0). Class C: 192 to 223 (mask 255.255.255.0). Class D: 224 to 239 (multicast)\nPrivate ranges: 10.0.0.0 to 10.255.255.255, 172.16.0.0 to 172.31.255.255, and 192.168.0.0 to 192.168.255.255\nUsable hosts in a subnet = 2^{h} − 2, where h is the number of host bits. Subnets = 2^{s}, where s is the number of borrowed bits.\nPorts: FTP 21, SSH 22, Telnet 23, SMTP 25, DNS 53, HTTP 80, POP3 110, IMAP 143, HTTPS 443\nExample: the mask 255.255.255.192 has 26 network bits. That leaves 6 host bits, so 64 addresses and 62 usable hosts.\nExample: splitting a Class C network (24 network bits) into 4 subnets borrows 2 bits. The mask then has 26 network bits, 255.255.255.192.\n\n## OSI model layers\n7 Application: HTTP, FTP, SMTP, DNS\n6 Presentation: encryption, compression, data format\n5 Session: opens, keeps and closes a dialogue\n4 Transport: TCP (reliable) and UDP (fast, no connection check)\n3 Network: IP addresses and routing. The router works here.\n2 Data link: MAC addresses and frames. The switch works here. Ethernet is here.\n1 Physical: cables, signals and bits. The hub and repeater work here.\nMnemonic from layer 7 to 1: \"All People Seem To Need Data Processing\"\nNote: the TCP/IP model has four layers: application, transport, internet and network access.\n\n## Flowchart symbols and basic algorithms\nOval: start or end. Rectangle: a process or instruction. Diamond: a decision (yes or no). Parallelogram: input or output. Arrows: the flow.\nControl structures: sequence, selection (if-then-else) and repetition (loops).\nLinear search: checks each item, so it takes up to n steps. It works on any list.\nBinary search: needs a sorted list and halves the list each step, so it takes about log_{2} n steps.\nBubble sort: about n^{2} comparisons. Merge sort, and quicksort on average: about n log_{2} n.\nStack: last in, first out (LIFO). Queue: first in, first out (FIFO).\nExample: a sorted list of 1,024 items takes at most about 10 steps in a binary search (2^{10} = 1,024).\n\n@Section: Notes\n@Source: Claude starter summary (standard computer fundamentals and networking)\n\n@Subject: ESAS\n@Topic: Computer and Logic\n\n## Computer hardware and the CPU\n- Von Neumann design: one memory holds both instructions and data. Harvard design: separate memories for instructions and data, which many microcontrollers use.\n- The CPU has an arithmetic logic unit (ALU), a control unit and registers. The program counter holds the address of the next instruction, the instruction register holds the current one, and the accumulator holds ALU results.\n- Fetch, decode, execute: the CPU fetches an instruction from memory, decodes it and carries it out, then repeats.\n- Three buses: the address bus (one way, from the CPU, and its width sets the memory size at 2^{n} locations), the data bus (two way, and its width is the word size) and the control bus (read, write, clock and interrupt signals).\n- RAM is volatile: it loses its contents without power. DRAM needs refreshing and SRAM does not and is faster, so cache is SRAM. ROM is non-volatile: PROM, EPROM, EEPROM and flash.\n- Memory speed goes from registers, to cache (L1, L2, L3), to main memory, to disk, and the capacity goes the other way. Virtual memory uses disk space as an extension of RAM.\n- A hard disk is magnetic and has moving parts. A solid-state drive uses flash memory and has none.\n- Input and output can be done by polling (the CPU keeps asking), by interrupts (the device calls the CPU) or by DMA, where a controller moves data to memory without the CPU.\n- A microprocessor is a CPU alone. A microcontroller puts a CPU, memory and input-output on one chip and is used in embedded systems.\n- CPU time = (instruction count × cycles per instruction)/clock rate.\nTip: when a problem gives the number of address lines, the memory size is 2^{n}. When it gives the memory size, the number of lines is the exponent.\n\n## Software and programming\n- System software is the operating system, device drivers and utilities. Application software does the user's work.\n- An operating system manages processes, memory, files and devices, provides the user interface and enforces security. Examples are Windows, Linux, macOS and Android.\n- Machine language is binary. Assembly language uses mnemonics and an assembler translates it. High-level languages are translated by a compiler (the whole program first) or an interpreter (line by line).\n- Three kinds of programming error: syntax errors (found when compiling), runtime errors (the program stops while running) and logic errors (the program runs but gives the wrong result).\n- Operators: arithmetic (+, −, ×, /), relational (<, >, ==) and logical (AND, OR, NOT). Evaluation order is parentheses first, then multiplication and division, then addition and subtraction.\n- Object-oriented programming: a class is a template and an object is one instance of it. The main ideas are encapsulation, inheritance and polymorphism.\n- Relational database: data in tables of rows and columns, with a primary key that identifies each row. SQL commands: SELECT reads, INSERT adds, UPDATE changes and DELETE removes.\n- Data structures: array, linked list, stack (last in, first out), queue (first in, first out), tree and graph.\n- Software life cycle: requirements, design, coding, testing, deployment and maintenance.\n\n## Networks and the internet\n- A LAN covers a building or campus, a MAN a city and a WAN a country or more. The internet is a network of networks.\n- Topologies: bus (one shared cable), star (every node to a central switch, the most common), ring, mesh (every node to several others) and tree.\n- A hub repeats signals to all ports. A switch sends frames only to the right port using MAC addresses. A router joins networks and forwards packets using IP addresses. A modem converts between digital data and the line signal. A firewall filters traffic.\n- Media: twisted pair (Ethernet, up to 100 m a segment), coaxial cable and optical fiber. Fiber has the highest bandwidth and is not affected by electromagnetic interference.\n- Standards: Ethernet is IEEE 802.3, Wi-Fi is IEEE 802.11 and Bluetooth is IEEE 802.15.1.\n- DNS turns a name into an IP address. DHCP hands out IP addresses automatically. ARP finds the MAC address for an IP address. SMTP sends mail, and POP3 and IMAP receive it. HTTPS is HTTP protected by TLS encryption.\n- Symmetric encryption uses one shared key. Asymmetric encryption uses a public and private key pair. A hash gives a fixed-size fingerprint of data and cannot be reversed.\n- Malware: a virus attaches to a file, a worm spreads by itself over the network, a trojan pretends to be useful, and ransomware locks the data until a payment is made.\n\n@Section: Modules\n@Source: Claude starter lessons\n@Subject: ESAS\n@Topic: Engineering Economics\n\n## 1. Exact Simple Interest\nSimple interest is charged on the original principal only. The interest does not earn interest.\n\nI = P r t\nF = P(1 + r t)\n\nFor exact simple interest, t is the actual number of days divided by 365 (366 in a leap year). Count the first day or the last day, but not both, unless the problem says otherwise.\n\nExample: Php 50,000 is borrowed at 8% simple interest for 90 days. Find the exact simple interest.\n1. I = P r t = 50,000 (0.08)(90/365)\n2. I = Php 986.30\nAnswer: Php 986.30.\nWatch out: Ordinary simple interest on the same loan uses 360 days and gives Php 1,000.00. The word \"exact\" or \"actual days\" tells you which one to use.\n\n## 2. Ordinary Simple Interest\nOrdinary (or bankers) simple interest uses a 360-day year, with every month counted as 30 days. If the time is given in months, use t = months/12. If it is given in days, use t = days/360.\n\nI = P r t\nF = P + I\n\nExample: Php 20,000 is borrowed at 6% simple interest for 8 months. Find the interest and the amount due.\n1. I = 20,000 (0.06)(8/12) = Php 800\n2. F = 20,000 + 800 = Php 20,800\nAnswer: interest Php 800, amount due Php 20,800.\nTip: When a problem gives no hint, use ordinary simple interest. When it gives the dates and says exact, use 365.\n\n## 3. Compound Interest\nInterest is added to the principal at the end of each period, and the next interest is charged on the larger amount.\n\nF = P(1 + i)^{n}\ni = r/m\nn = m t\n\nHere r is the nominal rate for the year, m is the number of compounding periods in a year and t is the number of years.\n\nExample: Php 100,000 is invested at 12% compounded quarterly for 5 years. Find the future amount.\n1. i = 0.12/4 = 0.03 per quarter\n2. n = 4 (5) = 20 quarters\n3. F = 100,000 (1.03)^{20} = Php 180,611.12\nAnswer: Php 180,611.12.\n\nExample: In how many years does money double at 8% compounded annually?\n1. 2 P = P (1.08)^{n}, so n = ln 2/ln 1.08\n2. n = 9.006 years\nAnswer: about 9 years.\nTip: To find an unknown n or i, take logarithms or roots. The calculator SOLVE function does it for you.\n\n## 4. Effective Rate of Interest\nThe effective rate is the single yearly rate that gives the same amount as the nominal rate compounded m times a year.\n\ni_{eff} = (1 + r/m)^{m} - 1\n\nTo go the other way, from an effective rate to the equivalent nominal rate:\n\nr = m[(1 + i_{eff})^{1/m} - 1]\n\nExample: Find the effective rate of 12% compounded monthly.\n1. i_{eff} = (1 + 0.12/12)^{12} - 1\n2. i_{eff} = 0.12683 = 12.683%\nAnswer: 12.683%.\n\nExample: Find the nominal rate compounded quarterly that is equal to 10% effective.\n1. r = 4[(1.10)^{1/4} - 1]\n2. r = 0.09645 = 9.645%\nAnswer: 9.645% compounded quarterly.\nWatch out: Two rates can be compared only on the same effective basis.\n\n## 5. Continuous Compound Interest\nWhen the number of compounding periods per year becomes very large, the interest is compounded continuously.\n\nF = P e^{r t}\ni_{eff} = e^{r} - 1\n\nExample: Php 10,000 is invested at 8% compounded continuously for 3 years. Find the amount, and the effective rate.\n1. F = 10,000 e^{0.08 (3)} = 10,000 e^{0.24} = Php 12,712.49\n2. i_{eff} = e^{0.08} - 1 = 0.08329 = 8.329%\nAnswer: Php 12,712.49 and 8.329%.\nTip: The key labelled e^x on your calculator gives e raised to a power.\n\n## 6. Annuity - Ordinary\nAn annuity is a series of equal payments made at equal intervals. In an ordinary annuity the payments are made at the end of each period.\n\nF = A[(1 + i)^{n} - 1]/i\nP = A[1 - (1 + i)^{-n}]/i\n\nA is each payment, i is the rate per payment period and n is the number of payments.\n\nExample: Php 5,000 is deposited at the end of each month for 3 years at 12% compounded monthly. Find the amount at the end of 3 years, and the present worth of the payments.\n1. i = 0.01 and n = 36\n2. F = 5,000[(1.01)^{36} - 1]/0.01 = Php 215,384.39\n3. P = 5,000[1 - (1.01)^{-36}]/0.01 = Php 150,537.53\nAnswer: F = Php 215,384.39 and P = Php 150,537.53.\nWatch out: The payment period and the compounding period must match. If they do not, find the effective rate per payment period first.\nTip: Check the present worth with the summation method in the Calculator section. Σ(5000(1.01)^(-X), 1, 36) gives the same Php 150,537.53.\n\n## 7. Annuity Due\nIn an annuity due the payments are made at the start of each period. Each payment earns interest for one more period than in an ordinary annuity, so the values are larger by the factor (1 + i).\n\nF = A[((1 + i)^{n} - 1)/i](1 + i)\nP = A[(1 - (1 + i)^{-n})/i](1 + i)\n\nExample: Use the same payments as in the ordinary annuity: Php 5,000 a month for 3 years at 12% compounded monthly, but paid at the start of each month.\n1. F = 215,384.39 (1.01) = Php 217,538.24\n2. P = 150,537.53 (1.01) = Php 152,042.90\nAnswer: F = Php 217,538.24 and P = Php 152,042.90.\nTip: The words \"in advance\", \"at the beginning of each\" and \"start of each\" point to an annuity due.\nTip: By summation, the present worth is Σ(5000(1.01)^(-X), 0, 35). The sum starts at X = 0 because the first payment is made now.\n\n## 8. Deferred Annuity\nA deferred annuity starts after a delay. If the first payment is made at the end of period m + 1, the annuity is deferred m periods. Find the present worth at the start of the annuity and then bring it back m periods.\n\nP = A[(1 - (1 + i)^{-n})/i](1 + i)^{-m}\n\nExample: Php 20,000 is paid at the end of each year for 10 years, with the first payment at the end of the 4th year. What is its present worth at 10% effective?\n1. The first payment is at the end of year 4, so the deferment is m = 3 years.\n2. P = 20,000[(1 - 1.10^{-10})/0.10](1.10)^{-3}\n3. P = 20,000 (6.144567)(0.751315) = Php 92,330.08\nAnswer: Php 92,330.08.\nWatch out: If the first payment is at the end of period k, the deferment is k - 1 periods, not k.\nTip: By summation, the payments are in periods 4 to 13, so P = Σ(20000(1.1)^(-X), 4, 13) = Php 92,330.08.\n\n## 9. Perpetuity\nA perpetuity is an annuity that never ends. The first payment is at the end of the first period.\n\nP = A/i\n\nExample: A fund is to pay Php 120,000 at the end of every year forever. Find the amount needed now if money earns 8%.\n1. P = 120,000/0.08 = Php 1,500,000\nAnswer: Php 1,500,000.\nTip: If the first payment is made today, add one payment to the result: P = A + A/i = Php 1,620,000. A scholarship or an endowment is a typical perpetuity.\n\n## 10. Straight Line Depreciation\nDepreciation spreads the loss of value of an asset over its life. The straight line method charges the same amount every year.\n\nd = (FC - SV)/n\nBV_{m} = FC - m d\n\nFC is the first cost, SV is the salvage value, n is the life in years and BV is the book value.\n\nExample: A machine costs Php 500,000, has a life of 10 years and a salvage value of Php 50,000. Find the yearly depreciation and the book value after 4 years.\n1. d = (500,000 - 50,000)/10 = Php 45,000\n2. BV_{4} = 500,000 - 4 (45,000) = Php 320,000\nAnswer: Php 45,000 a year, and Php 320,000 after 4 years.\n\n## 11. Sinking Fund Depreciation\nThe yearly charge is a payment into a sinking fund that earns interest and grows to (FC - SV) at the end of the life.\n\nA = (FC - SV) i/((1 + i)^{n} - 1)\nBV_{m} = FC - A[((1 + i)^{m} - 1)/i]\n\nExample: The same machine (Php 500,000, salvage Php 50,000, 10 years), with the fund earning 6%. Find the yearly charge and the book value after 4 years.\n1. A = 450,000 (0.06)/((1.06)^{10} - 1) = Php 34,140.58\n2. The fund after 4 years = 34,140.58 [((1.06)^{4} - 1)/0.06] = Php 149,351.93\n3. BV_{4} = 500,000 - 149,351.93 = Php 350,648.07\nAnswer: Php 34,140.58 a year, and Php 350,648.07 after 4 years.\nTip: The sinking fund method charges less in the early years than the straight line method, so the book value stays higher.\n\n## 12. SYD Depreciation\nThe sum of the years digits method charges more in the early years. The digits 1, 2, ..., n are added, and each year takes a fraction of (FC - SV) with the largest digit first.\n\nSum = n(n + 1)/2\nd_{m} = (FC - SV)(n - m + 1)/Sum\nBV_{m} = FC - (FC - SV)[m(2 n - m + 1)]/[n(n + 1)]\n\nExample: A machine costs Php 500,000, lasts 5 years and has a salvage value of Php 50,000. Find the depreciation in the 1st year, the 3rd year, and the book value after 3 years.\n1. Sum = 5 (6)/2 = 15\n2. d_{1} = 450,000 (5/15) = Php 150,000\n3. d_{3} = 450,000 (3/15) = Php 90,000\n4. Depreciation in the first 3 years = 450,000 (5 + 4 + 3)/15 = Php 360,000\n5. BV_{3} = 500,000 - 360,000 = Php 140,000\nAnswer: Php 150,000, Php 90,000 and Php 140,000.\n\n## 13. Declining Balance Depreciation\nA fixed percentage k of the book value at the start of the year is charged each year. It is also called the constant percentage or Matheson method.\n\nBV_{m} = FC(1 - k)^{m}\nk = 1 - (SV/FC)^{1/n}\nDouble declining balance: k = 2/n\n\nExample: A machine costs Php 500,000, lasts 5 years and has a salvage value of Php 50,000. Find k and the book value after 3 years by the declining balance method.\n1. k = 1 - (50,000/500,000)^{1/5} = 0.36904\n2. BV_{3} = 500,000 (1 - 0.36904)^{3} = Php 125,594.32\nAnswer: k = 36.904% and BV = Php 125,594.32.\n\nExample: Use double declining balance on the same machine.\n1. k = 2/5 = 0.40\n2. BV_{3} = 500,000 (0.60)^{3} = Php 108,000\nAnswer: Php 108,000.\nWatch out: With double declining balance, the book value after n years is not necessarily the salvage value. Use the rate k = 1 - (SV/FC)^{1/n} when the salvage value must be reached.\n\n## 14. Depreciation\nDepreciation is the decrease in the value of an asset with use and with time. The main terms are:\n- First cost (FC): the cost of the asset when it was installed.\n- Salvage value (SV) or scrap value: what the asset is worth at the end of its life.\n- Book value (BV): the first cost minus the total depreciation so far.\n- Useful life (n): the number of years the asset is used.\n- Depreciable amount: FC - SV.\nMethods covered in these modules: straight line, sinking fund, sum of the years digits and declining balance. The service output method is also common.\n\nService output: d = (FC - SV) × (units produced)/(total units in the life)\n\nExample: A machine costs Php 200,000, has a salvage value of Php 20,000 and can produce 100,000 units in its life. It produced 15,000 units this year. Find the depreciation for the year.\n1. d = 180,000 (15,000/100,000) = Php 27,000\nAnswer: Php 27,000.\n\n## 15. Inflation\nInflation is a rise in the general price level, so the same money buys less. Let f be the inflation rate, i the real interest rate (without inflation) and i_{f} the market rate (which includes inflation).\n\n(1 + i_{f}) = (1 + i)(1 + f)\ni_{f} = i + f + i f\ni = (i_{f} - f)/(1 + f)\nFuture price = present price (1 + f)^{n}\n\nExample: The real rate is 12% and the inflation rate is 5%. Find the market rate.\n1. i_{f} = 0.12 + 0.05 + 0.12 (0.05) = 0.176\nAnswer: 17.6%.\n\nExample: A bank pays 15% and inflation is 5%. Find the real rate.\n1. i = (0.15 - 0.05)/(1.05) = 0.09524\nAnswer: 9.52%.\n\nExample: Something costs Php 1,000 today. What will it cost in 5 years if the price goes up 4% a year?\n1. 1,000 (1.04)^{5} = Php 1,216.65\nAnswer: Php 1,216.65.\n\n## 16. Annual Cost\nThe annual cost (equivalent uniform annual cost) turns all costs of an asset into one yearly amount. The capital is recovered over the life, the salvage value is credited, and the yearly costs are added.\n\nAnnual cost = FC [i(1 + i)^{n}/((1 + i)^{n} - 1)] - SV [i/((1 + i)^{n} - 1)] + yearly cost\n\nExample: A machine costs Php 800,000, has a life of 8 years and a salvage value of Php 100,000. The yearly operating cost is Php 120,000. Money is worth 10%. Find the annual cost.\n1. Capital recovery = 800,000 (0.187444) = Php 149,955.21\n2. Salvage credit = 100,000 (0.087444) = Php 8,744.40\n3. Annual cost = 149,955.21 - 8,744.40 + 120,000 = Php 261,210.81\nAnswer: Php 261,210.81 a year.\n\n## 17. Capitalized Cost\nThe capitalized cost is the present worth of an asset that is kept forever, including its first cost, its renewals and its yearly costs.\n\nCC = first cost + (renewal cost)/((1 + i)^{n} - 1) + (yearly cost)/i\n\nExample: A bridge costs Php 2,000,000. Parts costing Php 500,000 have to be replaced every 10 years, and maintenance is Php 50,000 a year. Find the capitalized cost at 8%.\n1. Renewal term = 500,000/((1.08)^{10} - 1) = Php 431,434.30\n2. Maintenance term = 50,000/0.08 = Php 625,000\n3. CC = 2,000,000 + 431,434.30 + 625,000 = Php 3,056,434.30\nAnswer: Php 3,056,434.30.\nWatch out: Use the renewal cost less the salvage value of the old part when the problem gives one.\n\n## 18. Bonds and Stocks\nA bond is a loan to a company or the government. It has a face (par) value F, a redemption value and a bond rate. It pays a coupon C = (bond rate) × F every period, and returns the redemption value at the end.\n\nPrice = C[1 - (1 + i)^{-n}]/i + (redemption value)(1 + i)^{-n}\n\nHere i is the yield rate per period and n is the number of coupon periods. A higher yield makes a lower price.\n\nExample: A Php 100,000 bond with a bond rate of 10% paid semiannually is redeemable at par in 5 years. Find its price to yield 12% compounded semiannually.\n1. C = 100,000 (0.10/2) = Php 5,000 per half year\n2. i = 0.12/2 = 0.06 and n = 10\n3. Price = 5,000 (7.360087) + 100,000 (0.558395) = Php 92,639.91\nAnswer: Php 92,639.91.\n\nA stock is a share of ownership. It pays dividends. The dividend yield is (yearly dividend)/(price of the stock).\nTip: If the yield equals the bond rate, the bond sells at its face value.\n\n## 19. Break-even Analysis\nThe break-even point is where total revenue equals total cost, so there is no profit and no loss.\n\nTotal cost = fixed cost + (variable cost per unit)(units)\nTotal revenue = (selling price per unit)(units)\nBreak-even units = (fixed cost)/(selling price per unit - variable cost per unit)\n\nExample: Fixed costs are Php 600,000 a year, the variable cost is Php 40 per unit and the selling price is Php 100 per unit. Find the break-even number of units, and the profit at 12,000 units.\n1. Break-even units = 600,000/(100 - 40) = 10,000 units\n2. Revenue at break-even = 10,000 (100) = Php 1,000,000\n3. Profit at 12,000 units = 12,000 (60) - 600,000 = Php 120,000\nAnswer: 10,000 units, and a profit of Php 120,000.\n\n## 20. Comparing alternatives\nTo compare two ways of doing the same job, put them on the same basis. Use the present worth when the lives are equal. Use the annual cost when the lives are different, because it spreads each cost over its own life. The alternative with the lower cost is better.\n\nCapital recovery factor: i(1 + i)^{n}/((1 + i)^{n} - 1)\n\nExample: Machine A costs Php 300,000, has a life of 5 years and costs Php 40,000 a year to run. Machine B costs Php 450,000, has a life of 10 years and costs Php 25,000 a year to run. Neither has a salvage value. Money is worth 10%. Which is cheaper?\n1. Machine A: 300,000 (0.263797) + 40,000 = Php 119,139.24 a year\n2. Machine B: 450,000 (0.162745) + 25,000 = Php 98,235.43 a year\nAnswer: Machine B has the lower annual cost.\nTip: A longer life does not always win. Always compare on the annual cost or on a common time span.\n\n## 21. Gradient Series (Arithmetic and Geometric)\nA gradient series is a set of payments that change every period, by a fixed amount (arithmetic) or by a fixed percentage (geometric). The payments are made at the end of each period.\n\nArithmetic gradient: the payment in period k is A + (k - 1) G. It is a level payment A plus a gradient that is 0 in period 1 and rises by G each period.\nP = A[(1 - (1 + i)^{-n})/i] + (G/i)[(1 - (1 + i)^{-n})/i - n(1 + i)^{-n}]\nUniform equivalent of the gradient part: A_{G} = G[1/i - n/((1 + i)^{n} - 1)]\n\nExample: Payments start at Php 10,000 at the end of year 1 and rise by Php 2,000 each year for 8 years. Money is worth 10%. Find the present worth.\n1. Level part: 10,000 (5.334926) = Php 53,349.26\n2. Gradient part: (2,000/0.10)[5.334926 - 8 (0.466507)] = Php 32,057.34\n3. P = 53,349.26 + 32,057.34 = Php 85,406.6 (Php 85,406.61 when the calculator keeps all its digits)\nAnswer: Php 85,406.61.\n\nGeometric gradient: the payment in period k is A(1 + g)^{k-1}, where A is the first payment and g is the growth rate.\nP = A[1 - ((1 + g)/(1 + i))^{n}]/(i - g), when i ≠ g\nP = n A/(1 + i), when i = g\n\nExample: The first payment is Php 10,000 at the end of year 1 and the payments grow 5% a year for 10 years. Money is worth 8%. Find the present worth.\n1. ((1 + g)/(1 + i))^{n} = (1.05/1.08)^{10} = 0.754493\n2. P = 10,000 (1 - 0.754493)/(0.08 - 0.05) = Php 81,835.54\nAnswer: Php 81,835.54.\nTip: Both answers can be checked by summation. Σ((10000 + (X - 1)2000)(1.1)^(-X), 1, 8) gives 85,406.61 and Σ(10000(1.05)^(X - 1)(1.08)^(-X), 1, 10) gives 81,835.54. Look for the Calculator items on summation.\nWatch out: In the geometric formula the growth rate g is not the interest rate. If g is equal to i, use P = n A/(1 + i).\n\n@Section: Calculator\n@Source: Canon F-789SGA\n\n@Subject: ESAS\n@Topic: Physics 2\n\n## Harmonics of a string and of a pipe (SOLVE)\nString: f_{n} = n/(2L) × √(T/μ). Open pipe: f_{n} = n v/(2L). Closed pipe: f_{n} = n v/(4L), with n = 1, 3, 5.\n1. For a frequency, type the formula with your numbers and press `=`. Use brackets around 2L and 4L.\n2. For the tension, length or harmonic number that gives a target frequency, type the formula with X in place of the unknown and `= f`, then use SOLVE.\nExample: a string with L = 0.50 m, μ = 0.0025 kg/m and T = 100 N. Type 1/(2 × 0.5) × √(100/0.0025) and press `=` to get f_{1} = 200 Hz.\nExample: the tension for f_{1} = 400 Hz on the same string. Type 1/(2 × 0.5) × √(X/0.0025) = 400 and use SOLVE (starting value 100) to get X = 400 N.\nExample: the third harmonic of a closed pipe 0.50 m long at 343 m/s. Type 3 × 343/(4 × 0.5) and press `=` to get 514.5 Hz.\nWatch out: for a closed pipe use only the odd values of n. Enter μ in kg/m, with the mass per unit length and not the total mass.\n\n@Section: Notes\n@Source: Claude starter summary (standard university physics)\n\n@Subject: ESAS\n@Topic: Physics 2\n\n## Standing waves and harmonics\n- A standing wave forms when a wave meets its own reflection. The points that never move are nodes. The points that swing the most are antinodes. Adjacent nodes are half a wavelength apart.\n- A string fixed at both ends has a node at each end. It can only carry the wavelengths that fit a whole number of half-wavelengths: L = n λ/2. The frequencies are f_{n} = n v/(2L), where v = sqrt(T/μ).\n- The lowest frequency is the fundamental, the first harmonic. The others are whole-number multiples of it: the second harmonic is twice the fundamental, the third is three times, and so on.\n- Harmonic number and overtone number differ by one: the first overtone is the second harmonic.\n- An open pipe has an antinode at both ends, so it has every harmonic: f_{n} = n v/(2L). A closed pipe has a node at the closed end and an antinode at the open end, so it has only the odd harmonics: f_{n} = n v/(4L), n = 1, 3, 5.\n- A closed pipe of a given length sounds an octave lower than an open pipe of the same length.\n- Instruments: a guitar or violin string is a string fixed at both ends. A flute and an organ pipe behave like open pipes. A clarinet behaves roughly like a closed pipe, which is why it is rich in odd harmonics.\n- Different instruments playing the same note have the same fundamental but a different mix of harmonics. That mix is the timbre.\n- Resonance: pushing something at one of its natural frequencies builds up a large vibration. Beats: two close frequencies make the loudness pulse at the difference frequency.\nTip: for a problem on pipes, first draw the pipe with a node or an antinode at each end. Then count how many half-wavelengths or quarter-wavelengths fit in the length.\nWatch out: the speed of sound changes with temperature, v = 331 + 0.6 T. Use the temperature the problem gives, not 343 m/s from habit.\n\n@Section: Formulas\n@Source: Claude summary from your ESAS Constants Reference (SI and English), taken from the modules and solutions and from standard tables; confirm any table value against the table your exam supplies\n\n@Subject: ESAS\n@Topic: Constants and Conversions\n\n## Gravity and the gas constants\nGravitational acceleration: g = 9.81 m/s^{2} (9.80665 exact) = 32.2 ft/s^{2} (32.174)\nUniversal gas constant: R_{u} = 8.314 kJ/(kmol K) = 8.314 J/(mol K) = 1545 (ft·lbf)/(lbmol °R) = 1.986 BTU/(lbmol °R)\nGas constant, volume-pressure basis: R = 0.0821 (L·atm)/(mol K) (also written 0.082) = 0.7302 (ft^{3}·atm)/(lbmol °R)\nUse R_{u} with moles. With mass, use R = R_{u}/M, where M is the molar mass.\nNote: g and the SI value of R_{u} are used in the modules. The solutions use the L·atm form. The English values are standard-table values.\n\n## Gas constant R of common gases\nAir: R = 0.287 kJ/(kg K) = 53.35 (ft·lbf)/(lbm °R)\nHelium: R = 2.077 kJ/(kg K) = 386 (ft·lbf)/(lbm °R)\nNitrogen: R = R_{u}/28 = 0.297 kJ/(kg K) (the solutions also give 0.2969) = 55.2 (ft·lbf)/(lbm °R)\nOxygen: R = 0.260 kJ/(kg K) = 48.3 (ft·lbf)/(lbm °R)\nHydrogen: R = 4.124 kJ/(kg K) = 766.5 (ft·lbf)/(lbm °R)\nCarbon dioxide: R = 0.189 kJ/(kg K) = 35.1 (ft·lbf)/(lbm °R)\nNote: air, helium and nitrogen come from the modules and solutions. Oxygen, hydrogen and carbon dioxide are standard-table values.\n\n## Specific heats and specific heat ratio of gases\nSpecific heat of air at constant pressure: c_{p} = 1.005 kJ/(kg K) = 0.240 BTU/(lbm °R)\nSpecific heat of air at constant volume: c_{v} = 0.718 kJ/(kg K) = 0.171 BTU/(lbm °R)\nSpecific heat ratio: k = 1.40 for air, 1.40 for a diatomic gas and 1.67 for a monatomic gas, the same in English units\nNote: c_{p} and k are used in the modules. c_{v} is a standard-table value.\n\n## Radiation, atomic and wave constants\nStefan–Boltzmann constant: σ = 5.67 × 10^{-8} W/(m^{2} K^{4}) = 0.1714 × 10^{-8} BTU/(hr ft^{2} °R^{4})\nBoltzmann constant: k = 1.381 × 10^{-23} J/K\nAvogadro's number: N_{A} = 6.022 × 10^{23} per mol\nSpeed of light: c = 3.00 × 10^{8} m/s = 9.84 × 10^{8} ft/s\nSpeed of sound in air: 340 m/s (331 m/s at 0 °C) = 1100 ft/s\nNote: σ and N_{A} are used in the modules, and the speed of sound in the solutions. The Boltzmann constant and the speed of light are standard-table values.\n\n## Atmosphere and pressure units\nStandard atmosphere: 101.325 kPa = 760 mmHg = 1.01325 bar = 14.7 psia = 2116 lbf/ft^{2} = 29.92 inHg\nOther pressure units: 1 bar = 100 kPa; 1 psi = 6.895 kPa; 1 bar = 14.5 psi\nAtmosphere as a head of water: 10.33 m = 33.9 ft\nNote: the solutions use 101.325 kPa, 760 mmHg and 14.7 psi. The other rows are standard-table values.\n\n## Absolute temperature and standard conditions\nAbsolute temperature: K = °C + 273 and °R = °F + 460\nTemperature interval: 1 K = 1 °C = 1.8 °R = 1.8 °F\nStandard conditions (STP): 273 K, 101.325 kPa and 22.4 L/mol, or 492 °R and 14.7 psia\nNote: the solutions add 273 and 460. The more exact values are 273.15 and 459.67.\n\n## Energy, work and power conversions\nHeat: 1 cal = 4.186 J; 1 kcal = 4.186 kJ; 1 BTU = 1.055 kJ = 252 cal = 778 ft·lbf\nElectrical energy: 1 kWh = 3600 kJ = 860 kcal = 3413 BTU\nWork and torque: 1 ft·lbf = 1.356 J = 1.356 N·m; 1 lbf·ft = 1.356 N·m\nPower: 1 hp = 746 W = 550 (ft·lbf)/s = 33,000 (ft·lbf)/min = 2545 BTU/hr\nRefrigeration: 1 ton = 3.517 kW = 12,000 BTU/hr\nEnergy per unit mass: 1 kJ/kg = 0.4299 BTU/lbm\nNote: the solutions use 4.186 J/cal, 3600 kJ = 3413 BTU = 860 kcal, 746 W/hp and 33,000 (ft·lbf)/min per hp. The other rows are standard-table values.\n\n## Length, force, mass, volume and stress conversions\nLength: 1 in = 25.4 mm; 1 ft = 12 in = 0.3048 m\nForce: 1 lbf = 4.448 N; 1 kip = 1000 lbf = 4.448 kN\nMass: 1 lbm = 0.4536 kg; 1 slug = 32.2 lbm = 14.59 kg\nVolume: 1 m^{3} = 1000 L; 1 ft^{3} = 28.32 L = 7.48 US gal; 1 US gal = 3.785 L\nStress: 1 ksi = 6.895 MPa; 1 psi = 6.895 kPa\n\n## Unit constants for stress, torque and rotation\nStress: 1 MPa = 1 N/mm^{2}; 1 GPa = 1000 MPa; 1 ksi = 6.895 MPa; 1 psi = 6.895 kPa\nRotation: 1 rad = 57.30°; 1 rev = 2π rad; 1 rpm = 0.1047 rad/s\nOther: 1 lbf·ft = 1.356 N·m; 1 kip = 4.448 kN; 1 in = 25.4 mm\n\n## Properties of water\nDensity of water: ρ = 1000 kg/m^{3} = 62.4 lbm/ft^{3} = 1.94 slug/ft^{3}\nSpecific weight of water: γ = 9.81 kN/m^{3} (9810 N/m^{3}) = 62.4 lbf/ft^{3}\nSurface tension of water at 20 °C: 0.0728 N/m = 0.00499 lbf/ft\nDynamic viscosity of water at 20 °C: 1.00 × 10^{-3} Pa·s = 2.09 × 10^{-5} (lbf·s)/ft^{2}\nKinematic viscosity of water at 20 °C: 1.00 × 10^{-6} m^{2}/s = 1.08 × 10^{-5} ft^{2}/s\nBulk modulus of water: 2.2 GPa = 3.2 × 10^{5} psi\nNote: the density, the specific weight and the surface tension are used in the modules and solutions. The viscosities and the bulk modulus are standard-table values.\n\n## Mercury, air and seawater\nSpecific gravity of mercury: 13.55 (13.6 also appears)\nDensity of mercury: 13,600 kg/m^{3} = 849 lbm/ft^{3}\nSpecific weight of mercury: 133 kN/m^{3} (13.55 × 9810 = 132,925 N/m^{3}) = 845 lbf/ft^{3} (13.55 × 62.4)\nDensity of air at standard conditions: 1.225 kg/m^{3} = 0.0765 lbm/ft^{3}\nDensity of seawater: 1025 kg/m^{3} (SG 1.025) = 64.0 lbm/ft^{3}\nNote: the solutions use mercury at SG 13.55. The densities of air and seawater are standard-table values.\n\n## Viscosity and flow units\nViscosity: 1 poise = 0.1 Pa·s; 1 cP = 1 mPa·s; 1 (lbf·s)/ft^{2} = 47.88 Pa·s\nKinematic viscosity: 1 stokes = 10^{-4} m^{2}/s; 1 ft^{2}/s = 0.0929 m^{2}/s\nFlow rate: 1 m^{3}/s = 35.31 ft^{3}/s; 1 ft^{3}/s = 448.8 US gpm\nNote: these are standard-table values.\n\n## Typical E, G, ν and α of steel, aluminum and copper\nSteel: E = 200 GPa (210 also used) = 29 × 10^{6} psi; G = 80 GPa = 11.6 × 10^{6} psi; ν = 0.30; α = 11.7 × 10^{-6} per °C (11 to 12 used) = 6.5 × 10^{-6} per °F\nAluminum: E = 70 GPa = 10.2 × 10^{6} psi (10.5 also used); G = 26 GPa = 3.8 × 10^{6} psi; ν = 0.33; α = 23 × 10^{-6} per °C = 12.8 × 10^{-6} per °F\nCopper: E = 110 GPa = 16 × 10^{6} psi; G = 41 GPa = 6.0 × 10^{6} psi; ν = 0.34; α = 16.5 × 10^{-6} per °C = 9.2 × 10^{-6} per °F\nThe module problems give E, G, ν and α in the statement, so these are typical values for checking. The solutions use steel at 200 or 210 GPa with ν of 0.25 to 0.30, copper at 110 GPa with ν of 0.30 to 0.34 and α of 16.5 × 10^{-6} per °C, aluminum at 70 GPa, and G of 75, 80 or 85 GPa as stated.\nWatch out: use the figures the problem gives, even where a table gives a slightly different one. Mixed-unit data, such as aluminum at 10.5 × 10^{6} psi, are used as stated.\n\n## Densities of steel, aluminum, copper and concrete\nSteel: 7850 kg/m^{3} = 490 lbf/ft^{3}\nAluminum: 2700 kg/m^{3} = 169 lbf/ft^{3}\nCopper: 8960 kg/m^{3} = 559 lbf/ft^{3}\nConcrete: 2400 kg/m^{3} = 150 lbf/ft^{3}\n\n## Relations among E, G, K, ν and thermal expansion\nG = E/(2(1 + ν))\nK = E/(3(1 − 2ν))\nβ = 3α\nThese hold for ν below 0.5. G is the shear modulus, K the bulk modulus, α the linear coefficient of thermal expansion and β the volumetric one.\n\n## Specific heats of water, ice, steam and metals\nWater: c = 4.186 kJ/(kg K) = 1.00 cal/(g °C) = 1.00 BTU/(lbm °F)\nIce: c = 2.09 kJ/(kg K) = 0.5 cal/(g °C) = 0.50 BTU/(lbm °F)\nSteam: c = 2.01 kJ/(kg K) = 0.48 cal/(g °C) = 0.48 BTU/(lbm °F)\nAluminum: c = 0.88 to 0.92 kJ/(kg K) = 0.21 to 0.22 cal/(g °C) = 0.21 to 0.22 BTU/(lbm °F)\nCopper: c = 0.39 kJ/(kg K) = 0.093 cal/(g °C) = 0.093 BTU/(lbm °F)\nIron: c = 0.46 kJ/(kg K) = 0.11 cal/(g °C) = 0.11 BTU/(lbm °F)\nCalorimetry units: 1 cal/(g °C) = 1 kcal/(kg °C) = 1 BTU/(lbm °F) = 4.186 kJ/(kg K)\nNote: the calorimetry problems work in cal/(g °C). All of these values are used in the modules.\n\n## Latent heats and phase-change points of water\nLatent heat of fusion: 335 kJ/kg = 80 cal/g = 144 BTU/lbm\nLatent heat of vaporization: 2260 kJ/kg = 540 cal/g = 970 BTU/lbm\nPhase-change points at 1 atm: 0 °C and 100 °C, which are 32 °F and 212 °F\nNote: the modules use 80 cal/g and 540 cal/g. The phase-change points are standard-table values.\n\n## Thermal conductivity and the energy efficiency ratio\nCopper: k = 397 W/(m K) = 229 BTU/(hr ft °F)\nIron: k = 80 W/(m K) = 46 BTU/(hr ft °F)\nStainless steel: k = 16 W/(m K) = 9.2 BTU/(hr ft °F)\nConversion: 1 W/(m K) = 0.5778 BTU/(hr ft °F)\nEnergy efficiency ratio: EER = 3.412 × COP (the thermodynamics MCQ keys it as 3.42)\nNote: the SI conductivities and the EER relation are used in the modules. The conversion is a standard-table value.\n\n@Section: Notes\n@Source: Claude summary from your ESAS Constants Reference (SI and English)\n@Subject: ESAS\n@Topic: Constants and Conversions\n\n## Where the constants come from and how they are rounded\n- The constants cover fluid mechanics, strength of materials and thermodynamics. They are taken from the modules, the multiple-choice questions and the exam solutions where they appear, and from standard tables otherwise.\n- \"Used in the modules\" or \"used in the solutions\" means the value appears there. \"Standard-table value\" means it was added from a textbook table to fill a gap, so confirm it against any table your exam supplies.\n- Fluid mechanics has no module, so its values come from the multiple-choice questions and the exam solutions.\n- The sources round differently. g is 9.81 m/s^{2} (9.80665 exact), absolute zero is taken as 273 K and 460 °R, and the heat equivalent is 4.186 J/cal.\n- Mixed-unit data in a problem, such as aluminum at 10.5 × 10^{6} psi, are used as stated, even where a table gives a slightly different figure.\n- Use R_{u} with moles and R = R_{u}/M with mass.\nTip: when a problem gives a value, use the problem's value. Fall back on these constants only for what the problem leaves out.\n";/*STUDY_PACK_END*/

/* a study file: header lines (@Section, @Subject, @Topic, @Source) and "## Title" lines, each followed by the item's text */
function stNorm(x,warn){
  let sec=x.sec; if(!sec){ sec='note'; warn('An item had no @Section line, so it was filed under Notes: "'+tidy(x.title)+'"'); }
  let subject=null; if(x.subject){ subject=resolveSubject(x.subject)||(/^gen/i.test(x.subject.trim())?'General':null); if(!subject) warn(`Unknown @Subject "${tidy(x.subject)}" (use Math, ESAS, EE or General)`); }
  let topic=String(x.topic||'').replace(/\s+/g,' ').trim().slice(0,60);
  if(topic&&PHYS_GENERIC.test(topic)){ topic=physicsTo({front:x.title,back:x.body}); subject='ESAS'; }   // the old "Physics": Physics 1 or 2 by wording
  else if(topic){ const r=resolveTopic(topic,subject&&subject!=='General'?subject:null)||resolveTopic(topic,null);
    if(r){ topic=r.topic; subject=r.subject; }
    else if(!subject) subject='General'; }
  else warn('Some items had no @Topic line and were filed under General');
  if(!subject) subject='General'; if(!topic) topic='General';
  const title=String(x.title||'').replace(/\s+/g,' ').trim().slice(0,120);
  const idt=x.idt?String(x.idt):PHYS_NEW.includes(topic)?'Physics':topic;   // ids keep the old topic name, so stars, hidden items and formula-card progress carry over
  return {id:hash12([sec,subject,idt,title].map(normName).join('|')),sec,subject,topic,title,body:x.body,src:String(x.src||'').trim().slice(0,80),ord:x.ord||0};
}
function stUnique(items){ const seen=new Map(); return items.map(x=>{ const n=(seen.get(x.id)||0)+1; seen.set(x.id,n); return n>1?{...x,id:x.id+'-'+n}:x; }); }
function parseStudy(text){
  const warns=[], items=[], seenW=new Set(), W1=m=>{ if(!seenW.has(m)){ seenW.add(m); warns.push(m); } };
  let sec='', subj='', topic='', idt='', src='', cur=null, ord=0, stray=false;
  const flush=()=>{ if(!cur) return; const c=cur; cur=null; const body=c.body.join('\n').replace(/^\s*\n/,'').replace(/\s+$/,'');
    if(!body){ W1(`"${tidy(c.title)}" has no text, so it was skipped`); return; }
    items.push(stNorm({sec:c.sec,subject:c.subject,topic:c.topic,idt:c.idt,title:c.title,body,src:c.src,ord:c.ord},W1)); };
  for(const ln of String(text).replace(/\r/g,'').replace(/^﻿/,'').split('\n')){
    let m=/^[ \t]*[@#]+[ \t]*(section|study|subject|topic|idtopic|source|model)[ \t]*[:=][ \t]*(.*?)[ \t]*$/i.exec(ln);
    if(m){ flush(); const k=m[1].toLowerCase(), v=m[2];
      if(k==='section'||k==='study'){ const s=stSection(v); if(s) sec=s; else W1(`Unknown @Section "${tidy(v)}" (use Formulas, Notes, Modules or Calculator)`); }
      else if(k==='subject'){ subj=v; topic=''; idt=''; } else if(k==='topic'){ topic=v; idt=''; } else if(k==='idtopic') idt=v; else src=v;
      continue; }
    m=/^[ \t]*##[ \t]+(.+?)[ \t]*$/.exec(ln);
    if(m){ flush(); cur={sec,subject:subj,topic,idt,title:m[1],src,body:[],ord:ord++}; continue; }
    if(cur) cur.body.push(ln); else if(ln.trim()) stray=true;
  }
  flush(); if(stray) W1('Some text came before the first "## Title" line and was ignored');
  return {items,warns};
}
const isStudyText=t=>/^[ \t]*[@#]+[ \t]*(section|study)[ \t]*[:=]/im.test(String(t).slice(0,4000));

const stOk=x=>x&&typeof x.id==='string'&&ST_SEC[x.sec]&&typeof x.title==='string'&&typeof x.body==='string'&&typeof x.topic==='string'&&typeof x.subject==='string';

async function studyInit(){
  try{ const p=JSON.parse(localStorage.getItem('br-study')||'{}'), T=S.st;
    if(ST_SEC[p.sec]) T.sec=p.sec; if([...ST_SUBJ,'All'].includes(p.subject)) T.subject=p.subject; if(typeof p.topic==='string') T.topic=p.topic==='Physics'?'Physics 1':p.topic; T.starred=!!p.starred;
    if(Array.isArray(p.stars)) ST.stars=new Set(p.stars.filter(x=>typeof x==='string')); if(Array.isArray(p.hidden)) ST.hidden=new Set(p.hidden.filter(x=>typeof x==='string'));
    ST.smod=+p.smod>0?+p.smod:0;
  }catch(e){}
  try{ const m=await Meta.get('study-mine'); if(Array.isArray(m)) ST.mine=m.filter(stOk); }catch(e){}
  try{ const f=await Meta.get('study-files'); if(Array.isArray(f)) ST.files=f.filter(x=>x&&typeof x.id==='string'&&Array.isArray(x.items)).map(x=>({...x,items:x.items.filter(stOk)})); }catch(e){}

function studyAll(){
  if(ST.cache&&ST.cache.v===ST.v) return ST.cache.list;
  const stPhys=x=>PHYS_GENERIC.test(x.topic)&&(x.subject==='ESAS'||x.subject==='General')?{...x,subject:'ESAS',topic:physicsTo({front:x.title,back:x.body})}:x;   // items saved before the Physics split
  const raw=[...ST.built.filter(x=>!ST.hidden.has(x.id)),...ST.files.flatMap(f=>f.items.map(x=>({...x,id:'f:'+f.id+':'+x.id,file:f.id,fname:f.name}))),...ST.mine.map(x=>({...x,own:true}))].map(stPhys);
  const so=s=>{ const i=ST_SUBJ.indexOf(s); return i<0?9:i; }, to=(s,t)=>{ const i=s==='General'?-1:topicsFor(s).indexOf(t); return i<0?999:i; };
  const list=raw.map((x,i)=>({x,i})).sort((a,b)=>so(a.x.subject)-so(b.x.subject)||to(a.x.subject,a.x.topic)-to(b.x.subject,b.x.topic)||(a.x.topic<b.x.topic?-1:a.x.topic>b.x.topic?1:0)||a.i-b.i).map(o=>o.x);
  ST.cache={v:ST.v,list}; return list;
}
const stNeed=x=>(x.title+' '+x.topic+' '+x.body+' '+x.src).toLowerCase();

  return studyAll().filter(x=>x.sec===T.sec&&(T.subject==='All'||x.subject===T.subject)&&(T.topic==='All'||x.topic===T.topic)&&(!T.starred||ST.stars.has(x.id))&&(!qs.length||qs.every(w=>stNeed(x).includes(w))));

const stWide=()=>{ try{ return !!(window.matchMedia&&matchMedia('(min-width:1000px)').matches); }catch(e){ return false; } };

const stFirstTopic=()=>{ const T=S.st; if(!stWide()||T.q||T.starred) return 'All'; const pool=studyAll().filter(x=>x.sec===T.sec&&(T.subject==='All'||x.subject===T.subject)); return new Set(pool.map(x=>x.topic)).size>1?pool[0].topic:'All'; };
const studyHas=(s,t)=>studyAll().some(x=>x.topic===t&&(!s||x.subject===s));
