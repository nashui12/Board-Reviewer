X_{C})^{2})\nθ = ±tan^{-1}((X_{L} - X_{C})/R)\nCurrent: I_{T} = V_{T}/Z\n\n## Parallel RL circuit\nTotal current: I_{T} = I_{R} - j I_{L} = |I_{T}|∠θ\n|I_{T}| = √(I_{R}^{2} + I_{L}^{2})\nθ = -tan^{-1}(I_{L}/I_{R})\nNote: -θ means the current I_{T} lags behind the voltage V_{T}.\nWatch out: the sheet writes the angle without the minus sign, but its own note and I_{T} = I_{R} - j I_{L} call for it.\nAdmittance: Y = G - j B_{L} = |Y|∠θ\n|Y| = √(G^{2} + B_{L}^{2})\nθ = -tan^{-1}(B_{L}/G)\nImpedance: Z = 1/Y\nVoltage: V_{T} = I_{T} Z\n\n## Parallel RC circuit\nTotal current: I_{T} = I_{R} + j I_{C} = |I_{T}|∠θ\n|I_{T}| = √(I_{R}^{2} + I_{C}^{2})\nθ = tan^{-1}(I_{C}/I_{R})\nAdmittance: Y = G + j B_{C} = |Y|∠θ\n|Y| = √(G^{2} + B_{C}^{2})\nθ = tan^{-1}(B_{C}/G)\nImpedance: Z = 1/Y\nVoltage: V_{T} = I_{T} Z\nNote: the sheet writes Z = 1/Y with θ beside it. As phasors the angle of Z is the negative of the angle of Y.\n\n## Parallel RLC circuit\nTotal current: I_{T} = I_{R} + j I_{C} - j I_{L} = |I_{T}|∠θ\n|I_{T}| = √(I_{R}^{2} + (I_{C} - I_{L})^{2})\nθ = ±tan^{-1}((I_{C} - I_{L})/I_{R})\nAdmittance: Y = G + j B_{C} - j B_{L} = |Y|∠θ\n|Y| = √(G^{2} + (B_{C} - B_{L})^{2})\nθ = ±tan^{-1}((B_{C} - B_{L})/G)\nImpedance: Z = 1/Y\nVoltage: V_{T} = I_{T} Z\n\n## True, real, average or active power\nExpressed in watts (W).\nP = I_{R}^{2} R\nP = I_{R} V_{R}\nP = V_{R}^{2}/R\nP = V_{T} I_{T} cosθ, where cosθ is the power factor (PF)\n\n## Reactive power\nExpressed in volt-ampere-reactive (VAR).\nQ = I_{X} X_{eq} = V_{X}^{2}/X_{eq} = I_{X} V_{X} = V_{T} I_{T} sinθ\nI_{X} is the net reactive current (I_{C} - I_{L})\nV_{X} is the net reactive voltage (V_{L} - V_{C})\nX_{eq} is the equivalent reactance (X_{L} - X_{C})\nsinθ is the reactive factor\n\n## Apparent power and the power triangle\nExpressed in volt-amperes (VA).\nS = I_{T}^{2} Z = V_{T}^{2}/Z = V_{T} I_{T}\nPower triangle: S is the apparent power (kVA), P is the real power (kW) and Q is the reactive power (kVAR).\ncosθ = P/S, the power factor (PF)\nsinθ = Q/S, the reactive factor (RF)\nS = P ± j Q = |S|∠θ\n|S| = √(P^{2} + Q^{2})\nθ = ±tan^{-1}(Q/P)\n\n## Parallel loads and the power triangle\nVA = √(W^{2} + VAR^{2})\nS = √(P^{2} + Q^{2})\nP = S cosθ = S × pf\nQ = S sinθ = S × rf\nS is the apparent power, P is the real power, Q is the reactive power, pf is the power factor and rf is the reactive factor\n\n## Symmetrical trapezoid wave\na is the length of the flat top and b is the length of the half cycle.\n|V_{avg}| = ((a + b)/(2b)) V_{p}\nV_{rms} = V_{p} √((2a + b)/(3b))\nWatch out: the sheet gives V_{rms} = ((a + 0.577(b - a))/b) V_{p}. That matches the exact value at a = 0 (a triangle) and a = b (a rectangle) but not in between. For a = b/2 the sheet gives 0.789 V_{p} and the exact value is 0.816 V_{p}.\n\n## DC pulse\n|V_{rms}| = V_{p} √(a/b)\n|V_{avg}| = V_{p} (a/b)\na is the pulse width and b is the period.\n\n## Triangular or sawtooth wave\nV_{rms} = 0.577 V_{p}\n|V_{avg}| = 0.500 V_{p}\n\n## Square wave and white noise\nSquare wave: V_{rms} = V_{p} and |V_{avg}| = V_{p}\nWhite noise: V_{rms} ≈ (1/4) V_{p}\n\n## Sine wave on a DC level\nV_{rms} = √(V_{dc}^{2} + V_{p}^{2}/2)\n\n## Series-parallel and parallel-series impedances\nSeries-parallel (Z_{1} in series with Z_{2} and Z_{3} in parallel): Z_{t} = Z_{1} + 1/(1/Z_{2} + 1/Z_{3})\nParallel-series (Z_{1} in parallel with Z_{2} and Z_{3} in series): Z_{t} = 1/(1/Z_{1} + 1/(Z_{2} + Z_{3}))\n\n## Series and parallel resonance compared\nSeries circuit:\n- Impedance: Z = R (the minimum)\n- Current: I = E/Z (the maximum)\n- Resonant frequency: f_{r} = 1/(2π √(LC))\n- If f < f_{r}, the circuit is capacitive\n- If f > f_{r}, the circuit is inductive\n- Q factor: X_{L}/R\n- It magnifies the voltage\nParallel circuit:\n- Impedance: Z = L/(C R) (the maximum)\n- Current: I = E/Z (the minimum)\n- Resonant frequency: f_{r} = 1/(2π) √(1/(LC) - R^{2}/L^{2})\n- If f < f_{r}, the circuit is inductive\n- If f > f_{r}, the circuit is capacitive\n- Q factor: X_{L}/R\n- It magnifies the current\n\n## Ammeter shunt\nI = I_{g}(R_{g}/R_{sh} + 1)\nR_{sh} = (I_{g} R_{g})/(I − I_{g})\nI is the full-scale current wanted, I_{g} is the galvanometer current for full deflection, R_{g} is the galvanometer resistance and R_{sh} is the shunt resistance, in parallel with the galvanometer\nNote: the sheet gives only the first form, and marks R_{sh} as the unknown. The second form is that formula solved for R_{sh}.\n\n## Voltmeter multiplier\nE = E_{g}(R_{se}/R_{g} + 1)\nR_{se} = R_{g}(E/E_{g} − 1)\nE is the full-scale voltage wanted, E_{g} is the galvanometer voltage for full deflection, R_{g} is the galvanometer resistance and R_{se} is the series (multiplier) resistance\nNote: the sheet gives only the first form, and marks R_{se} as the unknown. The second form is that formula solved for R_{se}.\n\n@Topic: AC Circuits 2\n\n## Phase sequence\nABC sequence (positive): ABC, BCA, CAB\nV_{φ} = V_{AN} = V_{BN} = V_{CN} in size, with V_{AN} taken as the reference\nV_{AN} = V_{φ}∠0°\nV_{BN} = V_{φ}∠-120°\nV_{CN} = V_{φ}∠-240° = V_{φ}∠120°\nACB sequence (negative): ACB, CBA, BAC\nV_{AN} = V_{φ}∠0°\nV_{BN} = V_{φ}∠120°\nV_{CN} = V_{φ}∠-120° = V_{φ}∠240°\n\n## Wye-connected balanced source\nI_{L} = I_{φ}\nV_{L} = √3 V_{φ}\nV_{AN}, V_{BN} and V_{CN} are the phase voltages. V_{AB}, V_{BC} and V_{CA} are the line voltages.\nPositive sequence: V_{L} leads V_{φ} by 30°. Negative sequence: V_{L} lags V_{φ} by 30°.\n\n## Delta-connected balanced system\nV_{φ} = V_{L}\nI_{L} = √3 I_{φ}\nPositive sequence: I_{L} lags I_{φ} by 30°. Negative sequence: I_{L} leads I_{φ} by 30°.\nThis holds for a delta-connected generator and for a delta-connected balanced load.\n\n## Delta-connected unbalanced loads\nUsing KCL at nodes A, B and C:\nI_{A} = I_{AB} - I_{CA}\nI_{B} = I_{BC} - I_{AB}\nI_{C} = I_{CA} - I_{BC}\nPhase currents:\nI_{AB} = V_{AB}/Z_{AB}\nI_{BC} = V_{BC}/Z_{BC}\nI_{CA} = V_{CA}/Z_{CA}\n\n## Wye-connected unbalanced load with neutral\nThis is the three-phase, four-wire system.\nPhase currents:\nI_{A} = V_{AN}/Z_{AN}\nI_{B} = V_{BN}/Z_{BN}\nI_{C} = V_{CN}/Z_{CN}\nNeutral current: I_{N} = I_{A} + I_{B} + I_{C}, a phasor sum\n\n## Wye-connected unbalanced load without neutral\nChange the wye into an equivalent delta (the Y-Δ transformation):\nZ_{AB} = (Z_{A} Z_{B} + Z_{A} Z_{C} + Z_{B} Z_{C})/Z_{C}\nZ_{BC} = (Z_{A} Z_{B} + Z_{A} Z_{C} + Z_{B} Z_{C})/Z_{A}\nZ_{CA} = (Z_{A} Z_{B} + Z_{A} Z_{C} + Z_{B} Z_{C})/Z_{B}\nWatch out: the third numerator on the sheet has Z_{B} Z_{C} twice. It should be Z_{A} Z_{C}, as in the other two lines.\n\n## Three-phase power from the complex power S\nS = 3 V_{φ} I_{φ}^{*}\nP = 3 V_{φ} I_{φ} cosφ = √3 V_{L} I_{L} cosφ\nQ = 3 V_{φ} I_{φ} sinφ = √3 V_{L} I_{L} sinφ\nThe star on I_{φ} marks the complex conjugate.\n\n## Two-wattmeter method: connections\nThese forms hold for an unbalanced load. Each φ is the angle between the voltage and the current in the same line.\nCommon potential terminal B:\nW_{1} = V_{AB} I_{A} cosφ\nW_{2} = V_{CB} I_{C} cosφ\nCommon terminal C:\nW_{1} = V_{AC} I_{A} cosφ\nW_{2} = V_{BC} I_{B} cosφ\nCommon terminal A:\nW_{1} = V_{BA} I_{B} cosφ\nW_{2} = V_{CA} I_{C} cosφ\n\n## Two-wattmeter method: balanced load\nW_{1} = V_{L} I_{L} cos(30° - θ)\nW_{2} = V_{L} I_{L} cos(30° + θ)\nP_{T} = W_{1} + W_{2}\nθ is the power factor angle of the balanced three-phase load.\ntanθ = √3 (W_{1} - W_{2})/(W_{1} + W_{2})\nθ = tan^{-1}[√3 (W_{1} - W_{2})/(W_{1} + W_{2})], or θ = tan^{-1}(Q/P)\n- If pf = 1.0, then W_{1} = W_{2}\n- If pf ≥ 0.5, then P_{T} = W_{1} + W_{2}\n- If pf < 0.5, one reading is negative, so P_{T} is the larger reading minus the size of the smaller one\nWatch out: for pf < 0.5 the sheet writes P_{T} = W_{1}. Using the signed sum W_{1} + W_{2} (with W_{2} negative) gives the right total.\n\n## One-wattmeter methods for a balanced three-phase load\n1. Per phase method\n2. Potential lead shift method\n3. Artificial neutral\n4. T-method\n\n@Topic: Faults\n\n## Symmetrical components (Fortescue's theorem)\nAn unbalanced set of three phasors equals a positive-sequence set, plus a negative-sequence set, plus a zero-sequence set (three equal phasors in phase).\na = 1∠120°, the operator\nV_{a} = V_{a0} + V_{a1} + V_{a2}\nV_{b} = V_{a0} + a^{2} V_{a1} + a V_{a2}\nV_{c} = V_{a0} + a V_{a1} + a^{2} V_{a2}\nIn matrix form, the rows of the 3 × 3 matrix are (1, 1, 1), (1, a^{2}, a) and (1, a, a^{2}). It multiplies the column (V_{a0}, V_{a1}, V_{a2}) to give the column (V_{a}, V_{b}, V_{c}).\nGoing the other way:\nV_{a0} = (1/3)(V_{a} + V_{b} + V_{c})\nV_{a1} = (1/3)(V_{a} + a V_{b} + a^{2} V_{c})\nV_{a2} = (1/3)(V_{a} + a^{2} V_{b} + a V_{c})\nThis is the sheet's (1/3) matrix with rows (1, 1, 1), (1, a, a^{2}) and (1, a^{2}, a).\nWatch out: the sheet also shows the matrix with rows (1, 1, 1), (1, a^{2}, a), (1, a, a^{2}) multiplying (V_{a}, V_{b}, V_{c}) to give (V_{0}, V_{a1}, V_{a2}). That has no 1/3 and the rows are in the wrong order, so it does not give the sequence components. The (1/3) form is the correct one.\n\n## Sequence components from the operator a\na = 1∠120°\nZero sequence (a does not appear): I_{0} = (1/3)(I_{1} + I_{2} + I_{3})\nPositive sequence (the power of a goes up): I_{+} = (1/3)(I_{1} + a I_{2} + a^{2} I_{3})\nNegative sequence (the power of a goes down): I_{−} = (1/3)(I_{1} + a^{2} I_{2} + a I_{3})\nNote: I_{1}, I_{2} and I_{3} are the three phase currents here. The sheet writes a^{0} I_{1} as the first term of the positive and negative lines, which is just I_{1}.\n\n## Three-phase fault current by per-unit steps\n1. I_{3φ} = (Z_{pu})^{−1}, then store it in memory A.\n2. I_{base} = S_{base}/(√3 V_{L}), then store it in memory B.\n3. I_{fault} = A × B\nZ_{pu} is the per-unit impedance seen from the fault\n\n## Fault calculation with an additional impedance\nConvert it to per unit: Z_{pu} = (S_{base} Z)/V_{L}^{2}\nZ_{total} = Z_{pu} + (the existing per-unit impedance)\nThen apply the three-phase fault steps.\nNote: the sheet writes \"+ % impedance\", read here as the existing impedance given as a percent, changed to per unit first.\n\n## Single line-to-ground fault current\nI_{fault} = (3)/(Z_{1} + Z_{2} + Z_{0} + 3 Z_{n}) × I_{base}\nI_{base} = S_{base}/(√3 V_{L})\nUse 1 per unit in place of the 3 on top if you want the sequence current instead of the fault current.\nNote: the sheet words the denominator as positive + negative + zero + 3(neutral), with the neutral impedance 0 when it is solidly grounded. All impedances are per unit.\n\n## Line-to-line fault current\nI_{fault} = (√3)/(Z_{1} + Z_{2}) × I_{base}\nI_{base} = S_{base}/(√3 V_{L})\nNote: the sheet words the denominator as negative + positive.\n\n## Double line-to-ground fault current\nI_{fault} = (3 Z_{2})/(Z_{1} Z_{2} + Z_{2}(Z_{0} + 3 Z_{n}) + (Z_{0} + 3 Z_{n}) Z_{1}) × I_{base}\nI_{base} = S_{base}/(√3 V_{L})\nNote: the sheet calls this the double-line fault current. It is read here as the current into the ground.\n\n## Per-unit values, single phase\nI_{base} = S_{base}/V_{base}\nZ_{base} = V_{base}/I_{base} = V_{base}^{2}/S_{base}\nZ_{pu} = Z_{actual}/Z_{base}\n\n## Per-unit values, three phase\nI_{base} = S_{base}/(√3 E_{base})\nZ_{base} = E_{base,LL}^{2}/S_{base}\nZ_{pu} = Z_{actual}/Z_{base}\nE_{base,LL} is the line-to-line base voltage\nNote: the sheet writes Z_{pu} with (I_{base}) in both the top and bottom of the fraction. They cancel.\n\n@Topic: Electrostatics\n\n## Coulomb's law with units\nF = (Q_{1} Q_{2})/(4π ε_{0} ε_{r} d^{2}) = (k Q_{1} Q_{2})/d^{2}\nF is the force (N), Q_{1} and Q_{2} are the charges on the two bodies (C) and d is the distance between them (m)\nε_{0} = 8.854 × 10^{-12} F/m is the permittivity of free space. The sheet notes it as constant 32 in its calculator's list.\nε_{r} is the relative permittivity (dielectric constant), equal to 1 for air\nk = 9 × 10^{9} in SI units\nUnits on the sheet:\n- SI: force in N, charge in coulombs, d in m, k = 9 × 10^{9}\n- ENG row: force in dynes, charge in statcoulombs, d in cm, k = 1\n\n## Potential and field of a point charge\nV = Q/(4π ε_{0} ε_{r} d) = (k Q)/d\nE = Q/(4π ε_{0} ε_{r} d^{2}) = (k Q)/d^{2}\n\n## Field of an isolated charged line\nE = λ/(2π ε_{0} ε_{r} d)\nλ is the charge per unit length (coulomb per meter)\nNote: the sheet draws this symbol like a triangle. It is read here as λ.\n\n## Electric flux density and total flux\nD = ε_{0} ε_{r} E = Ψ/A\nΨ is the electric flux crossing the area (C)\nTotal flux: Ψ = 4π Q\nWatch out: Ψ = 4π Q is the total flux in the older unrationalized (CGS) convention. In SI units the total flux from a charge Q is Ψ = Q, which is what D = Ψ/A uses. A later page of the sheet also uses D = Q/(4π d^{2}), which is the SI form.\n\n## Charge and capacitance\nQ = C E, so I = Q/t\nC = Q/V\nC is the capacitance (farad), Q is the charge stored (coulomb) and E or V is the voltage across the capacitor (volt)\n\n## Parallel-plate capacitor\nC = (ε_{0} ε_{r} A)/d\nWatch out: the sheet also writes this as K A/d. K there has to mean ε_{0} ε_{r}. It is not the Coulomb constant 9 × 10^{9}.\n\n## Parallel-plate capacitor with n plates, same dielectric\nC = ((ε_{0} ε_{r} A)/d)(n - 1)\nn is the number of plates\n\n## Capacitor with layers of different dielectric\nC = (ε_{0} A)/(d_{1}/ε_{r1} + d_{2}/ε_{r2} + d_{3}/ε_{r3})\nThe sheet shows three layers of thickness d_{1}, d_{2} and d_{3}, and on a later page writes it for n layers: C = (ε_{0} A)/(d_{1}/ε_{r1} + d_{2}/ε_{r2} + … + d_{n}/ε_{rn}).\n\n## Spherical capacitor (concentric spheres)\nC = (4π ε_{0} ε_{r})(r_{1} r_{2})/(r_{2} - r_{1})\nC = (4π ε_{0} ε_{r}) r_{2}^{2}/(r_{2} - r_{1})\nr_{1} is the inner radius and r_{2} is the outer radius.\nNote: the sheet shows the two forms with two sketches and does not say which case each one is. The first is the usual one, with the charge on the inner sphere and the outer sphere earthed. The second is the form for the charge on the outer sphere with the inner sphere earthed.\n\n## Coaxial cable or cylindrical capacitor\nC = (2π ε_{0} ε_{r} L)/ln(r_{2}/r_{1})\nL is the length in meters, r_{1} is the inner radius and r_{2} is the outer radius.\n\n## Energy stored in a charged capacitor\nW = (1/2) Q E = (1/2) C E^{2} = (1/2)(Q^{2}/C), using Q = C E\nThe first form is the area under the graph of Q against E.\nW is the energy stored (joule), C is the capacitance (farad), E is the voltage (volt) and Q is the charge (coulomb)\n\n## Capacitors in series and in parallel\nSeries:\nC_{t} = 1/(1/C_{1} + 1/C_{2} + … + 1/C_{n})\nThe same thing as C_{t} = (C_{1}^{-1} + C_{2}^{-1} + … + C_{n}^{-1})^{-1}\nQ_{t} = Q_{1} = Q_{2} = … = Q_{n}\nE_{t} = E_{1} + E_{2} + … + E_{n}\nParallel:\nC_{t} = C_{1} + C_{2} + … + C_{n}\nQ_{t} = Q_{1} + Q_{2} + … + Q_{n}\nE_{t} = E_{1} = E_{2} = … = E_{n}\nSeries-parallel (C_{1} in series with C_{2} and C_{3} in parallel): C_{t} = 1/(1/C_{1} + 1/(C_{2} + C_{3}))\nParallel-series (C_{1} in parallel with C_{2} and C_{3} in series): C_{t} = C_{1} + 1/(1/C_{2} + 1/C_{3})\n\n## Voltage division for capacitors in series\nE_{1} = E_{t} C_{2}/(C_{1} + C_{2})\nE_{2} = E_{t} C_{1}/(C_{1} + C_{2})\nWatch out: the sheet shows a plus sign between E_{t} and the fraction. It has to be a product.\n\n## Charge division for capacitors in parallel\nQ_{1} = Q_{t} C_{1}/(C_{1} + C_{2})\nQ_{2} = Q_{t} C_{2}/(C_{1} + C_{2})\n\n## Capacitor current and voltage\ni = C dv/dt\nv = (1/C) ∫ i dt\n\n## Electric intensity and potential\nE = k q/d^{2}\nV = k q/d\nE = V/d\nAlso: E = F/Q, F/Q = V/d and F = V Q/d\n\n## Electrostatic energy of a charge\nW = V Q\nW is the electric energy (joule), V is the electric potential (volt) and Q is the charge (coulomb)\nNote: the sheet gives the unit of V as C/m. The unit of potential is the volt, which is joule per coulomb.\n\n## Work done between two points in a field\nW = q (V_{A} - V_{B})\nV = k Q/r, so W = k Q q [1/r_{A} - 1/r_{B}]\nQ is the charge that makes the field and q is the charge that is moved from point A to point B.\nNote: the sheet uses the same letter Q for both, which gives W = k Q^{2} [1/r_{A} - 1/r_{B}].\nUnits on the sheet:\n- SI: work in joules, voltage in V, charge in C\n- ENG row: work in ergs, voltage in statV, charge in statC\n1 joule = 1 × 10^{7} ergs\n1 eV = 1.6 × 10^{-19} joules\n\n## Flux density of a point charge\nD = Q/A = Q/(4π d^{2})\nD is the electric flux density (C/m^{2}), A is the area (m^{2}), Q is the flux or charge (coulomb) and d is the distance between the two charges\nIn the same terms: E = Q/(4π ε_{0} ε_{r} d^{2}) and D = ε_{0} ε_{r} E\n\n## Isolated conducting sphere\nC = 4π ε_{0} ε_{r} r\n\n@Topic: Electromagnetics\n\n## Magnetic flux density and units\nB = Φ/A\nB is the magnetic flux density, Φ is the magnetic flux and A is the area\nUnits on the sheet:\n- SI: B in tesla (T), Φ in weber (Wb), A in m^{2}\n- ENG row: B in gauss (G), Φ in maxwells, A in cm^{2}\n1 weber = 1 × 10^{8} maxwells\n1 line of magnetic flux = 1 maxwell\n1 tesla = 1 × 10^{4} gauss\nNote: the sheet leaves the units off the first and the last line. Maxwells and gauss are the matching units from its table.\n\n## Magnetic force between poles\nF = K m_{1} m_{2}/d^{2} = (m_{1} m_{2})/(4π μ_{0} μ_{r} d^{2})\nK = 1/(4π μ_{0} μ_{r}) for SI, and K = 1 for English units\nF is the force (N), m_{1} and m_{2} are the pole strengths (Wb) and d is the distance between the centers of the poles (m)\nμ_{r} is the relative permeability, 1 for air\nμ_{0} is the permeability of a vacuum, 4π × 10^{-7} H/m. The sheet notes it as constant 33 in its calculator's list.\nμ = μ_{0} μ_{r} is the permeability of a material (H/m)\n\n## Magnetic field intensity\nH = F/m, with m the pole strength\nH = K m/d^{2} = m/(4π μ_{0} μ_{r} d^{2})\nμ = B/H, so μ_{0} μ_{r} = (Φ/A)/H\nWatch out: the sheet writes the second form of H with 4π μ_{0} μ_{r} multiplying m/d^{2}. It has to divide, since K = 1/(4π μ_{0} μ_{r}).\n\n## Field of a long straight conductor\nH = I/(2π d), in AT/m\nI is the current and d is the distance from the wire in meters\nB is the flux density in Wb/m^{2}\n\n## Field inside a long solenoid\nH = (N I)/(ℓ), in AT/m\n\n## Force on a current-carrying conductor in a magnetic field\nF = B I ℓ sinθ, in N\nB is the flux density (Wb/m^{2} or T), ℓ is the length in meters, I is the current (A) and θ is the angle the conductor makes with the magnetic field\nPower: P = F v, with P the power, F the force and v the velocity\n\n## Force between parallel current-carrying conductors\nF = (2 I_{1} I_{2} ℓ)/d × 10^{-7} N\nℓ is the length and d is the distance apart, in meters, for conductors in air.\nWatch out: the sheet writes the second form with a plus sign, I_{1} + I_{2} ℓ. It has to be a product, I_{1} I_{2} ℓ, as in the first form.\n\n## Torque on a loop carrying current\nT = B I N A cosθ, in N·m\nB is the flux density (Wb/m^{2} or T), I is the current (A), N is the number of turns and A = ℓ × b is the area of the coil (m^{2})\nNote: the sheet does not define θ. With cosθ in the formula it is the angle between the field and the plane of the coil, so the torque is greatest when the field lies in the plane of the coil.\n\n## Force on a moving charge in a magnetic field\nF = B Q v sinθ, in N\nB is the flux density (Wb/m^{2} or T), Q is the charge (coulomb), v is the velocity and θ is the angle between the velocity and the field\n\n## Magnetic and electric circuits compared\n- mmf (magnetomotive force, A-T) matches emf (electromotive force, volts)\n- Reluctance S = (ℓ)/(μ A) matches resistance R = (ρ ℓ)/A\n- Flux Φ = mmf/S matches current I = V/R\n- Permeance = 1/S matches conductance = 1/R\n\n## Magnetomotive force\nmmf = N I, in AT\nmmf = 0.4π N I, in gilberts\nI is the current (A) and N is the number of turns in the coil\n\n## Reluctance\nS = (ℓ)/(μ_{0} μ_{r} A)\n\n## Lifting power of a magnet\nP = (B^{2} A)/(2 μ_{0})\nP = ((Φ/A)^{2} A)/(2 μ_{0}) = Φ^{2}/(2 μ_{0} A)\nP is the lifting power, the pull (N), and A is the area (m^{2})\nWatch out: the sheet ends with Φ^{2}/(2 μ_{0}), leaving out the A. Since B = Φ/A, one A stays in the denominator.\n\n## Faraday's law\nFirst law: whenever a conductor cuts magnetic flux, an emf is induced in that conductor.\nSecond law: the magnitude of the induced emf is equal to the rate of change of flux linkages.\ne = -N dΦ/dt, in volts\ne is the induced emf, dΦ/dt is the rate of change of flux and N is the number of turns of the coil\nNote: the sheet says to disregard the negative sign when only the size of the emf is needed. The sign shows the direction (Lenz's law).\n\n## Direction of induced emf: Fleming's right-hand rule and Lenz's law\nFleming's right-hand rule gives the direction of an emf induced by flux cutting: the thumb points along the motion, the first finger along the magnetic field and the second finger along the induced current.\nLenz's law covers emf induced by changing flux linkages: the induced emf acts in the direction that opposes the change that produces it.\nNote: the sheet only draws the three directions for the right-hand rule. The finger assignment here is the standard one.\n\n## Dynamically induced emf\nStraight conductor: e = B ℓ v sinθ\nCoil, as given on the sheet: e = (1/2) B r^{2} ω sinθ\nB is the flux density (T), ℓ is the length (m), v is the speed (m/s), r is the radius (m), ω is the angular velocity (rad/s) and θ is the angle between the motion and the field\nNote: the (1/2) B r^{2} ω form is the emf across a radius r that sweeps through the field at angular speed ω. For an N-turn coil of area A turning in a uniform field, the usual form is e = N B A ω sinθ.\n\n## Self-induced emf and self-inductance\ne = L di/dt\nL = e/(di/dt)\nL = (N Φ)/I\ne is the induced emf (V), L is the inductance (henry), di/dt is the rate of change of current, N is the number of turns and Φ is the flux produced by the current I\n\n## Inductance from the coil dimensions\nL = N^{2}/S = (μ_{0} μ_{r} A N^{2})/(ℓ)\nS = (ℓ)/(μ_{0} μ_{r} A) is the reluctance of the magnetic path\nNote: for a circular coil, ℓ is the circumference, with C = π d. For a straight coil, ℓ is its length.\n\n## Mutual inductance\nM = (N_{2} Φ_{1})/I_{1}\nM = (μ_{0} μ_{r} A N_{1} N_{2})/(ℓ)\nM = -e_{m}/(di/dt)\nNote: the sheet gives these under \"mutually induced emf\" without defining the symbols. Read here as: e_{m} is the emf induced in the second coil and di/dt is the rate of change of current in the first coil, so e_{m} = -M di/dt.\n\n## Coefficient of coupling\nk = M/√(L_{1} L_{2})\nM = k √(L_{1} L_{2})\nk = (flux linking coils 1 and 2) ÷ (flux produced by coil 1) = Φ_{12}/Φ_{1}, with Φ_{1} = Φ_{11} + Φ_{12}\nPerfect coupling (k = 1): N_{1}/N_{2} = L_{1}/√(L_{1} L_{2}) = L_{1}/M\nNote: Φ_{11} is read here as the part of the coil 1 flux that links coil 1 only, and Φ_{12} as the part that also links coil 2. The sheet writes the N_{1}/N_{2} ratio without saying it holds only for k = 1.\n\n## Inductances in series\nAiding: L = L_{1} + L_{2} + 2M\nOpposing: L = L_{1} + L_{2} - 2M\nM = (L_{aiding} - L_{opposing})/4\nNote: use \"aiding\" when the two coil fluxes add and \"opposing\" when they subtract.\n\n## Inductances in parallel\nAiding: L = (L_{1} L_{2} - M^{2})/(L_{1} + L_{2} - 2M)\nOpposing: L = (L_{1} L_{2} - M^{2})/(L_{1} + L_{2} + 2M)\n\n## Energy stored in a magnetic field\nW = (1/2) L I^{2}, in joules\nL is the inductance (H) and I is the current (A)\n\n## Electromagnetic force in other units\nF = B I L, in newtons\nF = (B I L)/10, in dynes\nF = (B I L)/(1.13 × 10^{8}), in pounds\nNote: the sheet writes the last form as BIL/113,000,000 and gives no units. The usual units for these forms are B in gauss, L in cm and I in A for dynes, and B in lines per square inch, L in inches and I in A for pounds.\n\n@Topic: Transients\n\n## RC circuit charging: current and resistor voltage\ni = (V/R) e^{−t/RC} = (V/R) e^{−t/τ}\nv_{R} = i R = V e^{−t/RC}\nV is the supply voltage, τ = RC is the time constant, and the capacitor starts with no charge\nNote: the sheet writes the second form of i with τ for the time constant, labelled \"time constant\".\n\n## RC circuit charging: capacitor voltage and charge\nV_{S} = V_{R} + V_{C}\nV_{C} = V_{S} - V_{R} = V(1 − e^{−t/RC})\nq = Q(1 − e^{−t/RC}), with Q = C V\nq is the instantaneous charge and Q is the final charge\nWatch out: the sheet's box for V_{C} reads 1 − e^{−t/RC} with no V in front. It must be V(1 − e^{−t/RC}), which is what V_{S} − V_{R} gives.\nWatch out: the sheet also writes dV_{C}/dt = t/RC. That does not hold as written. Differentiating V_{C} gives dV_{C}/dt = i/C = (V/(R C)) e^{−t/RC}.\n\n## RC time constant\nτ = R C, in seconds\nAfter one time constant a charging capacitor has reached 63.2% of its final voltage. A discharging capacitor has fallen to 36.8% of its starting voltage.\nNote: the sheet gives only the 63.2% figure. The 36.8% is its complement, e^{−1}.\n\n## RC circuit discharging\ni = (V/R) e^{−t/RC} = I_{0} e^{−t/RC}\nV_{C} = V e^{−t/RC} = V_{0} e^{−t/RC}\nq = Q_{0} e^{−t/RC}\nI_{0}, V_{0} and Q_{0} are the initial values\n\n## Charging a capacitor through a resistor\nCurrent just after the switch is closed: i = (E/R) e^{-t/RC}\nVoltage across the resistor: E_{R} = E e^{-t/RC}\nVoltage across the capacitor: E_{C} = E(1 - e^{-t/RC})\nCharge on the capacitor: q = Q(1 - e^{-t/RC})\nTime constant: τ = R C (the sheet writes λ)\n\n## Discharging a capacitor\ni = I_{0} e^{-t/RC}\n\n## RL circuit: voltages when the current grows\nV_{R} = V_{S}(1 − e^{−R t/L})\nV_{L} = V e^{−R t/L} = V − V_{R}\nThe voltage across the inductor starts at the full supply voltage and decays to zero.\n\n## RL circuit: current when the current grows\ni = (V_{0}/R)(1 − e^{−R t/L})\nTime constant form: i = (V_{0}/R)(1 − e^{−t/τ}), with τ = L/R\nV_{0} is the supply voltage, and the current starts from zero\nWatch out: the sheet's second form has −τ/L in the exponent. It has to be −t/τ, since τ = L/R gives t/τ = R t/L.\nNote: the sheet words the starting condition as \"if current has no initial charge\", read here as zero initial current.\n\n## RL circuit: current decay\ni = I_{0} e^{−R t/L}\nTime constant: τ = L/R, in seconds\nI_{0} is the initial current\n\n## Energy in an L–C oscillation\nU_{total} = U_{inductor} + U_{capacitor}\nU_{total} = (1/2) L I^{2} + (1/2)(Q^{2}/C)\nConservation of energy: the energy moves between the inductor and the capacitor while the total stays the same.\n\n## Time constant from a given condition\nτ = −t ÷ ln(given condition)\nτ is the time constant: R C for an RC circuit and L/R for an RL circuit. t is the time (the sheet notes it is sometimes Δt).\nCondition for a decay: ln(V_{f}/V_{i}) for voltage, ln(I_{f}/I_{i}) for current\nCondition for a charge-up: ln(1 − V_{f}/V_{i}) for voltage, ln(1 − I_{f}/I_{i}) for current\nTo find the time instead: t = −τ ln(given condition)\nExample: a capacitor discharges to one third of its starting voltage in 2 s. τ = −2 ÷ ln(1/3) = 1.82 s.\nWatch out: read V_{f} and I_{f} as the value at time t. In a decay V_{i} is the starting value. In a charge-up V_{i} is the final steady value, so V_{f}/V_{i} is the fraction reached.\nWatch out: for charge the sheet writes ln(Q) or ln(1 − Q). Read Q as the fraction q/Q_{0}, a number between 0 and 1, not as a charge in coulombs.\n\n@Topic: DC Machines\n\n## Elements per slot and types of winding\nSimplex (m = 1): 2 elements per slot\nDuplex (m = 2): 4 elements per slot\nTriplex (m = 3): 6 elements per slot\nQuadruplex (m = 4): 8 elements per slot\nElements per slot = 2m. Z = (elements per slot) × (total slots), where Z is the number of elements (conductors) on the armature.\n\n## Lap and wave windings compared\n- Number of brushes: lap P, wave 2\n- Parallel paths: lap a = m P, wave a = 2m\n- Current per path: lap I_{p} = I_{a}/(m P), wave I_{p} = I_{a}/(2m)\n- Voltage per path: V_{p} = V_{a} (armature voltage) for both\n- Number of elements: Z = (Z per slot) × (total slots) for both\n- Commutator segments: Z/2 for both\nNote: P is the number of poles, m is the winding multiplicity (1 for simplex, 2 for duplex) and I_{a} is the armature current.\n\n## Average emf of a DC generator\nE_{g} = (P φ N Z)/(60 a)\nK = (P Z)/(60 a), the machine constant\nE = K φ N\nP is the number of poles, φ is the flux per pole (Wb), N is the speed (rpm), Z is the number of elements (conductors) and a is the number of parallel paths\n\n## Separately excited generator\nI_{a} = I_{L}\nE_{g} = V_{T} + I_{L} R_{a}\nV_{T} is the terminal voltage and R_{a} is the armature resistance\nNote: the field is fed by an external battery, so the field current does not enter the armature equations.\n\n## Shunt generator\nKCL: I_{a} = I_{sh} + I_{L}\nKVL: E_{g} = V_{t} + I_{a} R_{a}\nI_{sh} is the shunt field current and I_{L} is the load current\n\n## Series generator\nI_{a} = I_{L}\nE_{g} = V_{T} + I_{L}(R_{a} + R_{se})\nR_{se} is the series field resistance\n\n## Long-shunt compound generator\nI_{a} = I_{L} + I_{sh}\nE_{g} = V_{t} + I_{a}(R_{a} + R_{se})\nThe shunt field is connected across the armature and series field together.\n\n## Short-shunt compound generator\nI_{a} = I_{L} + I_{sh}\nE_{g} = V_{T} + I_{L} R_{se} + I_{a} R_{a}\nThe shunt field is connected across the armature alone, and the series field carries the load current.\n\n## Wave winding pitches\nAverage pitch: Y = (Z ± 2m)/P\nY = (Y_{b} + Y_{f})/2\nCoil pitch: Y_{s} = coil span in slots ÷ slots per pole\nRetrogressive lap winding: Y_{b} = Y_{f} − 2m\nZ is the number of conductors, P is the number of poles and m is the winding multiplicity\nNote: the retrogressive lap relation is given on the sheet under wave winding. The progressive lap form, which the sheet does not give, is Y_{b} = Y_{f} + 2m.\n\n## Cumulative compounding and voltage level\n- Overcompounded: the full-load voltage is higher than the no-load voltage\n- Flat compounded: the full-load voltage equals the no-load voltage\n- Undercompounded: the full-load voltage is lower than the no-load voltage\nNote: the sheet writes the three cases as V_{T} ≥ E_{g} (the first symbol is hard to read), V_{T} = E_{g} and V_{T} ≤ E_{g}, and labels the third one \"full load voltage\". Read here as V_{T} the full-load terminal voltage and E_{g} the no-load voltage, with the third case being undercompounded.\n\n## Voltage regulation\n%VR = ((V_{NL} − V_{FL})/V_{FL}) × 100\nV_{NL} is the no-load voltage and V_{FL} is the full-load voltage\nNote: the sheet puts this under differential compounding, but it is the general definition of regulation for any generator.\n\n## Power flow in a DC generator\nP_{in} is the input (mechanical) power. P_{dev} = P_{in} − P_{core} − P_{mech} and P_{out} = P_{dev} − P_{cu}.\nP_{dev} = E_{g} I_{a}, the power developed in the armature\nP_{cu} = I^{2} R, the electrical (copper) losses\nP_{core} is the core loss, made up of hysteresis loss and eddy current loss\nP_{mech} is the mechanical loss, and P_{out} is the electrical output power\n\n## Core losses: hysteresis and eddy current\nHysteresis loss: P_{h} = K_{h} B_{m}^{1.6} f\nEddy current loss: P_{e} = K_{e} (B_{m} f)^{2}\nB_{m} ∝ V/f\nK_{h} and K_{e} are numerical constants, B_{m} is the maximum flux density and f is the frequency\nNote: the sheet says B_{m} is proportional to voltage and inversely proportional to frequency.\n\n## Electrical and mechanical efficiency\nη_{e} = (P_{out}/P_{dev}) × 100\nη_{m} = (P_{dev}/P_{in}) × 100\nNote: multiplying the two gives the overall efficiency, P_{out}/P_{in}.\n\n## Separately excited DC motor\nE_{b} = V_{T} − I_{a} R_{a}\nE_{b} is the back emf, V_{T} is the terminal voltage, I_{a} is the armature current and R_{a} is the armature resistance\nNote: the sheet labels the armature current I_{s} in this diagram. The armature carries the line current here, so I_{s} = I_{a}. The field is fed from a separate source with current I_{f}.\n\n## Shunt DC motor\nI_{s} = I_{a} + I_{sh}\nE_{b} = V_{T} − I_{a} R_{a}\nI_{s} is the supply (line) current and I_{sh} is the shunt field current\n\n## Series DC motor\nI_{a} = I_{s} = I_{f}\nE_{b} = V_{T} − I_{a}(R_{a} + R_{se})\nNote: the sheet writes the series field resistance as R_{sc}, read here as R_{se}.\n\n## Long-shunt compound DC motor\nI_{s} = I_{a} + I_{sh}\nE_{b} = V_{T} − I_{a}(R_{a} + R_{se})\nThe shunt field is connected across the armature and series field together.\n\n## Short-shunt compound DC motor\nI_{s} = I_{a} + I_{sh}\nE_{b} = V_{T} − I_{s} R_{s} − I_{a} R_{a}\nR_{s} is the series field resistance. The series field carries the supply current and the shunt field is across the armature alone.\n\n## Output and developed power of a DC motor\nP_{out} = (2π N T_{out})/60\nP_{dev} = (2π N T_{d})/60 = E_{b} I_{a}\nLinear motion: P = F v\nRotating motor: P = T ω\nN is the speed (rpm), T_{out} is the output (shaft) torque and T_{d} is the developed torque\n\n## Back emf and torque of a DC motor\nE_{b} = (P φ N Z)/(60 a) = K φ N, with K = (P Z)/(60 a)\nT = (P φ Z I_{a})/(2π a) = K_{T} φ I_{a}, with K_{T} = (P Z)/(2π a)\nP is the number of poles, φ is the flux per pole, N is the speed (rpm), Z is the number of conductors and a is the number of parallel paths\nWatch out: the sheet writes T = K φ I_{a} with the same letter K it used for the emf. The two constants are not equal: K_{T} = (60/(2π)) K, about 9.55 K.\n\n## Speed regulation of a DC motor\n%SR = ((N_{NL} − N_{FL})/N_{FL}) × 100\nN_{NL} is the no-load speed and N_{FL} is the full-load speed\nNote: the sheet labels this %NR, read here as percent speed regulation.\n\n## Efficiencies of a DC motor\nElectrical: η_{e} = (P_{dev}/P_{in}) × 100\nMechanical: η_{m} = (P_{out}/P_{dev}) × 100\nCommercial: η_{c} = (P_{out}/P_{in}) × 100\nNote: the commercial efficiency is the product of the electrical and mechanical efficiencies.\n\n## Starting a DC motor\nAt standstill N = 0, so E_{b} = 0, because E_{b} is proportional to N.\nV_{T} = E_{b} + I_{a}(R_{a} + R_{st}) = I_{a}(R_{a} + R_{st}) at the start\nR_{st} = V_{T}/I_{a} − R_{a}\nR_{st} is the starting resistance and I_{a} is the allowed starting armature current\n\n@Topic: Synchronous Machines\n\n## Frequency of an alternator\nf = (P N)/120\nf is the frequency (Hz), P is the number of poles (even) and N is the synchronous speed (rpm)\n\n## Mechanical and electrical degrees\nθ_{E} = (P/2) θ_{M}\nθ_{E} ≥ θ_{M}, because P/2 ≥ 1\nNote: the comparison sign on the sheet is hard to read. It is read here as ≥, which follows from P/2 ≥ 1.\n\n## Pitch factor\nFull-pitch winding: K_{p} = 1\nFractional-pitch winding: K_{p} = cos(α/2) = sin(θ_{P}/2)\nα = 180° − θ_{P}\nθ_{P} = (coil span in slots ÷ slots per pole) × 180°\nNote: the printed line gives θ_{P} = (coil pitch ÷ slot pitch) × 180, and a pencil note in a different hand beside it reads \"slots/pole\". It is written here the way the pencil note reads.\nNote: the same pencil note gives α = 180 ÷ (slots per pole). That is the electrical angle of one slot, so it equals the short-pitch angle only for a coil that is short by one slot.\n\n## Distribution factor\nConcentrated winding: K_{d} = 1\nDistributed winding: K_{d} = (sin(m θ_{d}/2))/(m sin(θ_{d}/2))\nThe same, with other letters: K_{d} = (sin(n d/2))/(n sin(d/2))\nm (or n) = slots per pole per phase = slots ÷ (poles × phases)\nθ_{d} (or d) = 180° ÷ (slots per pole), the electrical angle between slots\nPitch = coil span ÷ (slots per pole)\nNote: a pencil note on the sheet gives m = slots ÷ (pole × phase) and θ_{d} = 180 ÷ (slots per pole). The printed boxes say \"slots/pole over phase\".\n\n## Effective emf per phase of an alternator\nE_{φ} = 4.44 f Φ N K_{p} K_{d}\nE_{φ} = 2.22 f Φ Z K_{p} K_{d}\nf is the frequency, Φ is the flux per pole (Wb), N is the turns per phase and Z is the conductors per phase, with N = Z/2\nNote: if the flux is in maxwells, multiply by 10^{−8}, since 1 Wb = 10^{8} maxwells.\n\n## Line and phase values of an alternator winding\nWye: E_{gL} = E_{gp} √3 ∠30°, and I_{L} = I_{p}\nDelta: E_{gL} = E_{gp}, and I_{L} = √3 I_{p} ∠−30°\nE_{gL} is the line emf and E_{gp} is the phase emf\n\n## Salient pole alternator\nE_{g}' = V_{φ} + I_{a}(R_{a} + j X_{q}) = |E_{g}'| ∠δ\nE_{g} = V_{φ} + I_{a} R_{a} + j I_{d} X_{d} + j I_{q} X_{q}, the total emf\nI_{d} = |I_{a}| sin[cos^{−1}(pf) + δ]\nI_{q} = |I_{a}| cos[cos^{−1}(pf) + δ]\nWatch out: on the sheet the letters q and a look alike. They are read here as X_{q} and I_{q}, the quadrature-axis reactance and current, which is what these formulas need. The sheet also leaves out the j's in the second line, but as phasors they are needed.\nNote: these are the lagging-load forms. For a leading load the angle in the brackets becomes δ − cos^{−1}(pf). The sheet does not mention this.\n\n## Alternator at different power factors\nE_{g} = V_{φ} + I_{a}(R_{a} + j X)\nX is the synchronous reactance\nNote: the sheet draws three phasor diagrams, for lagging, unity and leading loads. Each adds I_{a} R_{a} and j I_{a} X to V_{φ} to reach E_{g}.\n\n## Alternator voltage regulation\n%VR = ((V_{NL} − V_{FL})/V_{FL}) × 100\n%VR = ((E_{gφ} − V_{Tφ})/V_{Tφ}) × 100\nThe second form uses per-phase values: E_{gφ} is the no-load phase emf and V_{Tφ} is the full-load phase terminal voltage.\n\n## Alternator DC resistance test\nWye: R_{a,dc} = R_{T}/2\nDelta: R_{a,dc} = (3 R_{T})/2\nNote: the sheet does not define R_{T}. It is read here as the resistance measured between two terminals.\n\n## Alternator open-circuit test\nWye: E_{OC} = V_{T}/√3\nDelta: E_{OC} = V_{T}\nE_{OC} is the open-circuit emf per phase and V_{T} is the open-circuit terminal (line) voltage\n\n## Alternator short-circuit test\nWye: I_{SC} = I\nDelta: I_{SC} = I/√3\nI is the line current and I_{SC} is the armature current per phase\n\n## Synchronous impedance and reactance\nZ = E_{OC}/I_{SC}\nX = √(Z^{2} − R_{a}^{2})\nZ is the magnitude of the synchronous impedance. E_{OC} and I_{SC} are per-phase values taken at the same field current.\n\n## Synchronous motor excitation and power factor\n- Under-excited: lagging power factor\n- Normally excited: unity power factor\n- Over-excited: leading power factor\n\n## Smooth cylindrical rotor synchronous motor\nVoltage: V_{φ} = E_{φ} − I_{φ}(R_{a} + j X_{a})\nPower: P_{in} = P_{dev} + 3 I_{φ}^{2} R_{φ} + (other losses)\nPower developed: P_{dev} = ((E_{L} V_{L})/Z) cos(θ_{Z} − α) − (E_{L}^{2} R_{φ})/Z^{2}\nNote: the last term of P_{in} on the sheet reads like \"P_cost\". It is read here as the remaining losses.\nNote: α is read as the torque angle and θ_{Z} as the angle of the synchronous impedance. Z is the magnitude of the synchronous impedance. With line values E_{L} and V_{L} and phase values R_{φ} and Z, P_{dev} is the three-phase total.\n\n@Topic: Induction Motors\n\n## Synchronous speed, rotor speed and slip\nN_{s} = (120 f)/P\nN_{r} = N_{s}(1 − s)\ns = (N_{s} − N_{r})/N_{s} = f_{r}/f_{s}\nN_{r} ≤ N_{s}\nNote: the comparison sign on the sheet is hard to read. Since the rotor runs slower than the field, it is read here as ≤.\n\n## Stator current of an induction motor\nI_{1} = V_{φ}/√((r_{1} + r_{2}/s)^{2} + (x_{1} + x_{2})^{2})\nNote: the sheet's label here looks like I_{2}, and the next lines call it I_{1}. It is the one current through the series branch r_{1} + r_{2}/s, called I_{1} in these items.\n\n## Active power absorbed by an induction motor\nP_{in} = V_{φ}^{2}/R_{m} + I_{1}^{2}(r_{1} + r_{2}/s)\nThis is a per-phase value.\nWatch out: the sheet writes I_{1} without the square. Power needs I_{1}^{2}.\n\n## Reactive power absorbed by an induction motor\nQ_{in} = V_{φ}^{2}/X_{m} + I_{1}^{2}(x_{1} + x_{2})\nThis is a per-phase value.\nWatch out: the sheet writes I_{1} without the square here too. It has to be I_{1}^{2}.\n\n## Apparent power and line current of an induction motor\nS = √(P_{in}^{2} + Q_{in}^{2}) ∠tan^{−1}(Q/P)\nI_{L} = S/(√3 V_{L})\nNote: P_{in} and Q_{in} above are per phase, so multiply S by 3 to get the three-phase total before using it in I_{L} = S/(√3 V_{L}), where V_{L} is the line voltage.\nWatch out: the sheet writes I_{1} = S/(√3 V_{φ}). That is only right if V_{φ} here means the line voltage and S is the three-phase total.\n\n## Rotor power flow in an induction motor\nP_{in,r} = P_{airgap} = I_{2}^{2} (R_{2}/s)\nP_{cu,r} = s P_{r}\nP_{d} = P_{in,r} − P_{cu,r}\nP_{out} = P_{d} − P_{rot}\nP_{in,r} is the rotor input power, P_{r} is the rotor input, P_{d} is the power developed and P_{rot} is the rotational loss\n\n## Efficiency of an induction motor\nη = (P_{out}/P_{in}) × 100\n\n## Torque developed by an induction motor\nT_{d} = (60 × 3 I_{2}^{2} r_{2} (1 − s))/(2π s N_{r})\nT_{d} = (60 × 3 V_{φ}^{2} (r_{2}/s))/(2π N_{s} ((r_{1} + r_{2}/s)^{2} + (x_{1} + x_{2})^{2}))\nNote: the first form is the developed power divided by the rotor speed. The sheet gives it on one page and the second form at the top of the next.\n\n## Maximum torque and slip at maximum torque\nT_{dm} = (60 × 3 V_{φ}^{2} × 0.5)/(2π N_{s} (r_{1} + √(r_{1}^{2} + (x_{1} + x_{2})^{2})))\ns_{mT} = r_{2}/√(r_{1}^{2} + (x_{1} + x_{2})^{2})\n\n## Torque ratio from the slips\nT_{df}/T_{dm} = (2 s_{mT} s_{F})/(s_{mT}^{2} + s_{F}^{2})\nT_{df} is the full-load torque, T_{dm} is the maximum torque and s_{F} is the full-load slip\n\n## Starting relations for an induction motor\nT ∝ V^{2}\nT ∝ I^{2}\nV ∝ I\nNote: the sheet lists these under \"methods of starting induction motor: direct\". They let you scale starting torque and current when the starting voltage changes.\n\n## No-load test of an induction motor\nS_{NL} = √3 E_{NL} I_{NL}\nX_{m} = E_{NL}^{2}/Q_{NL}\nR_{m} = E_{NL}^{2}/P_{NL}\nNote: these fit together when E_{NL} is the line voltage and P_{NL} and Q_{NL} are the three-phase totals. The sheet does not say.\n\n## Blocked-rotor test of an induction motor\nS_{br} = √3 E_{br} I_{br}\nX_{e1} = Q_{br}/(3 I_{br}^{2})\nR_{e1} = P_{br}/(3 I_{br}^{2})\nThe slip is 1 in this test.\nNote: the sheet's labels here read like \"ir\", taken as \"br\" for blocked rotor.\nWatch out: the sheet writes P_{NL} in the R_{e1} formula. It has to be the blocked-rotor power P_{br}.\n\n@Topic: Transmission Lines\n\n## Classification of lines by length\n- Short line: 80 km (50 miles) or less\n- Medium line: 81 to 240 km (150 miles)\n- Long line: above 240 km\n\n## Series resistance of a line\nDC resistance: R_{dc} = (ρ L)/A\nAC resistance: R_{ac} = K R_{dc}, with K = (1 + √(1 + F^{2}))/2\nF = 0.0105 d^{2} f for copper\nF = 0.0063 d^{2} f for aluminum\nd is the conductor diameter (inch) and f is the frequency (Hz)\nNote: the sheet gives K and F without a derivation, so take them as given. K is 1 or more, which raises the DC resistance to allow for the AC effect.\n\n## Inductance of a line\nL = 0.2 ln(GMD/GMR) for a three-phase line\nL = 0.4 ln(GMD/GMR) for a single-phase line\nNote: the sheet writes only \"(km)\" after the formula. The coefficients 0.2 and 0.4 fit inductance in mH per km, read here as per phase for the three-phase line.\n\n## GMR and GMD for line inductance\nIf the GMR is not given: GMR = 0.779 r, the self GMR of a round conductor of radius r\nThree-phase GMD for conductors spaced D, D and 2D: GMD = (D × D × 2D)^{1/3}\nNote: the sheet writes the GMD as the cube root of (D)(D)(2D) without describing the layout. It is the geometric mean of the three spacings for a flat layout.\n\n## Capacitance of a line\nSingle-phase: C = (π ε_{0})/ln(D/r)\nThree-phase: C = (2π ε_{0})/ln(D/r)\nε_{0} = 8.854 × 10^{−12} F per meter, and D is the spacing and r is the conductor radius\nNote: the sheet says \"ε_{0} = constant 32\", a stored calculator constant. The constant number differs between calculator models, so check it on yours.\n\n## Capacitance of a line with the effect of the earth\nC = (2π ε_{0})/(ln(D/r) − ln √(1 + D^{2}/(4 h^{2})))\nNote: the sheet writes the denominator as one logarithm, ln of D over r divided by the square-root term, which is the same thing. It does not define h. Read here as the height of the conductor above the ground.\n\n## Bundled conductors: GMR for inductance\n2-conductor bundle: GMR = (0.779 r d)^{1/2}\n3-conductor bundle: GMR = (0.779 r d^{2})^{1/3}\n4-conductor bundle: GMR = 1.09 (0.779 r d^{3})^{1/4}\nr is the radius of one conductor and d is the spacing within the bundle\n\n## Bundled conductors: radius for capacitance\n2-conductor bundle: (r d)^{1/2}\n3-conductor bundle: (r d^{2})^{1/3}\n4-conductor bundle: 1.09 (r d^{3})^{1/4}\nNote: the sheet gives these under \"capacitance\" with no name. They are read here as the equivalent radius used in place of r in the capacitance formula.\n\n## ABCD constants of a short line\nA = D = 1\nB = Z\nC = 0\n\n## ABCD constants of a medium line\nNominal π: A = D = 1 + (y z)/2, B = z, C = y(1 + (y z)/4)\nNominal T: A = D = 1 + (z y)/2, B = z(1 + (z y)/4), C = y\nEnd condenser: A = 1 + z y, B = z, C = y\nNote: the sheet gives no D for the end condenser. It is 1.\n\n## ABCD constants of a long line (sheet version)\nA = D = cosh(γ L)\nB = Z_{c} sinh(γ L)\nC = sinh(γ L)/Z_{c}\nWatch out: the sheet writes C = 1/(Z_{c} sinh(γ L)). The correct form is C = sinh(γ L)/Z_{c}. You can check it with A D − B C = 1.\n\n## Using ABCD constants at the receiving end\n1. Get θ_{r} = cos^{−1}(pf).\n2. The current angle is −θ_{r} for a lagging load and +θ_{r} for a leading load. The apparent power angle is +θ_{r} for lagging and −θ_{r} for leading.\n3. I_{r} = S/(√3 V_{L-L})\n4. V_{s} = A V_{r} + B I_{r}\n5. I_{s} = C V_{r} + D I_{r}\nWith no ABCD constants (short line): V_{s} = V_{r} + I_{r} Z_{L}\nNote: in step 4, V_{r} has to be the phase voltage, V_{L-L}/√3, for a three-phase line. The sheet does not say so.\n\n## Line voltage regulation from per-unit R and X\n%VR = √((pf + %R)^{2} + (sinθ ± %X)^{2}) − 1\nPlus for a lagging load and minus for a leading load\nR = (%R)(V^{2}/S)\nX = (%X)(V^{2}/S)\nNote: %R and %X are used here as per-unit fractions (5% is 0.05), and the result is per unit. Multiply by 100 for percent.\n\n## Voltage regulation from the sending and receiving ends\n%VR = ((|E_{S}| − E_{R})/E_{R}) × 100\nE_{S} = E_{R} + I_{R} Z_{L}\nE_{S} is the sending-end voltage, E_{R} is the receiving-end voltage, I_{R} is the receiving-end current and Z_{L} is the line impedance\nNote: the sheet puts this at the bottom of the transformer rating page, and does not define the symbols. They are read here for a line.\n\n@Topic: Transformers 1\n\n## Ideal transformer emf\nE_{rms} = 4.44 f N Φ_{max}\nE_{rms} = √2 π f N Φ_{max}\nNote: the two forms are the same, since √2 π is 4.443.\n\n## Ideal transformer ratios\nE_{1}/E_{2} = N_{1}/N_{2} = a (voltage ratio)\nI_{1}/I_{2} = N_{2}/N_{1} = 1/a (current ratio)\nZ_{1}/Z_{2} = R_{1}/R_{2} = X_{1}/X_{2} = a^{2} (ohmic ratio)\na = N_{1}/N_{2}\n\n## Equivalent circuit referred to the primary\nR_{01} = R_{1} + a^{2} R_{2}\nX_{01} = X_{1} + a^{2} X_{2}\nZ_{01} = R_{01} + j X_{01}\nR_{01}, X_{01} and Z_{01} are the equivalent primary resistance, reactance and impedance\n\n## Open-circuit test of a transformer\nP_{oc} = P_{core}\nR_{0} = V_{1}^{2}/P_{oc}\nX_{0} = V_{1}^{2}/Q_{oc}\nS_{oc} = V_{1} I_{0}\nQ_{oc} = √(S_{oc}^{2} − P_{oc}^{2})\nP_{oc} is the wattmeter reading, V_{1} is the applied rated voltage, I_{0} is the no-load current, I_{m} is the magnetizing current, R_{0} is the resistance that represents core loss and X_{0} is the magnetizing reactance\n\n## Short-circuit test of a transformer\nP_{sc} = P_{cu} at full load\nR_{eq} = P_{sc}/I_{sc}^{2}\nZ_{eq} = E_{sc}/I_{sc}\nX_{eq} = √(Z_{eq}^{2} − R_{eq}^{2})\n\n## Copper loss of a transformer\nP_{cu} = I_{1}^{2} R_{1} + I_{2}^{2} R_{2}\nP_{cu} = I_{1}^{2} R_{01} = I_{2}^{2} R_{02}\nAt a fraction x of full load: P_{cu} = x^{2} P_{cuFL}\n\n## Transformer core loss: hysteresis and eddy current\nHysteresis loss: P_{h} = K f B_{m}^{1.6}, where 1.6 is the Steinmetz exponent\nP_{h} = K (E^{1.6}/f^{0.6})\nEddy current loss: P_{e} = K f^{2} B_{m}^{2} = K E^{2}\nK is a proportionality constant, f is the frequency of the input voltage and B_{m} is the maximum flux density in the core\nNote: the sheet notes that E is proportional to f B_{m}. That is what turns the first forms into the E forms.\n\n## Commercial efficiency of a transformer\nη = P_{out}/P_{in} = P_{out}/(P_{out} + P_{cu} + P_{co})\nP_{out} = S x (pf)\nP_{cu} = x^{2} P_{cuFL}\nP_{co} is the core loss and x is the fraction of full load\n\n## Maximum efficiency of a transformer\nCondition: P_{cu} = P_{co}\nη_{m} = P_{out,max}/P_{in} = P_{out,max}/(P_{out,max} + 2 P_{co})\nLoad at maximum efficiency: x = √(P_{co}/P_{cuFL}), as a fraction of full load\nCurrent at maximum efficiency: I_{max} = x I_{1}, with I_{1} the rated current\nRated apparent power: S = E I_{1}\n\n## All-day efficiency of a transformer\nη_{allday} = W_{out}/(W_{out} + W_{cu} + W_{co})\nW_{out} = Σ(P_{out} t)\nW_{cu} = Σ(P_{cu} t)\nW_{co} = P_{co} t\nP_{out} = x S_{FL} (pf), P_{cu} = x^{2} P_{cuFL}, and x = √(P_{cu}/P_{cuFL}) is the fraction of full load that gives a copper loss P_{cu}\nNote: if the transformer is connected to the primary lines the whole day, loaded or not, the time in W_{co} is 24 hours.\n\n## Transformer voltage regulation\n%VR = ((E_{S} − V_{S})/V_{S}) × 100 = ((E_{NL} − E_{FL})/E_{FL}) × 100\nE_{S} is the no-load secondary emf and V_{S} is the loaded secondary voltage\nPer-unit form: %VR = √((cosθ + %IR)^{2} + (sinθ ± %Ix)^{2}) − 1\nPlus for a lagging power factor and minus for a leading one\nNote: the sheet shows the first form without the factor of 100.\n\n@Topic: Transformers 2\n\n## Autotransformer power transformed and conducted\nS_{transformed} = (V_{high} − V_{low}) I_{high}\nS_{conducted} = S_{output} − S_{transformed}\nWatch out: the sheet writes S_{transformed} = (V_{2} − V_{1}) I_{1} for step-down and (V_{2} + V_{1}) I_{1} for step-up. It does not say which side V_{1} and V_{2} are, and the plus sign in the step-up line does not fit. Both cases work out as (V_{high} − V_{low}) times the current at the high-voltage terminal. This is my correction.\n\n## Open delta bank rating\nS_{Δ-Δ} = 3 S_{rated}\nS_{V-V} = √3 S_{rated}\nS_{rated} = V_{c} I_{c} for one transformer\nWatch out: the sheet's third line reads S_{rated} = √3 V_{c} I_{c}. That is the V-V bank rating, S_{V-V} = √3 V_{c} I_{c}, with V_{c} and I_{c} the rated voltage and current of each transformer.\n\n## Loading check with an additional load\n|(load ÷ pf) ∠θ + x| ÷ (max rating) ≤ 1\nWith the added load at its own angle: |(load ÷ pf) ∠θ + x ∠θ_{x}| ÷ (max rating) ≤ 1\nx is the additional load. The sheet says to work it in complex mode, MODE 2.\nNote: the comparison on the sheet is hard to read. It says the result should be equal to 1 or less to satisfy the rating. The second form's angle on the added load is read here as its own angle.\n\n## Voltage and current ratings of three-phase transformer connections\nEach pair below is voltage, then current. V and I are the primary line voltage and line current, and a = N_{1}/N_{2}.\n- Δ–Δ, primary: line V and I; phase V and (I)/(√3)\n- Δ–Δ, secondary: line (V)/(a) and a I; phase (V)/(a) and (a I)/(√3)\n- Y–Y, primary: line V and I; phase (V)/(√3) and I\n- Y–Y, secondary: line (V)/(a) and a I; phase (V)/(√3 a) and a I\n- Δ–Y, primary: line V and I; phase V and (I)/(√3)\n- Δ–Y, secondary: line (√3 V)/(a) and (a I)/(√3); phase (V)/(a) and (a I)/(√3)\n- Y–Δ, primary: line V and I; phase (V)/(√3) and I\n- Y–Δ, secondary: line (V)/(√3 a) and √3 a I; phase (V)/(√3 a) and a I\nNote: the sheet gives these as a table with the connection in the first column, and marks the secondary line voltage with an asterisk for a = N_{1}/N_{2}.\n\n## Parallel operation of two transformers\nI_{A} = (I_{L} Z_{B})/(Z_{A} + Z_{B})\nI_{B} = (I_{L} Z_{A})/(Z_{A} + Z_{B})\nS_{A}^{*} = (S_{L}^{*} Z_{B})/(Z_{A} + Z_{B})\nS_{B}^{*} = (S_{L}^{*} Z_{A})/(Z_{A} + Z_{B})\nThe star means the complex conjugate, and the sheet's angle note is +θ for leading and −θ for lagging.\nEach transformer takes the share set by the other one's impedance. Use complex impedances referred to the same side.\n\n@Topic: Power Plant\n\n## Hydroelectric power\nP_{in} = Q ω h\nP_{out} = η P_{in} = η Q ω h\nQ is the volume flow rate (m^{3} per s or ft^{3} per s), ω is the specific weight of water (9810 N per m^{3} or 62.4 lb per ft^{3}) and h is the hydraulic head (m or ft)\nNote: the sheet uses ω for the specific weight of water, and P_{in} is the power harnessed from the potential energy of the water.\n\n## Coal-fired or diesel plant efficiency\ne = TEP/(m × HV)\ne is the efficiency, TEP is the total energy produced (W·hr), m is the mass of fuel (kg, g or lb) and HV is the heating (calorific) value (J per kg, cal per g or BTU per lb)\nTEP and m × HV have to be in the same energy unit.\n\n## Wind power plant\nP_{in} = (2.46 × 10^{−3}) D^{2} v^{3}, in watts\nP_{out} = (2.46 × 10^{−3}) η D^{2} v^{3}, in watts\nP_{ave} = (P_{max} + P_{min})/2\nNote: the sheet does not define D and v or give their units. D is read here as the rotor diameter and v as the wind speed. Check your reviewer for the units that go with the constant 2.46 × 10^{−3}.\n\n## Wave or tidal power plant\nP_{in} = 0.219 A h^{2}, in megawatts\nNote: the sheet does not define A and h or give their units. Read here as the basin area and the tidal height. Check your reviewer for the units.\n\n## Load factor\nLF = AL/MD = TEP/(MD × P_{r})\nAL is the average load, MD is the maximum demand, TEP is the total energy produced and P_{r} is the hours in the period (8760 hours for a year)\n\n## Capacity factor\nCF = TEP/(IC × P_{r})\nIC is the installed capacity and P_{r} is the hours in the period (8760 hours for a year)\n\n## Plant use factor\nPUF = TEP/(IC × S_{r})\nS_{r} is the hours in service\n\n## Demand factor\nDF = MD/CL\nMD is the maximum demand and CL is the connected load\nNote: the sheet notes that the demand factor is always less than or equal to 1.\n\n## Diversity factor\nDF = ΣMD_{i}/MD_{s} = MND/MCD\nMD_{i} are the individual maximum demands and MD_{s} is the simultaneous (coincident) maximum demand\nNote: the sheet's subscripts on this one are smudged. They are read here as i for individual and s for simultaneous, as on the coincidence factor below. MND is read as the maximum non-coincident demand and MCD as the maximum coincident demand.\n\n## Coincidence factor\nCoF = MCD/MND = MD_{s}/ΣMD_{i}\nMD_{s} is the simultaneous maximum demand and MD_{i} are the individual maximum demands\nNote: this is the reciprocal of the diversity factor.\n\n## Connected load factor\nCLF = AL/CL\n\n## Operating load factor\nOLF = AL/AMD\nAMD is the average daily maximum demand\n\n## Operating plant factor\nOPF = AL/OPC\nOPC is the operating plant capacity\n\n## Operating (service) factor\nOSF = t_{s}/t\nt_{s} is the service hours and t is the time period\n\n## Annual capacity factor\nCF_{annual} = TEP per year ÷ (IC × 8760 hrs)\nIC is the installed capacity\n\n## Plant use (output) factor\nOF = TEP/(IC × t_{s})\nt_{s} is the service hours\n\n## Utilization factor\nUF = MD/IC\n\n## Reserve capacity\nR = IC − MD\nIf P_{r} = S_{r}: R = MD((LF − CF)/CF) = IC((LF − CF)/LF)\nIf P_{r} ≠ S_{r}: R = MD((LF − PUF)/PUF) = IC((LF − PUF)/LF)\nP_{r} is the hours in the period and S_{r} is the hours in service\n\n## Hours in service\nS_{r} = P_{r}(CF/PUF)\nP_{r} is the hours per year (8760), CF is the capacity factor and PUF is the plant use factor\n\n## Exponential growth rate\nP = P_{0} e^{Kt}\nP is the power or energy demand at the given time t, P_{0} is the initial value (at t = 0), K is the growth rate and t is the time in years\n\n## Energy conversions for power plant problems\n1 kWh = 3413 BTU = 860 kcal = 3600 kJ\n1 cal = 4.186 J\nWatch out: the sheet's grey note writes the kcal figure like 8600 and 1 cal as 4.86 J. Both are slips. The values are 860 kcal and 4.186 J, which agree with 3600 kJ in a kWh.\n\n@Section: Formulas\n@Source: Claude summary (PEC section numbers as the study material cites them; OSH rates from the OSHS and the usual ANSI convention)\n\n@Subject: ESAS\n@Topic: PEC\n\n## Continuous and non-continuous load\nI = 1.25 I_{cont} + I_{noncont}\nA continuous load is one whose maximum current continues for three hours or more.\nI is the minimum ampacity of the branch-circuit conductor and the minimum rating of the overcurrent device (before the next-higher-rating rule).\nExample: 16 A continuous plus 4 A non-continuous. I = 1.25 × 16 + 4 = 24 A, so the circuit needs a 25 A device and a conductor good for at least 24 A.\n\n## Dwelling: lighting load and demand\nGeneral lighting load = floor area × 24 VA/m^{2}\nAdd the small-appliance circuits (2 × 1,500 VA) and the laundry circuit (1,500 VA).\nDemand on that total: first 3,000 VA at 100%, 3,001 VA to 120,000 VA at 35%, and the part over 120,000 VA at 25%.\nDemand = 3,000 + 0.35 (P - 3,000), for a total P between 3,000 VA and 120,000 VA\nExample: 150 m^{2} dwelling. Lighting = 150 × 24 = 3,600 VA. Add 3,000 VA small-appliance and 1,500 VA laundry. P = 8,100 VA. Demand = 3,000 + 0.35 × 5,100 = 4,785 VA.\nNote: Apply the demand steps first. The range, motors and fixed appliances are added after that.\n\n## Number of branch circuits\nN = P/(V × I_{rating})\nP is the load in VA, V is the circuit voltage (230 V single-phase in most Philippine dwellings) and I_{rating} is the breaker size in amperes.\nRound N up to the next whole circuit.\nNote: For a continuous load, use only 80% of the breaker rating, which is the same as the 125% rule.\n\n## Motor circuits\nBranch-circuit conductor to one motor: I ≥ 1.25 × FLC\nFeeder to several motors: I = 1.25 FLC_{largest} + ΣFLC_{others}\nOverload device: 1.15 × nameplate current (service factor of 1.15 or more, or a temperature rise of 40 °C or less), otherwise 1.25 × nameplate current\nShort-circuit and ground-fault device: rating ≤ the percent from the table × FLC (inverse-time breaker 250%, dual-element fuse 175%, non-time-delay fuse 300%, instantaneous-trip breaker 800%)\nFLC is the full-load current from the PEC motor table, not the nameplate current. The overload device uses the nameplate current.\nExample: motors of 20 A, 12 A and 8 A. Feeder = 1.25 × 20 + 12 + 8 = 45 A.\nWatch out: The 125% is added to the largest motor only. The others count at 100%.\n\n## Allowable ampacity\nI_{allowable} = I_{table} × K_{temp} × K_{adj}\nI_{table} is the ampacity from the table for the insulation rating and the conductor size.\nK_{temp} is the correction for an ambient temperature other than the table's (30 °C).\nK_{adj} is the adjustment for the number of current-carrying conductors in the raceway: 4 to 6 × 0.80, 7 to 9 × 0.70, 10 to 20 × 0.50, 21 to 30 × 0.45, 31 to 40 × 0.40.\nExample: 8.0 mm^{2} copper at 75 °C has 50 A in the table. Eight current-carrying conductors in the same conduit. I = 50 × 0.70 = 35 A.\nNote: A neutral that carries only the unbalanced current is not counted. On circuits with non-linear loads, count it.\n\n## Service neutral demand\nI_{N} = I, for I ≤ 200 A\nI_{N} = 200 + 0.70 (I - 200), for the part of the unbalanced load above 200 A\nExample: unbalanced load of 300 A. I_{N} = 200 + 0.70 × 100 = 270 A.\nWatch out: The reduction is not allowed for four-wire, three-phase circuits that feed non-linear loads.\n\n## Voltage drop\nSingle-phase: VD = (2 K I L)/A\nThree-phase: VD = (sqrt(3) K I L)/A\nPercent drop = (VD/V) × 100\nK is 12.9 Ω·cmil per ft for copper (21.2 for aluminum) at 75 °C. L is the one-way length in ft and A is the area in circular mils.\nIn metric units: R = (ρ L)/A, with ρ = 0.0172 Ω·mm^{2}/m for copper at 20 °C, L in m and A in mm^{2}. The single-phase drop is VD = 2 I R, using the one-way length.\nLimits (recommended): 3% at most in a branch circuit, 3% at most in a feeder and 5% at most from the service to the farthest outlet.\nNote: The single-phase formula has the factor 2 because the current goes out and comes back. The three-phase formula uses √3 instead.\n\n## Available fault current at a transformer\nI_{FLA} = (kVA × 1000)/(sqrt(3) V_{LL}), for three-phase\nI_{FLA} = (kVA × 1000)/V, for single-phase\nI_{sc} = (100 × I_{FLA})/Z\nI_{FLA} is the full-load current on the secondary and Z is the percent impedance on the nameplate (use 5 for 5%). This takes the source on the primary side as an infinite bus.\nThe interrupting rating of the device must be equal to or higher than I_{sc}.\nExample: 500 kVA, 400 V three-phase, %Z = 5. I_{FLA} = 500,000/(1.732 × 400) = 722 A. I_{sc} = 722/0.05 = 14,434 A, so a 22 kA device is needed.\n\n## Conduit fill\nSum of the conductor areas ≤ fill × conduit area\nFill: 53% for one conductor, 31% for two conductors, 40% for more than two conductors.\nExample: three conductors of 30 mm^{2} each (insulation included), so 90 mm^{2} in all. The conduit area must be at least 90/0.40 = 225 mm^{2}.\nNote: The grounding conductors and the neutrals count in the sum.\n\n## Equipment grounding conductor and electrode\nEGC size from the overcurrent device ahead of it: 15 A needs 2.0 mm^{2}, 60 A needs 5.5 mm^{2}, 100 A needs 8.0 mm^{2}, 200 A needs 14 mm^{2} and 600 A needs 38 mm^{2}.\nA single ground electrode should have a resistance of 25 Ω or less. If it does not, add another electrode.\nWatch out: The size comes from the rating of the device ahead of the conductor, not from the load.\n\n@Subject: ESAS\n@Topic: OSH\n\n## Man-hours of exposure\nMan-hours = number of workers × hours per day × working days\nExample: 300 workers × 8 hours × 250 days = 600,000 man-hours.\nNote: Use the hours actually worked. Count overtime and leave out paid leave.\n\n## Frequency rate\nFR = (number of disabling injuries × 1,000,000)/(man-hours of exposure)\nFR is the number of disabling injuries per million man-hours.\nExample: 6 disabling injuries in 600,000 man-hours. FR = (6 × 1,000,000)/600,000 = 10.\nNote: A disabling injury is one that keeps the worker away from work (lost time), or that causes death or permanent impairment.\n\n## Severity rate\nSR = (days charged × 1,000,000)/(man-hours of exposure)\nDays charged include the days lost by the injured workers and the time charges for deaths and permanent disabilities.\nTime charges: death or permanent total disability 6,000 days, arm above the elbow 4,500, hand at the wrist 3,000, thumb 600.\nExample: 150 days lost and one death (6,000 days) in 600,000 man-hours. SR = (6,150 × 1,000,000)/600,000 = 10,250.\n\n## Average days charged\nAverage days charged = \\frac{SR}{FR}\nThis is the days charged for each disabling injury.\nExample: SR = 10,250 and FR = 10 give 1,025 days per injury.\n\n## Safe-T-Score\nSafe-T-Score = (FR_{now} - FR_{before})/sqrt(FR_{before}/M_{now})\nM_{now} is the man-hours of the present period in millions.\nAbove +2.00: the record is significantly worse than before. Below -2.00: significantly better. Between -2.00 and +2.00: no significant change.\nExample: FR_{before} = 10, FR_{now} = 14 and M_{now} = 0.9. Score = 4/sqrt(10/0.9) = 1.20, so there is no significant change.\n\n## Permissible noise exposure\nT = 8/2^{(L - 90)/5} hours, with L in dBA\nThe limit is 90 dBA for 8 hours. Each increase of 5 dBA halves the allowed time.\n95 dBA gives 4 h, 100 dBA gives 2 h, 105 dBA gives 1 h and 110 dBA gives 0.5 h.\nMixed exposure: dose = Σ C_{i}/T_{i}, with C_{i} the hours spent at level i and T_{i} the allowed hours at that level. The limit is a dose of 1 (100%).\nExample: 4 h at 95 dBA and 2 h at 100 dBA. Dose = 4/4 + 2/2 = 2, which is twice the limit.\n\n## Current through the body\nI = V/R_{body}\nBody resistance is about 1,000 Ω for wet skin, about 100,000 Ω for dry skin and about 300 to 500 Ω inside the body.\nExample: 230 V across 1,000 Ω. I = 0.23 A = 230 mA, far above the 50 to 100 mA that can cause ventricular fibrillation.\nNote: The current and the path through the body decide the injury, not the voltage alone.\n\n## Risk rating\nRisk = likelihood × severity\nUsed in HIRAC to rank the hazards. Control the highest scores first, then re-rate the risk after the control.\nNote: The scales (for example 1 to 5) are set by the company's own risk matrix.\n\n## Incidence rate (US OSHA)\nIncidence rate = (number of recordable cases × 200,000)/(hours worked)\n200,000 hours is 100 full-time workers for one year (100 × 40 h × 50 weeks).\nWatch out: This is the US OSHA rate. The Philippine OSHS uses the frequency rate and the severity rate above, so use those unless the problem says incidence rate.\n\n@Section: Formulas\n@Source: Claude summary (standard university physics: check the symbols against your reviewer)\n\n@Subject: ESAS\n@Topic: Physics 1\n\n## Power\nP = W/t\nP = F v\nP = τ ω\nη = P_{out}/P_{in}\nPower is in watts, 1 W = 1 J/s. 1 hp = 746 W\nNote: P = F v uses the part of the force along the velocity. Average power is the total work divided by the total time. In P = τ ω the angular speed ω is in rad/s.\n\n## Conservation of energy\nLaw of conservation of energy: when only gravity and springs (conservative forces) act, the mechanical energy stays the same\nKE_{1} + PE_{1} = KE_{2} + PE_{2}\n(1/2) m v_{1}^{2} + m g h_{1} = (1/2) m v_{2}^{2} + m g h_{2}\nWith a spring: (1/2) m v^{2} + m g h + (1/2) k x^{2} stays constant\nWith friction: KE_{1} + PE_{1} − W_{f} = KE_{2} + PE_{2}\nW_{f} = f d is the energy lost to friction. It leaves as heat\nFalling from rest through a height h: v = √(2 g h)\nNote: the totals match only when gravity and springs do the pushing. If friction or a push acts, count the energy it takes away or adds.\n\n## Work-energy theorem\nWork-energy theorem, also called the work-energy relationship: the net work on a body equals its change in kinetic energy\nW_{net} = ΔKE = (1/2) m v_{2}^{2} − (1/2) m v_{1}^{2}\nW_{net} = F_{net} d cosθ\nWork by gravity: W = m g (h_{1} − h_{2}) = −ΔPE\nWork by a spring: W = (1/2) k (x_{1}^{2} − x_{2}^{2})\nStopping distance of a body brought to rest by friction, F = μ m g: d = v^{2}/(2 μ g)\nW_{net} adds up all the forces. h_{1}, x_{1} and v_{1} are the start, h_{2}, x_{2} and v_{2} the end\n\n## Rotational kinematics\nω = ω_{0} + α t\nθ = ω_{0} t + (1/2) α t^{2}\nω^{2} = ω_{0}^{2} + 2 α θ\nθ = ((ω_{0} + ω)/2) t\ns = r θ\nv = r ω\na_{t} = r α\na_{c} = r ω^{2} = v^{2}/r\nω = 2π f\nAngles are in radians, 1 rev = 2π rad. To change rpm to rad/s, multiply by 2π/60\n\n## Torque and Newton's second law for rotation\nτ = r F sinθ\nΣτ = I α\nCompare ΣF = m a: torque takes the place of force, I of mass and α of acceleration\nCounterclockwise torques are positive and clockwise ones negative\nFor a body that is not turning faster or slower: Στ = 0\nNote: r is the distance from the axis to the line of action of the force. The force must be the part across r (the sinθ).\n\n## Moment of inertia\nI = Σ m r^{2}\nHoop or thin ring about its axis: I = m r^{2}\nSolid disk or cylinder about its axis: I = (1/2) m r^{2}\nSolid sphere about a diameter: I = (2/5) m r^{2}\nThin hollow sphere: I = (2/3) m r^{2}\nThin rod about its center: I = (1/12) m L^{2}\nThin rod about one end: I = (1/3) m L^{2}\nRectangular plate about its center, axis perpendicular to it: I = (1/12) m (a^{2} + b^{2})\nParallel-axis theorem: I = I_{cm} + m d^{2}\nRadius of gyration: k = √(I/m)\nd is the distance between the new axis and the parallel axis through the center of mass\n\n## Rotational energy and angular momentum\nKE_{rot} = (1/2) I ω^{2}\nRolling without slipping: KE = (1/2) m v^{2} + (1/2) I ω^{2}\nWork done by a torque: W = τ θ\nAngular momentum: L = I ω\nΣτ = ΔL/Δt\nWith no outside torque: I_{1} ω_{1} = I_{2} ω_{2}\nNote: a skater who pulls the arms in lowers I, so ω goes up.\n\n@Section: Formulas\n@Source: Claude summary (standard university physics: check the symbols against your reviewer)\n\n@Subject: ESAS\n@Topic: Physics 2\n\n## Traveling and standing waves: equations\nTraveling wave: y = A sin(k x − ω t)\nWave number k = 2π/λ. Angular frequency ω = 2π f\nWave speed: v = ω/k = f λ\nStanding wave (a wave and its reflection): y = 2 A sin(k x) cos(ω t)\nNodes (no motion) are at x = (n λ)/2, with n = 0, 1, 2, ...\nAntinodes (largest motion) are at x = ((2n + 1) λ)/4\nAdjacent nodes are λ/2 apart. A node and the next antinode are λ/4 apart.\nThe antinodes swing with an amplitude of 2A. A standing wave carries no net energy along the string.\n\n## Standing waves on a string: harmonics\nString fixed at both ends: each end is a node, so L = n (λ_{n}/2), with n = 1, 2, 3, ...\nWavelength of harmonic n: λ_{n} = 2L/n\nFrequency: f_{n} = (n v)/(2L) = n f_{1}\nWith the wave speed v = √(T/μ): f_{n} = (n/(2L)) √(T/μ)\nHarmonic n has n loops, n antinodes and n + 1 nodes (counting the two ends).\nFundamental: f_{1} = v/(2L). A longer, heavier or looser string gives a lower frequency.\nExample: a string of length 0.50 m, μ = 0.0025 kg/m and T = 100 N. v = √(100/0.0025) = 200 m/s, so f_{1} = 200/(2 × 0.50) = 200 Hz, f_{2} = 400 Hz and f_{3} = 600 Hz.\nNote: f is proportional to √T, so four times the tension doubles the frequency. Half the length doubles it too.\nWatch out: μ is the mass per unit length in kg/m, not the total mass of the string.\n\n## Harmonics, overtones and the harmonic series\nFundamental = first harmonic = the lowest standing-wave frequency f_{1}\nHarmonic n: f_{n} = n f_{1} for a string and for an open pipe, with n = 1, 2, 3, ...\nClosed pipe: only the odd harmonics, f_{1}, 3 f_{1}, 5 f_{1}, ... The even harmonics are missing.\nOvertone: any frequency above the fundamental. For a string or an open pipe, the first overtone is the second harmonic. For a closed pipe, the first overtone is the third harmonic.\nFrequency ratios: string and open pipe 1 : 2 : 3 : 4 ... Closed pipe 1 : 3 : 5 : 7 ...\nOctave: a frequency ratio of 2 : 1. The second harmonic is an octave above the fundamental. A perfect fifth is 3 : 2 and a perfect fourth is 4 : 3.\nThe pitch you hear is set by the fundamental. The mix of harmonics gives the tone quality (timbre).\nExample: a fundamental of 200 Hz has harmonics of 200, 400, 600 and 800 Hz. A closed pipe with a fundamental of 200 Hz sounds 200, 600 and 1,000 Hz.\n\n## Open pipe: harmonics of sound\nOpen at both ends (flute, organ pipe): a displacement antinode at each end, so L = n (λ/2), with n = 1, 2, 3, ...\nf_{n} = (n v)/(2L) = n f_{1}. All the harmonics are present.\nSpeed of sound in air: v = 331 + 0.6 T (T in °C), which is 343 m/s at 20 °C\nLength for a given fundamental: L = v/(2 f_{1})\nResonance: the air column resonates when the sound has one of these frequencies. The pitch of the sound depends on the speed of sound and the length.\nExample: an open pipe 0.50 m long at 20 °C. f_{1} = 343/(2 × 0.50) = 343 Hz, f_{2} = 686 Hz and f_{3} = 1,029 Hz.\nNote: an open pipe sounds an octave higher than a closed pipe of the same length.\n\n## Closed pipe: harmonics of sound\nClosed at one end and open at the other: a node at the closed end and an antinode at the open end, so L = n (λ/4), with n = 1, 3, 5, ...\nf_{n} = (n v)/(4L), for odd n only\nFundamental: f_{1} = v/(4L). It is half the fundamental of an open pipe of the same length.\nResonance: the air column resonates when the sound has one of these frequencies. The pitch of the sound depends on the speed of sound and the length.\nExample: a closed pipe 0.50 m long at 20 °C. f_{1} = 343/(4 × 0.50) = 171.5 Hz, the third harmonic is 514.5 Hz and the fifth is 857.5 Hz.\nExample: the pipe for a fundamental of 256 Hz is 343/(4 × 256) = 0.335 m closed, or 343/(2 × 256) = 0.670 m open.\nEnd correction: a real open end acts as if the pipe were longer. For a pipe of radius r, L_{effective} ≈ L + 0.6 r with one open end, and L + 1.2 r with two open ends.\nWatch out: problems ignore the end correction unless they give the radius of the pipe.\n\n## Resonance tube\nAn air column closed at the bottom with a tuning fork held over the top. The sound is loud (resonance) when the fork frequency matches a harmonic of the air column.\nSuccessive resonances are half a wavelength apart: L_{2} − L_{1} = λ/2\nSpeed of sound: v = f λ = 2 f (L_{2} − L_{1})\nThe first resonance is at about L_{1} = λ/4.\nExample: a 512 Hz fork resonates at L_{1} = 0.165 m and L_{2} = 0.500 m. λ = 2(0.500 − 0.165) = 0.670 m, so v = 512 × 0.670 = 343 m/s.\nNote: subtract the two resonant lengths, so the end correction cancels.\n\n## Resonance and beats\nResonance: a body pushed at one of its natural frequencies vibrates with a large amplitude.\nBeats: two sounds of nearly equal frequency f_{1} and f_{2} make the loudness rise and fall.\nBeat frequency: f_{beat} = |f_{1} − f_{2}|\nThe tone you hear is at the average frequency (f_{1} + f_{2})/2\nExample: 440 Hz and 444 Hz give 4 beats per second, heard at 442 Hz.\nTip: when tuning a string against a reference, tightening the string raises its frequency. If the beats get faster the string was already higher than the reference. If they get slower it was lower.\n\n@Section: Formulas\n@Source: Claude summary (standard general chemistry, atomic masses rounded from the IUPAC table; check them against the table your reviewer uses)\n\n@Subject: ESAS\n@Topic: Chemistry\n\n## Atomic masses (amu), hydrogen to silicon\nHydrogen, H (Z = 1): 1.008\nLithium, Li (3): 6.94\nCarbon, C (6): 12.011\nNitrogen, N (7): 14.007\nOxygen, O (8): 15.999\nFluorine, F (9): 18.998\nSodium, Na (11): 22.990\nMagnesium, Mg (12): 24.305\nAluminum, Al (13): 26.982\nSilicon, Si (14): 28.085\nNote: amu is the atomic mass unit, one twelfth of the mass of a carbon-12 atom. The same number is the molar mass in g/mol. Z is the atomic number, the count of protons.\nTip: most board problems round these to 1, 12, 14, 16, 23, 24, 27 and 28. Use the full values only when the problem gives a lot of digits.\n\n## Atomic masses (amu), phosphorus to nickel\nPhosphorus, P (Z = 15): 30.974\nSulfur, S (16): 32.06\nChlorine, Cl (17): 35.45\nArgon, Ar (18): 39.948\nPotassium, K (19): 39.098\nCalcium, Ca (20): 40.078\nChromium, Cr (24): 51.996\nManganese, Mn (25): 54.938\nIron, Fe (26): 55.845\nNickel, Ni (28): 58.693\nNote: chlorine is 35.45 and not 35 because it is a mix of two isotopes, chlorine-35 and chlorine-37. Many problems use 35.5.\n\n## Atomic masses (amu), copper to lead\nCopper, Cu (Z = 29): 63.546\nZinc, Zn (30): 65.38\nBromine, Br (35): 79.904\nSilver, Ag (47): 107.87\nCadmium, Cd (48): 112.41\nTin, Sn (50): 118.71\nIodine, I (53): 126.90\nGold, Au (79): 196.97\nMercury, Hg (80): 200.59\nLead, Pb (82): 207.2\nNote: these include the metals of batteries (Zn, Cd, Pb, Ag, Hg), solder (Sn, Pb), wiring (Cu, Au) and the lamp and cell materials an electrical exam likes to use.\n\n## Molar mass and percent composition\nMolar mass = the sum of (atoms of each element × its atomic mass)\nPercent of an element = (atoms × atomic mass)/molar mass × 100\nMoles of a sample: n = mass/molar mass\nNumber of molecules: N = n × 6.022 × 10^{23}\nAverage atomic mass = Σ (fractional abundance × isotope mass)\nExample: water, H_{2}O = 2(1.008) + 15.999 = 18.015 g/mol. H is 11.19% and O is 88.81%.\nExample: CaCO_{3} = 40.078 + 12.011 + 3(15.999) = 100.09 g/mol. Ca is 40.04%, C is 12.00% and O is 47.96%.\nExample: chlorine is 75.77% Cl-35 (34.969) and 24.23% Cl-37 (36.966), so the average is 0.7577(34.969) + 0.2423(36.966) = 35.45 amu.\n\n## Empirical and molecular formula\n1. Turn the percent of each element into grams, taking 100 g of sample.\n2. Divide each mass by its atomic mass to get moles.\n3. Divide all the moles by the smallest one.\n4. If a ratio ends in .5, double all of them. If it ends in .33 or .67, triple them.\nMolecular formula = n × empirical formula, with n = molar mass/empirical formula mass\nWater of hydration: moles of water/moles of salt gives the x in salt·xH_{2}O\nExample: 40.0% C, 6.7% H and 53.3% O gives moles 3.33 : 6.65 : 3.33, which is 1 : 2 : 1, so CH_{2}O (30.03). A molar mass of 180 gives n = 6, so C_{6}H_{12}O_{6}.\nExample: CuSO_{4}·5H_{2}O = 63.546 + 32.06 + 4(15.999) + 5(18.015) = 249.68 g/mol.\n\n## Stoichiometry and yield\nBalance the equation first. The coefficients are mole ratios.\nmoles of B = moles of A × (coefficient of B/coefficient of A)\nLimiting reagent: the reactant that gives the least product. Divide each reactant's moles by its coefficient and the smallest one limits.\nTheoretical yield: the product amount from the limiting reagent\nPercent yield = (actual yield/theoretical yield) × 100\nGas volumes at the same T and P are in the same ratio as the coefficients (Avogadro).\nExample: 2H_{2} + O_{2} → 2H_{2}O with 4.0 g H_{2} (1.98 mol) and 16.0 g O_{2} (0.50 mol). O_{2} limits, giving 1.0 mol of water = 18.0 g. If 15.0 g forms, the yield is 83.3%.\n\n## Solution concentration units\nMass percent = (mass of solute/mass of solution) × 100\nppm = (mass of solute/mass of solution) × 10^{6}. In dilute water 1 ppm = 1 mg/L\nMole fraction X_{A} = n_{A}/(n_{A} + n_{B} + ...), and the mole fractions add up to 1\nMolarity from a stock label: M = (10 × P × ρ)/MM, with P the mass percent, ρ the density in g/mL and MM the molar mass in g/mol\nMolarity M = moles of solute/liters of solution. Molality m = moles of solute/kg of solvent\nExample: 37% HCl of density 1.19 g/mL is 10(37)(1.19)/36.46 = 12.08 M.\nExample: 10 g NaCl in 90 g water: n_{NaCl} = 0.1711 mol, n_{water} = 4.996 mol, X_{NaCl} = 0.0331.\n\n## Equivalent weight and normality\nEquivalent weight of an acid = molar mass/number of H^{+} given\nEquivalent weight of a base = molar mass/number of OH^{-} given\nEquivalent weight of a salt = molar mass/(total positive charge)\nEquivalent weight in redox = molar mass/electrons gained or lost per formula unit\nNormality N = equivalents of solute/liters of solution = M × (equivalents per mole)\nAt neutralization: N_{1} V_{1} = N_{2} V_{2}\nExample: H_{2}SO_{4} (98.07) has 2 H^{+}, so its equivalent weight is 49.04 and 1 M is 2 N.\n\n## Colligative properties\nBoiling point rise: ΔT_{b} = i K_{b} m\nFreezing point drop: ΔT_{f} = i K_{f} m\nWater: K_{b} = 0.512 °C·kg/mol and K_{f} = 1.86 °C·kg/mol\nOsmotic pressure: π = i M R T\nRaoult's law: P_{solution} = X_{solvent} P°_{solvent}\nVan't Hoff factor i: about 1 for sugar, 2 for NaCl, 3 for CaCl_{2}\nExample: 10 g NaCl in 500 g water has m = 0.342 and i = 2, so ΔT_{f} = 2(1.86)(0.342) = 1.27 °C (freezes at −1.27 °C) and ΔT_{b} = 2(0.512)(0.342) = 0.35 °C.\nNote: these depend on the number of dissolved particles, not on what they are.\n\n## Chemical equilibrium\nFor aA + bB ⇌ cC + dD: K_{c} = [C]^{c}[D]^{d}/([A]^{a}[B]^{b})\nK_{p} = K_{c} (R T)^{Δn}, with Δn = moles of gas products − moles of gas reactants\nReaction quotient Q has the same form as K but uses the present concentrations\nQ < K: the reaction goes forward. Q > K: it goes backward. Q = K: at equilibrium\nPure solids and pure liquids are left out of K\nReversing a reaction gives 1/K. Doubling the coefficients squares K. Adding reactions multiplies the K values.\nLe Chatelier: the system shifts to oppose the change. Only temperature changes the value of K.\n\n## Weak acids, bases and buffers\nWeak acid: K_{a} = [H^{+}][A^{-}]/[HA]\n[H^{+}] = √(K_{a} C) when the acid is weak and not too dilute\nK_{a} K_{b} = K_{w} = 10^{-14}, and pK_{a} + pK_{b} = 14\nBuffer (Henderson-Hasselbalch): pH = pK_{a} + log([A^{-}]/[HA])\nPercent ionization = [H^{+}]/C × 100\nExample: 0.10 M acetic acid with K_{a} = 1.8 × 10^{-5}: [H^{+}] = √(1.8 × 10^{-6}) = 1.34 × 10^{-3} M, so pH = 2.87.\nExample: acetic acid (pK_{a} = 4.76) with twice as much acetate as acid: pH = 4.76 + log 2 = 5.06.\n\n## Reaction rates\nRate law: rate = k [A]^{m}[B]^{n}. The orders m and n come from experiments, not from the coefficients.\nZero order: [A] = [A]_{0} − k t, and t_{1/2} = [A]_{0}/(2k)\nFirst order: ln([A]/[A]_{0}) = −k t, and t_{1/2} = 0.693/k\nSecond order: 1/[A] = 1/[A]_{0} + k t, and t_{1/2} = 1/(k [A]_{0})\nArrhenius: k = A e^{−E_{a}/(R T)}\nTwo temperatures: ln(k_{2}/k_{1}) = (E_{a}/R)(1/T_{1} − 1/T_{2}), with T in kelvin\nExample: a first-order reaction with k = 0.0231 min^{-1} has t_{1/2} = 0.693/0.0231 = 30 min. After 3 half-lives, 1/8 is left.\nNote: a catalyst lowers E_{a}. It speeds up both directions
