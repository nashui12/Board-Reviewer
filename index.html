 and does not change K.\n\n## Electrochemistry (cells)\nE°_{cell} = E°_{cathode} − E°_{anode}, both taken as reduction potentials\nReduction happens at the cathode and oxidation at the anode (\"An Ox, Red Cat\")\nΔG° = −n F E°, with F = 96,485 C/mol\nΔG° = −R T ln K, so at 25 °C: log K = n E°/0.0592\nNernst equation at 25 °C: E = E° − (0.0592/n) log Q\nE°_{cell} > 0 is spontaneous (a galvanic cell). E°_{cell} < 0 needs a pushed current (electrolysis).\nExample: the Zn/Cu cell has E° = 1.10 V. With Q = [Zn^{2+}]/[Cu^{2+}] = 0.10: E = 1.10 − (0.0592/2) log 0.10 = 1.13 V.\nExample: ΔG° = −2(96,485)(1.10) = −212 kJ/mol for that cell.\n\n## Thermochemistry\nHeat to change temperature: q = m c ΔT. Water: c = 4.184 J/(g·°C)\nHeat of a reaction: q = n ΔH\nHess's law: add the steps and add their ΔH\nΔH°_{rxn} = Σ ΔH°_{f}(products) − Σ ΔH°_{f}(reactants)\nGibbs energy: ΔG = ΔH − T ΔS. ΔG < 0 is spontaneous\nCalorimeter: q_{reaction} = −(q_{water} + q_{calorimeter})\nExample: heating 50 g of water by 60 °C takes q = 50(4.184)(60) = 12,552 J = 12.55 kJ.\nNote: ΔH < 0 is exothermic (heat released) and ΔH > 0 is endothermic. ΔH°_{f} of an element in its standard state is zero.\n\n## Gas density and kinetic theory\nDensity of a gas: ρ = (P M)/(R T)\nMolar mass from density: M = (ρ R T)/P\nMolar volume at STP (0 °C, 1 atm): 22.4 L/mol\nAvogadro: V_{1}/n_{1} = V_{2}/n_{2} at the same T and P\nAverage kinetic energy of a molecule: KE = (3/2) k T, with k = 1.381 × 10^{-23} J/K\nRoot-mean-square speed: v_{rms} = √((3 R T)/M), with M in kg/mol\nvan der Waals (real gas): (P + (a n^{2})/V^{2})(V − n b) = n R T\nExample: nitrogen at 300 K, M = 0.028 kg/mol: v_{rms} = √(3(8.314)(300)/0.028) = 517 m/s.\nNote: the molar mass M in v_{rms} must be in kg/mol for R = 8.314 J/(mol·K).\n\n## Atomic structure\nAtomic number Z = protons. Mass number A = protons + neutrons. Neutral atom: electrons = Z\nIsotopes: the same Z, a different number of neutrons\nShell n holds up to 2n^{2} electrons. It has n^{2} orbitals and n subshells\nSubshell capacity: s = 2, p = 6, d = 10, f = 14\nFilling order: 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p 6s 4f 5d 6p 7s\nQuantum numbers: n = 1, 2, 3 ...; l = 0 to n − 1; m_{l} = −l to +l; m_{s} = ±1/2\nPhoton energy: E = h ν = (h c)/λ, with h = 6.626 × 10^{-34} J·s\nHydrogen energy levels: E_{n} = −13.6 eV/n^{2}\nRydberg: 1/λ = R_{H}(1/n_{1}^{2} − 1/n_{2}^{2}), with R_{H} = 1.097 × 10^{7} m^{-1}\nWatch out: chromium and copper break the filling order. Cr is [Ar] 4s^{1} 3d^{5} and Cu is [Ar] 4s^{1} 3d^{10}.\n\n## Oxidation numbers\nAn element on its own is 0. A simple ion has its charge.\nThe oxidation numbers in a neutral compound add up to 0. In an ion they add up to the charge.\nGroup 1 is +1. Group 2 is +2. Fluorine is always −1.\nHydrogen is +1, except in metal hydrides where it is −1.\nOxygen is −2, except in peroxides (−1) and with fluorine.\nExample: Mn in KMnO_{4}: +1 + x + 4(−2) = 0, so Mn is +7.\nExample: Cr in Cr_{2}O_{7}^{2−}: 2x + 7(−2) = −2, so Cr is +6.\nOxidation is a rise in oxidation number (loss of electrons). Reduction is a fall (gain of electrons).\n\n## Common ions\nPositive 1+: H^{+}, Li^{+}, Na^{+}, K^{+}, Ag^{+}, NH_{4}^{+}, Cu^{+}\nPositive 2+: Mg^{2+}, Ca^{2+}, Ba^{2+}, Zn^{2+}, Cu^{2+}, Fe^{2+}, Pb^{2+}, Hg^{2+}, Ni^{2+}, Sn^{2+}\nPositive 3+: Al^{3+}, Fe^{3+}, Cr^{3+}\nNegative 1−: F^{-}, Cl^{-}, Br^{-}, I^{-}, OH^{-}, NO_{3}^{-}, HCO_{3}^{-}, ClO_{3}^{-}, MnO_{4}^{-}\nNegative 2−: O^{2-}, S^{2-}, SO_{4}^{2-}, SO_{3}^{2-}, CO_{3}^{2-}, CrO_{4}^{2-}, Cr_{2}O_{7}^{2-}\nNegative 3−: PO_{4}^{3-}, N^{3-}\nNote: a compound is neutral, so the charges must cancel. Al^{3+} with SO_{4}^{2-} gives Al_{2}(SO_{4})_{3}.\n\n## Common names and formulas\nQuicklime CaO. Slaked lime Ca(OH)_{2}. Limestone, marble CaCO_{3}\nTable salt NaCl. Caustic soda, lye NaOH. Caustic potash KOH\nBaking soda NaHCO_{3}. Washing soda Na_{2}CO_{3}·10H_{2}O\nMuriatic acid HCl. Oil of vitriol H_{2}SO_{4}. Aqua fortis HNO_{3}\nAmmonia NH_{3}. Marsh gas, natural gas CH_{4}. Laughing gas N_{2}O\nGypsum CaSO_{4}·2H_{2}O. Plaster of Paris CaSO_{4}·0.5H_{2}O\nEpsom salt MgSO_{4}·7H_{2}O. Blue vitriol CuSO_{4}·5H_{2}O. Green vitriol FeSO_{4}·7H_{2}O\nRust Fe_{2}O_{3} (hydrated). Bauxite Al_{2}O_{3}. Galena PbS. Cinnabar HgS\nDry ice solid CO_{2}. Silica, quartz SiO_{2}. Alumina Al_{2}O_{3}\nBrass: copper and zinc. Bronze: copper and tin. Solder: tin and lead\n\n## Alkanes and organic functional groups\nAlkanes C_{n}H_{2n+2}: methane CH_{4}, ethane C_{2}H_{6}, propane C_{3}H_{8}, butane C_{4}H_{10}, pentane C_{5}H_{12}\nAlkanes continued: hexane C_{6}H_{14}, heptane C_{7}H_{16}, octane C_{8}H_{18}, nonane C_{9}H_{20}, decane C_{10}H_{22}\nAlkenes C_{n}H_{2n} (one double bond). Alkynes C_{n}H_{2n-2} (one triple bond)\nAlcohol R–OH. Ether R–O–R'. Aldehyde R–CHO. Ketone R–CO–R'\nCarboxylic acid R–COOH. Ester R–COO–R'. Amine R–NH_{2}. Amide R–CONH_{2}\nComplete combustion: C_{x}H_{y} + (x + y/4) O_{2} → x CO_{2} + (y/2) H_{2}O\nExample: C_{3}H_{8} + 5O_{2} → 3CO_{2} + 4H_{2}O. One mole of propane needs 5 mol of O_{2}.\n\n@Section: Formulas\n@Source: Claude summary from PEC study material (section and table numbers as the sources cite them; check your edition of the Philippine Electrical Code)\n\n@Subject: ESAS\n@Topic: PEC\n\n## Standard ratings of overcurrent devices (PEC 2.40.1.6)\n15, 20, 25, 30, 35, 40, 45, 50, 60, 70, 80, 90, 100, 110, 125 A\n150, 175, 200, 225, 250, 300, 350, 400, 450, 500, 600, 700, 800 A\n1000, 1200, 1600, 2000, 2500, 3000, 4000, 5000, 6000 A\nNext higher rating: if the conductor ampacity does not match a standard rating and the device is 800 A or less, the next higher standard rating may be used.\nThe next-higher rule cannot be used for a multi-outlet branch circuit.\nExample: a conductor with an ampacity of 142 A may be protected by a 150 A breaker.\n\n## Small conductors: protection limit and ampacity\nMaximum overcurrent protection of small copper conductors (PEC 2.40.1.4(D)): 2.0 mm^{2} (14 AWG) 15 A, 3.5 mm^{2} (12 AWG) 20 A, 5.5 mm^{2} (10 AWG) 30 A\nAmpacity of copper at 75 °C, three or fewer conductors in a raceway: 2.0 mm^{2} 20 A, 3.5 mm^{2} 25 A, 5.5 mm^{2} 35 A, 8.0 mm^{2} 50 A, 14 mm^{2} 65 A, 22 mm^{2} 85 A\nWatch out: the 3.5 mm^{2} wire has an ampacity of 25 A but is protected at 20 A at most. The small-conductor limit wins.\n\n## Insulation types and temperature ratings\nTW: 60 °C, dry and wet locations\nTHW and THWN: 75 °C, dry and wet locations\nTHHN: 90 °C, dry and damp locations\nTable ampacities are for an ambient temperature of 30 °C.\n\n## Dwelling circuits and loads\nSmall-appliance circuits: at least two, 20 A each, counted at 1,500 VA each\nLaundry circuit: one, 20 A, counted at 1,500 VA\nBathroom circuit: one, 20 A\nLighting circuits: 15 A or 20 A\nReceptacle outlets: 180 VA for each single or multiple receptacle on one yoke\nHousehold range of 12 kW or less: feeder demand of 8 kW (Table 2.20.3.16)\nFour or more fixed appliances on the same feeder (not a range, dryer, heating or air conditioning): 75% demand\nWatch out: the 75% rule for fixed appliances is not in the study notes. Check the section number in your own PEC edition.\n\n## Unit lighting loads (PEC Table 2.20.2.3)\nDwelling units: 24 VA/m^{2}\nSchools: 24 VA/m^{2}\nStores: 24 VA/m^{2}\nOffice buildings: 28 VA/m^{2}\nHospitals: 16 VA/m^{2}\nLighting load = floor area × the unit load\nExample: a 300 m^{2} office has 300 × 28 = 8,400 VA of lighting load.\n\n## Demand factors for a dwelling (PEC Table 2.20.3.3)\nFirst 3,000 VA: 100%\n3,001 VA to 120,000 VA: 35%\nOver 120,000 VA: 25%\nThese apply to the general lighting, small-appliance and laundry loads together.\nDemand = 3,000 + 0.35 (P − 3,000) for P between 3,000 VA and 120,000 VA\nService neutral: 100% up to 200 A, then 70% of the part above 200 A\nNote: the 70% neutral reduction is not allowed on four-wire three-phase circuits that feed non-linear loads.\n\n## Motor protection percentages (PEC Table 4.30.4.2)\nNon-time-delay fuse: 300% of the full-load current\nDual-element (time-delay) fuse: 175%\nInstantaneous-trip breaker: 800%\nInverse-time breaker: 250%\nMotor conductor: at least 125% of the full-load current. Overload: 115% or 125% of the nameplate current.\nDisconnecting means: in sight of the motor, within 15 m, rated at least 115% of the full-load current\nLocked-rotor (starting) current: five to six times the full-load current\nExample: a motor with FLC = 20 A. Inverse-time breaker up to 2.5 × 20 = 50 A. Dual-element fuse up to 1.75 × 20 = 35 A.\nWatch out: use the FLC from the PEC table to size conductors and short-circuit protection. Use the nameplate current for the overload.\n\n## Working space around equipment (0 to 600 V)\nWidth: at least 750 mm, or the width of the equipment if that is greater\nHeight: at least 2.0 m\nDoors must open at least 90 degrees\nDepth for 0 to 150 V to ground: 0.9 m\nDepth for 151 to 600 V to ground: 0.9 m (Condition 1, live parts on one side only), 1.0 m (Condition 2, live parts on both sides), 1.2 m (Condition 3, live parts on both sides with grounded parts between)\n\n## Conduit supports\nEMT: secured within 900 mm of each box, cabinet or fitting. Supported at least every 3.0 m\nRigid metal conduit and IMC: secured within 900 mm of each box or fitting\nMaximum spacing between supports of rigid metal conduit and IMC: 3.0 m for 16 mm to 20 mm trade size, 4.5 m for 25 mm to 32 mm, 6.0 m for 40 mm to 50 mm and larger\nMetal cable trays are bonded across joints and connected to the grounding system.\n\n## Conductor colors, grounding and bonding\nGrounded conductor (neutral): white or gray\nEquipment grounding conductor: green or bare\nA single ground electrode: 25 Ω or less, otherwise add an electrode\nBonding joins the metal parts so they stay at the same potential and a fault current has a low-impedance path back to the source.\nEquipment grounding conductor sizes: 15 A needs 2.0 mm^{2}, 60 A needs 5.5 mm^{2}, 100 A needs 8.0 mm^{2}, 200 A needs 14 mm^{2}, 600 A needs 38 mm^{2}\nWatch out: the equipment grounding conductor is sized from the overcurrent device ahead of it, not from the load.\n\n## Panelboards and interrupting ratings\nMaximum overcurrent devices in a lighting and appliance panelboard: 42, not counting the main\nThe main or upstream overcurrent device cannot be rated higher than the panelboard busbar\nInterrupting rating (AIC) ≥ the available fault current at the device\nCommon AIC ratings: 10, 14, 22, 42, 65 kA\nBreaker frame sizes: 15 A to 50 A fit a 50 AF frame, 60 A to 100 A a 100 AF frame, 110 A to 175 A a 225 AF frame\n\n## Hazardous (classified) locations\nClass I: flammable gases or vapors\nClass II: combustible dust\nClass III: easily ignitable fibers and flyings\nDivision 1: the hazard is present under normal operating conditions\nDivision 2: the hazard is present only under abnormal conditions, such as a leak or a failure\nClass I Division 1 wiring: rigid metal conduit or equivalent with sealed fittings, and explosion-proof equipment\nExamples: gasoline stations and paint spray booths (Class I), grain elevators and flour mills (Class II)\n\n@Section: Notes\n@Source: Claude starter summary\n@Subject: Math\n@Topic: Algebra\n\n## Algebra at a glance\n- Exponents: a^{m} a^{n} = a^{m+n}, (a^{m})^{n} = a^{mn}, a^{0} = 1, a^{-n} = 1/a^{n}.\n- Logarithms: log(x y) = log x + log y, log(x/y) = log x - log y, log x^{n} = n log x. Change of base: log_{b} x = ln x/ln b.\n- Quadratic a x^{2} + b x + c = 0: the sum of the roots is -b/a and the product is c/a.\n- The discriminant b^{2} - 4 a c decides the roots. Positive gives two real roots, zero gives one repeated root, negative gives two complex conjugate roots.\n- Remainder theorem: the remainder of P(x) divided by (x - a) is P(a). If it is zero, (x - a) is a factor.\n- Arithmetic progression: a_{n} = a_{1} + (n - 1) d, S_{n} = (n/2)(a_{1} + a_{n}).\n- Geometric progression: a_{n} = a_{1} r^{n-1}, S_{n} = a_{1}(1 - r^{n})/(1 - r). An infinite sum a_{1}/(1 - r) exists only when |r| < 1.\n- Binomial expansion: the term number r + 1 of (x + y)^{n} is C(n, r) x^{n-r} y^{r}.\n- Variation: direct y = k x, inverse y = k/x, joint y = k x z.\n- Digit problems: a three digit number is 100 h + 10 t + u.\n- Work problems: add the rates. 1/t = 1/t_{1} + 1/t_{2}.\nTip: In word problems, define each unknown in a sentence first, then write one equation for every relationship.\n\n@Topic: Trigonometry\n\n## Trigonometry at a glance\n- Right triangle: sin = opposite/hypotenuse, cos = adjacent/hypotenuse, tan = opposite/adjacent. csc, sec and cot are the reciprocals.\n- Identities: sin^{2} θ + cos^{2} θ = 1, 1 + tan^{2} θ = sec^{2} θ, 1 + cot^{2} θ = csc^{2} θ.\n- Signs by quadrant: All positive in I, Sine in II, Tangent in III, Cosine in IV.\n- Radian measure: π rad = 180°. Arc length s = r θ and sector area = (1/2) r^{2} θ, with θ in radians.\n- Law of sines: a/sin A = b/sin B = c/sin C = 2 R.\n- Law of cosines: c^{2} = a^{2} + b^{2} - 2 a b cos C.\n- Given two sides and an angle opposite one of them, there may be two triangles, one or none. Check this ambiguous case.\n- Double angle: sin 2A = 2 sin A cos A, cos 2A = cos^{2} A - sin^{2} A = 1 - 2 sin^{2} A = 2 cos^{2} A - 1.\n- Principal values of inverse functions: arcsin from -90° to 90°, arccos from 0° to 180°, arctan from -90° to 90°.\n- Special triangles: 30-60-90 has sides 1, sqrt(3), 2. 45-45-90 has sides 1, 1, sqrt(2).\n- Spherical triangle: the angle sum is more than 180°. Spherical excess E = A + B + C - 180°, and the area is π R^{2} E/180°.\nWatch out: Check whether your calculator is in degrees or radians before every trigonometry problem.\n\n@Topic: Geometry\n\n## Geometry at a glance\n- Polygon with n sides: the interior angles add up to (n - 2)(180°) and it has n(n - 3)/2 diagonals. Each interior angle of a regular polygon is (n - 2)(180°)/n.\n- Triangle: area = (1/2) b h, and by Heron's formula sqrt(s(s - a)(s - b)(s - c)) with s the half perimeter. Inradius r = A/s and circumradius R = a b c/(4 A).\n- Equilateral triangle of side a: area = (sqrt(3)/4) a^{2}.\n- Circle: C = 2 π r, A = π r^{2}. Segment area = (1/2) r^{2}(θ - sin θ), with θ in radians.\n- Cyclic quadrilateral: opposite angles are supplementary. Ptolemy: the product of the diagonals equals the sum of the products of opposite sides. Brahmagupta: area = sqrt((s - a)(s - b)(s - c)(s - d)).\n- Prism and cylinder: V = base area × height. Pyramid and cone: V = (1/3) base area × height.\n- Sphere: V = (4/3) π r^{3} and S = 4 π r^{2}.\n- Cone lateral area = π r ℓ, with ℓ the slant height. Cylinder lateral area = 2 π r h.\n- Euler's formula for polyhedra: V - E + F = 2. There are five regular polyhedra: tetrahedron (4 faces), cube (6), octahedron (8), dodecahedron (12), icosahedron (20).\n- Similar figures: areas go as the square of the scale factor, volumes as the cube.\n- Pappus: the volume of a solid of revolution = (area) × (distance travelled by its centroid).\n- Prismatoid: V = (L/6)(A_{1} + 4 A_{m} + A_{2}).\n\n@Topic: Analytics 1\n\n## Plane analytic geometry at a glance\n- Distance d = sqrt((x_{2} - x_{1})^{2} + (y_{2} - y_{1})^{2}). Midpoint = ((x_{1} + x_{2})/2, (y_{1} + y_{2})/2).\n- Slope m = (y_{2} - y_{1})/(x_{2} - x_{1}). Parallel lines have equal slopes. Perpendicular lines have slopes whose product is -1.\n- Angle between two lines: tan θ = (m_{2} - m_{1})/(1 + m_{1} m_{2}).\n- Distance from a point to a line: |A x_{0} + B y_{0} + C|/sqrt(A^{2} + B^{2}).\n- Circle: (x - h)^{2} + (y - k)^{2} = r^{2}. In the general form x^{2} + y^{2} + D x + E y + F = 0 the center is (-D/2, -E/2).\n- Parabola: (x - h)^{2} = 4 a (y - k). The focus is a from the vertex and the latus rectum is 4a.\n- Ellipse: x^{2}/a^{2} + y^{2}/b^{2} = 1 with c^{2} = a^{2} - b^{2}, e = c/a < 1, area = π a b, latus rectum = 2 b^{2}/a.\n- Hyperbola: x^{2}/a^{2} - y^{2}/b^{2} = 1 with c^{2} = a^{2} + b^{2}, e > 1, asymptotes y = ±(b/a) x.\n- Identify a conic from A x^{2} + B x y + C y^{2} + ... = 0 using B^{2} - 4 A C. Negative is an ellipse (a circle if A = C and B = 0), zero is a parabola, positive is a hyperbola.\n- Polar coordinates: x = r cos θ, y = r sin θ, r^{2} = x^{2} + y^{2}.\n\n@Topic: Analytics 2\n\n## Solid analytic geometry at a glance\n- Distance between two points in space: d = sqrt((x_{2} - x_{1})^{2} + (y_{2} - y_{1})^{2} + (z_{2} - z_{1})^{2}).\n- Direction cosines of a line: l = cos α, m = cos β, n = cos γ. They satisfy l^{2} + m^{2} + n^{2} = 1.\n- Direction numbers are any numbers proportional to the direction cosines.\n- Angle between two lines: cos θ = l_{1} l_{2} + m_{1} m_{2} + n_{1} n_{2}.\n- Plane: A x + B y + C z + D = 0, and (A, B, C) is a vector normal to the plane.\n- Distance from a point to a plane: |A x_{0} + B y_{0} + C z_{0} + D|/sqrt(A^{2} + B^{2} + C^{2}).\n- Line through a point: (x - x_{1})/l = (y - y_{1})/m = (z - z_{1})/n.\n- Sphere: (x - h)^{2} + (y - k)^{2} + (z - l)^{2} = r^{2}.\n- Dot product: A · B = A B cos θ. Cross product: the magnitude is A B sin θ, and the direction is normal to both vectors.\n- Cylindrical coordinates use (r, θ, z). Spherical coordinates use a radius and two angles. Check which angle your reviewer measures from the z axis.\n\n@Topic: Differential Calculus\n\n## Differential calculus at a glance\n- The derivative is the limit of Δy/Δx as Δx goes to 0. It is the slope of the tangent.\n- Rules: the product rule (u v)' = u' v + u v', the quotient rule (u/v)' = (u' v - u v')/v^{2}, the chain rule dy/dx = (dy/du)(du/dx).\n- Tangent slope m = f'(a). The normal has slope -1/m.\n- Maxima and minima: set f'(x) = 0. Then f'' > 0 gives a minimum and f'' < 0 gives a maximum. A point of inflection is where f'' changes sign.\n- Optimization steps: write the quantity to optimize, use the constraint to get one variable, differentiate, set to zero, then check the end points and the second derivative.\n- Related rates: write the relation between the variables, differentiate with respect to time, then substitute the known values.\n- Implicit differentiation: differentiate both sides and treat y as a function of x.\n- L'Hôpital's rule: for 0/0 or ∞/∞, take the derivative of the top and the bottom separately.\n- Curvature κ = |y''|/(1 + y'^{2})^{3/2}, and the radius of curvature R = 1/κ.\nTip: In related rates, never substitute a changing quantity before you differentiate.\n\n@Topic: Integral Calculus\n\n## Integral calculus at a glance\n- Power rule: the integral of x^{n} is x^{n+1}/(n + 1) + C for n ≠ -1. The integral of 1/x is ln|x| + C.\n- Substitution: let u be the inner function. For a definite integral, change the limits too.\n- By parts: ∫ u dv = u v - ∫ v du. Choose u in the order logarithmic, inverse trigonometric, algebraic, trigonometric, exponential.\n- Trigonometric substitution: sqrt(a^{2} - x^{2}) uses x = a sin θ, sqrt(a^{2} + x^{2}) uses x = a tan θ, sqrt(x^{2} - a^{2}) uses x = a sec θ.\n- Area between curves: integrate (upper - lower).\n- Volume of revolution: disks π ∫ y^{2} dx, washers π ∫ (R^{2} - r^{2}) dx, shells 2 π ∫ x y dx.\n- Average value of f on [a, b]: (1/(b - a)) ∫ f dx.\n- Centroid: x̄ = ∫ x dA/A. Moment of inertia: I = ∫ r^{2} dA.\n- Wallis formula for the integral of sin^{m} x cos^{n} x from 0 to π/2 saves a lot of time.\nWatch out: Do not forget +C on an indefinite integral, and do not mix limits in x with a substitution in u.\n\n@Topic: Differential Equations\n\n## Differential equations at a glance\n- Order is the highest derivative. Degree is the power of that derivative after clearing radicals and fractions.\n- Separable: write g(y) dy = f(x) dx and integrate both sides.\n- First-order linear: y' + P y = Q. The integrating factor is μ = e^{∫P dx}, and y μ = ∫ μ Q dx.\n- Exact: M dx + N dy = 0 is exact when ∂M/∂y = ∂N/∂x.\n- Homogeneous (same degree in x and y): let y = v x.\n- Bernoulli: y' + P y = Q y^{n}. Let v = y^{1-n}.\n- Second-order linear with constant coefficients: solve the characteristic equation. Real distinct roots give C_{1} e^{r_{1} x} + C_{2} e^{r_{2} x}. A repeated root gives (C_{1} + C_{2} x) e^{r x}. Complex roots α ± jβ give e^{α x}(C_{1} cos β x + C_{2} sin β x).\n- Nonhomogeneous: y = y_{h} + y_{p}. Find y_{p} by undetermined coefficients or variation of parameters.\n- Growth and decay: dN/dt = k N. Newton's law of cooling: dT/dt = -k(T - T_{s}).\n- Mixing problems: the rate of change = rate in - rate out.\n- Orthogonal trajectories: replace dy/dx by -dx/dy in the original family's equation.\n\n@Topic: Advanced Mathematics\n\n## Advanced mathematics at a glance\n- Complex numbers: z = a + j b = r∠θ = r e^{jθ}. De Moivre: z^{n} = r^{n}∠(nθ). The n nth roots are spaced 360°/n apart.\n- Matrices: A B is not the same as B A. (A B)^{-1} = B^{-1} A^{-1} and (A B)^{T} = B^{T} A^{T}.\n- A square matrix has an inverse only if its determinant is not zero. For 2 × 2: det = a d - b c.\n- Determinant rules: swapping two rows changes the sign. Two equal rows give zero. Adding a multiple of one row to another changes nothing. Multiplying a row by k multiplies the determinant by k.\n- Cramer's rule: x_{i} = det(A_{i})/det(A).\n- Eigenvalues: solve det(A - λ I) = 0. Their sum is the trace and their product is the determinant.\n- Scalar triple product: the volume of the parallelepiped on three vectors.\n- Fourier series: an even function has only cosine terms, an odd function only sine terms. Half-wave symmetry leaves only odd harmonics.\n- Laplace transforms: L{e^{a t}} = 1/(s - a), L{sin ω t} = ω/(s^{2} + ω^{2}), L{f'} = s F(s) - f(0).\n- Hyperbolic functions: cosh^{2} x - sinh^{2} x = 1.\n\n@Topic: Numerical Solutions\n\n## Numerical solutions at a glance\n- Bisection: needs f(a) and f(b) of opposite sign. The interval halves each step, so the error after n steps is at most (b - a)/2^{n}.\n- Newton-Raphson: x_{n+1} = x_{n} - f(x_{n})/f'(x_{n}). It converges fast near a root but can fail when f' is near zero.\n- Secant method: like Newton-Raphson, but the derivative is replaced by a slope through the last two points.\n- False position keeps a bracket like bisection but uses a straight line to pick the next point.\n- Trapezoidal rule: (h/2)[y_{0} + 2(y_{1} + ... + y_{n-1}) + y_{n}].\n- Simpson's 1/3 rule: (h/3)[y_{0} + 4(odd terms) + 2(even terms) + y_{n}]. It needs an even number of intervals.\n- Euler's method: y_{n+1} = y_{n} + h f(x_{n}, y_{n}). A smaller h gives a smaller error.\n- Errors: absolute error = |true - approximate|, relative error = absolute error/|true|.\n- Interpolation: Newton's forward difference and Lagrange both pass a polynomial through the given points.\n- Linear systems: Gauss elimination is direct. Jacobi and Gauss-Seidel are iterative.\nTip: The Calculator section of this tab shows how to check a root with SOLVE and a table of values with TABLE.\n\n@Topic: Statistics and Probability\n\n## Statistics and probability at a glance\n- Mean, median and mode describe the center. Population variance divides by N. Sample variance divides by N - 1.\n- Standard deviation is the square root of the variance.\n- Probability: P(A or B) = P(A) + P(B) - P(A and B). For independent events P(A and B) = P(A) P(B).\n- Conditional probability: P(A|B) = P(A and B)/P(B). Bayes: P(A|B) = P(B|A) P(A)/P(B).\n- Permutations: nPr = n!/(n - r)!. Combinations: nCr = n!/(r!(n - r)!). Circular arrangements of n objects: (n - 1)!. With repeated objects: n!/(n_{1}! n_{2}! ...).\n- Binomial: P(x) = C(n, x) p^{x} q^{n-x}, with mean n p and variance n p q.\n- Poisson: P(x) = λ^{x} e^{-λ}/x!, with mean and variance both equal to λ.\n- Normal distribution: z = (x - μ)/σ. About 68%, 95% and 99.7% of values lie within 1, 2 and 3 standard deviations of the mean.\n- Expected value: E = Σ x P(x).\n- Correlation r lies between -1 and 1. The least-squares line is the best straight-line fit.\nTip: For \"at least one\", compute 1 minus the probability of none.\n\n@Section: Notes\n@Source: Claude starter summary\n@Subject: ESAS\n@Topic: Engineering Economics\n\n## Engineering economics at a glance\n- Money has a time value, so amounts at different times are compared only after moving them to the same time with an interest rate. This is equivalence.\n- Simple interest is charged on the principal only. Ordinary simple interest uses 360 days a year, exact simple interest uses 365 (366 in a leap year).\n- Compound interest is charged on principal plus earned interest. Nominal rate r compounded m times a year gives i = r/m per period.\n- The effective annual rate is (1 + r/m)^{m} - 1. Compare rates only on the same effective basis.\n- Ordinary annuity: equal payments at the end of each period. Annuity due: at the start. Deferred annuity: payments begin after a delay. Perpetuity: payments never end, P = A/i.\n- Draw a cash flow diagram first. Put the present at time 0, and match the interest period to the payment period.\n- Depreciation spreads the first cost less the salvage value over the life. Straight line is the same amount each year. Sinking fund treats the charges as a fund that earns interest. Declining balance applies a fixed rate to the book value. SYD uses decreasing fractions n/Σ, (n - 1)/Σ and so on.\n- Capitalized cost is the present worth of a cost that goes on forever: first cost plus renewals plus yearly costs divided by i.\n- Break-even is where total revenue equals total cost.\n- Comparing alternatives: use present worth for equal lives. Use annual cost, or the least common multiple of the lives, for unequal lives. Choose the lower cost, or the higher benefit-cost ratio.\n- Inflation: (1 + i_{f}) = (1 + i)(1 + f). A rate that includes inflation is not the real rate.\n- Bonds: price = present worth of the coupons plus present worth of the redemption value.\n- Gradient series: an arithmetic gradient changes by a fixed amount G each period (payment A + (k - 1) G). A geometric gradient changes by a fixed percentage g (payment A(1 + g)^{k-1}).\n- Summation method: the present worth of any series is the sum of each payment times (1 + i)^{-k}. Only the first and last period change between an ordinary annuity, an annuity due and a deferred annuity. The Calculator section shows how to type it with Σ.\nWatch out: The number of periods n and the rate i must use the same period, such as quarters with a quarterly rate.\n\n@Topic: Project Management\n\n## Project management at a glance\n- A project is a temporary effort that makes a unique product or result. The main constraints are scope, time and cost, with quality tied to all three.\n- The five process groups are initiating, planning, executing, monitoring and controlling, and closing.\n- A work breakdown structure splits the scope into deliverables and work packages.\n- Precedence relationships are finish-to-start, start-to-start, finish-to-finish and start-to-finish. Finish-to-start is the most common.\n- Critical path method: the forward pass gives the earliest start and finish, the backward pass gives the latest start and finish. Float = LS - ES = LF - EF. The critical path is the longest path and has zero total float.\n- PERT three-point estimate: expected time = (o + 4 m + p)/6 and variance = ((p - o)/6)^{2}, with o optimistic, m most likely and p pessimistic. The project standard deviation is the square root of the sum of the critical path variances.\n- Crashing shortens a project by paying more for some activities. Crash the critical activity with the lowest cost slope first. Cost slope = (crash cost - normal cost)/(normal time - crash time).\n- Earned value: CPI = EV/AC and SPI = EV/PV. CV = EV - AC and SV = EV - PV. A value above 1 for an index, or above 0 for a variance, is good.\n- Estimate at completion: EAC = BAC/CPI when the current cost performance is expected to continue.\n- Risk responses for threats: avoid, mitigate, transfer or accept.\n- A Gantt chart shows the schedule against time. A network diagram shows the logic between activities.\nTip: After a crash, check whether another path has become critical.\n\n@Topic: Mechanics\n\n## Statics at a glance\n- Draw the free-body diagram first. Show every force and reaction acting on the body.\n- Equilibrium in a plane: ΣF_{x} = 0, ΣF_{y} = 0 and ΣM = 0. In space there are six equations.\n- Supports: a roller gives one reaction, a pin gives two, a fixed support gives two forces and a moment.\n- Resultant of concurrent forces: R_{x} = ΣF_{x}, R_{y} = ΣF_{y}, R = sqrt(R_{x}^{2} + R_{y}^{2}) and the angle is arctan(R_{y}/R_{x}).\n- Moment = force × perpendicular distance. Varignon's theorem: the moment of a resultant equals the sum of the moments of its components.\n- A couple is two equal, opposite, parallel forces. Its moment is F d and it is the same about any point.\n- Trusses: the method of joints solves a joint with at most two unknowns. The method of sections cuts through at most three unknown members and takes moments.\n- A truss is statically determinate when m + r = 2 j, with m members, r reactions and j joints.\n- Friction: F ≤ μ N. Motion is about to start when F = μ_{s} N. On an incline, a block starts to slip when tan θ > μ.\n- Centroids and moments of inertia: the parallel axis theorem is I = I_{c} + A d^{2}. For a rectangle, I_{c} = b h^{3}/12. The radius of gyration is r = sqrt(I/A).\nTip: Take moments about the point where the most unknown forces cross.\n\n@Topic: Communications\n\n## Communications at a glance\n- A communication system has a transmitter, a channel and a receiver. Noise is added in the channel and the receiver.\n- Amplitude modulation: the bandwidth is 2 f_{m}. The modulation index is m = V_{m}/V_{c}. The total power is P_{t} = P_{c}(1 + m^{2}/2), and each sideband carries P_{c} m^{2}/4.\n- Single sideband sends one sideband only. It saves bandwidth and power.\n- Frequency modulation: the deviation follows the amplitude of the message. The modulation index is m_{f} = Δf/f_{m}. Carson's rule: BW ≈ 2(Δf + f_{m}).\n- The superheterodyne receiver mixes the input with a local oscillator to get a fixed intermediate frequency. A typical IF is 455 kHz for AM broadcast and 10.7 MHz for FM broadcast.\n- Image frequency = f_{s} + 2 f_{IF}. A good RF stage rejects it.\n- Decibels: dB = 10 log(P_{2}/P_{1}) = 20 log(V_{2}/V_{1}).\n- Thermal noise voltage: V_{n} = sqrt(4 k T B R). Noise figure NF = 10 log F, with F the input signal-to-noise ratio divided by the output ratio.\n- In a cascade of amplifiers, the first stage has the most effect on the noise.\n- Sampling theorem: sample at least twice the highest frequency, f_{s} ≥ 2 f_{max}.\n- Shannon capacity: C = B log_{2}(1 + S/N).\n- A half-wave dipole is about 468/f feet long, with f in MHz.\n- The standing wave ratio shows how well a line is matched. A perfect match gives 1.\n\n@Topic: Mechanics 2\n\n## Dynamics at a glance\n- Uniform acceleration: v = v_{0} + a t, s = v_{0} t + (1/2) a t^{2}, v^{2} = v_{0}^{2} + 2 a s.\n- Free fall: g = 9.81 m/s^{2} (32.2 ft/s^{2}).\n- Projectile: the horizontal velocity is constant and the vertical motion is free fall. Time of flight 2 v_{0} sin θ/g, maximum height v_{0}^{2} sin^{2} θ/(2 g), range v_{0}^{2} sin 2θ/g. The range is greatest at 45° on level ground.\n- Newton's second law: ΣF = m a. Use it along the direction of motion and along the normal to the path.\n- Work and energy: the work done equals the change in kinetic energy. KE = (1/2) m v^{2} and PE = m g h. Mechanical energy is conserved when only gravity and springs do work.\n- Impulse and momentum: F Δt = m Δv. Linear momentum is conserved when no outside force acts.\n- Coefficient of restitution e = (relative speed after)/(relative speed before). It is 1 for an elastic collision and 0 for a perfectly plastic one.\n- Rotation about a fixed axis: ω = ω_{0} + α t, θ = ω_{0} t + (1/2) α t^{2}, v = r ω, a_{t} = r α and a_{c} = v^{2}/r.\n- Torque and rotation: T = I α. Rotational kinetic energy = (1/2) I ω^{2}.\n- Power = F v = T ω.\n- The projectile formulas for range, height and time of flight can be put into SOLVE with the unknown as X. The Calculator section has the steps.\n- Circular path: the net inward force is m v^{2}/r. A banked curve with no friction needs tan θ = v^{2}/(g r).\nTip: Convert all speeds to the same units, such as km/h to m/s, by dividing by 3.6.\n\n@Topic: Physics 1\n\n## Physics 1 at a glance\n- Use SI units and convert first. Check that both sides of an equation have the same units.\n- Newton's laws: a body at rest or in uniform motion stays that way without a net force, F = m a, and every action has an equal and opposite reaction.\n- Newton's law for angular motion: the net torque on a rigid body is T = I α, the rotation version of F = m a. Rotational kinetic energy = (1/2) I ω^{2}.\n- Work W = F d cos θ, in joules. Power is work per unit time, P = W/t = F v, in watts (1 hp = 746 W).\n- Kinetic energy = (1/2) m v^{2}. Gravitational potential energy = m g h. A spring stores (1/2) k x^{2}.\n- Conservation of energy: in an isolated system, energy changes form but the total stays the same. With only gravity and springs doing work, KE + PE is constant.\n- Work and energy: the net work on a body equals its change in kinetic energy, W_{net} = ΔKE.\n- Universal gravitation: F = G m_{1} m_{2}/r^{2}, with G = 6.674 × 10^{-11} N·m^{2}/kg^{2}.\n- Simple harmonic motion: the period of a spring is T = 2 π sqrt(m/k) and of a pendulum is T = 2 π sqrt(L/g). Frequency f = 1/T.\n- Metric prefixes: kilo 10^{3}, mega 10^{6}, giga 10^{9}, milli 10^{-3}, micro 10^{-6}, nano 10^{-9}.\nTip: Momentum, impulse and collisions are under Mechanics 2. Heat and heat transfer are under Thermodynamics.\n\n@Topic: Physics 2\n\n## Physics 2 at a glance\n- Waves: v = f λ and f = 1/T. A wave carries energy, not matter.\n- Types of waves: in a transverse wave the motion is across the direction of travel (a string, light). In a longitudinal wave it is along the direction of travel (sound). Mechanical waves need a medium. Light and other electromagnetic waves do not.\n- Speed of a wave: on a string v = sqrt(T/μ), with tension T and mass per unit length μ.\n- Sound: the speed in air is about 343 m/s at 20 °C. The Doppler effect raises the pitch when the source and the listener approach.\n- Sound level: β = 10 log(I/I_{0}) in decibels, with I_{0} = 10^{-12} W/m^{2}. Adding 3 dB doubles the intensity.\n- Light: n = c/v, with c ≈ 3 × 10^{8} m/s. The angle of reflection equals the angle of incidence. Snell's law n_{1} sin θ_{1} = n_{2} sin θ_{2}. The critical angle has sin θ_{c} = n_{2}/n_{1}, for light going into the lower index n_{2}.\n- Spherical mirrors: the focal length is half the radius, f = r/2. Mirrors and thin lenses follow 1/f = 1/p + 1/q, and magnification M = -q/p.\n- Lens: a converging lens has a positive focal length and a diverging one a negative focal length. Sign rules differ between books, so check the Formulas section.\n- Photon energy: E = h f.\nTip: Electricity and magnetism are under EE, in Electrostatics and Electromagnetics.\n\n@Topic: Chemistry\n\n## Chemistry at a glance\n- Mole: n = mass/molar mass. One mole holds 6.022 × 10^{23} particles.\n- Concentration: molarity = moles of solute per liter of solution. Molality = moles of solute per kilogram of solvent. Dilution: M_{1} V_{1} = M_{2} V_{2}.\n- Gas laws: Boyle (P V constant), Charles (V/T constant) and Gay-Lussac (P/T constant), all with temperature in kelvin. Ideal gas: P V = n R T, with R = 0.08206 L·atm/(mol·K). At STP (0 °C, 1 atm) one mole of gas takes 22.4 L.\n- Dalton's law: the total pressure is the sum of the partial pressures.\n- Stoichiometry: balance the equation, then use the mole ratio. The limiting reagent runs out first and fixes the yield. Percent yield = actual yield/theoretical yield × 100.\n- Acids and bases: pH = -log[H^{+}]. At 25 °C, pH + pOH = 14. Strong acids dissociate completely. A buffer follows pH = pK_{a} + log([A^{-}]/[HA]).\n- Periodic trends: atomic radius decreases across a period and increases down a group. Electronegativity increases across a period and decreases down a group.\n- Bonding: ionic bonds transfer electrons, covalent bonds share them, metallic bonds share a sea of them.\n- Electrochemistry: oxidation is loss of electrons and reduction is gain. Faraday's law: m = M I t/(n F), with F = 96485 C/mol. E°_{cell} = E°_{cathode} - E°_{anode}.\n- Thermochemistry: ΔH < 0 is exothermic. Hess's law: the total ΔH does not depend on the path.\n- Hydrocarbons: alkanes C_{n}H_{2n+2}, alkenes C_{n}H_{2n}, alkynes C_{n}H_{2n-2}.\n- Le Chatelier: a system at equilibrium shifts to oppose a change.\n\n@Topic: Computer and Logic\n\n## Computer and logic at a glance\n- Number systems: group binary digits in threes for octal and in fours for hexadecimal. Convert decimal to binary by dividing by 2 repeatedly and reading the remainders backward.\n- Two's complement: invert the bits and add 1. It is how computers store negative integers.\n- Gates: AND, OR, NOT, NAND, NOR, XOR, XNOR. NAND and NOR are universal gates.\n- De Morgan: (A + B)' = A' B' and (A B)' = A' + B'.\n- Useful identities: A + A B = A and A + A' B = A + B.\n- Karnaugh maps group adjacent 1s in powers of two to simplify a sum of products.\n- Combinational circuits have no memory: adders, multiplexers, decoders. Sequential circuits have memory: flip-flops (SR, D, JK, T), registers and counters.\n- A CPU has an arithmetic logic unit, a control unit and registers. Memory speed goes from registers, to cache, to main memory, to disk, and the capacity goes the other way.\n- Software: an operating system manages resources. A compiler translates the whole program first. An interpreter runs it line by line.\n- Programs are built from sequence, selection and repetition. A flowchart shows the logic.\n- Networks: the OSI model has seven layers: physical, data link, network, transport, session, presentation and application. TCP is reliable and connection-based. UDP is fast and connectionless.\n- 1 byte = 8 bits.\n\n@Topic: Strength of Materials\n\n## Strength of materials at a glance\n- Normal stress σ = P/A. Strain ε = δ/L. Hooke's law σ = E ε in the elastic range. The elongation is δ = P L/(A E).\n- Shear stress τ = V/A. The moduli are related by G = E/(2(1 + ν)). Poisson's ratio ν = -(lateral strain)/(axial strain).\n- Thermal effects: δ_{T} = α L ΔT. A fully restrained member gets a stress σ = E α ΔT.\n- Torsion: τ = T ρ/J, so τ_{max} = T r/J. For a solid shaft J = π d^{4}/32 and τ_{max} = 16 T/(π d^{3}). The angle of twist is θ = T L/(J G).\n- Power in a shaft: P = T ω = 2 π N T/60 with N in rpm.\n- Beams: dV/dx = -w and dM/dx = V, so the largest bending moment is where the shear is zero or changes sign.\n- Bending stress σ = M c/I. Shear stress in a beam τ = V Q/(I b).\n- Columns: Euler's buckling load P_{cr} = π^{2} E I/(L_{e})^{2}. The slenderness ratio is L_{e}/r.\n- Thin-walled cylinder: hoop stress p D/(2 t) and longitudinal stress p D/(4 t). A sphere has p D/(4 t) in every direction.\n- Principal stresses: σ = (σ_{x} + σ_{y})/2 ± sqrt(((σ_{x} - σ_{y})/2)^{2} + τ^{2}). Mohr's circle shows the same result.\n- Factor of safety = ultimate stress/allowable stress.\nWatch out: Keep units consistent. Use N and mm for stress in MPa.\n\n@Topic: Fluid Mechanics\n\n## Fluid mechanics at a glance\n- Water has a density of 1000 kg/m^{3} and a specific weight of 9.81 kN/m^{3}. Specific gravity = density of the fluid/density of water.\n- Pressure in a static fluid: p = γ h. Absolute pressure = gage pressure + atmospheric pressure (101.325 kPa at sea level). Pressure is the same at the same level in a connected fluid at rest.\n- Force on a submerged plane surface: F = γ h_{c} A, acting below the centroid at a distance I_{c}/(A y_{c}).\n- Buoyancy: B = γ V_{displaced}. A floating body displaces its own weight of fluid.\n- Continuity: Q = A_{1} v_{1} = A_{2} v_{2} for an incompressible fluid.\n- Bernoulli (steady, no losses, along a streamline): p/γ + v^{2}/(2 g) + z is constant. Add pump head, subtract turbine head and head loss in the energy equation.\n- Torricelli: v = sqrt(2 g h). An orifice discharges Q = C_{d} A sqrt(2 g h).\n- Reynolds number Re = ρ v D/μ. A pipe flow is laminar below about 2000 and turbulent above about 4000.\n- Pipe friction (Darcy): h_{f} = f L v^{2}/(2 g D), with f = 64/Re for laminar flow. Minor losses: h = K v^{2}/(2 g).\n- Open channel (Manning): v = (1/n) R^{2/3} S^{1/2}, with hydraulic radius R = A/P.\n- Pump power: P = γ Q H/η.\n- Viscosity: τ = μ du/dy.\n- Froude number v/sqrt(g L) is used for free-surface flows.\n\n@Topic: Thermodynamics\n\n## Thermodynamics at a glance\n- A closed system has a fixed mass. An open system, or control volume, lets mass cross the boundary. Properties are intensive (not dependent on mass, like pressure) or extensive (like volume).\n- First law, closed system: Q - W = ΔU. Steady flow: Q - W = Δ(h + v^{2}/2 + g z) per unit mass.\n- Second law: no engine is 100% efficient, and heat does not flow by itself from cold to hot.\n- Carnot efficiency: η = 1 - T_{L}/T_{H} with absolute temperatures. Refrigerator COP = Q_{L}/W. Heat pump COP = Q_{H}/W = COP_{refrigerator} + 1.\n- Ideal gas: P V = m R T, c_{p} - c_{v} = R and k = c_{p}/c_{v}.\n- Processes: isobaric W = P ΔV. Isothermal W = m R T ln(V_{2}/V_{1}). Isentropic P V^{k} is constant and T_{2}/T_{1} = (P_{2}/P_{1})^{(k-1)/k}. Polytropic P V^{n} is constant and W = (P_{2} V_{2} - P_{1} V_{1})/(1 - n).\n- Entropy: for a reversible process dS = δQ/T. It does not decrease in an isolated system.\n- Cycles: Otto η = 1 - 1/r^{k-1}. Brayton η = 1 - 1/r_{p}^{(k-1)/k}. Rankine is the basic steam power cycle: boiler, turbine, condenser, pump.\n- Steam: quality x = mass of vapor/total mass, and h = h_{f} + x h_{fg}. Use the steam tables for saturated and superheated steam.\n- Temperature: K = °C + 273.15 and °R = °F + 459.67.\n- Heat: Q = m c ΔT for a temperature change and Q = m L for a change of phase. In a mixture, the heat lost equals the heat gained.\n- Heat transfer: conduction q = k A ΔT/L, convection q = h A ΔT and radiation q = σ ε A T^{4}, with T in kelvin.\nWatch out: Use absolute temperature and absolute pressure in every gas equation.\n\n@Section: Notes\n@Source: Claude starter summary\n@Subject: EE\n@Topic: Electrostatics\n\n## Electrostatics at a glance\n- Like charges repel and unlike charges attract. The charge of an electron is 1.602 × 10^{-19} C.\n- Coulomb's law: F = k Q_{1} Q_{2}/r^{2}. The force falls with the square of the distance.\n- Field lines leave positive charges and end on negative charges. The field inside a conductor is zero and the charge sits on the outer surface.\n- Potential is a scalar: V = W/Q. Equipotential lines cross field lines at right angles.\n- Gauss's law: the flux out of a closed surface equals the charge inside. Use it when the charge has symmetry (a sphere, a long line or a large sheet).\n- A capacitor stores energy in its electric field: W = (1/2) C V^{2}.\n- Capacitors in parallel add. In series, the charge is the same and 1/C_{eq} adds, so the result is smaller than the smallest one.\n- A dielectric raises the capacitance by its relative permittivity ε_{r}. Too high a field breaks the dielectric down.\n- Charging through a resistor: the time constant is τ = R C.\nTip: Capacitors in series combine like resistors in parallel, and capacitors in parallel combine like resistors in series.\n\n@Topic: Electromagnetics\n\n## Electromagnetics at a glance\n- Current makes a magnetic field. Point the right thumb along the current and the fingers curl in the direction of the field.\n- The force on a current-carrying conductor is F = B I L sin θ. The direction follows Fleming's left-hand rule for a motor and the right-hand rule for a generator.\n- Faraday's law: the induced emf is e = -N dΦ/dt. Lenz's law: the induced emf opposes the change that makes it.\n- A magnetic circuit is like an electric circuit. The mmf N I corresponds to emf, the flux Φ to current and the reluctance R to resistance.\n- Materials: diamagnetic and paramagnetic materials are barely affected. Ferromagnetic materials have a high permeability but saturate and show hysteresis.\n- Hysteresis loss is proportional to the area of the B-H loop. Laminating the core reduces eddy current loss.\n- An inductor stores energy in its magnetic field: W = (1/2) L I^{2}. Inductors in series add like resistors when there is no coupling.\n- Two parallel conductors attract when their currents are in the same direction and repel when opposite.\n- Units: flux in weber (Wb), flux density in tesla (T), inductance in henry (H), mmf in ampere-turns.\n\n@Topic: AC Circuits 1\n\n## AC circuits 1 at a glance\n- A phasor stands for a sinusoid by its magnitude (usually the rms value) and its phase angle. Add and subtract phasors as complex numbers.\n- In an inductor the voltage leads the current by 90°. In a capacitor the current leads the voltage by 90°. A resistor has them in phase.\n- Series RLC: Z = R + j(X_{L} - X_{C}). If X_{L} is larger the circuit is inductive and the current lags. If X_{C} is larger it is capacitive and the current leads.\n- Power triangle: P is real power in watts, Q is reactive power in var, S is apparent power in VA. Only the resistance uses real power.\n- Adding a capacitor across an inductive load raises the power factor and lowers the line current. The real power does not change.\n- Resonance occurs when X_{L} = X_{C}. In a series circuit the impedance is smallest and the current largest. In a parallel circuit the impedance is largest and the line current smallest.\n- A higher Q gives a narrower bandwidth. BW = f_{0}/Q.\n- The rms value is the dc value that gives the same heating.\n- Network theorems: Kirchhoff's current law at a node, Kirchhoff's voltage law around a loop, Thevenin and Norton equivalents, and superposition for linear circuits.\n- Maximum power transfer in ac needs the load impedance to be the complex conjugate of the source impedance.\nTip: Use j for sqrt(-1) in electrical work, because i stands for current.\n\n@Topic: AC Circuits 2\n\n## AC circuits 2 at a glance\n- A balanced three-phase source has three voltages of equal size, 120° apart. In the positive sequence (abc) they reach their peaks in the order a, b, c.\n- In a wye connection the line voltage is sqrt(3) times the phase voltage and the line current equals the phase current. In a delta connection the line voltage equals the phase voltage and the line current is sqrt(3) times the phase current.\n- For a balanced load, analyze one phase. Convert a delta load to a wye with Z_{Y} = Z_{Δ}/3, and use V_{ph} = V_{L}/sqrt(3).\n- Total three-phase power is P = sqrt(3) V_{L} I_{L} cos θ whether the load is wye or delta. The angle θ is the angle of one phase of the load.\n- The instantaneous power of a balanced three-phase load is constant.\n- The two-wattmeter method measures the power of a three-wire system, balanced or not. The sum of the readings is the total power.\n- In a four-wire wye system the neutral carries current only when the load is unbalanced.\n- Symmetrical components break an unbalanced set into a positive sequence set, a negative sequence set (the order is reversed) and a zero sequence set (all three in phase).\n- Phase sequence matters for motor rotation direction. Swapping two lines reverses it.\nWatch out: A line quantity and a phase quantity are not the same. Always find out which one a problem gives.\n\n@Topic: Transients\n\n## Transients at a glance\n- A capacitor voltage and an inductor current cannot change instantly. The values just after switching equal the values just before.\n- Just after switching, an uncharged capacitor acts like a short circuit and an inductor with no current acts like an open circuit. A long time after switching in a dc circuit, the capacitor is open and the inductor is short.\n- Time constants: τ = R C and τ = L/R, with R the Thevenin resistance seen by the capacitor or the inductor.\n- Every first-order response has the form x(t) = x_{f} + (x_{0} - x_{f}) e^{-t/τ}. Find the starting value, the final value and τ.\n- After 5 τ the response is practically finished.\n- Series RLC: compare α = R/(2 L) with ω_{0} = 1/sqrt(L C). If α is larger the response is overdamped. If equal, critically damped. If smaller, underdamped and it rings at ω_{d}.\n- The damping ratio is ζ = α/ω_{0}.\n- Laplace method: in the s domain a resistor is R, an inductor is s L and a capacitor is 1/(s C). Initial conditions appear as sources.\n\n@Topic: DC Machines\n\n## DC machines at a glance\n- Field connections: separately excited, shunt, series and compound (cumulative or differential).\n- The back emf of a motor opposes the supply, so I_{a} = (V - E_{b})/R_{a}. At starting E_{b} = 0, so the current is very large and a starter resistance is needed.\n- Shunt motor: nearly constant speed, good speed control. Never open its field circuit while it runs, because it can race.\n- Series motor: very high starting torque and a speed that drops sharply with load. Never run it without load, because it can race.\n- Speed control: armature voltage control gives speeds below the base speed. Field weakening gives speeds above it.\n- Losses: copper losses in the armature and the field, iron losses (hysteresis and eddy), mechanical losses and brush loss.\n- The commutator turns the alternating emf in the armature coils into a direct voltage at the brushes.\n- Armature reaction distorts the field and weakens the flux. Interpoles and compensating windings reduce its effect.\n- A self-excited generator builds up only with residual magnetism and a field resistance below the critical value.\n- Maximum efficiency occurs when the variable losses equal the constant losses.\n\n@Topic: Transformers 1\n\n## Transformers 1 at a glance\n- A transformer works by mutual induction. It needs a changing flux, so it works on ac only, and it does not change the frequency.\n- Turns ratio a = N_{1}/N_{2}. Voltage goes with the turns ratio and current goes in the opposite way.\n- Impedance referred across the transformer is multiplied by a^{2}.\n- Core loss (hysteresis and eddy) depends on the voltage and frequency and is nearly constant from no load to full load. Copper loss depends on the square of the current.\n- Maximum efficiency occurs at the load where the copper loss equals the core loss.\n- Open circuit test: apply rated voltage, usually on the low-voltage side. The power read is the core loss.\n- Short circuit test: apply a reduced voltage so rated current flows, usually on the high-voltage side. The power read is the full-load copper loss.\n- Regulation is positive for a lagging power factor. For a leading power factor it can be zero or negative.\n- The kVA rating is set by the voltage and the current. It does not depend on the power factor of the load.\n- Switching on a transformer can draw a large inrush current because the core saturates.\n\n@Topic: Transformers 2\n\n## Transformers 2 at a glance\n- Three-phase banks: Y-Y, Δ-Δ, Y-Δ and Δ-Y. A Y-Δ or a Δ-Y bank shifts the line voltages by 30°.\n- A Δ-Δ bank can keep running with only two transformers (open delta), at 57.7% of the bank rating.\n- A Y-Y bank without a neutral connection can have an unstable neutral and third harmonic voltages. A delta tertiary winding helps.\n- An autotransformer has one winding with a tap. It is smaller, cheaper and more efficient than a two-winding transformer, especially when the ratio is close to 1. It gives no electrical isolation.\n- Per-unit values of a transformer are the same on the high-voltage and low-voltage sides. Choose one base MVA for the whole system and one base voltage on each side that follows the turns ratio.\n- To combine units in parallel, match the voltage ratio, the polarity, the phase sequence and the phase shift. For good sharing, also match the per-unit impedance.\n- A current transformer must never have an open secondary while the primary carries current. A potential transformer must never have a shorted secondary.\n- A Scott connection makes two phases from three. A tap changer adjusts the voltage ratio.\n\n@Topic: Synchronous Machines\n\n## Synchronous machines at a glance\n- The rotor carries a dc field and turns at synchronous speed N_{s} = 120 f/P. The three-phase armature is on the stator.\n- Alternator regulation depends on the load power factor. A lagging load gives the largest voltage drop. A leading load can make the terminal voltage rise above the no-load value.\n- The synchronous impedance method uses the open circuit test and the short circuit test.\n- To connect an alternator to a bus, match the voltage, the frequency, the phase sequence and the phase angle. A synchroscope or a lamp method shows when to close the switch.\n- After paralleling, the governor setting shares the real power and the field current shares the reactive power.\n- A synchronous motor is not self-starting. It starts as an induction motor using damper windings or with a variable frequency drive, then locks in at synchronous speed.\n- The motor speed stays constant under varying load. A load increase raises the power angle δ. The pull-out torque is reached near 90° for a cylindrical rotor.\n- Excitation controls the motor power factor. Over-excited gives a leading current, and a synchronous motor on no load used for this is a synchronous condenser.\n- A salient pole machine has X_{d} larger than X_{q} and develops reluctance torque as well.\n- Hunting is a swinging of the rotor about its steady speed after a disturbance.\n\n@Topic: Induction Motors\n\n## Induction motors at a glance\n- The stator makes a rotating field at synchronous speed. The rotor turns slower. The difference is the slip: s = 1 at standstill and only a few percent at full load.\n- Squirrel cage rotors are rugged and cheap but have a lower starting torque. Wound rotors let you add external resistance for a high starting torque and for speed control.\n- Torque-speed curve: starting torque at s = 1, maximum or pull-out torque at s_{m}, and the rated point at a small slip. Stable operation is between the pull-out point and synchronous speed.\n- Adding rotor resistance moves the maximum torque to a higher slip, but does not change its size.\n- Torque goes as the square of the supply voltage. A 10% voltage drop reduces torque by about 19%.\n- Starting: direct on line, star-delta, autotransformer, soft starter, or rotor resistance for a wound rotor.\n- Speed control: change the supply frequency (keep V/f constant), change the number of poles, change the rotor resistance or change the stator voltage.\n- Tests: the no-load test is like the open circuit test of a transformer, and the blocked rotor test is like the short circuit test.\n- Above synchronous speed the slip is negative and the machine works as a generator.\n- Single-phase induction motors need a starting method: split-phase, capacitor-start or shaded-pole.\n\n@Topic: Power Plant\n\n## Power plants at a glance\n- Conventional sources: coal, oil, natural gas, nuclear and large hydro. Renewable sources: solar, wind, geothermal, biomass and ocean.\n- A steam plant follows the Rankine cycle: boiler, turbine, condenser and feed pump.\n- A gas turbine starts quickly. A diesel plant suits small or standby loads. A combined cycle uses the gas turbine exhaust to make steam and reaches a higher efficiency.\n- Hydroelectric power depends on head and flow. Pelton turbines suit high heads, Francis medium heads and Kaplan low heads.\n- Nuclear plants use fission. The moderator slows the neutrons, control rods absorb them and the coolant carries the heat away.\n- Base load plants run all the time. Peak plants run only at peak demand and need low capital cost and fast starts.\n- A higher load factor spreads fixed costs over more kWh and lowers the cost per kWh.\n- Diversity among customers makes the system maximum demand smaller than the sum of the individual maximum demands.\n- The cost of energy has a fixed part (capital, interest, depreciation) and an operating part (fuel, labor, maintenance).\n\n@Topic: Illuminations\n\n## Illuminations at a glance\n- Luminous flux in lumens is the light output. Luminous intensity in candela is the flux per steradian. Illuminance in lux is the flux per square meter on a surface.\n- Inverse square law for a point source: E = I/d^{2}. Cosine law: E = I cos θ/d^{2} on a surface tilted away from the source.\n- Luminous efficacy (lumens per watt) rates lamps. Incandescent lamps are the lowest, then halogen, then fluorescent, with LED and high intensity discharge lamps (mercury, metal halide, sodium) the highest.\n- Lumen method for an interior: the number of lamps N = E A/(Φ · CU · MF).\n- The coefficient of utilization depends on the room index and the reflectances of the ceiling, walls and floor. The maintenance factor allows for dirt and lamp aging.\n- Color temperature in kelvin tells whether the light looks warm or cool. The color rendering index tells how well colors look under the lamp.\n- Glare, uniformity and the spacing to mounting height ratio are design checks.\n- Recommended illuminance levels depend on the task. Use the table in your reviewer or the lighting standard.\n\n@Topic: Transmission Lines\n\n## Transmission lines at a glance\n- The line parameters are series resistance and inductance and shunt capacitance and conductance. The GMD and GMR give the inductance and the capacitance.\n- Transposition equalizes the phases. Bundled conductors lower the reactance and reduce corona.\n- Short lines (about 80 km or less) use series impedance only. Medium lines (about 80 to 250 km) use the nominal π or T model. Long lines use distributed parameters. Textbooks use slightly different limits.\n- The sending-end and receiving-end quantities are related by the ABCD constants: V_{S} = A V_{R} + B I_{R}, and A D - B C = 1.\n- The Ferranti effect is a higher voltage at the open receiving end than at the sending end.\n- Surge impedance loading: the load at which the line neither supplies nor absorbs reactive power. Heavier loads absorb reactive power. Lighter loads supply it.\n- Corona is a discharge in the air around a conductor. It causes power loss and radio noise. It increases with higher voltage, smaller conductors and wet weather.\n- An insulator string does not share voltage equally. The unit nearest the conductor has the highest voltage. A grading ring improves the sharing.\n- Sag increases with heavier loading and temperature. Ice and wind add to the load on the conductor.\n- Skin effect makes the ac resistance greater than the dc resistance.\n\n@Topic: Faults\n\n## Faults at a glance\n- Fault types: three-phase (balanced), single line to ground (the most common), line to line, and double line to ground.\n- A three-phase fault is balanced, so a single-phase positive sequence network is enough.\n- Per-unit method: choose a base MVA and base kV, convert every impedance to that base, reduce the network at the fault point to Z_{th}, and then I_{f} = 1/Z_{th} per unit.\n- Unsymmetrical faults use symmetrical components. Connect the sequence networks: for a single line to ground fault, all three in series. For a line to line fault, the positive and negative in parallel with no zero sequence. For a double line to ground fault, all three in parallel.\n- The zero sequence depends on the grounding and on the transformer connection. A delta winding blocks zero sequence current from the line and lets it circulate inside the delta. A grounded wye lets it flow.\n- A circuit breaker must interrupt the largest fault current at its location.\n- Protection devices: fuses, reclosers, overcurrent relays, distance relays and differential relays.\n- Relays and breakers receive their signals through current transformers and potential transformers.\nTip: When the question gives a fault MVA at a bus, the equivalent per-unit impedance is the base MVA divided by that fault MVA.\n\n@Section: Notes\n@Source: Claude summary from the texts of the laws, checked against lawphil and chanrobles (verify against the official text before an exam)\n@Subject: ESAS\n@Topic: EE Laws\n\n## Electrical engineering laws at a glance\n- RA 7920, the New Electrical Engineering Law, was approved on February 24, 1995. It governs the practice of electrical engineering and repealed RA 184, the old electrical engineering law.\n- RA 7920 creates the Board of Electrical Engineering: a chairman and two members, appointed by the President, under the Professional Regulation Commission (PRC). It names three classes of practitioner: Professional Electrical Engineer (PEE), Registered Electrical Engineer (REE) and Registered Master Electrician (RME).\n- RA 9136, the Electric Power Industry Reform Act (EPIRA, 2001), restructured the power industry. It created the Energy Regulatory Commission (ERC), the Power Sector Assets and Liabilities Management Corporation (PSALM), the transmission company TRANSCO and the wholesale electricity spot market (WESM).\n- RA 7832 (1994) punishes the illegal use of electricity and the theft of transmission lines and materials.\n- RA 9513, the Renewable Energy Act of 2008, gives incentives to renewable energy developers and sets up feed-in tariffs, a renewable portfolio standard and net metering.\n- RA 11285, the Energy Efficiency and Conservation Act (2019), requires energy labels, energy audits and energy managers.\n- RA 10912, the Continuing Professional Development (CPD) Act of 2016, makes CPD a condition for renewing a PRC license.\n- The Code of Ethics for Electrical Engineers sets the duties of an electrical engineer to the public, clients, the profession and fellow engineers.\nWatch out: Questions on laws are usually about a number (how many members, how many years, how many kVA) or about who may do what. The last note in this topic collects the numbers.\n\n## RA 7920: the Board of Electrical Engineering\n- Composition (Sec. 3): a chairman and two members, appointed by the President of the Philippines from the recommendees of the PRC Commissioner. The Institute of Integrated Electrical Engineers of the Philippines (IIEE), the accredited professional organization, nominates.\n- Qualifications of each member (Sec. 5): natural-born Filipino citizen and a resident of the Philippines for at least five consecutive years; at least 35 years old; a registered professional electrical engineer with a valid certificate and license, with at least ten years of active practice; no connection as faculty, officer or owner with a school that offers the BSEE, or with a review center, for the years before the appointment.\n- Term (Sec. 6): three years, or until the successors are appointed and qualified. A member may be reappointed for one more term.\n- Powers (Sec. 4): make rules, give the REE and RME examinations, evaluate the experience record and technical report of PEE applicants, inspect, investigate violations, issue subpoenas, and suspend or revoke certificates of registration.\nWatch out: The Board has three members in all (a chairman and two members). Do not confuse it with the five-member ERC.\n\n## RA 7920: PEE, REE and RME\n- Registered Electrical Engineer (REE, Sec. 17): a citizen of good moral character, at least 21 years old, with no conviction for a crime involving moral turpitude, and a BSEE from a recognized school. The applicant takes the REE examination.\n- Professional Electrical Engineer (PEE, Sec. 16): an REE with a valid certificate and license and four years or more of active practice counted from the date of registration as an REE. The applicant submits an experience record and a technical report (Sec. 19).\n- Registered Master Electrician (RME, Sec. 18): a citizen of good moral character, at least 18 years old, with no conviction for a crime involving moral turpitude, and one of the listed backgrounds. One of them is at least three years of the five-year BSEE program.\n- Examination (Sec. 19): the passing general weighted average is 70%, with no grade below 50% in any group of subjects.\n- The PEE is the highest class. The PEE alone may seal electrical plans.\nWatch out: The four years of practice for a PEE are counted from registration as an REE, not from graduation.\n\n## RA 7920: field of practice and personnel required\n- PEE (Sec. 31): sole authority to sign and seal electrical plans, and the right to practice electrical engineering in its full scope.\n- REE: may practice within the field the law lists, including supervising the operation and maintenance of plants. An REE cannot sign and seal plans.\n- RME: may install, wire and maintain electrical equipment. If the installation or machinery is rated above 500 kVA or above 600 V, the work must be under the supervision of a PEE or REE.\n- Personnel required (Sec. 33): every electric plant, industrial plant, commercial establishment, institutional building and other installation where persons and property are exposed to electrical hazards must keep at least the complement the law lists. For an electric plant of any size and voltage, that is one PEE or one REE. For capacities up to 500 kVA and voltages up to 600 V, one RME is enough.\n- Plans, designs, valuations and specifications for an installation must be prepared or supervised by, and signed and sealed by, a PEE.\n- Prohibited acts include practicing without a valid certificate and professional identification card, signing or sealing plans without being a licensed PEE, using another practitioner's certificate or seal, and giving false evidence to get registered.\nTip: Two numbers decide who may do the work: 500 kVA and 600 V.\n\n## RA 7920: seal, penalties and effectivity\n- The PEE seal bears the name of the registrant, the certificate number and the words \"Professional Electrical Engineer.\" It cannot be used after the license is delisted or has expired.\n- Penalty (Sec. 40): a violation is a misdemeanor, punished by a fine of not less than Php 10,000 and not more than Php 50,000, or imprisonment of not less than six months and not more than five years, or both, at the court's discretion.\n- Effectivity (Sec. 45): 30 days after full publication in the Official Gazette or a newspaper of general circulation.\n- Repealing clause (Sec. 43): RA 184 and conflicting laws and ordinances are repealed or amended.\n\n## EPIRA (RA 9136)\n- Approved on June 8, 2001. Policy (Sec. 2): ensure and accelerate total electrification, set transparent and reasonable prices in a competitive regime, promote indigenous and new and renewable energy, and set up an independent regulator.\n- The electric power industry is split into generation, transmission, distribution and supply. Every participant must unbundle its activities and rates (Sec. 36). Distribution utilities must show the rate components separately on the bill.\n- DOE (Sec. 37): supervises the restructuring of the industry, updates the Philippine Energy Plan every year and the Power Development Program.\n- TRANSCO (Sec. 8): takes over the transmission function of the National Power Corporation (NPC) and is wholly owned by PSALM. Its franchise or assets are to be sold or conceded through open bidding. The concession runs 25 years, renewable for up to another 25 years.\n- PSALM: owns and sells the assets of NPC and manages its debts. Before retail competition begins, at least 70% of the NPC generating capacity in Luzon and Visayas must be privatized.\n- WESM (Sec. 30): the DOE had to set up the wholesale electricity spot market within one year. A market operator runs it, at first under TRANSCO, then an independent entity.\n- Open access and retail competition (Sec. 31): to start not later than three years after the law took effect. The first contestable customers are those with a monthly average peak demand of at least 1 MW. Two years later the limit drops to 750 kW, and it keeps dropping toward household level.\n- Universal charge (Sec. 34): set by the ERC and paid by all electricity end-users. It covers the stranded debts and costs of NPC, missionary electrification and tax equalization, and an environmental charge of Php 0.0025 per kWh (one-fourth of a centavo).\n- Ownership limits: a participant, with its related group, cannot own more than 30% of the installed generating capacity of a grid (Sec. 45). Ownership of a distribution utility is limited to 25% of voting shares unless the shares are listed.\n- Lifeline rate: the ERC sets a subsidized rate for marginalized end-users (Sec. 43).\nWatch out: The ERC took over the work of the old Energy Regulatory Board. RA 7832 still says \"Energy Regulatory Board.\"\n\n## The Energy Regulatory Commission (EPIRA Sec. 38)\n- The ERC is an independent, quasi-judicial body. It is composed of a chairman and four members, all appointed by the President of the Philippines.\n- All members have a term of seven years. The first appointees had staggered terms: the chairman seven years, two members five years and two members three years. There is no reappointment, and no member may serve more than seven years. A member who fills a vacancy serves the rest of the predecessor's term.\n- A member must be a natural-born citizen and resident of the Philippines, at least 35 years old, of good moral character, and of recognized competence in energy, law, economics, finance, commerce or engineering, with at least three years of actual and distinguished experience.\n- The chairman must be a member of the Philippine Bar. At least one member must be a member of the Bar and one a certified public accountant, each with at least ten years of experience.\n- Functions (Sec. 43): promote competition, encourage market development and ensure customer choice. The list includes enforcing the rules, approving rates and wheeling charges, and setting the lifeline rate.\nTip: Board of Electrical Engineering: 3 members and 3 years. ERC: 5 members and 7 years.\n\n## Other power-sector laws\n- RA 7638, the Department of Energy Act of 1992, created the DOE to plan, coordinate and supervise energy programs.\n- RA 9511 granted National Grid Corporation of the Philippines (NGCP) the franchise to operate, maintain and develop the transmission system.\n- RA 7832, approved December 8, 1994, is the Anti-Electricity and Electric Transmission Lines/Materials Pilferage Act. It punishes illegal use of electricity (unauthorized taps, tampering with meters or equipment, and knowingly benefiting from them) and theft of transmission lines and materials.\n- Under RA 7832, signs such as a bored hole in the meter cover, foreign matter inside the meter, a jumper or a tampered seal are prima facie evidence of tampering when they are found and witnessed as the law requires. A utility may disconnect after written notice and may collect double the value of the electricity illegally used.\n- RA 9513, the Renewable Energy Act of 2008: the DOE is the lead agency, and the National Renewable Energy Board sets the renewable portfolio standard. Registered developers get a seven-year income tax holiday, duty-free importation of equipment and zero-rated VAT. The feed-in tariff gives priority connection and a fixed tariff for not less than twelve years. Net metering bills a user only for the net energy taken from the grid.\n- RA 11285, the Energy Efficiency and Conservation Act of 2019: the DOE leads and its Secretary chairs the inter-agency committee. Room air conditioners, refrigerators and television sets need a mandatory energy label. Designated establishments are Type 1 (annual use of 500,000 kWh up to 4,000,000 kWh) and Type 2 (above 4,000,000 kWh). Type 1 employs a Certified Energy Conservation Officer and Type 2 a Certified Energy Manager. An energy audit is due every three years, and the annual report is due to the DOE by April 15.\nWatch out: The penalty amounts of these laws are not listed here. Check the law's text for them.\n\n## CPD and renewing a license\n- RA 10912, the CPD Act of 2016, requires licensed professionals to earn credit units through CPD to renew the professional identification card. The CPD Council of the PRC accredits providers.\n- A PRC professional identification card is valid for three years. The PRC table lists the number of CPD credit units a profession needs per renewal. For most professions it is 15 units.\n- Professionals working abroad and newly licensed professionals (for their first renewal) were exempted during the transition. Senior citizens are not exempt.\nWatch out: Look up the number of units for electrical engineers in the PRC table of the year you are reading.\n\n## Code of Ethics for Electrical Engineers\n- The keystone of professional conduct is integrity. An engineer acts with absolute fidelity to clients and employers and with fairness to all, with public interest and welfare in mind.\n- Public safety: show due regard for the safety of life and health of workers and the public, and protect property.\n- Advertising: advertise work or merit in a simple manner and avoid anything that discredits the profession.\n- Clients and employers: be fair, impartial and reasonable; disclose any financial interest in equipment the work requires; do not accept pay for the same service from more than one interested party without the consent of all; keep client information confidential; do not hold an interest in the bid of a contractor on work you are engaged for without the client's consent.\n- Fellow engineers: give credit to whoever is due it; do not harm another engineer's reputation or practice; do not underbid after the results of a public bidding are announced.\n- A violation is unethical, unprofessional and dishonorable conduct and is subject to discipline by the Board of Electrical Engineering.\n\n## Numbers to memorize for the laws\n- RA 7920: approved February 24, 1995; repealed RA 184; Board of 3 (a chairman and two members); 3-year term and one reappointment; member at least 35 years old with 10 years of practice and 5 years of residence; PEE needs 4 years of practice as an REE; REE at least 21 years old; RME at least 18 years old; passing 70% with no grade below 50%; RME limit 500 kVA and 600 V; fine Php 10,000 to Php 50,000 or 6 months to 5 years in prison.\n- EPIRA: June 8, 2001; ERC has 5 members with 7-year terms and no reappointment; ERC members at least 35 years old; open access first at 1 MW, then 750 kW; TRANSCO concession 25 years plus up to 25 years; 70% of NPC capacity privatized before retail competition; ownership caps of 30% of grid capacity and 25% of a distribution utility; environmental charge Php 0.0025 per kWh.\n- RA 7832: December 8, 1994. RA 9513: December 16, 2008; income tax holiday 7 years; feed-in tariff at least 12 years. RA 11285: April 12, 2019; Type 1 from 500,000 kWh, Type 2 above 4,000,000 kWh; audit every 3 years.\n- RA 10912: license card valid for 3 years; 15 CPD units per renewal for most professions.\n\n@Section: Notes\n@Source: Claude summary from PEC study material (section numbers as the sources cite them; check your edition of the Philippine Electrical Code)\n@Subject: ESAS\n@Topic: PEC\n\n## The Philippine Electrical Code at a glance\n- The PEC Part 1 sets the minimum rules for safe electrical installations in buildings and similar premises. It is a safety code, not a design guide.\n- The chapters follow the order of the NEC: 1 General, 2 Wiring and Protection, 3 Wiring Methods and Materials, 4 Equipment for General Use, 5 Special Occupancies, 6 Special Equipment, 7 Special Conditions, 8 Communications Systems, 9 Tables.\n- Sections are numbered by chapter, article, part and rule. For example 2.10 is branch circuits, 2.20 is branch-circuit, feeder and service calculations, 2.30 is services, 2.40 is overcurrent protection, 2.50 is grounding, 3.10 is conductors for general wiring and 4.30 is motors.\n- PEC Part 1 is the main reference of the RME examination and is also tested in the electrical engineering professional subjects.\nWatch out: Section and table numbers change between editions. The numbers in these notes are the ones the study material cites, so check them against your own copy.\n\n## Branch circuits and loads in a dwelling\n- Unit lighting load (PEC Table 2.20.2.3), in VA per square meter of floor area: dwelling units 24, schools 24, stores 24, office buildings 28, hospitals 16.\n- Lighting load of a dwelling = floor area × 24 VA/m^{2}.\n- A dwelling needs at least two 20 A small-appliance circuits (1,500 VA each), one 20 A laundry circuit (1,500 VA) and one 20 A bathroom circuit. Lighting circuits are 15 A or 20 A.\n- Receptacle outlets count 180 VA for each single or multiple receptacle on one yoke.\n- Demand factors for the general lighting and small-appliance loads of a dwelling (PEC Table 2.20.3.3): the first 3,000 VA at 100%, 3,001 VA to 120,000 VA at 35%, and the part above 120,000 VA at 25%.\n- A household electric range of 12 kW or less has a feeder demand of 8 kW (Table 2.20.3.16).\n- A continuous load is one whose maximum current continues for three hours or more. A branch circuit must carry 125% of the continuous load plus 100% of the non-continuous load.\nTip: For a dwelling, find the total of lighting, small-appliance and laundry loads, apply the 100% / 35% / 25% steps, and only then add the range, motors and fixed appliances.\n\n## Overcurrent protection and small conductors\n- Standard ratings of overcurrent devices (PEC 2.40.1.6), in amperes: 15, 20, 25, 30, 35, 40, 45, 50, 60, 70, 80, 90, 100, 110, 125, 150, 175, 200, 225, 250, 300, 350, 400, 450, 500, 600, 700, 800, 1000, 1200, 1600, 2000, 2500, 3000, 4000, 5000 and 6000.\n- Small copper conductors (PEC 2.40.1.4(D)): 2.0 mm^{2} (14 AWG) is protected at 15 A at most, 3.5 mm^{2} (12 AWG) at 20 A and 5.5 mm^{2} (10 AWG) at 30 A. This holds even when the insulation allows a higher ampacity.\n- Next higher standard rating: when the ampacity of a conductor does not match a standard rating, and the device is 800 A or less, the next higher standard rating may be used. It cannot be used for a multi-outlet branch circuit. A 150 A breaker may protect a conductor with an ampacity of 142 A.\n- Standard breaker frame sizes: 15 A to 50 A trips fit a 50 AF frame, 60 A to 100 A a 100 AF frame, and 110 A to 175 A a 225 AF frame.\n- The interrupting rating (AIC) of a device must be equal to or higher than the maximum available fault current at its location. Common AIC ratings are 10, 14, 22, 42 and 65 kA.\n- Maximum number of overcurrent devices in a lighting and appliance panelboard: 42, not counting the main.\n\n## Ampacity, derating and voltage drop\n- Conductor insulation: TW is rated 60 °C for dry and wet locations, THW and THWN are rated 75 °C for dry and wet locations, and THHN is rated 90 °C for dry and damp locations.\n- Ampacities of copper conductors at 75 °C (three or fewer conductors in a raceway): 2.0 mm^{2} = 20 A, 3.5 mm^{2} = 25 A, 5.5 mm^{2} = 35 A, 8.0 mm^{2} = 50 A, 14 mm^{2} = 65 A, 22 mm^{2} = 85 A.\n- More than three current-carrying conductors in a raceway reduce the ampacity: 4 to 6 conductors × 0.80, 7 to 9 × 0.70, 10 to 20 × 0.50, 21 to 30 × 0.45, 31 to 40 × 0.40.\n- A neutral that carries only the unbalanced current is not counted. On circuits with non-linear loads the neutral is counted.\n- Allowable ampacity = table ampacity × temperature correction factor × adjustment factor for the number of conductors.\n- Voltage drop (a recommendation in the fine print note): 3% at most in a branch circuit, 3% at most in a feeder, and 5% at most from the service to the farthest outlet.\n- Service neutral: for the part of the unbalanced load above 200 A, the demand is 70% (neutral demand = 200 + 0.70 × (I - 200)). The reduction is not allowed on four-wire three-phase circuits that feed non-linear loads.\n\n## Raceways, conduit fill and supports\n- Maximum fill of a conduit or tubing (PEC Chapter 9, Table 1): 53% of the area for one conductor, 31% for two conductors, 40% for more than two conductors. The grounding conductors and neutrals count.\n- EMT is secured
