h. Each direction cosine is the component divided by the length.\n3. The direction angles are cos⁻¹ of the direction cosines (Deg mode).\nExample: the vector (2, -3, 6) has length Abs = 7. The direction cosines are 2/7 = 0.2857, -3/7 = -0.4286 and 6/7 = 0.8571. The angles are 73.40°, 115.38° and 31.00°.\nCheck: the squares of the three cosines add up to 1.\nFor the angle between two vectors, use cos⁻¹ of the dot product divided by the product of the lengths. The calculator manual also shows this with the dot function.\n\n## Plane through three points and distance from a point to a plane (VCTR)\n1. Find two vectors in the plane: PQ = Q - P and PR = R - P.\n2. In VCTR take the cross product PQ × PR. This is a normal vector (A, B, C) of the plane.\n3. The plane is Ax + By + Cz = A x₀ + B y₀ + C z₀, using any one of the points.\n4. The distance from a point (x₁, y₁, z₁) is |Ax₁ + By₁ + Cz₁ + D|/√(A² + B² + C²), with D = -(A x₀ + B y₀ + C z₀).\nExample: P(1, 0, 0), Q(0, 2, 0) and R(0, 0, 3). PQ = (-1, 2, 0) and PR = (-1, 0, 3). The cross product is (6, 3, 2), so the plane is 6x + 3y + 2z = 6.\nDistance from (1, 1, 1): Abs(6 + 3 + 2 - 6)/√(6^2 + 3^2 + 2^2) = 5/7 = 0.7143.\nTip: the area of triangle PQR is half the length of the cross product. Abs of the cross product here is 7, so the area is 3.5.\n\n## Cylindrical and spherical coordinates with Pol( and Rec(\nCylindrical (r, θ, z): r and θ come from the x and y of the point, and z stays the same. Spherical (ρ, θ, φ): ρ is the distance from the origin.\n1. Set Deg. Type Pol(x, y). The first result r (stored in X) and the angle θ (stored in Y) are the cylindrical values.\n2. Type Pol(X, z). The first result is ρ and the second is the angle above the xy-plane. The angle from the z axis is 90° minus that.\n3. To go back, use Rec( twice: Rec(ρ, angle above the xy-plane) gives the horizontal radius and z.\nExample: the point (2, 3, 6). Pol(2, 3) gives r = 3.6056 and θ = 56.3099°. Pol(X, 6) then gives ρ = 7 and an angle above the xy-plane of 58.9973°. The angle from the z axis is 31.0027°.\nWatch out: textbooks differ on which angle is called φ. Check your reviewer's definition.\n\n@Subject: Math\n@Topic: Differential Calculus\n\n## Maximum and minimum: critical points with EQN and a check\n1. Write the quantity to optimize as a function of one variable and find f'(x) by hand.\n2. Solve f'(x) = 0 with EQN (for a polynomial) or SOLVE.\n3. Test each root with the second derivative: use the derivative function on f'(X) at that point. A negative f'' means a maximum and a positive f'' a minimum.\n4. Press `CALC` to get the value of f at the best point.\nExample: the open box V = x(12 - 2x)² = 4x³ - 48x² + 144x. V' = 12x² - 96x + 144. In EQN (Quad) enter 12, -96, 144 to get x = 2 and x = 6. The second derivative at 2 is d/dx(12X^2 - 96X + 144, 2) = -48, negative, so x = 2 is the maximum. V(2) = 2(12 - 4)² = 128. x = 6 gives a volume of 0.\nWatch out: x = 6 is a root of V' but gives zero volume, a minimum. Always check the roots against the problem limits.\n\n## Tangent and normal lines (derivative at a point)\n1. Type the derivative function d/dx(f(X), a) and press `=` for the slope m of the tangent at x = a.\n2. Use CALC (or type f(a)) for y at that point.\n3. Tangent: y - y₀ = m(x - x₀). Normal: slope -1/m.\nExample: y = x³ - 2x at x = 1.5. d/dx(X^3 - 2X, 1.5) = 4.7500. y₀ = 1.5³ - 2(1.5) = 0.3750. The tangent is y - 0.375 = 4.75(x - 1.5). The normal slope is -1/4.75 = -0.2105.\nTip: the tangent is horizontal where the slope is 0. The angle the tangent makes with the x-axis is tan⁻¹(m).\n\n## Curvature and the second derivative\nCurvature κ = |y''|/(1 + y'²)^(3/2). The radius of curvature is R = 1/κ.\n1. Find y' by hand and type it as a function of X.\n2. The second derivative is the derivative of that: d/dx(y'(X), a).\n3. Put y' and y'' into the curvature formula.\nExample: y = x³ at x = 1. y' = 3x² gives 3 at x = 1. y'' = d/dx(3X^2, 1) = 6. κ = 6/(1 + 3^2)^(3/2) = 0.18974. R = 5.2705.\nWatch out: the calculator manual does not allow a derivative inside a derivative, so type y' by hand first.\n\n## Estimate a limit with CALC\n1. Type the function in X (with brackets round the top and the bottom).\n2. Press `CALC` and enter a value very close to the limit point from the left, then from the right.\n3. If both sides settle on the same number, that is the limit.\nExample: the limit of (x² - 4)/(x - 2) as x goes to 2. CALC at 1.999 gives 3.9990 and at 2.001 gives 4.0010. The limit is 4.\nExample: the limit of sin(x)/x as x goes to 0, in Rad mode. CALC at 0.001 gives 0.99999983. The limit is 1.\nWatch out: do not enter the limit point itself if it makes the bottom 0. Use values on both sides.\n\n@Subject: Math\n@Topic: Integral Calculus\n\n## Area between two curves (∫)\n1. Find where the curves meet (SOLVE or EQN). These are the limits a and b.\n2. Type ∫(upper - lower, a, b).\nExample: y = 2x and y = x². They meet at x = 0 and x = 2. The area is ∫(2X - X^2, 0, 2) = 1.3333333.\nExample: the area under y = sin x from 0 to π, in Rad mode: ∫(sin(X), 0, π) = 2.\nWatch out: if the curves cross inside the interval, split it and add the absolute values.\n\n## Volume of revolution: disks, washers and shells (∫)\nDisk about the x-axis: π ∫ y² dx. Washer: π ∫ (R² - r²) dx. Shell about the y-axis: 2π ∫ x y dx.\nExample: the region under y = x² from 0 to 2 revolved about the x-axis. Type π × ∫(X^4, 0, 2) = 20.10619.\nExample: the region between y = 2x and y = x² revolved about the y-axis (shells). Type 2π × ∫(X(2X - X^2), 0, 2) = 8.37758.\nExample: the same region about the x-axis (washers). Type π × ∫((2X)^2 - (X^2)^2, 0, 2) = 13.40413.\nTip: type π once outside the integral.\n\n## Centroid and moment of inertia of an area (∫)\nx̄ = ∫ x y dx / A, ȳ = (1/2) ∫ y² dx / A, and the moment of inertia about the y-axis is I_y = ∫ x² y dx.\n1. Find the area A = ∫(y, a, b) and keep it.\n2. Type each integral and divide.\nExample: y = x² from 0 to 2. A = ∫(X^2, 0, 2) = 2.66667. x̄ = ∫(X×X^2, 0, 2)/A = 1.5000. ȳ = (1/2)∫((X^2)^2, 0, 2)/A = 1.2000. I_y = ∫(X^2×X^2, 0, 2) = 6.4000.\nTip: store A in a variable so you do not retype it.\n\n## Arc length and surface of revolution (∫)\nArc length: ∫ √(1 + (y')²) dx. Surface about the x-axis: 2π ∫ y √(1 + (y')²) dx.\n1. Find y' by hand.\n2. Type it inside the integral.\nExample: y = x²/2 from 0 to 2, so y' = x. ∫(√(1 + X^2), 0, 2) = 2.957886.\nExample: the line y = x from 0 to 2 turned about the x-axis. 2π × ∫(X√(1 + 1), 0, 2) = 17.7715. Check with the cone formula π r ℓ = π(2)(2√2) = 17.7715.\nWatch out: type y' as an ordinary expression inside the integral. Do not put the derivative function inside it.\n\n## Average value and work done by a variable force (∫)\nAverage value of f on [a, b] = (1/(b - a)) ∫ f dx. Work = ∫ F dx.\nExample: the average value of x² on [0, 3] is ∫(X^2, 0, 3)/3 = 3.\nExample: a force F = 10 + 4x newtons moves a body from x = 0 to x = 5 m. Work = ∫(10 + 4X, 0, 5) = 100 J.\nExample: a spring with k = 200 N/m stretched 0.3 m: ∫(200X, 0, 0.3) = 9.0 J.\n\n@Subject: Math\n@Topic: Differential Equations\n\n## Second-order equations: roots of the characteristic equation (EQN)\nFor a y'' + b y' + c y = 0 the characteristic equation is a r² + b r + c = 0.\n1. Open EQN, choose Quad and enter a, b and c.\n2. Real roots r₁ and r₂: y = C₁e^(r₁x) + C₂e^(r₂x). A repeated root r: y = (C₁ + C₂x)e^(rx). Complex roots α ± βi: y = e^(αx)(C₁cos βx + C₂ sin βx).\nExample: y'' - 5y' + 6y = 0. Enter 1, -5, 6. The roots are 2 and 3, so y = C₁e^(2x) + C₂e^(3x).\nExample: y'' + 4y' + 13y = 0. Enter 1, 4, 13. The roots are -2 + 3i and -2 - 3i, so y = e^(-2x)(C₁cos 3x + C₂ sin 3x).\nExample: y'' + 6y' + 9y = 0 has the repeated root -3, so y = (C₁ + C₂x)e^(-3x).\nTip: for third-order equations use the Cubic choice.\n\n## Growth, decay and cooling (SOLVE)\nGrowth and decay: N = N₀ e^(kt). Newton's law of cooling: T = T_s + (T₀ - T_s)e^(-kt).\n1. Use the two known readings to find k (put k as X in SOLVE).\n2. Put k back and solve for the time or the temperature.\nExample: coffee at 90 °C in a 20 °C room cools to 70 °C in 10 minutes. 20 + 70e^(-10X) = 70 gives X = 0.033647 per minute.\nThen the time to reach 40 °C: 20 + 70e^(-0.033647X) = 40 gives X = 37.23 minutes.\nExample: a population doubles in 5 years. e^(5X) = 2 gives X = k = 0.138629. It triples in 7.925 years.\nTip: use CALC to check the temperature after any time.\n\n@Subject: Math\n@Topic: Advanced Mathematics\n\n## Powers and roots of complex numbers (De Moivre, CPLX)\n1. Open CPLX. Enter the number in polar form r∠θ (Deg mode), or in a + bi.\n2. A power: put brackets round the number and use ^. A root: raise it to the power 1/n.\n3. The calculator gives one root, normally the principal one. For the other n - 1 roots, add 360°/n to the angle again and again.\nExample: (1 + i)^8 = 16.\nExample: the cube roots of 8∠90°. (8∠90)^(1/3) = 2∠30° = 1.7321 + 1i. The others are 2∠150° and 2∠270°.\nExample: (2∠20°)^5 = 32∠100°.\nWatch out: use brackets round a polar number before a power or the angle is raised too. Switch back to COMP when you finish.\n\n## Eigenvalues of a 2 × 2 or 3 × 3 matrix (MATX and EQN)\nEigenvalues are the roots of det(A - λI) = 0.\n2 × 2: λ² - (trace)λ + det = 0. Take the determinant from MATX with Det(MatA), the trace by adding the diagonal, then solve with EQN (Quad).\n3 × 3: λ³ - (trace)λ² + (sum of the three 2 × 2 principal minors)λ - det = 0. Solve with EQN (Cubic).\nExample: A = [[4, 1], [2, 3]]. Trace 7 and det 10, so enter 1, -7, 10: λ = 5 and 2.\nExample: A = [[2, 0, 0], [0, 3, 4], [0, 4, 9]]. Trace 14, minors 6 + 18 + 11 = 35, det 22. Enter 1, -14, 35, -22: λ = 1, 2 and 11.\nCheck: the eigenvalues add up to the trace and multiply to the determinant.\n\n## Fourier coefficients with ∫ (Rad)\nFor a function of period 2π: a_n = (1/π)∫ f(x) cos(nx) dx and b_n = (1/π)∫ f(x) sin(nx) dx over one period.\n1. Set the angle unit to Rad.\n2. Type the integral with a fixed n, divide by π, and press `=`. Replay the line with a new n.\nExample: f(x) = x on -π to π. b₁ = ∫(X sin(X), -π, π)/π = 2.000000. b₂ = ∫(X sin(2X), -π, π)/π = -1.000000. b₃ = 0.666667. These match 2(-1)^(n+1)/n.\nThe a_n are all 0 because x is an odd function.\nTip: an even function has only cosine terms, an odd function only sine terms.\n\n## Maclaurin series partial sums with Σ\nAdd the first terms of a series with Σ and compare with the exact value.\nExample: e = Σ(1/X!, 0, 8) = 2.71827877. The exact e is 2.71828183.\nExample: sin(0.5) in Rad mode = Σ((-1)^X × 0.5^(2X + 1)/(2X + 1)!, 0, 4) = 0.479425539. The exact value is 0.479425539.\nTip: raise the last value until the sum stops changing. If the calculator reports an error with the factorial inside Σ, add the terms one by one with the answer memory.\n\n@Subject: Math\n@Topic: Numerical Solutions\n\n## Newton-Raphson iteration with the answer memory\nx_(n+1) = x_n - f(x_n)/f'(x_n).\n1. Type the starting value x₀ and press `=`.\n2. Type the iteration formula using `Ans` for x_n and press `=`. Each further `=` (or replay) gives the next iterate.\nExample: f(x) = x³ - x - 2 with x₀ = 1.5. Type 1.5, press `=`, then type Ans - (Ans^3 - Ans - 2)/(3Ans^2 - 1). The results are 1.52173913, 1.52137981, 1.52137971. The root is 1.521380.\nTip: stop when two iterates agree to the required number of places. Check with SOLVE using the same x₀.\n\n## Bisection method with CALC\n1. Type f(X) with CALC and check that f(a) and f(b) have opposite signs.\n2. Find the midpoint m = (a + b)/2 and press `CALC` with m.\n3. Keep the half whose ends still have opposite signs and repeat.\nExample: f(x) = x³ - x - 2 on [1, 2]. f(1) = -2 and f(2) = 4.\nStep 1: m = 1.5000, f = -0.1250. Root in [1.5000, 2.0000].\nStep 2: m = 1.7500, f = 1.6094. Root in [1.5000, 1.7500].\nStep 3: m = 1.62500, f = 0.66602. Root in [1.50000, 1.62500].\nStep 4: m = 1.562500, f = 0.252197. Root in [1.500000, 1.562500].\nThe error after n steps is at most (b - a)/2^n.\n\n## Secant and false position with CALC\nSecant: x₂ = x₁ - f(x₁)(x₁ - x₀)/(f(x₁) - f(x₀)). False position uses the same formula but keeps the two points on opposite sides of the root.\n1. Use `CALC` to get f at the two starting points.\n2. Type the formula with those numbers and press `=`.\nExample: f(x) = x³ - x - 2, x₀ = 1, x₁ = 2. f(1) = -2 and f(2) = 4. Secant: x₂ = 1.333333, then x₃ = 1.462687.\nFalse position on [1, 2] gives 1.333333, then 1.462687, then 1.504019.\nTip: both approach the root 1.521380. Secant is faster but can wander. False position is steadier.\n\n## Trapezoidal and Simpson's rules with Σ\nWith n equal intervals of width h = (b - a)/n:\nTrapezoidal: h[(f₀ + f_n)/2 + Σ f_k] for k = 1 to n - 1.\nSimpson's 1/3 (n even): (h/3)[f₀ + f_n + Σ (3 - (-1)^k) f_k] for k = 1 to n - 1. The weight 3 - (-1)^k is 4 for odd k and 2 for even k.\n1. Set the angle unit if the function has trigonometry (Rad here).\n2. Type h, the end values, and the Σ with f(a + kh) using X for k.\nExample: the integral of sin x from 0 to π with n = 4 (h = π/4).\nTrapezoidal: (π/4)((sin(0) + sin(π))/2 + Σ(sin(X π/4), 1, 3)) = 1.896119.\nSimpson: (π/12)(sin(0) + sin(π) + Σ((3 - (-1)^X) sin(X π/4), 1, 3)) = 2.004560.\nThe exact value, from ∫(sin(X), 0, π), is 2. Simpson is closer for the same number of steps.\n\n## Euler's method with CALC\ny_(n+1) = y_n + h f(x_n, y_n).\n1. Type f(x, y) using the letters X and Y, for example X + Y.\n2. For each step, press `CALC`, enter x_n and y_n, and read f.\n3. Work out y_(n+1) = y_n + h × f, and the next x is x_n + h.\nExample: y' = x + y, y(0) = 1, h = 0.1.\nStep 1: f(0, 1) = 1, so y₁ = 1 + 0.1(1) = 1.1000.\nStep 2: f(0.1, 1.1) = 1.2, so y₂ = 1.2200.\nStep 3: f(0.2, 1.22) = 1.42, so y₃ = 1.3620.\nThe exact solution y = 2e^x - x - 1 gives y(0.3) = 1.39972. Euler is 0.03772 below it. A smaller h reduces the error.\n\n@Subject: Math\n@Topic: Statistics and Probability\n\n## Binomial probability with nCr and Σ\nP(x) = nCx × p^x × q^(n - x), where q = 1 - p. The mean is np and the variance is npq.\n1. Type n, the nCr function, x, then × p^x × q^(n - x).\n2. For \"at most k\", use Σ with X as the number of successes.\nExample: n = 10, p = 0.3. P(3) = 10 nCr 3 × 0.3^3 × 0.7^7 = 0.266828.\nP(at most 3) = Σ(10 nCr X × 0.3^X × 0.7^(10 - X), 0, 3) = 0.649611. P(at least 4) = 1 - that = 0.350389.\nMean = 3 and variance = 2.10.\nTip: if the calculator does not accept nCr inside Σ, add P(0) to P(3) one by one with the answer memory.\n\n## Poisson probability\nP(x) = e^(-λ) λ^x / x!. The mean and the variance are both λ.\n1. Type e^(-λ) × λ^x/x! with the numbers (use the e^x function and the factorial function).\n2. For \"at most k\", add with Σ.\nExample: λ = 2. P(3) = e^(-2) × 2^3/3! = 0.180447. P(at most 3) = Σ(e^(-2) × 2^X/X!, 0, 3) = 0.857123.\nP(at least one) = 1 - e^(-2) = 0.864665.\n\n## Grouped data: mean and standard deviation with FREQ\n1. In the Set-up menu, turn the STAT frequency column on (FREQ ON).\n2. Press `Apps`, choose STAT and type 1 (SD).\n3. Enter the class marks (midpoints) in the X column and the class frequencies in the FREQ column.\n4. Use S-VAR for the mean and the standard deviations, and S-SUM for n.\nExample: class marks 5, 15, 25, 35 with frequencies 4, 10, 12, 4. n = 30. Mean = 20.3333. The population standard deviation σ = 8.8443. The sample standard deviation s = 8.9955.\nWatch out: the class mark is (lower limit + upper limit)/2. With frequencies on, you can enter only 40 lines for one-variable data. Turn FREQ off again when you do not need it.\n\n## Counting and probability with nPr and nCr\nPermutations (order matters): nPr. Combinations (order does not matter): nCr. Probability = favorable ways/total ways.\nExample: a committee of 5 is chosen from 6 men and 5 women. P(exactly 2 men and 3 women) = (6 nCr 2 × 5 nCr 3)/(11 nCr 5) = 0.324675.\nExample: arrangements of the letters of ARRANGE (7 letters, A twice, R twice): 7!/(2! × 2!) = 1260.\nExample: seating 6 people at a round table: (6 - 1)! = 120.\nWatch out: \"at least one\" is easier as 1 minus the probability of none.\n\n@Section: Calculator\n@Source: Canon F-789SGA\n\n@Subject: ESAS\n@Topic: Engineering Economics\n\n## Loan payment, number of payments and rate (SOLVE)\nPayment A on a loan P at rate i per period for n periods: A = P i/(1 - (1 + i)^(-n)).\n1. Type the payment formula with your numbers and press `=`.\n2. For n or i, type A(1 - (1 + i)^(-n))/i = P with X in place of the unknown, then use SOLVE.\nExample: Php 500,000 at 12% compounded monthly for 5 years (i = 0.01, n = 60). A = 500000 × 0.01/(1 - 1.01^(-60)) = Php 11,122.22.\nNumber of payments for that payment: type 11122.22(1 - 1.01^(-X))/0.01 = 500000 and SOLVE gives X = 60.00.\nRate for that payment (starting value 0.01): 11122.22(1 - (1 + X)^(-60))/X = 500000 gives X = 0.01000 per month, which is 12.00% a year nominal.\nWatch out: use the same period for the rate and for n. For monthly payments use the monthly rate.\n\n## Effective rate and equivalent nominal rate (SOLVE)\nEffective rate: i_eff = (1 + r/m)^m - 1. Equivalent nominal rate: r = m((1 + i_eff)^(1/m) - 1). Continuous equivalent: r = ln(1 + i_eff).\nExample: 12% compounded monthly. (1 + 0.12/12)^12 - 1 = 12.6825%.\nExample: the nominal rate compounded quarterly that equals 15% effective. 4((1.15)^(1/4) - 1) = 14.2232%. In SOLVE: (1 + X/4)^4 - 1 = 0.15 gives X = 0.142232.\nExample: the continuous rate equal to 15% effective: ln(1.15) = 13.9762%.\nTip: to compare two rates, convert both to effective rates first.\n\n## Depreciation schedule with TABLE (book value by year)\nTABLE shows one function f(X) and up to 30 rows, so it gives the book value for every year at once.\n1. Press `Apps` and choose TABLE.\n2. Type f(X) as the book value after X years.\n3. Set Start 0, End = the life, Step 1, then press `=`.\nExample: straight line with FC = 500,000, SV = 50,000, n = 10. f(X) = 500000 - 45000X. The table runs from 500,000 at X = 0 down to 50,000 at X = 10.\nExample: declining balance with FC = 500,000, SV = 50,000, n = 5. First find k = 1 - (50000/500000)^(1/5) = 0.36904. Then f(X) = 500000(1 - 0.36904)^X gives 500,000; 315,478.67; 199,053.59; 125,594.32; 79,244.66; 50,000.00.\nTip: the depreciation in a year is the difference between two rows. To try new numbers, change the function and run the table again.\n\n## Sum of the years digits (SYD) with Σ\nd_m = (FC - SV)(n - m + 1)/(n(n + 1)/2). Use Σ for the total depreciation to year m.\n1. Work out FC - SV and the sum of the digits n(n + 1)/2.\n2. Type Σ((FC - SV)(n + 1 - X)/sum, 1, m).\n3. The book value is FC minus that total.\nExample: FC = 500,000, SV = 50,000, n = 5 (sum 15). Σ(450000(6 - X)/15, 1, 3) = 360,000. The book value after 3 years is 500000 - 360,000 = 140,000.\nThe depreciation in year 3 alone is 450000(6 - 3)/15 = 90,000.\n\n## Bond price and yield (SOLVE)\nPrice = C(1 - (1 + i)^(-n))/i + F(1 + i)^(-n), where C is the coupon each period, F is the redemption value and i is the yield per period.\n1. For the price, type the formula with the yield i.\n2. For the yield, put the price on the right and use X for i in SOLVE.\nExample: a Php 100,000 bond with a 10% bond rate paid semiannually, redeemed at par in 5 years. C = 5,000 and n = 10. At 6% per half year: 5000(1 - 1.06^(-10))/0.06 + 100000(1.06)^(-10) = Php 92,639.91.\nNow find the yield from the price. 5000(1 - (1 + X)^(-10))/X + 100000(1 + X)^(-10) = 92639.91 (starting value 0.05) gives X = 0.06000, which is 12% nominal, compounded semiannually.\nWatch out: a bond bought below its face value yields more than its bond rate.\n\n## Break-even and equal-cost points\nPut total cost (or revenue) for each case in terms of X and set them equal.\n1. Type the difference of the two costs with X, with no equals sign. The calculator treats an expression without = as equal to 0.\n2. Start SOLVE.\nExample: two machines. Machine A costs 200,000 + 15X and machine B costs 120,000 + 25X for X units. Type 200000 + 15X - (120000 + 25X), and SOLVE gives X = 8000 units. Above 8000 units A is cheaper.\nExample: break-even of one product. Revenue 100X, fixed cost 600,000, variable cost 40X. 100X - (600000 + 40X) gives X = 10000 units.\nTip: for a straight-line problem you can also solve by hand: 80000 = 10X.\n\n@Subject: ESAS\n@Topic: Project Management\n\n## PERT: expected time, variance and probability of finishing on time\nExpected time t_e = (o + 4m + p)/6 and variance ((p - o)/6)². Add the t_e and the variances of the activities on the critical path. Then z = (T - T_E)/σ and the probability is P(z).\n1. In STAT (type 1, SD) you can enter the t_e values and read the sum from S-SUM, or just add them.\n2. Type σ = √(sum of variances).\n3. Type z = (T - T_E)/σ, then use Distr: P( for the area to the left of z.\nExample: critical path activities (o, m, p) = (2, 4, 6), (3, 5, 13), (4, 6, 8).\nt_e = 4.0000, 6.0000, 6.0000, so T_E = 16.0000 days.\nVariances: 0.4444, 2.7778, 0.4444. The sum is 3.6667, so σ = 1.9149.\nProbability of finishing in 18 days: z = (18 - 16)/1.9149 = 1.0445, and P(z) = 0.8519.\nProbability of finishing in 14 days: z = -1.0445, and P(z) = 0.1481.\n\n## Crashing: cost slope and the cheapest way to shorten the project\nCost slope = (crash cost - normal cost)/(normal time - crash time). Crash the critical activity with the lowest cost slope first.\n1. Compute the slope of each critical activity.\n2. Crash the cheapest by one day at a time. After each day, check whether another path has become critical.\nExample: activity A: normal 10 days, Php 40,000; crash 7 days, Php 55,000. Slope = (55000 - 40000)/(10 - 7) = Php 5,000 per day.\nActivity B: normal 8 days, Php 24,000; crash 6 days, Php 31,000. Slope = (31000 - 24000)/(8 - 6) = Php 3,500 per day.\nB has the lower slope, so crash B first. It can be crashed by 2 days at most: 2 × 3,500 = Php 7,000.\nSuppose both are on the critical path and the project must be 3 days shorter. Crash B by 2 days, then A by 1 day at Php 5,000. The extra cost is 7,000 + 5,000 = Php 12,000.\nWatch out: you can crash an activity only down to its crash time.\n\n## Earned value indices\nCPI = EV/AC, SPI = EV/PV, CV = EV - AC, SV = EV - PV, EAC = BAC/CPI, ETC = EAC - AC, VAC = BAC - EAC, TCPI = (BAC - EV)/(BAC - AC).\n1. Type each formula with your numbers.\n2. A CPI or SPI above 1 is good. A CV or SV above 0 is good.\nExample: BAC = 500,000, PV = 220,000, EV = 200,000, AC = 250,000.\nCPI = 0.8000, SPI = 0.9091, CV = -50,000, SV = -20,000.\nEAC = 500000/0.8 = 625,000, ETC = 375,000, VAC = -125,000.\nTCPI = (500000 - 200000)/(500000 - 250000) = 1.2000.\nTip: EAC = BAC/CPI assumes the present cost performance continues.\n\n@Subject: ESAS\n@Topic: Mechanics\n\n## Equilibrium of concurrent forces (EQN)\nWrite ΣF_x = 0 and ΣF_y = 0, then solve the two unknown forces with EQN (2 unknowns). You can type cos(30), sin(60) and so on as the coefficients, with the angle unit on Deg.\n1. Open EQN, choose 2 unknowns.\n2. Row 1 is the x equation (a₁, b₁, c₁). Row 2 is the y equation.\nExample: a weight of 500 N hangs from two cables, T₁ at 30° and T₂ at 60° above the horizontal on opposite sides. ΣF_x: T₁ cos30 - T₂ cos60 = 0. ΣF_y: T₁ sin30 + T₂ sin60 = 500. Enter cos(30), -cos(60), 0 then sin(30), sin(60), 500. T₁ = 250.0 N and T₂ = 433.0127 N.\nTip: if the calculator does not accept an expression in a cell, work out each coefficient first and type the number. For three forces in space use EQN with 3 unknowns and the x, y and z components.\n\n## Friction on an inclined plane\nA block on an incline of angle θ with friction coefficient μ: the block is about to slide when tan θ = μ.\nForce parallel to the incline to start it moving up: P = W(sin θ + μ cos θ). Force to hold it from sliding down: P = W(sin θ - μ cos θ).\n1. Set Deg. Type the formula with your numbers.\n2. The angle of friction is tan⁻¹(μ).\nExample: W = 1000 N, θ = 25°, μ = 0.3. P (up) = 1000(sin(25) + 0.3cos(25)) = 694.51 N. P (hold) = 1000(sin(25) - 0.3cos(25)) = 150.73 N.\nThe block starts to slide by itself at θ = tan⁻¹(0.3) = 16.70°. Since 25° is above that, it needs a holding force.\nWatch out: if sin θ - μ cos θ is negative, the block stays put without a force.\n\n## Centroid of a composite area\nx̄ = Σ(A x)/ΣA and ȳ = Σ(A y)/ΣA, where each piece has its own area and centroid.\n1. List each piece with its area A, x and y.\n2. Type each sum of products and divide by the total area.\nExample: a rectangle 8 × 4 (A = 32, centroid at x = 4, y = 2) and a triangle (A = 9, centroid at x = 10, y = 1).\nx̄ = (32×4 + 9×10)/(32 + 9) = 5.3171.\nȳ = (32×2 + 9×1)/(32 + 9) = 1.7805.\nTip: a hole counts as a negative area. For a parallel-load resultant, the line of action uses the same formula with forces in place of areas.\n\n@Subject: ESAS\n@Topic: Communications\n\n## Decibels, gain and loss\nPower: dB = 10 log(P₂/P₁). Voltage or current (same resistance): dB = 20 log(V₂/V₁). dBm = 10 log(P/1 mW).\n1. For a ratio to dB, type 10 log(ratio).\n2. For dB to a ratio, type 10^(dB/10) for power or 10^(dB/20) for voltage.\n3. For a chain, add the dB gains and subtract the losses.\nExample: 100 W in and 1 W out is 10 log(1/100) = -20 dB.\nExample: a voltage ratio of 10 is 20 log(10) = 20 dB.\nExample: 2 W is 10 log(2/0.001) = 33.01 dBm.\nExample: an amplifier of +20 dB, a cable of -3 dB and a second stage of +12 dB gives 29 dB. As a power ratio that is 10^(29/10) = 794.3.\nWatch out: a loss is a negative dB. Along a chain you add the dB values or multiply the ratios, never add the ratios.\n\n## AM and FM calculations\nAM: m = V_m/V_c or m = (V_max - V_min)/(V_max + V_min). P_t = P_c(1 + m²/2) and each sideband has P_c m²/4. Bandwidth = 2 f_m.\nFM: m_f = Δf/f_m and Carson's rule BW = 2(Δf + f_m).\nExample: P_c = 100 W and m = 0.8. P_t = 100(1 + 0.8^2/2) = 132.0 W. Each sideband = 100 × 0.8^2/4 = 16.0 W.\nExample: an AM envelope has V_max = 12 V and V_min = 4 V. m = (12 - 4)/(12 + 4) = 0.50.\nExample: FM with a deviation of 75 kHz and a message of 15 kHz. m_f = 75/15 = 5 and BW = 2(75 + 15) = 180 kHz.\nTip: to find m from a power ratio, put P_t/P_c = 1 + m²/2 into SOLVE.\n\n## Noise voltage, noise figure and cascaded stages\nThermal noise voltage V_n = √(4kTBR), with k = 1.38 × 10^{-23} J/K (look for it in the calculator's list of constants), T in kelvin, B in hertz and R in ohms. Noise factor F = (S/N input)/(S/N output) and NF = 10 log(F).\nCascade (Friis): F = F₁ + (F₂ - 1)/G₁ + (F₃ - 1)/(G₁G₂) + ...\n1. Convert the noise figures and gains from dB to ratios with 10^(dB/10).\n2. Type the Friis formula.\n3. Convert back with 10 log(F).\nExample: T = 290 K, B = 1 MHz and R = 50 Ω. V_n = √(4 × 1.38×10^(-23) × 290 × 10^6 × 50) = 0.895 µV.\nExample: a low-noise amplifier with NF = 2 dB and gain 20 dB, then a stage with NF = 10 dB. F₁ = 1.5849, F₂ = 10, G₁ = 100. F = 1.5849 + (10 - 1)/100 = 1.6749, so NF = 10 log(1.6749) = 2.240 dB.\nThe first stage matters most, because the later stages are divided by its gain.\n\n@Subject: ESAS\n@Topic: Mechanics 2\n\n## Collisions: two unknown velocities (EQN)\nTwo equations: momentum m₁v₁ + m₂v₂ = m₁v₁' + m₂v₂' and restitution e = (v₂' - v₁')/(v₁ - v₂).\n1. Write them as m₁v₁' + m₂v₂' = (total momentum) and -v₁' + v₂' = e(v₁ - v₂).\n2. Open EQN with 2 unknowns and enter the rows.\nExample: m₁ = 4 kg at 6 m/s hits m₂ = 2 kg at rest, with e = 0.5. Enter 4, 2, 24 then -1, 1, 3. The answers are v₁' = 3.0000 m/s and v₂' = 6.0000 m/s.\nFor a perfectly plastic collision (e = 0) both move together with the speed 24/6 = 4.0 m/s.\nWatch out: keep the signs of the velocities. Take one direction as positive.\n\n## Circular motion and banked curves (SOLVE)\nBanked curve with no friction: tan θ = v²/(g r). Flat curve with friction: v_max = √(μ g r). Centripetal force F = m v²/r.\n1. Set Deg. Type the angle formula with tan⁻¹, or put the equation in SOLVE.\n2. Check the units: speed in m/s, radius in m.\nExample: v = 20 m/s and r = 100 m. θ = tan⁻¹(20^2/(9.81 × 100)) = 22.183°.\nExample: the speed for a curve banked at 15° with r = 50 m. Type X^2/(9.81 × 50) = tan(15) in SOLVE with a starting value of 10 (X = 11.464 m/s), or directly √(9.81 × 50 × tan(15)).\nExample: the greatest speed on a flat curve with μ = 0.4 and r = 60 m: √(0.4 × 9.81 × 60) = 15.344 m/s.\nTip: convert km/h to m/s by dividing by 3.6.\n\n## Work and energy with SOLVE\nWork-energy: (1/2) m v² = m g s (sin θ - μ cos θ) for a block starting from rest and sliding a distance s down an incline.\n1. Set Deg. Put the unknown speed as X.\n2. Type the equation with X on the left and the work on the right.\nExample: 5 kg slides 4 m down a 30° incline with μ = 0.2. 0.5 × 5 × X^2 = 5 × 9.81 × 4(sin(30) - 0.2cos(30)) gives X = 5.0643 m/s.\nExample: the starting speed of a 1000 kg car that is stopped over 40 m by a friction force of 5000 N: 0.5 × 1000 × X^2 = 5000 × 40 gives X = 20.000 m/s.\nTip: power = force × speed. A car driven by a force of 2000 N at 15 m/s delivers 30 kW.\n\n@Subject: ESAS\n@Topic: Physics 1\n\n## Pendulum and spring period (SOLVE)\nPendulum T = 2π√(L/g). Spring T = 2π√(m/k).\n1. Type the formula with X for the unknown and the period on the right.\nExample: the length of a pendulum with a period of 2 s. 2π√(X/9.81) = 2 gives X = 0.9940 m.\nExample: a 0.5 kg mass on a spring with k = 200 N/m has T = 2π√(0.5/200) = 0.3142 s. Its frequency is 1/T = 3.183 Hz.\nTip: to find k from a measured period, solve 2π√(m/X) = T.\n\n@Topic: Physics 2\n\n## Snell's law and critical angle\nn₁ sin θ₁ = n₂ sin θ₂. The critical angle for going from a dense medium (n₁) into a rare medium (n₂) is sin θ_c = n₂/n₁.\n1. Set Deg. Type the angle with sin⁻¹.\nExample: light from air (n = 1) into glass (n = 1.5) at 40° from the normal. θ₂ = sin⁻¹(1 × sin(40)/1.5) = 25.374°.\nExample: the critical angle from glass into air: sin⁻¹(1/1.5) = 41.810°.\nWatch out: the angles are measured from the normal, not from the surface.\n\n## Sound level and the Doppler effect\nSound level β = 10 log(I/I₀) with I₀ = 10^{-12} W/m². Doppler effect: f' = f(v ± v_o)/(v ∓ v_s).\n1. For β, type 10 log(I/10^(-12)).\n2. For I from β, type 10^(β/10) × 10^(-12).\nExample: I = 10^{-5} W/m². β = 10 log(10^(-5)/10^(-12)) = 70.0 dB.\nExample: β = 85 dB gives I = 10^(8.5) × 10^(-12) = 0.00031623 W/m².\nExample: a siren of 700 Hz approaches a listener at 30 m/s (the speed of sound is 343 m/s). f' = 700 × 343/(343 - 30) = 767.09 Hz.\nTip: adding 3 dB doubles the intensity. Adding 10 dB multiplies it by 10.\n\n## Lenses and mirrors (SOLVE)\n1/f = 1/p + 1/q, magnification M = -q/p. A real image has q > 0.\n1. Put the known values in and use X for the unknown. Make X appear once.\nExample: f = 10 cm and the object is at p = 30 cm. 1/30 + 1/X = 1/10 (starting value 10) gives X = 15.0 cm. M = -15/30 = -0.50.\nExample: f = 10 cm and the object at p = 5 cm (inside the focal point). 1/5 + 1/X = 1/10 (starting value -5) gives X = -10.0 cm, a virtual image on the same side as the object.\nWatch out: sign conventions differ between books. Check the convention in your reviewer.\n\n@Topic: Thermodynamics\n@IdTopic: Physics\n\n## Heat: mixing and change of phase (SOLVE)\nHeat lost = heat gained. Q = m c ΔT, and Q = m L for a phase change.\n1. Write the heat lost by the hot body and the heat gained by the cold one with X as the final temperature.\n2. Type the heat lost minus the heat gained, with no equals sign, and use SOLVE.\nExample: 200 g of water at 80 °C is mixed with 300 g at 20 °C. Type 200(80 - X) - 300(X - 20) and SOLVE gives X = 44.0 °C.\nExample: how much heat melts 0.5 kg of ice at 0 °C and heats it to 30 °C? Q = 0.5 × 334 + 0.5 × 4.186 × 30 = 229.79 kJ (with L = 334 kJ/kg and c = 4.186 kJ/(kg·K)).\nWatch out: use the same units (J or kJ) for c and L.\n\n@Subject: ESAS\n@Topic: Chemistry\n\n## pH, pOH and weak acids (log and EQN)\npH = -log[H⁺], [H⁺] = 10^(-pH), pH + pOH = 14.\n1. For pH, type -log(concentration).\n2. For the concentration, type 10^(-pH).\n3. For a weak acid, K_a = x²/(C - x). Rearrange to x² + K_a x - K_a C = 0 and solve with EQN (Quad). Take the positive root.\nExample: [H⁺] = 3.2 × 10^{-4} gives pH = -log(3.2×10^(-4)) = 3.4949.\nExample: pH = 8.25 gives [H⁺] = 10^(-8.25) = 5.623 × 10^{-9} M.\nExample: 0.10 M acetic acid, K_a = 1.8 × 10^{-5}. Enter 1, 1.8×10^(-5), -1.8×10^(-6) in EQN. x = 0.001333 M, so pH = 2.875.\nWatch out: a negative root of the quadratic has no meaning here.\n\n## Gas laws with SOLVE\nIdeal gas: P V = n R T with R = 0.08206 L·atm/(mol·K) and T in kelvin. Combined law: P₁V₁/T₁ = P₂V₂/T₂. Dalton: the total pressure is the sum of the partial pressures.\n1. Put the equation in SOLVE with X as the unknown.\n2. Convert °C to K by adding 273.15.\nExample: the volume of 2 mol of gas at 300 K and 1.5 atm: 1.5X = 2 × 0.08206 × 300 gives X = 32.824 L.\nExample: 2 L of gas at 300 K and 1 atm is heated to 400 K and compressed to 2 atm. Type 2X/400 = 1 × 2/300 and SOLVE gives X = 1.3333 L.\nTip: the calculator has a constant for the gas constant R (8.3144621 J/(mol·K) in the list), but its unit is different from L·atm. Match the units.\n\n## Balance a chemical equation with simultaneous equations (EQN)\nWrite one equation for each element, set one coefficient to 1, and solve for the rest.\nExample: a C₂H₆ + b O₂ → c CO₂ + d H₂O. Let a = 1.\nC: 2 = c. H: 6 = 2d. O: 2b = 2c + d.\n1. Open EQN with 3 unknowns (b, c, d).\n2. Enter the rows b, c, d, constant: 0, 1, 0, 2 then 0, 0, 1, 3 then 2, -2, -1, 0.\n3. The answers are b = 3.5, c = 2 and d = 3.\n4. Multiply everything by 2 to clear the fraction: 2 C₂H₆ + 7 O₂ → 4 CO₂ + 6 H₂O.\nTip: with 4 unknown coefficients and one set to 1, you need only 3 equations from the elements.\n\n## Concentration and dilution (SOLVE)\nMolarity M = moles/litres of solution. Molality = moles/kg of solvent. Mole fraction = moles of one/total moles. Dilution: M₁V₁ = M₂V₂.\n1. Type the relation with X as the unknown.\nExample: dilute 25 mL of 12 M HCl to 500 mL. X × 500 = 12 × 25 gives X = 0.60 M.\nExample: 40 g of NaOH (molar mass 40) in 2 L of solution is 0.50 M.\nExample: 5 g of glucose (180.16 g/mol) in 250 g of water is 0.1110 molal.\nTip: use the same unit (mL or L) on both sides of M₁V₁ = M₂V₂.\n\n## Faraday's law of electrolysis (SOLVE)\nm = M I t/(n F), with F = 96485 C/mol, t in seconds, M the molar mass and n the number of electrons.\n1. Type the formula with X as the unknown, or solve directly.\nExample: the time to deposit 5 g of copper (M = 63.55, n = 2) at 2 A. 63.55 × 2 × X/(2 × 96485) = 5 gives X = 7591.3 s, which is 2.109 hours.\nExample: the mass of silver (M = 107.87, n = 1) deposited by 3 A in 30 minutes: 107.87 × 3 × 1800/(1 × 96485) = 6.0372 g.\nWatch out: change minutes or hours to seconds.\n\n@Subject: ESAS\n@Topic: Computer and Logic\n\n## Negative numbers (two's complement) and bit masks in BASE\nThe calculator uses 32 bits. A negative number is stored in two's complement, and BASE mode shows it in that form.\n1. Press `Apps` and choose BASE. Choose HEX, BIN or OCT to see the number in that base.\n2. Use Neg for the negative of a number and Not for the complement of every bit.\n3. Use and, or, Xor and Xnor between numbers.\nExample: Neg(5) in HEX is FFFFFFFB. In DEC it is -5.\nExample: 5 - 8 gives -3, shown as FFFFFFFD in HEX.\nExample: 1100 and 1010 = 1000 in BIN. 1100 Xor 1010 = 0110. 1100 Xnor 1010 shows as FFFFFFF9 in HEX (all the upper bits become 1).\nExample: mask the low four bits of B7 (HEX): B7 and 0F = 07.\nWatch out: all scientific functions are off in BASE mode. Numbers must be whole numbers within the 32-bit range.\n\n@Subject: ESAS\n@Topic: Strength of Materials\n\n## Axial stress, strain and elongation (SOLVE)\nσ = P/A, ε = δ/L, δ = P L/(A E), and for a circular rod A = π d²/4. Keep units in N, m and Pa, or N, mm and MPa.\n1. Type the formula with the numbers.\n2. For a size, put the formula in SOLVE with X in place of the unknown.\nExample: a steel rod 2 m long, d = 20 mm, P = 50 kN, E = 200 GPa. σ = 50000/(π × 0.02^2/4) = 159.15 × 10^6 Pa, which is 159.15 MPa. δ = 50000 × 2/(π × 0.02^2/4 × 200×10^9) = 0.0015915 m, which is 1.5915 mm.\nExample: the diameter that limits δ to 1 mm: 50000 × 2/(π X^2/4 × 200×10^9) = 0.001 gives X = 0.025231 m, which is 25.231 mm.\nWatch out: do not mix mm and m. Convert the diameter to metres if E is in Pa.\n\n## Principal stresses and maximum shear with Pol(\nCentre of Mohr's circle: (σ_x + σ_y)/2. Radius R = √(((σ_x - σ_y)/2)² + τ²) = maximum shear stress. σ₁,₂ = centre ± R. tan 2θ_p = 2τ/(σ_x - σ_y).\n1. Set Deg. Type Pol((σ_x - σ_y)/2, τ). The first result is R and the second is the angle 2θ_p.\n2. Add and subtract R from the centre.\nExample: σ_x = 80 MPa, σ_y = -20 MPa, τ = 30 MPa. Centre = 30. Pol(50, 30) gives R = 58.3095 and 2θ_p = 30.964°.\nσ₁ = 88.3095 MPa, σ₂ = -28.3095 MPa, and τ_max = 58.3095 MPa. The principal plane is at θ_p = 15.482°.\nTip: check that σ₁ + σ₂ = σ_x + σ_y.\n\n## Torsion: shaft diameter, twist and power (SOLVE)\nτ = 16T/(πd³) for a solid shaft, angle of twist θ = T L/(J G) with J = πd⁴/32, and P = T ω = 2π N T/60.\n1. Type the formula with X as the diameter in metres.\n2. For power, T = 60 P/(2π N) with P in watts.\nExample: T = 3000 N·m and τ_allow = 60 MPa. 16 × 3000/(π X^3) = 60×10^6 gives X = 0.06338 m, which is 63.38 mm.\nExample: a shaft transmits 75 kW at 1500 rpm. T = 60 × 75000/(2π × 1500) = 477.46 N·m. For τ_allow = 60 MPa the diameter is (16 × 477.46/(π × 60×10^6))^(1/3) = 34.35 mm.\nWatch out: keep T in N·m and τ in Pa to get d in metres.\n\n## Euler buckling of a column (SOLVE)\nP_cr = π²EI/(K L)², where K L is the effective length: pinned-pinned K = 1, fixed-free K = 2, fixed-fixed K = 0.5, fixed-pinned K = 0.7. Slenderness ratio = K L/r with r = √(I/A).\n1. Put the formula in SOLVE with X as the length (or anything else you need).\nExample: E = 200 GPa, I = 8 × 10^{-6} m⁴, P_cr = 100 kN, pinned ends. π^2 × 200×10^9 × 8×10^(-6)/X^2 = 100000 gives X = 12.566 m.\nExample: the same column fixed at one end and free at the other has K = 2, so the safe length for the same load is 6.283 m.\nWatch out: Euler's formula holds only for long, slender columns.\n\n@Subject: ESAS\n@Topic: Fluid Mechanics\n\n## Continuity and Bernoulli for a pipe change (SOLVE)\nContinuity: Q = A₁v₁ = A₂v₂. Bernoulli: p₁/γ + v₁²/(2g) + z₁ = p₂/γ + v₂²/(2g) + z₂ (no losses). For a horizontal pipe p₂ = p₁ + (ρ/2)(v₁² - v₂²).\n1. Find the velocities from Q and the areas.\n2. Type the pressure formula, or put the Bernoulli equation in SOLVE with X as the unknown.\nExample: Q = 0.1 m³/s in a pipe going from d₁ = 0.3 m to d₂ = 0.15 m, with p₁ = 200 kPa and water (ρ = 1000). v₁ = 0.1/(π × 0.3^2/4) = 1.4147 m/s and v₂ = 5.6588 m/s.\np₂ = 200000 + 500(1.4147^2 - 5.6588^2) = 184,989 Pa, which is 184.99 kPa.\nExample: the speed of water leaving an orifice 4 m below the surface: √(2 × 9.81 × 4) = 8.859 m/s.\n\n## Colebrook friction factor with SOLVE\n1/√f = -2 log(ε/(3.7D) + 2.51/(Re √f)). The friction factor f is on both sides, so SOLVE does the iteration.\n1. Compute Re = ρ v D/μ and the relative roughness ε/D.\n2. Move every term to one side, so that the expression equals 0. Type it with X for f, with no equals sign. Start SOLVE with a guess of 0.02.\n3. Use the result in h_f = f (L/D) v²/(2g).\nExample: ε/D = 0.0005 and Re = 100000. Type 1/√X + 2log(0.0005/3.7 + 2.51/(100000√X)) and SOLVE gives X = 0.02033.\nFor a smooth pipe with Re = 100000, the Blasius formula 0.316/Re^0.25 = 0.01777.\nWatch out: use a starting value in the usual range for f, 0.01 to 0.1. For laminar flow (Re below about 2000) use f = 64/Re.\n\n## Open channel flow: Manning's equation (SOLVE)\nQ = (1/n) A R^(2/3) S^(1/2), with R = A/P_w. For a rectangle of width b and depth y: A = b y and P_w = b + 2y.\n1. Type Q with the depth X.\n2. For the depth from a known Q, put Q on the right and use SOLVE.\nExample: b = 3 m, n = 0.013, S = 0.001, y = 1.2 m. A = 3.6, P_w = 5.4, R = 0.6667. Q = (1/0.013) × 3.6 × (0.6667)^(2/3) × √0.001 = 6.683 m³/s.\nExample: the depth for Q = 8 m³/s. (1/0.013)(3X)((3X)/(3 + 2X))^(2/3)√0.001 = 8 (starting value 1) gives X = 1.370 m.\nTip: a wider or flatter channel has a larger R for the same area and carries more flow.\n\n## Hydrostatic force and centre of pressure on a gate\nF = γ h_c A. The centre of pressure is below the centroid: y_p = y_c + I_c/(A y_c), measured along the plane from the surface. For a vertical rectangle I_c = b h³/12.\n1. Find the depth of the centroid and the area.\n2. Type each formula once and keep the answers.\nExample: a vertical gate 2 m wide and 3 m high with its top 1 m under the water surface (γ = 9.81 kN/m³). y_c = 1 + 1.5 = 2.50 m, A = 6 m². F = 9.81 × 2.50 × 6 = 147.15 kN.\nI_c = 2 × 3^3/12 = 4.50 and y_p = 2.50 + 4.50/(6 × 2.50) = 2.80 m below the surface.\nTip: for pressure at a depth, p = γ h. Convert to kPa when γ is in kN/m³.\n\n@Subject: ESAS\n@Topic: Thermodynamics\n\n## Linear interpolation for table values\ny = y₁ + (x - x₁)(y₂ - y₁)/(x₂ - x₁).\n1. Read the two table rows on either side of your value: (x₁, y₁) and (x₂, y₂).\n2. Type the formula with your numbers.\nExample: at 250 the table gives 2800 and at 300 it gives 2900. At 270: 2800 + (270 - 250)(2900 - 2800)/(300 - 250) = 2840.\nExample: the temperature where the property equals 2850: 250 + (2850 - 2800)(300 - 250)/(2900 - 2800) = 275.\nTip: use your own steam table values. The formula is the same in every table.\n\n## Ideal gas processes (SOLVE)\nIsentropic: T₂/T₁ = (P₂/P₁)^((k-1)/k) and P V^k is constant. Isothermal work: W = m R T ln(V₂/V₁). Polytropic: P V^n is constant and W = (P₂V₂ - P₁V₁)/(1 - n).\n1. Type the formula with the numbers, using absolute temperatures and pressures.\n2. For an unknown exponent or ratio, use SOLVE.\nExample: air (k = 1.4) at 300 K and 100 kPa is compressed isentropically to 800 kPa. T₂ = 300(800/100)^(0.4/1.4) = 543.43 K.\nExample: the pressure ratio for T₂ = 543.4 K: 300 X^(0.4/1.4) = 543.4 gives X = 8.00.\nExample: 2 kg of air (R = 0.287 kJ/(kg·K)) compressed isothermally at 300 K to one quarter of its volume: W = 2 × 0.287 × 300 × ln(0.25) = -238.72 kJ (work is done on the gas).\nWatch out: use kelvin and absolute pressure in every gas equation.\n\n## Cycle efficiency and compression ratio (SOLVE)\nCarnot: η = 1 - T_L/T_H. Otto: η = 1 - r^(1-k). Brayton: η = 1 - r_p^(-(k-1)/k).\n1. Type the efficiency formula.\n2. To find the ratio for a given efficiency, put the formula in SOLVE or rearrange: r = (1 - η)^(-1/(k-1)).\nExample: Carnot between 800 K and 300 K: η = 1 - 300/800 = 0.6250.\nExample: Otto with r = 8 and k = 1.4: η = 1 - 8^(-0.4) = 0.5647.\nExample: the compression ratio for η = 0.55: 1 - X^(-0.4) = 0.55 gives X = 7.362.\nExample: Brayton with r_p = 8: η = 1 - 8^(-0.4/1.4) = 0.4480.\n\n@Section: Calculator\n@Source: Canon F-789SGA\n\n@Subject: EE\n@Topic: Electrostatics\n\n## Coulomb force and the electric field of point charges (Rec and Pol)\nForce F = k q₁ q₂/r². Field E = k q/r². k = 1/(4π ε₀) = 8.99 × 10^{9} in SI units. Type 8.99×10^9, or look for ε₀ in the calculator's constants list and type 1/(4π ε₀). The field points away from a positive charge and toward a negative one.\n1. For the force between two charges, type k × q₁ × q₂/r² and use the size of the charges. Unlike charges attract and like charges repel.\n2. For the field at a point from several charges, find each field's size E = k q/r² and its direction angle.\n3. Turn each field into x and y parts with Rec(E, θ). Add the x parts and add the y parts.\n4. Turn the totals back with Pol(Ex, Ey) to get the size and the direction.\nExample: q₁ = 5 µC and q₂ = -3 µC are 0.2 m apart. F = 8.99×10^9 × 5×10^(-6) × 3×10^(-6)/0.2^2 = 3.371 N. The force is attractive.\nExample: q₁ = +4 nC at the origin and q₂ = -6 nC at x = 0.4 m. Find the field at P (0.2 m, 0.15 m). Both charges are 0.25 m from P.\nE₁ = 8.99×10^9 × 4×10^(-9)/0.25^2 = 575.36 N/C at 36.87° (away from q₁).\nE₂ = 8.99×10^9 × 6×10^(-9)/0.25^2 = 863.04 N/C at -36.87° (toward q₂).\nRec(575.36, 36.87) gives 460.29 and 345.22. Rec(863.04, -36.87) gives 690.43 and -517.82.\nEx = 1150.72 and Ey = -172.61. Pol(1150.72, -172.61) gives E = 1163.6 N/C at -8.53°.\nWatch out: a negative charge's field points toward it, so use the direction toward the charge. Use the size of the charge, without its sign, for the field size.\n\n## Capacitors: series, parallel, energy and charge sharing\nSeries: 1/C = 1/C₁ + 1/C₂ + ... Parallel: C = C₁ + C₂ + ... Charge Q = C V. Energy W = (1/2) C V². Parallel plates: C = ε₀ε_r A/d, with ε₀ = 8.854×10^(-12) F/m.\n1. For capacitors in series type (C₁^(-1) + C₂^(-1) + C₃^(-1))^(-1).\n2. Find the charge on the series string with Q = C_eq V. Every series capacitor carries the same charge, so V₁ = Q/C₁.\n3. Check that the voltages add up to the supply.\nExample: 4 µF, 6 µF and 12 µF in series across 120 V. (4^(-1) + 6^(-1) + 12^(-1))^(-1) = 2.0000 µF. Q = 2.0000 × 120 = 240.00 µC. The voltages are Q/C₁ = 60.00 V, Q/C₂ = 40.00 V and Q/C₃ = 20.00 V, which add to 120 V.\nExample: parallel plates with A = 0.02 m², d = 1 mm and ε_r = 4. C = 8.854×10^(-12) × 4 × 0.02/0.001 = 708.32 pF.\nExample: charge sharing. A 10 µF capacitor charged to 100 V is connected to an uncharged 5 µF capacitor. The charge 1000 µC is shared, so V = 1000/15 = 66.67 V. The energy goes from 0.0500 J to 0.0333 J, and the lost energy is 0.01667 J.\nWatch out: in series the charge is the same and the voltages differ. In parallel the voltage is the same and the charges differ.\n\n## Electric potential, work and Gauss law fields\nPotential of a point charge V = k q/r. Potential difference and work: W = q (V_B - V_A). Fields from Gauss's law: outside a charged sphere E = k Q/r². Infinite line E = λ/(2π ε₀ r). Infinite sheet E = σ/(2 ε₀).\n1. For several charges, add the potentials with their signs. Potential is a number and has no direction.\n2. The work to bring a charge q from far away is q V.\n3. For a charge q moved through a potential difference V, the kinetic energy gained is q V, so v = √(2 q V/m).\nExample: q₁ = 4 nC at 0.3 m and q₂ = -2 nC at 0.5 m from point P. V = 8.99×10^9(4×10^(-9)/0.3 - 2×10^(-9)/0.5) = 83.91 V.\nWork to bring a 2 nC charge there from far away: 2×10^(-9) × 83.91 = 1.678 × 10^{-7} J.\nExample: a line of charge λ = 5 nC/m. At 0.5 m the field is 5×10^(-9)/(2π × 8.854×10^(-12) × 0.5) = 179.75 N/C.\nExample: an electron accelerated through 1000 V. v = √(2 × 1.602×10^(-19) × 1000/9.109×10^(-31)) = 1.875 × 10^{7} m/s.\nTip: look in the calculator's constants list for the electron charge and mass. Using them avoids typing errors.\n\n@Subject: EE\n@Topic: Electromagnetics\n\n## Magnetic field and force: wire, solenoid and moving charge\nLong straight wire B = μ₀ I/(2π r). Solenoid B = μ₀ N I/ℓ. Force on a wire F = B I L sin θ. Force between parallel wires F/L = μ₀ I₁ I₂/(2π d). Moving charge F = q v B sin θ and the circle has radius r = m v/(q B). μ₀ = 4π × 10^(-7) in SI units.\n1. Set Deg if there is an angle. Type the formula with your numbers.\n2. For the radius of a charged particle in a field, use r = m v/(q B).\nExample: 50 A, at 0.1 m from the wire. B = 4π×10^(-7) × 50/(2π × 0.1) = 1.000 × 10^{-4} T, which is 100.0 µT.\nExample: two parallel wires with 100 A each and 0.2 m apart. F/L = 4π×10^(-7) × 100 × 100/(2π × 0.2) = 0.0100 N/m.\nExample: B = 0.5 T, I = 10 A, L = 0.3 m at 60° to the field. F = 0.5 × 10 × 0.3 × sin(60) = 1.2990 N.\nExample: an electron at 10^7 m/s in a field of 1 mT. r = 9.109×10^(-31) × 10^7/(1.602×10^(-19) × 10^(-3)) = 5.686 cm.\nExample: a solenoid with 500 turns, 0.25 m long and 2 A. B = 4π×10^(-7) × 500 × 2/0.25 = 5.027 × 10^{-3} T.\nWatch out: set Deg before sin(60), and use metres, amperes and teslas.\n\n## Magnetic circuits: reluctance, flux and air gap\nReluctance ℛ = ℓ/(μ₀ μ_r A). The magnetic \"Ohm's law\" is N I = Φ ℛ. Flux density B = Φ/A. In series the reluctances add.\n1. Work out the reluctance of the core and of the air gap (with μ_r = 1) separately.\n2. The flux is B A. The total MMF is N I = Φ (ℛ_core + ℛ_gap).\n3. Divide by N for the current. The inductance is L = N²/ℛ_total.\nExample: a core with mean length 0.4 m, A = 4×10^(-4) m², μ_r = 2000 and an air gap of 1 mm. N = 500 turns and the gap flux density must be 1 T.\nℛ_core = 0.4/(4π×10^(-7) × 2000 × 4×10^(-4)) = 397887 A·t/Wb.\nℛ_gap = 0.001/(4π×10^(-7) × 4×10^(-4)) = 1989437 A·t/Wb.\nΦ = 1 × 4×10^(-4) = 0.0004 Wb. N I = 0.0004 × (397887 + 1989437) = 954.93 A·t, so I = 954.93/500 = 1.9099 A.\nL = 500^2/2387324 = 0.10472 H.\nWatch out: the air gap takes most of the MMF, even though it is only 1 mm long. This ignores fringing.\n\n## Inductance, energy and mutual inductance\nInduced voltage e = L di/dt. Energy W = (1/2) L I². Series: L = L₁ + L₂ + ... Parallel: 1/L = 1/L₁ + 1/L₂ + ... Mutual inductance M = k √(L₁ L₂).\n1. Type M = k √(L₁ L₂).\n2. Coils in series aiding: L = L₁ + L₂ + 2M. In series opposing: L = L₁ + L₂ - 2M.\n3. For the induced voltage, type L × (change in current)/(time).\nExample: L₁ = 0.4 H, L₂ = 0.9 H and k = 0.5. M = 0.5 √(0.4 × 0.9) = 0.30 H.\nAiding: 0.4 + 0.9 + 2(0.3) = 1.90 H. Opposing: 0.4 + 0.9 - 2(0.3) = 0.70 H.\nExample: the current in a 0.4 H coil rises by 2 A in 10 ms. e = 0.4 × 2/0.01 = 80.0 V.\nExample: the energy at 2 A is 0.5 × 0.4 × 2^2 = 0.80 J.\nWatch out: use seconds, not milliseconds, in e = L di/dt.\n\n@Subject: EE\n@Topic: AC Circuits 1\n\n## Series RLC circuit in CPLX mode\nX_L = 2π f L, X_C = 1/(2π f C), Z = R + j(X_L - X_C). Current I = V/Z. A negative net reactance means the current leads the voltage.\n1. Press `Apps`, choose CPLX and set Deg.\n2. Type the voltage over the impedance: V∠0 ÷ (R + (X_L - X_C)i), with X_L and X_C typed as 2π f L and 1/(2π f C).\n3. Read the current as a magnitude and an angle with Abs and Arg, or from the polar display.\n4. The voltage across each part is I times its impedance, such as I × 20 or I × (X_L i).\nExample: R = 20 Ω, L = 50 mH, C = 100 µF, f = 60 Hz, V = 120 V. X_L = 18.8496 Ω and X_C = 26.5258 Ω.\nZ = 20.0000 - 7.6763i Ω = 21.4225∠-20.9975° Ω.\nI = 120∠0 ÷ (20 + (18.8496 - 26.5258)i) = 5.6016∠20.9975° A.\nV_R = 112.032 V, V_L = 105.587 V and V_C = 148.586 V. The capacitor voltage is larger than the supply, which is normal in series RLC.\nPower factor = cos(21.0°) = 0.9336 leading. Real power P = I²R = 627.55 W.\nWatch out: the calculator writes i where you write j. Switch back to COMP for ordinary work.\n\n## Resonance, quality factor and bandwidth (SOLVE)\nf₀ = 1/(2π√(LC)). Q = X_L/R = ω₀ L/R for a series circuit. Bandwidth = f₀/Q. At resonance X_L = X_C, so Z = R and the current is at its largest.\n1. Type 1/(2π√(L × C)) with L in henries and C in farads.\n2. For Q, type 2π f₀ L/R. For the bandwidth, divide f₀ by Q.\n3. To find L or C for a given f₀, use SOLVE with X in place of the unknown.\nExample: L = 50 mH, C = 100 µF, R = 20 Ω. f₀ = 1/(2π√(0.05 × 0.0001)) = 71.176 Hz.\nQ = 2π × 71.176 × 0.05/20 = 1.1180. Bandwidth = 71.176/1.1180 = 63.66 Hz.\nExample: the capacitor needed for f₀ = 100 Hz with L = 50 mH. 1/(2π√(0.05X)) = 100 (starting value 0.00005) gives X = 5.066 × 10^{-5} F, which is 50.66 µF.\nWatch out: convert µF and mH before you type. For a parallel LC circuit with a small coil resistance, f₀ is about the same, but the line current is smallest at resonance.\n\n## Average and RMS values of waveforms with the integral\nAverage = (1/T)∫v dt and RMS = √((1/T)∫v² dt) over one period, with θ = ωt as the variable. Use COMP mode with the angle unit on Rad.\n1. Type the average as ∫(v(X), start, end) ÷ period, using X as the angle.\n2. Type the RMS as √(∫((v(X))^2, start, end) ÷ period).\n3. For a sine wave, the rest of the cycle where v = 0 only adds to the period, so you can integrate over the part that is not zero.\nExample: a half-wave rectified wave with V_m = 10. The average is ∫(10sin(X), 0, π) ÷ (2π) = 3.1831, which is V_m/π. RMS = √(∫((10sin(X))^2, 0, π) ÷ (2π)) = 5.0000, which is V_m/2.\nExample: a full-wave rectified wave. The average is ∫(10sin(X), 0, π) ÷ π = 6.3662, which is 2V_m/π. RMS = 7.0711, which is V_m/√2.\nExample: v = 10 + 5 sin θ. RMS = √(∫((10 + 5sin(X))^2, 0, 2π) ÷ (2π)) = 10.6066. This equals √(10^2 + 5^2/2).\nForm factor = RMS/average = 1.5708 for the half-wave and 1.1107 for the full-wave waveform. Peak factor = V_m/RMS.\nWatch out: this gives a numerical result that may differ in the last digits. Check it against the formula when there is one.\n\n## Mesh equations for a resistive network (EQN, 3 unknowns)\nWrite Kirchhoff's voltage law around each mesh, with all mesh currents in the same direction. Each equation has the form (sum of resistances in the mesh) I_a - (shared resistance) I_b ... = (source voltage).\n1. Press `Apps`, choose EQN, and then 3 (3 unknowns).\n2. Type the three rows, with the coefficients of I₁, I₂, I₃ and the constant on the right.\n3. Read I₁, I₂ and I₃ one by one. A negative current flows against the direction you assumed.\nExample: Mesh 1: 30 I₁ - 20 I₂ = 50. Mesh 2: -20 I₁ + 60 I₂ - 10 I₃ = 0. Mesh 3: -10 I₂ + 50 I₃ = -20.\nEnter 30, -20, 0, 50 then -20, 60, -10, 0 then 0, -10, 50, -20.\nI₁ = 2.1045 A, I₂ = 0.6567 A and I₃ = -0.2687 A.\nCheck: 30(2.1045) - 20(0.6567) = 50.0000, which matches 50.\nTip: the same method solves nodal equations. The unknowns are then node voltages and the coefficients are conductances.\n\n## Thevenin equivalent and maximum power transfer in CPLX mode\nV_th is the open-circuit voltage at the terminals. Z_th is the impedance seen from the terminals with the source shorted. Maximum power goes to the load when Z_L = the conjugate of Z_th, and P_max = |V_th|²/(4 R_th).\n1. Use CPLX mode with Deg. Type the open-circuit voltage with the voltage-divider formula.\n2. Type Z_th as a parallel combination: Z₁ Z₂ ÷ (Z₁ + Z₂).\n3. Type Conjg(Z_th) for the best load, then P_max = Abs(V_th)² ÷ (4 Real(Z_th)).\nExample: a 120∠0° source in series with Z₁ = 6 + 8i. The terminals are across Z₂ = 8 - 6i.\nV_th = 120∠0 × (8 - 6i) ÷ ((6 + 8i) + (8 - 6i)) = 84.8528∠-45.0000° V.\nZ_th = (6 + 8i)(8 - 6i) ÷ ((6 + 8i) + (8 - 6i)) = 7.0000 + 1.0000i Ω.\nThe best load is Conjg(Z_th) = 7.0000 - 1.0000i Ω. P_max = 84.8528^2 ÷ (4 × 7.0000) = 257.14 W.\nWatch out: use the conjugate only for the load. Put brackets around the whole denominator.\n\n@Subject: EE\n@Topic: AC Circuits 2\n\n## Power factor correction (kvar and capacitance)\nQ = P tan θ with θ = cos⁻¹(pf). The capacitor kvar needed is Q_c = P(tan θ₁ - tan θ₂), where θ₁ is the old angle and θ₂ the new one.\n1. Set Deg. Type P(tan(cos⁻¹(old pf)) - tan(cos⁻¹(new pf))).\n2. For one capacitor on a single-phase supply, C = Q_c/(2π f V²).\n3. For a three-phase bank in delta, each capacitor has Q_c/3 across the line voltage: C = Q_c/(3 × 2π f V_L²).\nExample: 100 kW at 0.75 lagging, corrected to 0.95 lagging, on a 440 V, 60 Hz three-phase supply.\nQ₁ = 100 tan(cos⁻¹(0.75)) = 88.19 kvar and Q₂ = 100 tan(cos⁻¹(0.95)) = 32.87 kvar.\nQ_c = 100(tan(cos⁻¹(0.75)) - tan(cos⁻¹(0.95))) = 55.32 kvar.\nDelta bank: C = 55.32×10^3/(3 × 2π × 60 × 440^2) = 252.7 µF per phase.\nIn a wye bank, the capacitance per phase is three times that, 758.0 µF, because each capacitor sees V_L/√3.\nWatch out: a bigger capacitor bank does not always help. Going past unity power factor makes the load leading.\n\n## Balanced three-phase loads: wye and delta\nWye: V_L = √3 V_p and I_L = I_p. Delta: V_L = V_p and I_L = √3 I_p. In both, S = √3 V_L I_L, P = √3 V_L I_L cos θ and Q = √3 V_L I_L sin θ, where θ is the angle of the load impedance. A delta load Z_Δ is the same as a wye load Z_Δ/3.\n1. Use CPLX mode with Deg if the impedance is complex. Type Abs(Z) for its size and Arg(Z) for its angle.\n2. Find the phase voltage and the phase current, then the line current.\n3. Use the √3 formula for the total power.\nExample: a wye load with V_L = 380 V and each phase Z = 12 + 9i = 15.00∠36.87° Ω. V_p = 380/√3 = 219.39 V and I_L = I_p = 219.39/15 = 14.626 A.\nS = √3 × 380 × 14.626 = 9626.7 VA. P = S cos(36.87°) = 7701.3 W and Q = 5776.0 var.\nExample: the same impedance connected in delta. I_p = 380/15 = 25.333 A and I_L = √3 × 25.333 = 43.879 A. S = √3 × 380 × 43.879 = 28880.0 VA and P = 23104.0 W. This is three times the wye power.\nWatch out: use line values in the √3 formula and phase values in the 3 V_p I_p formula. Do not mix them.\n\n## Two-wattmeter method\nP = W₁ + W₂. tan φ = √3 (W₁ - W₂)/(W₁ + W₂), with W₁ the larger reading. Q = √3 (W₁ - W₂). The power factor is cos φ.\n1. Add the two readings for the total power.\n2. Type tan⁻¹(√3(W₁ - W₂)/(W₁ + W₂)) with Deg set, then cos of that angle for the power factor.\n3. For the line current, I_L = S/(√3 V_L) with S = √(P² + Q²).\nExample: W₁ = 5200 W and W₂ = 2300 W on a 440 V line. P = 7500 W.\ntan φ = √3 × (5200 - 2300)/(5200 + 2300) = 0.6697, so φ = 33.811° and pf = cos(33.811) = 0.8309 lagging.\nQ = √3 × 2900 = 5022.9 var, S = √(7500^2 + 5022.9^2) = 9026.6 VA and I_L = 9026.6/(√3 × 440) = 11.84 A.\nWatch out: if the power factor is below 0.5, W₂ is negative. Keep its sign in W₁ + W₂ and in W₁ - W₂.\n\n@Subject: EE\n@Topic: Transients\n\n## First-order RC and RL circuits (SOLVE)\nx(t) = x_final + (x_initial - x_final) e^{-t/τ}. For RC, τ = R C. For RL, τ = L/R. After 5τ the change is over 99%.\n1. Work out τ, the initial value and the final value.\n2. Type the formula with t and read the value at that time.\n3. To find the time for a given value, put the formula in SOLVE with X for t. Or rearrange to t = -τ ln((x - x_final)/(x_initial - x_final)).\nExample: an RC circuit with R = 10 kΩ, C = 100 µF, so τ = 1 s. A 24 V supply charges the capacitor from 0 V. v(t) = 24(1 - e^(-X)).\nAt t = 0.5 s: 24(1 - e^(-0.5)) = 9.4433 V.\nThe time to reach 15 V: 24(1 - e^(-X)) = 15 (starting value 1) gives X = 0.9808 s. By formula, -1 × ln(1 - 15/24) = 0.9808 s.\nExample: an RL circuit with R = 10 Ω, L = 2 H, a 12 V supply. τ = 0.2 s, and the final current is 1.2 A. i(t) = 1.2(1 - e^(-X/0.2)).\nThe time to reach 1 A: 1.2(1 - e^(-X/0.2)) = 1 (starting value 0.3) gives X = 0.3584 s.\nWatch out: use ln for natural logarithms. The log key is base 10. Keep R in ohms and C in farads so that τ is in seconds.\n\n## Second-order series RLC: damping and characteristic roots (EQN)\nThe characteristic equation is s² + (R/L)s + 1/(LC) = 0. Define α = R/(2L) and ω₀ = 1/√(LC). If α > ω₀ the response is overdamped. If α = ω₀ it is critically damped. If α < ω₀ it is underdamped, with ω_d = √(ω₀² - α²).\n1. Type α = R/(2L), ω₀ = 1/√(LC) and compare them.\n2. For two real roots, use EQN, choose the quadratic and enter 1, R/L, 1/(LC).\n3. For the underdamped case, the roots are -α ± jω_d. Work out α and ω_d directly.\nExample: L = 0.5 H, C = 0.02 F, so ω₀ = 1/√(0.5 × 0.02) = 10.000 rad/s. The critical resistance is 2√(L/C) = 2√(0.5/0.02) = 10.000 Ω.\nFor R = 12 Ω: α = 12/(2 × 0.5) = 12.000, which is larger than ω₀, so it is overdamped. In EQN enter 1, 24, 100. The roots are s₁ = -5.3668 and s₂ = -18.6332.\nFor R = 4 Ω: α = 4.000, which is smaller than ω₀, so it is underdamped. ω_d = √(10^2 - 4^2) = 9.1652 rad/s, and the roots are -4 ± 9.1652j.\nWatch out: the answers to the quadratic are in 1/s. Use L in henries and C in farads.\n\n@Subject: EE\n@Topic: DC Machines\n\n## DC generator: induced voltage, losses and efficiency\nShunt generator: I_a = I_L + I_sh, I_sh = V/R_sh and E_g = V + I_a R_a + brush drop. Series generator: I_a = I_L = I_series and E_g = V + I_a(R_a + R_s) + brushes. Power developed P_d = E_g I_a. Efficiency η = output/(output + losses).\n1. Work out the field current and then the armature current.\n2. Type E_g = V + I_a R_a + brush drop.\n3. Add the stray and rotational losses to the electrical power developed to get the mechanical input.\nExample: a 250 V shunt generator delivers 20 kW. R_a = 0.05 Ω, R_sh = 125 Ω, the brush drop is 2 V, and the stray losses are 800 W.\nI_L = 20000/250 = 80 A, I_sh = 250/125 = 2 A and I_a = 82 A.\nE_g = 250 + 82 × 0.05 + 2 = 256.10 V. Power developed = 256.10 × 82 = 21000.2 W.\nInput = 21000.2 + 800 = 21800.2 W, so η = 20000/21800.2 = 91.74%.\nWatch out: the armature carries the load current plus the shunt field current. The terminal voltage is less than E_g.\n\n## DC motor: back emf, speed ratio, torque and starting resistance\nE_b = V - I_a R_a. Speed N ∝ E_b/Φ. Torque T = P_d/ω = E_b I_a/(2π N/60). For two operating points with the same flux, N₂/N₁ = E_b2/E_b1. For a series motor below saturation, Φ ∝ I_a so N₂/N₁ = (E_b2/E_b1)(I_a1/I_a2).\n1. Work out E_b at each load.\n2. Type N₁ × E_b2/E_b1 for the new speed.\n3. For torque, type 60 E_b I_a/(2π N) with N in rpm.\n4. The starting resistance for a current limit I_max is V/I_max - R_a.\nExample: a 220 V shunt motor with R_a = 0.25 Ω takes I_a = 40 A at 1000 rpm. E_b1 = 220 - 40 × 0.25 = 210.0 V. At I_a = 60 A, E_b2 = 220 - 60 × 0.25 = 205.0 V.\nShunt motor (constant flux): N₂ = 1000 × 205.0/210.0 = 976.19 rpm.\nSeries motor: N₂ = 1000 × (205.0/210.0) × (40/60) = 650.79 rpm.\nTorque at the first point: T = 60 × 210.0 × 40/(2π × 1000) = 80.21 N·m.\nStarting resistance for a start current of 1.5 times 40 A: 220/(1.5 × 40) - 0.25 = 3.4167 Ω.\nWatch out: use the armature current, not the line current, when finding E_b.\n\n## DC motor efficiency and the condition for maximum efficiency\nInput = V I_L. Mechanical power developed = E_b I_a. Output = developed power - stray losses. η = output/input. The efficiency is greatest when the variable loss I_a² R_a equals the constant losses, so I_a = √(P_constant/R_a).\n1. Work out I_a = I_L - I_sh and E_b = V - I_a R_a.\n2. Type the developed power, subtract the stray losses, and divide by the input.\n3. For maximum efficiency, add the shunt-field loss and the stray losses, then type √(P_c/R_a).\nExample: a 220 V shunt motor takes 45 A, with I_sh = 1.5 A, R_a = 0.3 Ω and stray losses of 400 W.\nI_a = 45 - 1.5 = 43.5 A. E_b = 220 - 43.5 × 0.3 = 206.95 V. Developed power = 206.95 × 43.5 = 9002.3 W.\nOutput = 9002.3 - 400 = 8602.3 W and input = 220 × 45 = 9900 W, so η = 86.89%.\nConstant losses = 220 × 1.5 + 400 = 730 W. Maximum efficiency is at I_a = √(730/0.3) = 49.33 A.\nWatch out: stray losses are taken as constant here. Always check which losses your problem treats as constant.\n\n@Subject: EE\n@Topic: Transformers 1\n\n## Equivalent circuit referred to one side, and voltage regulation (CPLX)\nTurns ratio a = N₁/N₂ = V₁/V₂. An impedance on the secondary appears on the primary as a² Z. The primary voltage is V₁ = V₂' + I₁(R_eq + jX_eq), with everything referred to the primary. Voltage regulation = (|V₁| - V₂')/V₂'.\n1. Use CPLX mode with Deg. Type the rated load current as an angle: I∠-θ for a lagging load and I∠+θ for a leading load, with θ = cos⁻¹(pf).\n2. Type V₂' + I × (R_eq + X_eq i). Read the size with Abs.\n3. Type (Abs(V₁) - V₂') ÷ V₂' × 100 for the regulation in percent.\nExample: a 50 kVA, 2400/240 V transformer has R_eq = 1.4 Ω and X_eq = 2.2 Ω, referred to the primary. a = 10 and the rated primary current is 50000/2400 = 20.833 A.\nAt full load, 0.8 lagging: V₁ = 2400 + 20.833∠-36.87 × (1.4 + 2.2i) = 2450.9083∠0.4481° V. Regulation = (2450.91 - 2400)/2400 × 100 = 2.121%.\nAt full load, 0.8 leading: the current angle is +36.87°, |V₁| = 2396.45 V and the regulation is -0.148%, which is negative.\nA 5 Ω load on the secondary looks like 10^2 × 5 = 500 Ω on the primary.\nWatch out: refer the impedance to the side where you want the voltage. Going to the other side divides by a².\n\n## Transformer efficiency, maximum efficiency and all-day efficiency\nAt a fraction x of full load: η = x S pf/(x S pf + P_core + x² P_cu), where P_cu is the full-load copper loss. Maximum efficiency is at x = √(P_core/P_cu). All-day efficiency = energy out/(energy out + energy lost) over 24 hours.\n1. Type the efficiency formula with x. Use CALC to try other loads with the same formula.\n2. For the load at maximum efficiency, type √(P_core ÷ P_cu). The kVA at that point is x times the rating.\n3. For the all-day efficiency, add the energy out and the losses for each period, in kWh.\nExample: 50 kVA, core loss 200 W, full-load copper loss 600 W, pf 0.8.\nFull load: η = 40000/(40000 + 200 + 600) = 98.039%. Half load: x = 0.5, η = 20000/(20000 + 200 + 150) = 98.280%.\nx = √(200/600) = 0.5774, which is 28.87 kVA, and η_max = 98.297%.\nAll-day: 6 h at full load (40 kW out), 6 h at half load (20 kW out), and 12 h at no load. Energy out = 40 × 6 + 20 × 6 = 360 kWh. Core loss = 0.2 × 24 = 4.8 kWh. Copper loss = 0.6 × 6 + 0.15 × 6 = 4.50 kWh. η = 360/(360 + 9.30) = 97.48%.\nWatch out: the core loss is there all day and the copper loss only when there is a load.\n\n## Open-circuit and short-circuit tests: finding the circuit values\nOpen-circuit test (usually on the low-voltage side): pf₀ = P/(V I), I_c = I cos θ₀, I_m = I sin θ₀, R_c = V/I_c and X_m = V/I_m. Short-circuit test (usually on the high-voltage side): Z_eq = V_sc/I_sc, R_eq = P_sc/I_sc², X_eq = √(Z_eq² - R_eq²).\n1. Type the power factor and the angle with cos⁻¹.\n2. Type the branch currents and then R_c and X_m.\n3. Type Z_eq, R_eq and X_eq. These values are referred to the side where the test was done.\nExample: a 10 kVA, 2300/230 V transformer. Open-circuit test on the 230 V side: 230 V, 2.0 A, 120 W. Short-circuit test on the 2300 V side: 85 V, 4.35 A, 240 W.\npf₀ = 120/(230 × 2) = 0.2609. I_c = 2 × 0.2609 = 0.5217 A and I_m = 2 × sin(cos⁻¹(0.2609)) = 1.9307 A.\nR_c = 230/0.5217 = 440.8 Ω and X_m = 230/1.9307 = 119.1 Ω (low-voltage side).\nZ_eq = 85/4.35 = 19.540 Ω. R_eq = 240/4.35^2 = 12.683 Ω. X_eq = √(19.540^2 - 12.683^2) = 14.865 Ω (high-voltage side).\nWatch out: refer these values to the same side before you use them together. Multiply by a² to go from the low side to the high side.\n\n@Subject: EE\n@Topic: Transformers 2\n\n## Autotransformer: kVA rating and power transferred\nFor an autotransformer with ratio a = V_high/V_low (a > 1): S_auto = S_winding × V_high/(V_high - V_low). The power passed through the winding (inductively) is S_ind = S_auto(1 - 1/a). The rest goes straight through by the conductor.\n1. Work out the ratio a.\n2. Type the autotransformer rating: S_winding × V_high ÷ (V_high - V_low).\n3. Type S_auto × (1 - 1/a) for the inductive part. The conductive part is S_auto - S_ind.\nExample: a 10 kVA, 2300/230 V two-winding transformer connected as an autotransformer for 2530 V and 2300 V. The series winding carries 2530 - 2300 = 230 V.\na = 2530/2300 = 1.100. S_auto = 10 × 2530/230 = 110.0 kVA.\nS_ind = 110.0 × (1 - 1/1.100) = 10.00 kVA. The conductive part is 100.00 kVA.\nExample: a 1:2 autotransformer (a = 2) passes (1 - 1/2) = 50% of its rating through the winding.\nWatch out: an autotransformer has no isolation. Its savings are greatest when a is close to 1.\n\n## Three-phase transformer connections and line ratios\nFor a bank of three identical single-phase transformers: wye-delta gives V_line,HV/V_line,LV = √3 × (N₁/N₂). Delta-wye gives (N₁/N₂)/√3. Wye-wye and delta-delta give N₁/N₂. The three-phase rating is three times the single-phase rating. Line current = S/(√3 V_L).\n1. Work out the line voltage on each side from the winding voltages and the connection.\n2. Find the three-phase kVA, then each line current with S/(√3 V_L).\n3. A delta winding's phase current is I_L/√3.\nExample: three 25 kVA, 7200/240 V single-phase transformers connected wye-delta. Bank rating = 3 × 25 = 75 kVA.\nHigh-voltage line voltage = 7200√3 = 12470.8 V. Low-voltage line voltage = 240 V. The line-to-line ratio is 51.96.\nHigh-voltage line current = 75000/(√3 × 12470.8) = 3.472 A. Low-voltage line current = 75000/(√3 × 240) = 180.42 A.\nThe low-voltage delta winding carries 180.42/√3 = 104.17 A in each winding.\nWatch out: wye-delta and delta-wye connections shift the phase angle by 30°.\n\n## Parallel transformers: load sharing\nTransformers in parallel share the load in proportion to S_rated/Z%, when their per-unit impedances have similar angles. For transformer 1: S₁ = S_total × (S₁r/Z₁)/(S₁r/Z₁ + S₂r/Z₂). The one with the smaller percent impedance reaches full load first.\n1. Type S_rated ÷ Z% for each transformer.\n2. Type each share of the total load.\n3. For the largest load that does not overload anything, set the lower-Z transformer at its rating and scale up: S₁r ÷ (its share).\nExample: T₁ is 500 kVA with Z = 4%, and T₂ is 750 kVA with Z = 5%. The total load is 1000 kVA.\n500/4 = 125.0 and 750/5 = 150.0. S₁ = 1000 × 125.0/(125.0 + 150.0) = 454.5 kVA. S₂ = 545.5 kVA.\nLoading: T₁ is at 90.9% and T₂ is at 72.7%.\nT₁ is the first to reach 100%, so the largest total load is 500/(125.0/275.0) = 1100.0 kVA.\nWatch out: the percent impedances must be on each transformer's own kVA base, as given on the nameplates.\n\n@Subject: EE\n@Topic: Synchronous Machines\n\n## Synchronous generator: generated voltage and regulation (CPLX)\nPer phase: E_f = V_t + I_a(R_a + jX_s). Terminal voltage per phase for a wye connection is V_L/√3. Regulation = (|E_f| - V_t)/V_t. Rated line current I = S/(√3 V_L).\n1. Use CPLX mode with Deg. Type the rated current as I∠-θ for a lagging load or I∠+θ for a leading load.\n2. Type V_t + I × (R_a + X_s i) and read the size with Abs and the angle with Arg. The angle is the power angle δ.\n3. Type (Abs(E_f) - V_t) ÷ V_t × 100 for the regulation.\nExample: 1000 kVA, 2300 V, wye, R_a = 0.4 Ω, X_s = 4 Ω. I = 1000000/(√3 × 2300) = 251.02 A and V_t = 2300/√3 = 1327.91 V.\nAt 0.8 lagging: E_f = 1327.91 + 251.02∠-36.87 × (0.4 + 4i) = 2143.5811∠20.2812° V per phase. Regulation = 61.43%. The power angle is δ = 20.28°.\nAt 0.8 leading: E_f = 1181.0758∠46.9809° V and the regulation is -11.06%. A leading load can make the regulation negative.\nWatch out: type the current with the angle for its power factor. The line voltage is not the phase voltage in a wye connection.\n\n## Power angle, maximum power and synchronous speed (SOLVE)\nNeglecting R_a: P = 3 E_f V_t sin δ/X_s (three phases, per-phase E_f and V_t). The largest power is at δ = 90°. Synchronous speed N_s = 120 f/p in rpm, with p the number of poles.\n1. Set Deg. Type 3 × E_f × V_t/X_s for P_max.\n2. For the angle at a given power, type sin⁻¹(P X_s/(3 E_f V_t)).\n3. For the number of poles or the frequency, use N_s = 120 f/p, or put it in SOLVE with X in place of the unknown.\nExample: with the same excitation, use E_f = 2143.6 V, V_t = 1327.9 V and X_s = 4 Ω from the previous item. P_max = 3 × 2143.6 × 1327.9/4 = 2134.9 kW.\nAt P = 800 kW, δ = sin⁻¹(800000 × 4/(3 × 2143.6 × 1327.9)) = 22.008°.\nSpeed of a 6-pole alternator at 60 Hz: 120 × 60/6 = 1200 rpm. The number of poles for 1800 rpm at 60 Hz: 120 × 60/X = 1800 (starting value 4) gives X = 4.\nWatch out: this uses the machine's per-phase values. If you use line voltages, divide by √3 before you type them.\n\n## Synchronous motor as a power factor corrector (CPLX)\nAn overexcited synchronous motor takes leading current, so its reactive power is negative: Q = -P tan(cos⁻¹ pf). Add the complex powers of all the loads. The total S = P + jQ, with Abs(S) the kVA and Arg(S) the power factor angle.\n1. Use CPLX mode with Deg. Type each load as P + Q i, with a negative Q for the leading load.\n2. Add them. Read the total kVA with Abs and the angle with Arg.\n3. The power factor is cos(Arg).\nExample: a plant takes 500 kW at 0.7 lagging. Add a 200 kW synchronous motor at 0.8 leading.\nPlant: Q = 500 tan(cos⁻¹(0.7)) = 510.10 kvar. Motor: Q = -200 tan(cos⁻¹(0.8)) = -150.00 kvar.\nTotal S = (500 + 200) + (510.10 - 150)i = 700.00 + 360.10i kVA, which is 787.19∠27.22° kVA.\nThe power factor is cos(27.22) = 0.8892 lagging, up from 0.7.\nWatch out: the motor's own kvar is negative because it supplies the reactive power. The motor must not be overloaded when it is overexcited.\n\n@Subject: EE\n@Topic: Induction Motors\n\n## Synchronous speed, slip and rotor frequency (SOLVE)\nN_s = 120 f/p. Slip s = (N_s - N)/N_s. Rotor speed N = (1 - s) N_s. Rotor frequency f_r = s f. The nameplate speed is a little under N_s, so the nearest synchronous speed above it gives the number of poles.\n1. Type 120 × f ÷ p for the synchronous speed.\n2. Type (N_s - N) ÷ N_s for the slip, and s × f for the rotor frequency.\n3. For the number of poles from a nameplate speed, find the nearest N_s above it, then 120 f/X = N_s with SOLVE, or just type 120 f ÷ N_s.\nExample: a 6-pole motor at 60 Hz. N_s = 120 × 60/6 = 1200 rpm. At 1140 rpm, s = (1200 - 1140)/1200 = 0.0500, which is 5.00%. f_r = 0.0500 × 60 = 3.00 Hz.\nExample: a nameplate of 1750 rpm at 60 Hz. The nearest N_s above it is 1800 rpm, so p = 120 × 60/1800 = 4 poles and s = (1800 - 1750)/1800 = 2.78%.\nWatch out: a standstill rotor has s = 1 and f_r = f. The slip is a fraction, not a speed.\n\n## Induction motor power flow, efficiency and torque\nAir-gap power P_ag = input - stator losses (copper and core). Rotor copper loss = s P_ag. Developed power P_conv = (1 - s) P_ag. Output = P_conv - friction and windage. Shaft torque T = output/(2π N/60).\n1. Subtract the stator losses from the input to get P_ag.\n2. Find the rotor copper loss s P_ag, then P_conv = P_ag - s P_ag.\n3. Subtract friction and windage for the output. Divide by the input for the efficiency.\n4. Find the torque from the output and the speed in rad/s.\nExample: a 460 V, 60 Hz, 4-pole motor takes 15 kW. Stator losses are 1.2 kW, the slip is 0.03, and friction and windage are 0.4 kW.\nP_ag = 15 - 1.2 = 13.8 kW. Rotor copper loss = 0.03 × 13.8 = 0.414 kW. P_conv = 13.386 kW.\nOutput = 13.386 - 0.4 = 12.986 kW and η = 12.986/15 = 86.57%.\nSpeed = (1 - 0.03) × 1800 = 1746 rpm. Torque = 12986/(2π × 1746/60) = 71.02 N·m.\nTip: P_ag : rotor copper loss : P_conv = 1 : s : (1 - s). This is the quickest check.\nWatch out: use watts or kilowatts consistently. The speed in the torque formula is in rpm and must be the rotor speed.\n\n## Torque-slip curve with TABLE, starting and maximum torque\nT = 3 V_p² (R₂'/s)/(ω_s[(R₁ + R₂'/s)² + (X₁ + X₂')²]), in N·m with V_p the phase voltage and ω_s = 2π N_s/60. The slip at maximum torque is s_m = R₂'/√(R₁² + X²) with X = X₁ + X₂'. The maximum torque is T_max = 3 V_p²/(2 ω_s [R₁ + √(R₁² + X²)]).\n1. Press `Apps` and choose TABLE.\n2. Type f(X) with X as the slip. The slip must not be 0, so start the table above 0.\n3. Choose Start 0.05, End 0.35 and Step 0.05, then press `=`.\n4. Read the torque for each slip. The starting torque is f(1), which you can find with CALC.\nExample: 460 V, 4 poles, 60 Hz, R₁ = 0.3 Ω, R₂' = 0.25 Ω, X = 1.2 Ω. V_p = 460/√3 = 265.58 V and ω_s = 188.496 rad/s.\nf(X) = 3 × 265.58^2 × (0.25/X)/(188.496 × ((0.3 + 0.25/X)^2 + 1.2^2)).\nThe table gives (in N·m): s = 0.05 gives 190.1; s = 0.10 gives 302.4; s = 0.15 gives 352.5; s = 0.20 gives 365.2; s = 0.25 gives 358.6; s = 0.30 gives 343.4; s = 0.35 gives 324.8.\ns_m = 0.25/√(0.3^2 + 1.2^2) = 0.2021. T_max = 365.20 N·m. The starting torque (s = 1) is 161.06 N·m.\nWatch out: the rotor values must be referred to the stator. The table shows 30 rows at most, so keep the step large enough.\n\n@Subject: EE\n@Topic: Power Plant\n\n## Load factor, capacity factor and diversity factor\nLoad factor = average demand/maximum demand = energy ÷ (maximum demand × hours). Capacity factor = energy ÷ (installed capacity × hours). Utilization factor = maximum demand/installed capacity. Demand factor = maximum demand/connected load. Diversity factor = (sum of the individual maximum demands)/(maximum demand of the whole group).\n1. Use kW and kWh. A year has 8760 hours (8784 in a leap year).\n2. Type each factor as a quotient. The load factor and capacity factor are always less than 1. The diversity factor is at least 1.\nExample: a 100 MW plant with a peak demand of 80 MW generates 350 GWh in a year.\nAverage demand = 350×10^6/8760 = 39954.3 kW. Load factor = 39954.3/80000 = 49.94%.\nCapacity factor = 350×10^6/(100000 × 8760) = 39.95%. Utilization factor = 80/100 = 80%.\nExample: four consumers with maximum demands of 30, 50, 40 and 20 MW, and a group maximum of 100 MW. Diversity factor = (30 + 50 + 40 + 20)/100 = 1.40.\nExample: a consumer has a connected load of 40 MW and a maximum demand of 30 MW. Demand factor = 30/40 = 0.75.\nWatch out: do not mix MW and kW. Energy in GWh is 10^6 kWh.\n\n## Hydro power and steam plant fuel consumption (SOLVE)\nHydro: P = ρ g Q H η = 9.81 Q H η kW, with Q in m³/s, H in m and η overall. Steam or diesel: fuel per hour = P × 3600/(η × heating value), with P in kW, the heating value in kJ/kg and η the overall efficiency. Heat rate = 3600/η in kJ/kWh.\n1. For the power, type 9.81 × Q × H × η.\n2. For the flow needed for a given power, put it in SOLVE with Q = X.\n3. For fuel, type P × 3600 ÷ (η × heating value).\nExample: a hydro plant with Q = 20 m³/s, H = 60 m, η = 0.85. P = 9.81 × 20 × 60 × 0.85 = 10006.2 kW.\nThe flow for 15000 kW: 9.81X × 60 × 0.85 = 15000 gives X = 29.98 m³/s.\nExample: a 50 MW steam station with an overall efficiency of 30% burns coal of 26000 kJ/kg. Heat rate = 3600/0.30 = 12000 kJ/kWh.\nCoal per hour = 50000 × 3600/(0.30 × 26000) = 23076.9 kg, which is 0.4615 kg per kWh.\nWatch out: use the overall efficiency, which includes the boiler, turbine and generator, when you find fuel.\n\n## Cost of energy: sinking fund depreciation and fixed charges\nSinking fund payment A = P i/((1 + i)^n - 1) for the first cost P (no salvage value). Annual fixed charges = depreciation + interest on the investment + taxes and insurance. Cost per kWh = (annual fixed charges)/(annual kWh) + running cost per kWh.\n1. Type the sinking fund payment with CALC, so that you can change n or i.\n2. Add interest and taxes, then divide by the annual energy.\n3. Add the running cost (fuel, labour, maintenance) per kWh.\nExample: a plant costs Php 500,000,000 with a life of 15 years, a rate of 10%, taxes and insurance of 2% of the first cost, and 120,000,000 kWh each year.\nDepreciation = 500000000 × 0.10/(1.10^15 - 1) = Php 15,736,888. Interest = Php 50,000,000. Taxes and insurance = Php 10,000,000.\nFixed charges = Php 75,736,888, which is Php 0.6311 per kWh.\nWith a running cost of Php 3.20 per kWh, the cost of energy is 0.6311 + 3.20 = Php 3.8311 per kWh.\nWatch out: the depreciation here is the sinking fund method. Straight line depreciation would give a different amount.\n\n@Subject: EE\n@Topic: Illuminations\n\n## Illumination from a point source (SOLVE)\nE = I/d² on a surface facing the source. On a horizontal surface E = I cos θ/d², with θ the angle from the vertical and cos θ = h/d. For a source at height h and a horizontal distance x, d² = h² + x².\n1. Find d = √(h² + x²) and cos θ = h/d.\n2. Type I × (h/d) ÷ d².\n3. To find the mounting height for a target illumination E at a horizontal distance x, type I X/(X^2 + x^2)^(3/2) = E in SOLVE, with your numbers for I, x and E, and X for the height.\nExample: a lamp of 1500 cd is 4 m above the floor. At a point 3 m to the side, d = √(4² + 3²) = 5 m and cos θ = 4/5 = 0.8. E = 1500 × 0.8/5^2 = 48.0 lux. Directly facing the lamp at that point it would be 1500/5^2 = 60.0 lux.\nThe inverse square law: if E = 100 lux at 2 m, then E = 100 × (2/4)^2 = 25 lux at 4 m.\nThe height for 30 lux at 3 m to the side: 1500X/(X^2 + 3^2)^(3/2) = 30. A starting value of 1 gives X = 0.5694 m. A starting value of 8 gives X = 5.9734 m.\nWatch out: this equation has two roots, because the illumination at the point first rises and then falls as the lamp is raised. At 3 m to the side the most this lamp can give is 64.2 lux, at a height of 2.121 m. Use both starting values.\n\n## Lumen method: number of lamps, room index and luminous efficacy\nNumber of lamps N = (E × A)/(F × UF × MF), where E is the required illumination in lux, A the floor area in m², F the lumens per lamp, UF the utilization factor and MF the maintenance factor. Room index K = L W/(H_m(L + W)), with H_m the mounting height above the working plane. Luminous efficacy = lumens/watts. A point source of intensity I cd emits F = 4π I
