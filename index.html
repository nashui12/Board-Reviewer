 lumens.\n1. Type the number of lamps and round up.\n2. Type the room index to look up UF in a table.\n3. For the flux of a point source, type 4π × I.\nExample: a room of 12 m × 8 m needs 300 lux. Each lamp gives 3200 lm, UF = 0.55 and MF = 0.8. N = 300 × 96/(3200 × 0.55 × 0.8) = 20.455, so use 21 lamps.\nThe room index, with H_m = 2.5 m, is 96/(2.5 × (12 + 8)) = 1.92.\nExample: a lamp of 100 cd in every direction emits 4π × 100 = 1256.6 lm. If it uses 40 W, its efficacy is 31.42 lm/W.\nWatch out: round the number of lamps up, never down. The maintenance factor is less than 1.\n\n@Subject: EE\n@Topic: Transmission Lines\n\n## Short transmission line: sending end, regulation and efficiency (CPLX)\nPer phase: V_s = V_r + I Z. Receiving-end current I = P/(√3 V_L pf), at the angle -cos⁻¹(pf) for lagging. Regulation = (|V_s| - |V_r|)/|V_r|. Line loss = 3 I² R. Efficiency = P_r/(P_r + loss).\n1. Use CPLX mode with Deg. Take the receiving-end phase voltage as the reference angle (0°).\n2. Type V_r(phase) + I∠-θ × (R + X i), and read the size with Abs.\n3. The line voltage is √3 times the phase voltage size.\nExample: a short line with Z = 4 + 8i Ω per phase delivers 10 MW at 0.8 lagging and 33 kV. I = 10000000/(√3 × 33000 × 0.8) = 218.69 A and V_r = 33000/√3 = 19052.56 V.\nV_s = 19052.56 + 218.69∠-36.87 × (4 + 8i) = 20820.4901∠2.4080° V per phase. The sending-end line voltage is √3 × 20820.49 = 36062 V.\nRegulation = (20820.49 - 19052.56)/19052.56 × 100 = 9.279%.\nLoss = 3 × 218.69^2 × 4 = 573.92 kW and the efficiency is 10/(10 + 0.5739) = 94.57%.\nWatch out: the regulation is found from the phase voltages. For a leading load the regulation can be negative.\n\n## Medium line, nominal pi: ABCD constants and sending end (CPLX)\nFor the nominal-π circuit with total series impedance Z and total shunt admittance Y: A = D = 1 + YZ/2, B = Z, C = Y(1 + YZ/4). Then V_s = A V_r + B I_r and I_s = C V_r + D I_r. Check: AD - BC = 1.\n1. Use CPLX mode with Deg. Type A, B, C and D with the complex values.\n2. Type V_s = A × V_r + B × I_r and I_s = C × V_r + D × I_r with the phase voltage and the current at its angle.\n3. Type A × D - B × C and check that it equals 1.\nExample: Z = 15 + 50i Ω and Y = 0.0004i S for the whole line. YZ = -0.0200 + 0.0060i.\nA = D = 1 + YZ/2 = 0.99000 + 0.00300i. B = 15.00 + 50.00i Ω. C = 0.0004i × (1 + YZ/4) = -0.0000006 + 0.0003980i S.\nThe load is 40 MW at 0.9 lagging at 66 kV. V_r = 66000/√3 = 38105.1 V and I_r = 388.79∠-25.84° A.\nV_s = 53607.30∠16.32° V per phase, so the sending-end line voltage is √3 × 53607.3 = 92851 V.\nI_s = 378.559∠-23.600° A. The check A × D - B × C = 1.00000 - 0.00000i.\nWatch out: use phase voltages with per-phase Z and Y. A difference from 1 in the check usually means a typing error.\n\n## Line inductance and capacitance with GMD and GMR\nGeometric mean distance GMD = (D₁₂ D₂₃ D₃₁)^(1/3). For a solid round conductor GMR = 0.7788 r. Inductance per phase L = 2×10^(-7) ln(GMD/GMR) H/m. Capacitance to neutral C = 2π ε₀/ln(GMD/r) F/m. Reactance X_L = 2π f L.\n1. Type the GMD with the cube root as ^(1/3).\n2. Type the inductance per metre, then multiply by 1000 for the value per kilometre.\n3. Type the capacitance per metre. The charging current is I_c = 2π f C V_phase.\nExample: conductors of radius 1 cm, spaced 3 m, 3 m and 6 m. GMD = (3 × 3 × 6)^(1/3) = 3.7798 m and GMR = 0.7788 × 0.01 = 0.007788 m.\nL = 2×10^(-7) × ln(3.7798/0.007788) = 1.237 × 10^{-6} H/m, which is 1.2370 mH per km.\nX_L at 60 Hz = 2π × 60 × 1.237 × 10^{-6} × 1000 = 0.4663 Ω per km.\nC = 2π × 8.854×10^(-12)/ln(3.7798/0.01) = 9.374 × 10^{-12} F/m, which is 9.374 nF per km.\nWatch out: use the radius, not the diameter. The inductance uses GMR, but the capacitance uses the actual radius.\n\n## Sag and length of a conductor span\nLevel supports: sag S = w L²/(8 T). Length of conductor ℓ = L + 8 S²/(3 L). Supports at different levels with height difference h: the lowest point is x₁ = L/2 - T h/(w L) from the lower support, x₂ = L - x₁ from the higher one, and the sags below each support are S₁ = w x₁²/(2T) and S₂ = w x₂²/(2T). Here w is the weight per metre, T the horizontal tension and L the span.\n1. Type the sag with w in N/m, T in N and L in m.\n2. Type the length.\n3. For unequal levels, type x₁ and x₂ first, then S₁ and S₂. Check S₂ - S₁ = h.\nExample: a span of 250 m, w = 12 N/m and T = 20000 N. S = 12 × 250^2/(8 × 20000) = 4.6875 m. ℓ = 250 + 8 × 4.6875^2/(3 × 250) = 250.2344 m.\nUnequal supports, h = 10 m: x₁ = 125 - 20000 × 10/(12 × 250) = 58.33 m and x₂ = 191.67 m. S₁ = 12 × 58.33^2/(2 × 20000) = 1.021 m and S₂ = 11.021 m. The check S₂ - S₁ = 10.000 m.\nWatch out: use the same unit of force for w × L and T. For wind or ice, use the resultant weight √((w + w_ice)² + w_wind²).\n\n@Subject: EE\n@Topic: Faults\n\n## Per-unit system: bases and changing the base\nZ_base = V_base²/S_base (V in volts and S in VA, or kV and MVA). I_base = S_base/(√3 V_base) for three phase. Z_pu = Z_ohms/Z_base. To change base: Z_new = Z_old × (S_new/S_old) × (V_old/V_new)².\n1. Choose S_base and V_base.\n2. Type Z_base and I_base. Then convert each impedance to per unit.\n3. To change a nameplate per-unit value to the system base, type Z_old × (S_new ÷ S_old) × (V_old ÷ V_new)^2.\nExample: S_base = 100 MVA and V_base = 13.8 kV. Z_base = 13.8^2/100 = 1.9044 Ω. I_base = 100000000/(√3 × 13800) = 4183.7 A.\nA 2 Ω reactance is 2/1.9044 = 1.0502 per unit.\nA generator rated 25 MVA and 13.2 kV has X = 0.20 per unit. On the 100 MVA, 13.8 kV base: X = 0.20 × (100/25) × (13.2/13.8)^2 = 0.7319 per unit.\nWatch out: use the base voltage of the section where the equipment is. Each side of a transformer has its own base voltage.\n\n## Three-phase fault level and a current-limiting reactor\nFor a bolted three-phase fault with a 1 per unit pre-fault voltage: I_f = 1/X_th per unit. Fault MVA = S_base/X_th. Sources in parallel combine as X₁ X₂/(X₁ + X₂), or as (X₁^(-1) + X₂^(-1))^(-1). A series reactor adds to X_th.\n1. Put all the reactances on one base, in per unit.\n2. Type the Thevenin reactance at the fault point.\n3. Type 1 ÷ X_th for the current in per unit, then multiply by I_base for amperes, or S_base ÷ X_th for the fault MVA.\nExample: base 100 MVA and 13.8 kV. A generator of X = 0.25 and the utility system of X = 0.10 feed a bus in parallel. X_th = 0.25 × 0.10/(0.25 + 0.10) = 0.07143 per unit.\nI_f = 1/0.07143 = 14.000 per unit. Fault level = 100/0.07143 = 1400.0 MVA. I_f = 14.000 × 4183.7 = 58572 A.\nTo limit the fault level to 800 MVA, the total reactance must be 100/800 = 0.125 per unit. The reactor needs 0.125 - 0.07143 = 0.05357 per unit, which is 0.05357 × 1.9044 = 0.1020 Ω.\nWatch out: a reactor in series with only one source adds to that branch before the parallel combination. Check where the reactor sits.\n\n## Symmetrical components of an unbalanced set (CPLX)\nWith the operator a = 1∠120°: V₀ = (V_a + V_b + V_c)/3, V₁ = (V_a + a V_b + a² V_c)/3 and V₂ = (V_a + a² V_b + a V_c)/3. To go back, V_a = V₀ + V₁ + V₂, V_b = V₀ + a² V₁ + a V₂ and V_c = V₀ + a V₁ + a² V₂.\n1. Use CPLX mode with Deg. Type a as 1∠120 and a² as 1∠240.\n2. Type each component with brackets around the whole sum, then divide by 3.\n3. Type V₀ + V₁ + V₂ and check that it equals V_a.\nExample: V_a = 100∠0°, V_b = 80∠-110° and V_c = 60∠120°.\nV₀ = (100∠0 + 80∠-110 + 60∠120) ÷ 3 = 16.1827∠-28.5655° V.\nV₁ = (100∠0 + 1∠120 × 80∠-110 + 1∠240 × 60∠120) ÷ 3 = 79.7295∠3.3296° V.\nV₂ = (100∠0 + 1∠240 × 80∠-110 + 1∠120 × 60∠120) ÷ 3 = 6.9282∠26.6477° V.\nCheck: V₀ + V₁ + V₂ = 100.0000∠0.0000° V, which is V_a.\nWatch out: the angles for the a operator are 120° and 240° (or -120°). The negative-sequence set has the opposite phase order.\n\n## Unsymmetrical faults: line-to-ground, line-to-line and double line-to-ground\nWith E = 1 per unit and sequence reactances X₁, X₂, X₀ at the fault point: Single line-to-ground I_f = 3E/(X₀ + X₁ + X₂). Line-to-line I_f = √3 E/(X₁ + X₂). Double line-to-ground: I₁ = E/(X₁ + X₂X₀/(X₂ + X₀)), I₀ = I₁ X₂/(X₂ + X₀) and the ground current I_g = 3 I₀. Multiply the per-unit result by I_base.\n1. Type the three sequence reactances in per unit on one base.\n2. Type the formula for the fault type.\n3. Multiply by I_base (from the previous per-unit item) for amperes.\nExample: X₁ = 0.2, X₂ = 0.2 and X₀ = 0.1 per unit, with I_base = 4183.7 A.\nSingle line-to-ground: 3/(0.1 + 0.2 + 0.2) = 6.000 per unit = 25102 A.\nLine-to-line: √3/(0.2 + 0.2) = 4.3301 per unit = 18116 A.\nDouble line-to-ground: X₂X₀/(X₂ + X₀) = 0.06667. I₁ = 1/(0.2 + 0.06667) = 3.750 per unit. I₀ = 3.750 × 0.2/(0.2 + 0.1) = 2.500 per unit, so I_g = 3 × 2.500 = 7.500 per unit = 31378 A.\nCompare with the three-phase fault at the same point: 1/0.2 = 5.000 per unit. The line-to-ground fault is larger here, because X₀ is smaller than X₁.\nWatch out: the sequence networks are connected differently for each fault type. Use the formula for the fault you have.\n\n@Section: Formulas\n@Source: Claude starter\n@Subject: Math\n@Topic: Algebra\n\n## Quadratic formula\nx = (-b ± sqrt(b^{2} - 4ac))/(2a)\nNote: the discriminant b^{2} - 4ac decides the roots. Positive: two real roots. Zero: one repeated root. Negative: two complex roots.\n\n## Sum and product of the roots\nx_{1} + x_{2} = -b/a\nx_{1} x_{2} = c/a\n\n## Laws of exponents\na^{m} a^{n} = a^{m+n}\na^{m}/a^{n} = a^{m-n}\n(a^{m})^{n} = a^{mn}\na^{-n} = 1/a^{n}\na^{1/n} = nth root of a\n\n## Laws of logarithms\nlog_{b}(xy) = log_{b} x + log_{b} y\nlog_{b}(x/y) = log_{b} x - log_{b} y\nlog_{b}(x^{n}) = n log_{b} x\nlog_{b} x = ln x / ln b\n\n## Arithmetic progression\na_{n} = a_{1} + (n - 1)d\nS_{n} = (n/2)(a_{1} + a_{n})\nS_{n} = (n/2)(2a_{1} + (n - 1)d)\n\n## Geometric progression\na_{n} = a_{1} r^{n-1}\nS_{n} = a_{1}(1 - r^{n})/(1 - r)\nS_{∞} = a_{1}/(1 - r), for |r| < 1\n\n## Harmonic progression\nThe reciprocals of a harmonic progression form an arithmetic progression.\nHarmonic mean of a and b: H = 2ab/(a + b)\n\n## Binomial theorem\n(x + y)^{n} = Σ C(n, k) x^{n-k} y^{k}\nThe term with y^{r} is the (r + 1)th term: C(n, r) x^{n-r} y^{r}\n\n## Permutations and combinations\nP(n, r) = n!/(n - r)!\nC(n, r) = n!/(r!(n - r)!)\nCircular arrangement of n objects: (n - 1)!\nn objects with p alike and q alike: n!/(p! q!)\n\n## Complex numbers\ni^{2} = -1\n|z| = sqrt(a^{2} + b^{2}), for z = a + bi\nz = r(cosθ + i sinθ) = r e^{iθ}\nDe Moivre: [r(cosθ + i sinθ)]^{n} = r^{n}(cos nθ + i sin nθ)\nEuler: e^{iθ} = cosθ + i sinθ\n\n## Variation\nDirect: y = kx\nInverse: y = k/x\nJoint: y = kxz\n\n## Remainder theorem\nThe remainder when f(x) is divided by (x - a) is f(a).\n(x - a) is a factor of f(x) when f(a) = 0.\n\n## Work and mixture problems\nWork together: 1/T = 1/T_{1} + 1/T_{2}\nMixture: Σ (amount × concentration) before = (total amount) × (final concentration)\n\n@Topic: Trigonometry\n\n## Basic ratios\nsinθ = opposite/hypotenuse\ncosθ = adjacent/hypotenuse\ntanθ = opposite/adjacent\ncscθ = 1/sinθ, secθ = 1/cosθ, cotθ = 1/tanθ\n\n## Pythagorean identities\nsin^{2}θ + cos^{2}θ = 1\n1 + tan^{2}θ = sec^{2}θ\n1 + cot^{2}θ = csc^{2}θ\n\n## Sum and difference of angles\nsin(A ± B) = sinA cosB ± cosA sinB\ncos(A ± B) = cosA cosB ∓ sinA sinB\ntan(A ± B) = (tanA ± tanB)/(1 ∓ tanA tanB)\n\n## Double angle\nsin2A = 2 sinA cosA\ncos2A = cos^{2}A - sin^{2}A = 2cos^{2}A - 1 = 1 - 2sin^{2}A\ntan2A = 2tanA/(1 - tan^{2}A)\n\n## Half angle\nsin(A/2) = ± sqrt((1 - cosA)/2)\ncos(A/2) = ± sqrt((1 + cosA)/2)\ntan(A/2) = sinA/(1 + cosA) = (1 - cosA)/sinA\n\n## Product to sum\nsinA cosB = (1/2)[sin(A + B) + sin(A - B)]\ncosA cosB = (1/2)[cos(A - B) + cos(A + B)]\nsinA sinB = (1/2)[cos(A - B) - cos(A + B)]\n\n## Sum to product\nsinA + sinB = 2 sin((A + B)/2) cos((A - B)/2)\nsinA - sinB = 2 cos((A + B)/2) sin((A - B)/2)\ncosA + cosB = 2 cos((A + B)/2) cos((A - B)/2)\ncosA - cosB = -2 sin((A + B)/2) sin((A - B)/2)\n\n## Law of sines and law of cosines\na/sinA = b/sinB = c/sinC = 2R\nc^{2} = a^{2} + b^{2} - 2ab cosC\nNote: R is the radius of the circle through the three vertices.\n\n## Area of a triangle\nArea = (1/2) a b sinC\nHeron: Area = sqrt(s(s - a)(s - b)(s - c)), with s = (a + b + c)/2\n\n## Radian measure\nπ rad = 180°\nArc length s = rθ\nSector area = (1/2) r^{2} θ\nθ must be in radians in these formulas.\n\n## Spherical triangle\nSpherical excess E = A + B + C - 180°\nArea = π R^{2} E/180°\ncos a = cos b cos c + sin b sin c cosA\nsinA/sin a = sinB/sin b = sinC/sin c\n\n@Topic: Geometry\n\n## Circle\nCircumference C = 2πr\nArea A = πr^{2}\nSegment area = (1/2) r^{2}(θ - sinθ), θ in radians\n\n## Regular polygon of n sides\nSum of interior angles = (n - 2)(180°)\nEach interior angle = (n - 2)(180°)/n\nNumber of diagonals = n(n - 3)/2\nArea = (n/4) s^{2} cot(180°/n)\n\n## Quadrilaterals\nTrapezoid: A = (1/2)(b_{1} + b_{2}) h\nRhombus: A = (1/2) d_{1} d_{2}\nCyclic quadrilateral (Brahmagupta): A = sqrt((s - a)(s - b)(s - c)(s - d)), s = (a + b + c + d)/2\nPtolemy: the product of the diagonals = the sum of the products of opposite sides\n\n## Equilateral triangle\nArea = (sqrt(3)/4) s^{2}\nHeight = (sqrt(3)/2) s\n\n## Prism and cylinder\nPrism: V = B h, lateral area = P h\nCylinder: V = πr^{2} h, lateral area = 2πrh, total area = 2πr(r + h)\n\n## Pyramid and cone\nPyramid: V = (1/3) B h\nCone: V = (1/3) πr^{2} h, lateral area = πrL, with L = sqrt(r^{2} + h^{2})\n\n## Sphere\nV = (4/3) πr^{3}\nArea = 4πr^{2}\nZone area = 2πRh\nSpherical cap volume = πh^{2}(3R - h)/3\n\n## Frustum and prismatoid\nFrustum of a cone: V = (πh/3)(R^{2} + Rr + r^{2})\nPrismatoid: V = (h/6)(A_{1} + 4A_{m} + A_{2})\n\n## Torus and Pappus\nTorus: V = 2π^{2} R r^{2}, area = 4π^{2} R r\nPappus: V = A (2π ȳ), the area times the distance travelled by its centroid\n\n## Regular polyhedra\nEuler: V - E + F = 2\nCube: diagonal = a sqrt(3)\nRegular tetrahedron: V = a^{3} sqrt(2)/12\nRegular octahedron: V = a^{3} sqrt(2)/3\n\n@Topic: Analytics 1\n\n## Distance, midpoint and slope\nd = sqrt((x_{2} - x_{1})^{2} + (y_{2} - y_{1})^{2})\nMidpoint = ((x_{1} + x_{2})/2, (y_{1} + y_{2})/2)\nm = (y_{2} - y_{1})/(x_{2} - x_{1})\n\n## Equations of a line\nPoint-slope: y - y_{1} = m(x - x_{1})\nSlope-intercept: y = mx + b\nTwo-intercept: x/a + y/b = 1\nGeneral: Ax + By + C = 0\n\n## Angle between two lines\ntanθ = (m_{2} - m_{1})/(1 + m_{1} m_{2})\nParallel: m_{1} = m_{2}. Perpendicular: m_{1} m_{2} = -1\n\n## Distance from a point to a line\nd = |A x_{1} + B y_{1} + C|/sqrt(A^{2} + B^{2})\nBetween parallel lines: d = |C_{1} - C_{2}|/sqrt(A^{2} + B^{2})\n\n## Area of a triangle from coordinates\nArea = (1/2)|x_{1}(y_{2} - y_{3}) + x_{2}(y_{3} - y_{1}) + x_{3}(y_{1} - y_{2})|\n\n## Circle\n(x - h)^{2} + (y - k)^{2} = r^{2}\nx^{2} + y^{2} + Dx + Ey + F = 0\nCenter (-D/2, -E/2), radius r = sqrt(D^{2}/4 + E^{2}/4 - F)\n\n## Parabola\n(y - k)^{2} = 4a(x - h)\nVertex (h, k), focus (h + a, k), directrix x = h - a\nLatus rectum = 4a\n\n## Ellipse\n(x - h)^{2}/a^{2} + (y - k)^{2}/b^{2} = 1\nc^{2} = a^{2} - b^{2}, e = c/a < 1\nLatus rectum = 2b^{2}/a, area = πab\n\n## Hyperbola\n(x - h)^{2}/a^{2} - (y - k)^{2}/b^{2} = 1\nc^{2} = a^{2} + b^{2}, e = c/a > 1\nAsymptotes: y - k = ±(b/a)(x - h)\n\n## General conic\nA x^{2} + B xy + C y^{2} + Dx + Ey + F = 0\nB^{2} - 4AC < 0: ellipse (a circle if A = C and B = 0)\nB^{2} - 4AC = 0: parabola\nB^{2} - 4AC > 0: hyperbola\nRotation to remove the xy term: tan2θ = B/(A - C)\n\n## Polar coordinates\nx = r cosθ, y = r sinθ\nr = sqrt(x^{2} + y^{2}), θ = tan^{-1}(y/x)\n\n@Topic: Analytics 2\n\n## Distance and direction cosines\nd = sqrt((x_{2} - x_{1})^{2} + (y_{2} - y_{1})^{2} + (z_{2} - z_{1})^{2})\nl = cosα, m = cosβ, n = cosγ\nl^{2} + m^{2} + n^{2} = 1\nAngle between two lines: cosθ = l_{1} l_{2} + m_{1} m_{2} + n_{1} n_{2}\n\n## Plane and sphere\nPlane: Ax + By + Cz + D = 0\nDistance from a point to the plane: d = |A x_{1} + B y_{1} + C z_{1} + D|/sqrt(A^{2} + B^{2} + C^{2})\nSphere: (x - h)^{2} + (y - k)^{2} + (z - l)^{2} = r^{2}\n\n## Cylindrical and spherical coordinates\nCylindrical: x = r cosθ, y = r sinθ, z = z\nSpherical (ρ, θ, φ with φ measured from the z-axis): x = ρ sinφ cosθ, y = ρ sinφ sinθ, z = ρ cosφ\nNote: books differ on which angle is called θ and which φ. Check your reviewer's convention.\n\n@Topic: Differential Calculus\n\n## Basic rules\nd(u^{n}) = n u^{n-1} du\nd(uv) = u dv + v du\nd(u/v) = (v du - u dv)/v^{2}\nChain rule: dy/dx = (dy/du)(du/dx)\n\n## Derivatives of trigonometric functions\nd(sin u) = cos u du\nd(cos u) = -sin u du\nd(tan u) = sec^{2}u du\nd(cot u) = -csc^{2}u du\nd(sec u) = sec u tan u du\nd(csc u) = -csc u cot u du\n\n## Derivatives of exponential and logarithmic functions\nd(e^{u}) = e^{u} du\nd(a^{u}) = a^{u} ln a du\nd(ln u) = du/u\nd(log_{a} u) = du/(u ln a)\n\n## Derivatives of inverse trigonometric functions\nd(sin^{-1}u) = du/sqrt(1 - u^{2})\nd(cos^{-1}u) = -du/sqrt(1 - u^{2})\nd(tan^{-1}u) = du/(1 + u^{2})\n\n## Derivatives of hyperbolic functions\nd(sinh u) = cosh u du\nd(cosh u) = sinh u du\nd(tanh u) = sech^{2}u du\n\n## Maxima and minima\nCritical points: f'(x) = 0\nf''(x) < 0: maximum. f''(x) > 0: minimum.\nPoint of inflection: f''(x) = 0 with a change of sign\n\n## Tangent and normal\nTangent: y - y_{1} = f'(x_{1})(x - x_{1})\nNormal slope = -1/f'(x_{1})\n\n## Curvature\nRadius of curvature R = [1 + (y')^{2}]^{3/2}/|y''|\nCurvature K = 1/R\n\n## Limits and L'Hôpital's rule\nlim (sin x)/x = 1, as x → 0\nlim (1 + 1/n)^{n} = e, as n → ∞\nIf f/g gives 0/0 or ∞/∞, then lim f/g = lim f'/g'\n\n@Topic: Integral Calculus\n\n## Basic integrals\n∫ u^{n} du = u^{n+1}/(n + 1) + C, for n ≠ -1\n∫ du/u = ln|u| + C\n∫ e^{u} du = e^{u} + C\n∫ a^{u} du = a^{u}/ln a + C\n\n## Integrals of trigonometric functions\n∫ sin u du = -cos u + C\n∫ cos u du = sin u + C\n∫ tan u du = -ln|cos u| + C\n∫ cot u du = ln|sin u| + C\n∫ sec u du = ln|sec u + tan u| + C\n∫ csc u du = ln|csc u - cot u| + C\n∫ sec^{2}u du = tan u + C\n∫ csc^{2}u du = -cot u + C\n∫ sec u tan u du = sec u + C\n\n## Integrals that give inverse functions\n∫ du/sqrt(a^{2} - u^{2}) = sin^{-1}(u/a) + C\n∫ du/(a^{2} + u^{2}) = (1/a) tan^{-1}(u/a) + C\n∫ du/(a^{2} - u^{2}) = (1/(2a)) ln|(a + u)/(a - u)| + C\n∫ du/sqrt(u^{2} ± a^{2}) = ln|u + sqrt(u^{2} ± a^{2})| + C\n\n## Integration by parts\n∫ u dv = uv - ∫ v du\n\n## Wallis formula\n∫_{0}^{π/2} sin^{m}x cos^{n}x dx = [(m - 1)(m - 3)...(n - 1)(n - 3)...]/[(m + n)(m + n - 2)...] × k\nk = π/2 when m and n are both even. Otherwise k = 1.\nNote: each product in the top counts down by 2 until it reaches 1 or 2. An empty product is 1.\n\n## Areas and volumes\nArea between curves: A = ∫ (y_{upper} - y_{lower}) dx\nDisk: V = π ∫ y^{2} dx\nWasher: V = π ∫ (R^{2} - r^{2}) dx\nShell: V = 2π ∫ x y dx\n\n## Length, surface and work\nArc length: L = ∫ sqrt(1 + (dy/dx)^{2}) dx\nSurface of revolution: S = 2π ∫ y ds\nWork: W = ∫ F dx\nAverage value = (1/(b - a)) ∫_{a}^{b} f(x) dx\n\n## Centroid and moment of inertia\nx̄ = ∫ x dA / A, ȳ = ∫ y dA / A\nI_{x} = ∫ y^{2} dA, I_{y} = ∫ x^{2} dA\n\n@Topic: Differential Equations\n\n## First-order equations\nSeparable: f(x) dx = g(y) dy, then integrate both sides\nLinear: dy/dx + P y = Q has the integrating factor e^{∫P dx}, so y e^{∫P dx} = ∫ Q e^{∫P dx} dx + C\nExact: M dx + N dy = 0 is exact when ∂M/∂y = ∂N/∂x\nBernoulli: dy/dx + P y = Q y^{n}. Let v = y^{1-n}.\nHomogeneous: let y = vx\n\n## Second-order, constant coefficients\na y'' + b y' + c y = 0\nCharacteristic equation: a m^{2} + b m + c = 0\nReal distinct roots: y = C_{1} e^{m_{1}x} + C_{2} e^{m_{2}x}\nRepeated root: y = (C_{1} + C_{2} x) e^{mx}\nComplex roots α ± βi: y = e^{αx}(C_{1} cosβx + C_{2} sinβx)\n\n## Variation of parameters\nWronskian: W = y_{1} y_{2}' - y_{2} y_{1}'\ny_{p} = -y_{1} ∫ (y_{2} g/W) dx + y_{2} ∫ (y_{1} g/W) dx\nNote: g(x) is the right side after the equation is written with y'' having coefficient 1.\n\n## Laplace transforms\nL{1} = 1/s\nL{t^{n}} = n!/s^{n+1}\nL{e^{at}} = 1/(s - a)\nL{sin kt} = k/(s^{2} + k^{2})\nL{cos kt} = s/(s^{2} + k^{2})\nL{sinh kt} = k/(s^{2} - k^{2})\nL{cosh kt} = s/(s^{2} - k^{2})\n\n## Laplace transform rules\nL{y'} = sY(s) - y(0)\nL{y''} = s^{2}Y(s) - s y(0) - y'(0)\nL{e^{at} f(t)} = F(s - a)\nL{t f(t)} = -F'(s)\n\n## Growth, decay and cooling\nGrowth or decay: N = N_{0} e^{kt}\nNewton's law of cooling: dT/dt = -k(T - T_{s}), so T = T_{s} + (T_{0} - T_{s}) e^{-kt}\n\n@Topic: Advanced Mathematics\n\n## Determinants and Cramer's rule\n2 × 2: |a b; c d| = ad - bc\nCramer's rule: x_{i} = D_{i}/D, where D_{i} replaces column i by the constants\ndet(AB) = det(A) det(B)\n\n## Inverse of a matrix\nA^{-1} = adj(A)/det(A)\nA matrix with det(A) = 0 has no inverse.\n\n## Eigenvalues\ndet(A - λI) = 0\nA v = λ v\nThe sum of the eigenvalues = the trace of A. The product = det(A).\n\n## Vector products\nA · B = |A||B| cosθ = a_{1}b_{1} + a_{2}b_{2} + a_{3}b_{3}\n|A × B| = |A||B| sinθ (the area of the parallelogram)\nA · (B × C) = the volume of the parallelepiped\n\n## Vector calculus\nGradient: ∇f = (∂f/∂x, ∂f/∂y, ∂f/∂z)\nDivergence: ∇ · F = ∂F_{x}/∂x + ∂F_{y}/∂y + ∂F_{z}/∂z\nLaplacian: ∇^{2}f = ∂^{2}f/∂x^{2} + ∂^{2}f/∂y^{2} + ∂^{2}f/∂z^{2}\nDivergence theorem: ∮ F · n dS = ∫ (∇ · F) dV\nStokes: ∮ F · dr = ∫ (∇ × F) · n dS\n\n## Taylor and Maclaurin series\nf(x) = Σ f^{(n)}(a)(x - a)^{n}/n!\ne^{x} = 1 + x + x^{2}/2! + x^{3}/3! + ...\nsin x = x - x^{3}/3! + x^{5}/5! - ...\ncos x = 1 - x^{2}/2! + x^{4}/4! - ...\nln(1 + x) = x - x^{2}/2 + x^{3}/3 - ... for -1 < x ≤ 1\n1/(1 - x) = 1 + x + x^{2} + ... for |x| < 1\n\n## Convergence tests\nRatio test: L = lim |a_{n+1}/a_{n}|. L < 1 converges. L > 1 diverges. L = 1 gives no answer.\np-series: Σ 1/n^{p} converges for p > 1.\n\n## Fourier series\nf(x) = a_{0}/2 + Σ (a_{n} cos nx + b_{n} sin nx), period 2π\na_{n} = (1/π) ∫_{-π}^{π} f(x) cos nx dx\nb_{n} = (1/π) ∫_{-π}^{π} f(x) sin nx dx\n\n## Gamma and beta functions\nΓ(n) = (n - 1)!\nΓ(n + 1) = n Γ(n)\nΓ(1/2) = sqrt(π)\nB(m, n) = Γ(m) Γ(n)/Γ(m + n)\n\n## Complex variables\nCauchy-Riemann: ∂u/∂x = ∂v/∂y and ∂u/∂y = -∂v/∂x\nCauchy integral formula: f(a) = (1/(2πi)) ∮ f(z)/(z - a) dz\n\n@Topic: Numerical Solutions\n\n## Root finding\nNewton-Raphson: x_{n+1} = x_{n} - f(x_{n})/f'(x_{n})\nBisection: x_{m} = (a + b)/2, keep the half where f changes sign\nFalse position: x = (a f(b) - b f(a))/(f(b) - f(a))\nSecant: x_{n+1} = x_{n} - f(x_{n})(x_{n} - x_{n-1})/(f(x_{n}) - f(x_{n-1}))\nFixed point: x_{n+1} = g(x_{n}), converges when |g'(x)| < 1\n\n## Numerical integration\nTrapezoidal: ∫ f dx ≈ (h/2)[f_{0} + 2(f_{1} + f_{2} + ... + f_{n-1}) + f_{n}]\nSimpson's 1/3 (n even): (h/3)[f_{0} + 4(f_{1} + f_{3} + ...) + 2(f_{2} + f_{4} + ...) + f_{n}]\nSimpson's 3/8 (n a multiple of 3): (3h/8)[f_{0} + 3f_{1} + 3f_{2} + 2f_{3} + ... + f_{n}]\n\n## Differential equations\nEuler: y_{n+1} = y_{n} + h f(x_{n}, y_{n})\nHeun (modified Euler): y_{n+1} = y_{n} + (h/2)[f(x_{n}, y_{n}) + f(x_{n+1}, y*_{n+1})]\nRunge-Kutta 4: y_{n+1} = y_{n} + (h/6)(k_{1} + 2k_{2} + 2k_{3} + k_{4})\n\n## Interpolation\nLagrange: P(x) = Σ y_{i} Π_{j≠i} (x - x_{j})/(x_{i} - x_{j})\nNewton forward: y = y_{0} + pΔy_{0} + p(p - 1)Δ^{2}y_{0}/2! + ..., with p = (x - x_{0})/h\n\n@Topic: Statistics and Probability\n\n## Averages\nMean: x̄ = Σ x/n\nGeometric mean = (x_{1} x_{2} ... x_{n})^{1/n}\nHarmonic mean = n/Σ(1/x)\nWeighted mean = Σ w x/Σ w\n\n## Spread\nPopulation variance: σ^{2} = Σ(x - μ)^{2}/N\nSample variance: s^{2} = Σ(x - x̄)^{2}/(n - 1)\nStandard deviation = sqrt(variance)\nCoefficient of variation = σ/μ\nStandard score: z = (x - μ)/σ\n\n## Probability rules\nP(A or B) = P(A) + P(B) - P(A and B)\nP(A | B) = P(A and B)/P(B)\nIndependent events: P(A and B) = P(A) P(B)\nBayes: P(A | B) = P(B | A) P(A)/P(B)\n\n## Binomial distribution\nP(x) = C(n, x) p^{x} q^{n-x}, q = 1 - p\nMean = np, variance = npq\n\n## Poisson distribution\nP(x) = e^{-λ} λ^{x}/x!\nMean = variance = λ\n\n## Expected value and Chebyshev\nE(X) = Σ x P(x)\nChebyshev: P(|X - μ| < kσ) ≥ 1 - 1/k^{2}\n\n## Regression and correlation\nSlope b = (nΣxy - ΣxΣy)/(nΣx^{2} - (Σx)^{2})\nIntercept a = ȳ - b x̄\nr = (nΣxy - ΣxΣy)/sqrt([nΣx^{2} - (Σx)^{2}][nΣy^{2} - (Σy)^{2}])\n\n## Confidence interval and chi-square\nMean: x̄ ± z σ/sqrt(n)\nStandard error = σ/sqrt(n)\nχ^{2} = Σ (O - E)^{2}/E\n\n@Section: Formulas\n@Source: Claude starter\n@Subject: ESAS\n@Topic: Engineering Economics\n\n## Simple interest\nI = P r t\nF = P(1 + r t)\nOrdinary simple interest uses a 360-day year. Exact simple interest uses the actual 365 days (366 in a leap year).\n\n## Compound interest\nF = P(1 + i)^{n}\nP = F/(1 + i)^{n}\ni = r/m per period, and n = m t periods, for a nominal rate r compounded m times a year\n\n## Effective and continuous rates\nEffective rate: i_{eff} = (1 + r/m)^{m} - 1\nContinuous compounding: F = P e^{rt}\nEffective rate for continuous compounding: i_{eff} = e^{r} - 1\nDiscount rate: d = i/(1 + i)\n\n## Ordinary annuity (payments at the end of each period)\nF = A[(1 + i)^{n} - 1]/i\nP = A[1 - (1 + i)^{-n}]/i\nA = P i/[1 - (1 + i)^{-n}]\nSinking fund payment: A = F i/[(1 + i)^{n} - 1]\n\n## Annuity due (payments at the start of each period)\nF = A[((1 + i)^{n} - 1)/i](1 + i)\nP = A[1 + (1 - (1 + i)^{-(n-1)})/i]\n\n## Deferred annuity and perpetuity\nDeferred annuity: P = A[(1 - (1 + i)^{-n})/i](1 + i)^{-m}, with m periods of deferment\nPerpetuity: P = A/i\nCapitalized cost = first cost + (cost of renewing every n years)/((1 + i)^{n} - 1) + (yearly cost)/i\n\n## Gradient series\nArithmetic gradient, uniform equivalent: A = G[1/i - n/((1 + i)^{n} - 1)]\nArithmetic gradient, present worth: P = (G/i)[(1 - (1 + i)^{-n})/i - n(1 + i)^{-n}]\n\n## Straight line and sinking fund depreciation\nStraight line: d = (FC - SV)/n\nBook value after m years: BV_{m} = FC - m d\nSinking fund: A = (FC - SV) i/((1 + i)^{n} - 1)\nBook value after m years: BV_{m} = FC - A[((1 + i)^{m} - 1)/i]\n\n## Declining balance and sum of the years digits\nDeclining balance: BV_{m} = FC(1 - k)^{m}\nk = 1 - (SV/FC)^{1/n}\nDouble declining balance: k = 2/n\nSum of the years digits: sum = n(n + 1)/2\nd_{m} = (FC - SV)(n - m + 1)/sum\n\n## Service output depreciation\nd = (FC - SV) × (units produced)/(total units in the life)\n\n## Break-even\nTotal cost = fixed cost + (variable cost per unit) × (units)\nBreak-even units = fixed cost/(price per unit - variable cost per unit)\n\n## Bonds\nPrice = C[1 - (1 + i)^{-n}]/i + F(1 + i)^{-n}\nC = bond rate × face value (the coupon each period), F = redemption value\nCurrent yield = annual coupon/price\n\n## Measures of worth\nBenefit-cost ratio = B/C\nPayback period = first cost/yearly net savings\nRate of return = net profit/investment\n\n## Inflation\n(1 + i_{f}) = (1 + i)(1 + f)\ni_{f} = i + f + i f\nReal interest: i = (i_{f} - f)/(1 + f)\nRule of 72 (approximate): years to double ≈ 72/(interest rate in %)\n\n@Topic: Project Management\n\n## PERT estimate\nt_{e} = (t_{o} + 4 t_{m} + t_{p})/6\nσ = (t_{p} - t_{o})/6, variance = σ^{2}\nTriangular estimate = (t_{o} + t_{m} + t_{p})/3\n\n## Critical path calculations\nEF = ES + duration\nES = the largest EF of the predecessors\nLS = LF - duration\nLF = the smallest LS of the successors\nTotal float = LS - ES = LF - EF\nFree float = ES of the next activity - EF of this one\nNote: the critical path is the longest path. Its activities have zero total float.\n\n## Earned value\nEV = percent complete × BAC\nCV = EV - AC, SV = EV - PV\nCPI = EV/AC, SPI = EV/PV\nA value below 1 (or negative for CV and SV) is bad: over budget or behind schedule.\n\n## Forecasts\nEAC = BAC/CPI (the cost trend continues)\nETC = EAC - AC\nVAC = BAC - EAC\nTCPI = (BAC - EV)/(BAC - AC)\n\n## Communication channels\nChannels = n(n - 1)/2, for n people\n\n## Expected monetary value\nEMV = probability × impact\nAdd the EMV of all the risks for the contingency reserve.\n\n@Topic: Mechanics\n\n## Equilibrium\nΣF_{x} = 0, ΣF_{y} = 0, ΣM = 0\nLami's theorem (three concurrent forces): F_{1}/sinα = F_{2}/sinβ = F_{3}/sinγ\n\n## Resultant of forces\nR = sqrt((ΣF_{x})^{2} + (ΣF_{y})^{2})\nθ = tan^{-1}(ΣF_{y}/ΣF_{x})\nMoment: M = F d\nVarignon: the moment of the resultant = the sum of the moments of the components\n\n## Friction\nF ≤ μ N\nAngle of friction: tanφ = μ\nBelt friction: T_{1}/T_{2} = e^{μβ}, β in radians\n\n## Centroids\nx̄ = Σ A x/Σ A, ȳ = Σ A y/Σ A\nTriangle: h/3 from the base\nSemicircle and quarter circle: 4r/(3π) from the diameter\n\n## Moment of inertia\nRectangle about its centroid: I = b h^{3}/12\nRectangle about its base: I = b h^{3}/3\nTriangle about its centroid: I = b h^{3}/36\nCircle: I = πr^{4}/4 = πd^{4}/64\nParallel axis: I = Ī + A d^{2}\nRadius of gyration: k = sqrt(I/A)\n\n## Cables\nParabolic cable with a uniform load w per horizontal metre: y = w x^{2}/(2H)\nTension at a support: T = sqrt(H^{2} + V^{2})\n\n@Topic: Mechanics 2\n\n## Uniform acceleration\nv = v_{0} + a t\ns = v_{0} t + (1/2) a t^{2}\nv^{2} = v_{0}^{2} + 2 a s\n\n## Projectile\nx = v_{0} cosθ × t\ny = v_{0} sinθ × t - (1/2) g t^{2}\nRange R = v_{0}^{2} sin2θ/g\nMaximum height = v_{0}^{2} sin^{2}θ/(2g)\nTime of flight = 2 v_{0} sinθ/g\n\n## Circular motion\na_{c} = v^{2}/r = ω^{2} r\nF_{c} = m v^{2}/r\nv = r ω, a_{t} = r α\nBanking angle without friction: tanθ = v^{2}/(g r)\n\n## Rotation with constant acceleration\nω = ω_{0} + α t\nθ = ω_{0} t + (1/2) α t^{2}\nω^{2} = ω_{0}^{2} + 2 α θ\n\n## Work, energy and power\nW = F s cosθ\nKE = (1/2) m v^{2}, PE = m g h\nWork-energy: W = ΔKE\nPower: P = F v = T ω\n\n## Impulse and momentum\nF Δt = m Δv\nConservation: m_{1} v_{1} + m_{2} v_{2} = m_{1} v_{1}' + m_{2} v_{2}'\nCoefficient of restitution: e = (v_{2}' - v_{1}')/(v_{1} - v_{2})\n\n## Rotational dynamics\nT = I α\nKE_{rot} = (1/2) I ω^{2}\nPower = T ω\n\n## Simple harmonic motion\nω = sqrt(k/m), period T = 2π sqrt(m/k)\nPendulum: T = 2π sqrt(L/g)\n\n@Topic: Physics 1\n\n## Metric prefixes\ntera 10^{12}, giga 10^{9}, mega 10^{6}, kilo 10^{3}\nmilli 10^{-3}, micro 10^{-6}, nano 10^{-9}, pico 10^{-12}, femto 10^{-15}\n\n@Topic: Physics 2\n\n## Waves and sound\nv = f λ\nSpeed of sound in air: v ≈ 331 + 0.6 T (m/s, T in °C)\nDoppler: f' = f(v ± v_{o})/(v ∓ v_{s})\nSound level: β = 10 log(I/I_{0}), with I_{0} = 10^{-12} W/m^{2}\n\n## Lenses and mirrors\n1/f = 1/p + 1/q\nMagnification M = -q/p = image height/object height\n\n## Refraction\nn_{1} sinθ_{1} = n_{2} sinθ_{2}\nCritical angle: sinθ_{c} = n_{2}/n_{1}, with n_{2} < n_{1}\nn = c/v\n\n## Modern physics\nE = m c^{2}\nPhoton energy: E = h f, h = 6.626 × 10^{-34} J s\nde Broglie: λ = h/p\n\n@Topic: Thermodynamics\n@IdTopic: Physics\n\n## Heat\nQ = m c ΔT\nQ = m L (change of phase)\nThermal expansion: ΔL = α L ΔT\nConduction: H = k A ΔT/L\nRadiation: P = ε σ A T^{4}, σ = 5.67 × 10^{-8} W/(m^{2} K^{4})\n\n@Topic: Chemistry\n\n## Moles and concentration\nn = mass/molar mass = N/N_{A}, with N_{A} = 6.022 × 10^{23}\nMolarity M = moles of solute/litres of solution\nMolality m = moles of solute/kg of solvent\nNormality N = M × equivalents per mole\nDilution: M_{1} V_{1} = M_{2} V_{2}\n\n## Gas laws\nIdeal gas: P V = n R T\nR = 0.08206 L atm/(mol K) = 8.314 J/(mol K)\nBoyle: P_{1} V_{1} = P_{2} V_{2}\nCharles: V_{1}/T_{1} = V_{2}/T_{2}\nGay-Lussac: P_{1}/T_{1} = P_{2}/T_{2}\nCombined: P_{1} V_{1}/T_{1} = P_{2} V_{2}/T_{2}\nTemperature in kelvin: K = °C + 273.15\n\n## Gas mixtures and diffusion\nDalton: P_{total} = P_{1} + P_{2} + ...\nGraham: rate_{1}/rate_{2} = sqrt(M_{2}/M_{1})\n\n## Acids and bases\npH = -log[H^{+}]\npOH = -log[OH^{-}]\npH + pOH = 14 at 25 °C\nK_{w} = [H^{+}][OH^{-}] = 10^{-14}\n\n## Electrolysis (Faraday)\nm = (M I t)/(n F), F = 96,485 C per mole of electrons\nCharge Q = I t\n\n@Topic: Computer and Logic\n\n## Number systems\nBinary to hexadecimal: group the bits in fours from the right.\nBinary to octal: group the bits in threes from the right.\nDecimal to binary: divide by 2 repeatedly and read the remainders from the last to the first.\nn bits hold 2^{n} different values (0 to 2^{n} - 1 unsigned).\n\n## Two's complement\nNegative number: invert all the bits, then add 1.\nRange of n bits: -2^{n-1} to 2^{n-1} - 1\n\n## Boolean laws\nA + 0 = A, A · 1 = A\nA + A' = 1, A · A' = 0\nA + A = A, A · A = A\nA + AB = A\nA + A'B = A + B\n\n## De Morgan's theorems\n(AB)' = A' + B'\n(A + B)' = A' B'\n\n## Exclusive OR\nA ⊕ B = A'B + AB'\nA XNOR B = AB + A'B'\nNAND and NOR gates can each build any other gate.\n\n## Storage units\n1 byte = 8 bits\n1 KB = 1024 bytes, 1 MB = 1024 KB, 1 GB = 1024 MB\n\n@Topic: Strength of Materials\n\n## Stress and strain\nNormal stress σ = P/A\nShear stress τ = V/A\nStrain ε = δ/L\nHooke's law: σ = E ε\nDeformation: δ = P L/(A E)\n\n## Poisson's ratio and moduli\nν = -(lateral strain)/(axial strain)\nE = 2G(1 + ν)\n\n## Thermal stress\nFree expansion: δ = α L ΔT\nFully restrained: σ = E α ΔT\n\n## Thin-walled pressure vessels\nCylinder, hoop stress: σ_{t} = p D/(2t)\nCylinder, longitudinal stress: σ_{l} = p D/(4t)\nSphere: σ = p D/(4t)\n\n## Torsion\nτ = T ρ/J\nSolid shaft: τ_{max} = 16 T/(π d^{3}), J = π d^{4}/32\nHollow shaft: J = π(D^{4} - d^{4})/32\nAngle of twist: θ = T L/(J G)\nPower: P = 2π f T = T ω\n\n## Beams\nFlexure: σ = M y/I\nShear: τ = V Q/(I b)\nRectangle: I = b h^{3}/12, section modulus S = b h^{2}/6\n\n## Beam deflections (maximum)\nCantilever, end load: δ = P L^{3}/(3 E I)\nCantilever, uniform load: δ = w L^{4}/(8 E I)\nSimply supported, central load: δ = P L^{3}/(48 E I)\nSimply supported, uniform load: δ = 5 w L^{4}/(384 E I)\n\n## Columns\nEuler: P_{cr} = π^{2} E I/(K L)^{2}\nK = 1 for pinned ends, 0.5 for fixed ends, 2 for one end fixed and the other free.\n\n## Combined stress (Mohr's circle)\nσ_{1,2} = (σ_{x} + σ_{y})/2 ± sqrt(((σ_{x} - σ_{y})/2)^{2} + τ_{xy}^{2})\nτ_{max} = sqrt(((σ_{x} - σ_{y})/2)^{2} + τ_{xy}^{2})\ntan2θ_{p} = 2τ_{xy}/(σ_{x} - σ_{y})\n\n## Strain energy, safety and connections\nStrain energy: U = P^{2} L/(2 A E)\nFactor of safety = ultimate stress/allowable stress\nRivet in shear: τ = 4P/(π d^{2}) per shear plane\nBearing: σ_{b} = P/(d t)\n\n## Helical springs\nτ = 8 P D/(π d^{3})\nδ = 8 P D^{3} N/(G d^{4})\n\n@Topic: Fluid Mechanics\n\n## Pressure\np = γ h = ρ g h\nγ = ρ g\nSpecific gravity S = ρ/ρ_{water}\nAbsolute pressure = gauge pressure + atmospheric pressure\n\n## Hydrostatic force on a plane surface\nF = γ h_{cg} A\nCenter of pressure: y_{cp} = y_{cg} + I_{cg}/(A y_{cg})\nNote: distances are measured along the incline from the water surface.\n\n## Buoyancy\nF_{B} = γ V_{displaced}\nA floating body displaces its own weight of fluid.\n\n## Continuity and Bernoulli\nQ = A v\nA_{1} v_{1} = A_{2} v_{2}\np_{1}/γ + v_{1}^{2}/(2g) + z_{1} = p_{2}/γ + v_{2}^{2}/(2g) + z_{2} + h_{L}\n\n## Orifices\nTorricelli: v = sqrt(2 g h)\nQ = C_{d} A sqrt(2 g h)\n\n## Flow regimes and friction\nReynolds number: Re = ρ v D/μ = v D/ν\nLaminar below about 2000. Turbulent above about 4000.\nDarcy-Weisbach: h_{f} = f L v^{2}/(2 g D)\nLaminar flow: f = 64/Re\n\n## Open channels and weirs\nManning: V = (1/n) R^{2/3} S^{1/2}\nChezy: V = C sqrt(R S)\nRectangular weir: Q = (2/3) C_{d} L sqrt(2g) H^{3/2}\n\n## Pumps and momentum\nPump power: P = γ Q H/η\nForce from a jet: F = ρ Q (v_{2} - v_{1})\nViscosity: τ = μ du/dy\nCapillary rise: h = 4σ cosθ/(γ d)\n\n@Topic: Thermodynamics\n\n## First law and ideal gas\nQ = ΔU + W\nP V = m R T, R = R_{u}/M\nc_{p} - c_{v} = R, k = c_{p}/c_{v}\nΔU = m c_{v} ΔT, ΔH = m c_{p} ΔT\n\n## Ideal gas processes\nIsothermal: P V = constant, W = m R T ln(V_{2}/V_{1})\nIsobaric: W = P ΔV\nIsochoric: W = 0\nAdiabatic: P V^{k} = constant, W = (P_{1} V_{1} - P_{2} V_{2})/(k - 1)\nAdiabatic: T_{2}/T_{1} = (P_{2}/P_{1})^{(k-1)/k}\nPolytropic: P V^{n} = constant\n\n## Heat engines and refrigerators\nThermal efficiency: η = W/Q_{in} = 1 - Q_{out}/Q_{in}\nCarnot: η = 1 - T_{L}/T_{H}\nRefrigerator: COP = Q_{L}/W\nCarnot refrigerator: COP = T_{L}/(T_{H} - T_{L})\nHeat pump: COP = Q_{H}/W\n\n## Entropy\nΔs = ∫ dQ/T\nIdeal gas: Δs = c_{p} ln(T_{2}/T_{1}) - R ln(P_{2}/P_{1})\n\n## Air-standard cycles\nOtto: η = 1 - 1/r^{k-1}\nDiesel: η = 1 - (1/r^{k-1})[(r_{c}^{k} - 1)/(k(r_{c} - 1))]\nBrayton: η = 1 - 1/r_{p}^{(k-1)/k}\n\n## Steam\nh = h_{f} + x h_{fg}\nQuality x = (mass of vapor)/(total mass)\nRankine: η = (W_{turbine} - W_{pump})/Q_{in}\n\n## Heat transfer\nConduction: q = k A ΔT/L\nConvection: q = h A ΔT\nRadiation: q = ε σ A T^{4}\n\n@Topic: Communications\n\n## Decibels\ndB = 10 log(P_{2}/P_{1}) = 20 log(V_{2}/V_{1})\ndBm = 10 log(P/1 mW)\n\n## Amplitude modulation\nm = V_{m}/V_{c}\nBandwidth B = 2 f_{m}\nTotal power: P_{t} = P_{c}(1 + m^{2}/2)\nEach sideband: P_{c} m^{2}/4\n\n## Frequency modulation\nModulation index: m_{f} = Δf/f_{m}\nCarson's rule: B ≈ 2(Δf + f_{m})\n\n## Noise\nThermal noise power: N = k T B, k = 1.38 × 10^{-23} J/K\nNoise voltage: v_{n} = sqrt(4 k T B R)\nSignal-to-noise ratio: SNR = P_{s}/P_{n}, in dB: 10 log(P_{s}/P_{n})\nNoise factor F = SNR_{in}/SNR_{out}, noise figure NF = 10 log F\nFriis: F_{total} = F_{1} + (F_{2} - 1)/G_{1} + (F_{3} - 1)/(G_{1} G_{2}) + ...\n\n## Digital communications\nNyquist sampling: f_{s} ≥ 2 f_{max}\nPCM bit rate = f_{s} × (bits per sample)\nShannon capacity: C = B log_{2}(1 + S/N)\nNyquist channel rate: C = 2 B log_{2} M\nBaud rate = bit rate/(bits per symbol)\n\n## Waves and antennas\nλ = c/f, c = 3 × 10^{8} m/s\nHalf-wave dipole length in feet = 468/f (f in MHz)\nQuarter-wave length in feet = 234/f (f in MHz)\nRadio horizon: d (miles) = sqrt(2 h) with h in feet\nFree-space path loss: L (dB) = 32.44 + 20 log d (km) + 20 log f (MHz)\n\n## Transmission lines\nZ_{0} = sqrt(L/C)\nReflection coefficient: Γ = (Z_{L} - Z_{0})/(Z_{L} + Z_{0})\nSWR = (1 + |Γ|)/(1 - |Γ|)\n\n## Superheterodyne receivers\nf_{LO} = f_{s} + f_{IF}\nImage frequency: f_{image} = f_{s} + 2 f_{IF}\n\n## Optical fiber\nNumerical aperture: NA = sqrt(n_{1}^{2} - n_{2}^{2})\nAttenuation in dB = (loss in dB per km) × (length in km)\n\n@Section: Formulas\n@Source: Claude starter\n\n@Subject: EE\n@Topic: Electrostatics\n\n## Coulomb's law and electric field\nF = k Q_{1} Q_{2}/r^{2}\nk = 1/(4 π ε_{0}) = 9 × 10^{9} N·m^{2}/C^{2}, ε_{0} = 8.854 × 10^{-12} F/m\nE = F/Q = k Q/r^{2}\nLine charge: E = λ/(2 π ε r)\nInfinite sheet of charge: E = σ/(2 ε)\nD = ε E, with ε = ε_{r} ε_{0}\n\n## Potential and Gauss's law\nV = k Q/r\nV_{AB} = W/Q, the work per unit charge in moving from B to A\nE = -dV/dr, and in a uniform field E = V/d\nGauss's law: the electric flux out of a closed surface equals the enclosed charge Q\n\n## Capacitance\nC = Q/V\nParallel plates: C = ε A/d\nIsolated sphere: C = 4 π ε R\nConcentric spheres: C = 4 π ε a b/(b - a)\nCoaxial cylinders: C = 2 π ε L/ln(b/a)\nParallel: C_{eq} = C_{1} + C_{2} + C_{3}\nSeries: 1/C_{eq} = 1/C_{1} + 1/C_{2} + 1/C_{3}\n\n## Stored energy\nW = (1/2) C V^{2} = (1/2) Q V = Q^{2}/(2 C)\nEnergy density = (1/2) ε E^{2}\nForce between parallel plates: F = (1/2) ε A V^{2}/d^{2}\n\n@Topic: Electromagnetics\n\n## Magnetic quantities\nB = Φ/A (tesla, Wb/m^{2})\nB = μ H, with μ = μ_{r} μ_{0} and μ_{0} = 4 π × 10^{-7} H/m\nAmpere's law: the line integral of H around a closed path equals the enclosed current\nLong straight wire: H = I/(2 π r)\nToroid: H = N I/(2 π r)\nSolenoid: H = (N I)/(ℓ)\nCenter of a circular loop: H = N I/(2 R)\n\n## Forces\nOn a conductor: F = B I L sin θ\nOn a moving charge: F = Q v B sin θ\nBetween two parallel wires: F/L = μ_{0} I_{1} I_{2}/(2 π d) = 2 × 10^{-7} I_{1} I_{2}/d N/m\n\n## Magnetic circuits\nmmf = N I = Φ R\nReluctance: R = (ℓ)/(μ A)\nΦ = N I/R\n\n## Induced emf and inductance\nFaraday: e = -N dΦ/dt\nMotional emf: e = B L v sin θ\nInductance: L = N Φ/I = N^{2}/R\nSolenoid: L = (μ N^{2} A)/(ℓ)\nv = L di/dt\nEnergy: W = (1/2) L I^{2}\nEnergy density = (1/2) B H\nMutual inductance: M = k sqrt(L_{1} L_{2})\nSeries coils: L_{total} = L_{1} + L_{2} ± 2 M\n\n@Topic: AC Circuits 1\n\n## DC circuit basics\nV = I R\nP = V I = I^{2} R = V^{2}/R\nSeries: R_{eq} = R_{1} + R_{2} + R_{3}\nParallel: 1/R_{eq} = 1/R_{1} + 1/R_{2} + 1/R_{3}\nTwo in parallel: R_{eq} = R_{1} R_{2}/(R_{1} + R_{2})\nVoltage divider: V_{x} = V R_{x}/R_{T}\nCurrent divider (two branches): I_{1} = I R_{2}/(R_{1} + R_{2})\nMaximum power transfer: R_{L} = R_{Th}, P_{max} = V_{Th}^{2}/(4 R_{Th})\nBalanced delta to wye: R_{Y} = R_{Δ}/3\n\n## Sinusoids\nv = V_{m} sin(ω t + θ)\nω = 2 π f, T = 1/f\nV_{rms} = V_{m}/sqrt(2) = 0.707 V_{m}\nAverage over a half cycle: V_{avg} = 2 V_{m}/π = 0.637 V_{m}\nForm factor = V_{rms}/V_{avg} = 1.11\nCrest factor = V_{m}/V_{rms} = 1.414\n\n## Impedance\nX_{L} = ω L\nX_{C} = 1/(ω C)\nZ = R + j(X_{L} - X_{C})\n|Z| = sqrt(R^{2} + X^{2})\nθ = arctan(X/R)\nAdmittance: Y = 1/Z = G + j B\n\n## AC power\nApparent power: S = V I (VA)\nReal power: P = V I cos θ (W)\nReactive power: Q = V I sin θ (var)\nS^{2} = P^{2} + Q^{2}\nPower factor = cos θ = P/S\nComplex power: S = V I^{*}\n\n## Power factor correction\nQ_{C} = P(tan θ_{1} - tan θ_{2})\nC = Q_{C}/(ω V^{2})\n\n## Resonance\nω_{0} = 1/sqrt(L C)\nf_{0} = 1/(2 π sqrt(L C))\nSeries: Q = ω_{0} L/R = (1/R) sqrt(L/C)\nParallel (ideal): Q = R/(ω_{0} L) = R sqrt(C/L)\nBandwidth: BW = f_{0}/Q = f_{2} - f_{1}\nf_{0} = sqrt(f_{1} f_{2})\n\n@Topic: AC Circuits 2\n\n## Balanced three-phase connections\nWye: V_{L} = sqrt(3) V_{ph}, I_{L} = I_{ph}\nDelta: V_{L} = V_{ph}, I_{L} = sqrt(3) I_{ph}\nDelta to wye impedance: Z_{Y} = Z_{Δ}/3\n\n## Three-phase power\nS = sqrt(3) V_{L} I_{L}\nP = sqrt(3) V_{L} I_{L} cos θ = 3 V_{ph} I_{ph} cos θ\nQ = sqrt(3) V_{L} I_{L} sin θ\nθ is the angle between the phase voltage and the phase current\n\n## Two-wattmeter method\nP = W_{1} + W_{2}\nQ = sqrt(3)(W_{1} - W_{2})\ntan θ = sqrt(3)(W_{1} - W_{2})/(W_{1} + W_{2})\nPower factor = cos θ\nEqual readings mean unity power factor. One reading of zero means a power factor of 0.5.\n\n## Symmetrical components\na = 1∠120° = -0.5 + j 0.866\n1 + a + a^{2} = 0\nV_{a} = V_{0} + V_{1} + V_{2}\nV_{0} = (V_{a} + V_{b} + V_{c})/3\nV_{1} = (V_{a} + a V_{b} + a^{2} V_{c})/3\nV_{2} = (V_{a} + a^{2} V_{b} + a V_{c})/3\nNeutral current: I_{n} = 3 I_{0}\n\n@Topic: Transients\n\n## First-order circuits\nRC time constant: τ = R C\nRL time constant: τ = L/R\nGeneral: x(t) = x_{f} + (x_{0} - x_{f}) e^{-t/τ}\nCapacitor charging: v_{C} = V(1 - e^{-t/τ})\nCapacitor discharging: v_{C} = V_{0} e^{-t/τ}\nInductor current rising: i = (V/R)(1 - e^{-t/τ})\nInductor current decaying: i = I_{0} e^{-t/τ}\nTime to reach a value x: t = τ ln[(x_{0} - x_{f})/(x - x_{f})]\nAfter one time constant the change is 63.2% complete. After five it is about 99.3% complete.\n\n## Series RLC\nα = R/(2 L)\nω_{0} = 1/sqrt(L C)\ns = -α ± sqrt(α^{2} - ω_{0}^{2})\nOverdamped: α > ω_{0}\nCritically damped: α = ω_{0}, which means R = 2 sqrt(L/C)\nUnderdamped: α < ω_{0}, with ω_{d} = sqrt(ω_{0}^{2} - α^{2})\nUnderdamped response: i(t) = e^{-α t}(A cos ω_{d} t + B sin ω_{d} t)\nParallel RLC: α = 1/(2 R C)\n\n@Topic: DC Machines\n\n## Generator and motor equations\nGenerator: E_{g} = V_{t} + I_{a} R_{a}\nMotor: V_{t} = E_{b} + I_{a} R_{a}\nShunt machine: I_{L} = I_{a} ± I_{sh}, I_{sh} = V/R_{sh}\nSeries machine: I_{L} = I_{a} = I_{se}\n\n## EMF, torque and power\nE = Z P Φ N/(60 a), with Z conductors, P poles, a parallel paths and N in rpm\nParallel paths: a = P for lap winding, a = 2 for wave winding\nT = Z P Φ I_{a}/(2 π a) = K_{a} Φ I_{a}\nP_{dev} = E_{b} I_{a} = T ω\nω = 2 π N/60\n\n## Speed and torque relations\nN is proportional to E_{b}/Φ\nN_{2}/N_{1} = (E_{b2}/E_{b1})(Φ_{1}/Φ_{2})\nShunt motor: T is proportional to I_{a}\nSeries motor (unsaturated): T is proportional to I_{a}^{2}\nStarting resistance: R_{st} = V/I_{start} - R_{a}\n\n## Regulation and efficiency\nSpeed regulation = (N_{NL} - N_{FL})/N_{FL} × 100%\nVoltage regulation (generator) = (V_{NL} - V_{FL})/V_{FL} × 100%\nη = output/input = (input - losses)/input\nMaximum efficiency occurs when the variable loss equals the constant loss.\n\n@Topic: Transformers 1\n\n## Ideal transformer\na = N_{1}/N_{2} = E_{1}/E_{2} = I_{2}/I_{1}\nV_{1} I_{1} = V_{2} I_{2}\nEMF equation: E = 4.44 f N Φ_{m}, with Φ_{m} = B_{m} A\nImpedance referred to the primary: Z_{2}' = a^{2} Z_{2}\n\n## Equivalent circuit\nR_{01} = R_{1} + a^{2} R_{2}\nX_{01} = X_{1} + a^{2} X_{2}\nZ_{01} = sqrt(R_{01}^{2} + X_{01}^{2})\n\n## Tests\nOpen circuit test: P_{0} = V_{0} I_{0} cos θ_{0}\nI_{c} = I_{0} cos θ_{0}, I_{m} = I_{0} sin θ_{0}\nR_{c} = V_{0}/I_{c}, X_{m} = V_{0}/I_{m}\nShort circuit test: Z_{01} = V_{sc}/I_{sc}\nR_{01} = P_{sc}/I_{sc}^{2}\n\n## Regulation and efficiency\nVoltage regulation = (V_{NL} - V_{FL})/V_{FL} × 100%\nApproximate: (I R_{02} cos θ ± I X_{02} sin θ)/V_{2} × 100%, with + for a lagging load and - for a leading load\nη = P_{out}/(P_{out} + P_{core} + P_{cu})\nMaximum efficiency when P_{cu} = P_{core}\nFraction of full load at maximum efficiency: x = sqrt(P_{core}/P_{cu,FL})\nAll-day efficiency = energy out in 24 h/energy in during 24 h\n\n@Topic: Transformers 2\n\n## Three-phase transformer connections\nPer-phase turns ratio: a = N_{1}/N_{2}\nΔ-Δ and Y-Y: line voltage ratio = a\nY-Δ: line voltage ratio = sqrt(3) a\nΔ-Y: line voltage ratio = a/sqrt(3)\nBank rating: S = sqrt(3) V_{L} I_{L}\n\n## Open delta and Scott connection\nOpen delta (V-V) capacity = sqrt(3) × rating of one transformer\nThis is 57.7% of the capacity of three transformers in delta.\nUtilization of each transformer in open delta = sqrt(3)/2 = 86.6%\nScott connection: the teaser has 86.6% of the turns of the main\n\n## Autotransformer\nV_{1}/V_{2} = N_{1}/N_{2} = a\nStep down with a = V_{H}/V_{L}: the part of the input power transformed = S(1 - 1/a)\nThe rest of the power is passed directly by conduction.\n\n## Parallel operation\nNeeds the same voltage ratio, the same polarity and the same phase sequence and phase shift.\nThe load shared by each unit is proportional to its rating divided by its per-unit impedance.\n\n@Topic: Synchronous Machines\n\n## Speed and frequency\nf = P N_{s}/120\nGenerated emf per phase: E = 4.44 k_{w} f Φ N_{ph}\nWinding factor: k_{w} = k_{p} k_{d}\nPitch factor: k_{p} = cos(α/2), with α the electrical angle by which the coil is short-pitched\nDistribution factor: k_{d} = sin(m γ/2)/(m sin(γ/2)), with m slots per pole per phase and γ the slot angle\n\n## Equivalent circuit (per phase)\nX_{s} = X_{a} + X_{l}, Z_{s} = R_{a} + j X_{s}\nGenerator: E_{f} = V_{t} + I_{a} Z_{s}\nMotor: E_{f} = V_{t} - I_{a} Z_{s}\nVoltage regulation = (E_{f} - V_{t})/V_{t} × 100%\n\n## Power and torque\nCylindrical rotor, R_{a} neglected: P = (E_{f} V_{t}/X_{s}) sin δ per phase\nSalient pole: P = (E_{f} V_{t}/X_{d}) sin δ + (V_{t}^{2}/2)(1/X_{q} - 1/X_{d}) sin 2δ\nT = P/ω_{s}, with ω_{s} = 2 π N_{s}/60\n\n## Tests\nSynchronous impedance: Z_{s} = V_{oc}/I_{sc} at the same field current, per phase\nShort circuit ratio = field current for rated voltage at open circuit/field current for rated current at short circuit\nShort circuit ratio = 1/X_{s} in per unit\n\n## Synchronous motor excitation\nAn over-excited motor draws a leading current and can correct the power factor.\nAn under-excited motor draws a lagging current.\n\n@Topic: Induction Motors\n\n## Speed and slip\nN_{s} = 120 f/P\ns = (N_{s} - N)/N_{s}\nN = N_{s}(1 - s)\nRotor frequency: f_{r} = s f\n\n## Power flow\nP_{ag} = air-gap power\nRotor copper loss = s P_{ag}\nP_{mech} = (1 - s) P_{ag}\nP_{ag} : rotor copper loss : P_{mech} = 1 : s : (1 - s)\nT = P_{mech}/ω_{m} = P_{ag}/ω_{s}\nω = 2 π N/60\n\n## Rotor and torque\nRotor current: I_{2} = s E_{2}/sqrt(R_{2}^{2} + (s X_{2})^{2})\nT is proportional to s E_{2}^{2} R_{2}/(R_{2}^{2} + (s X_{2})^{2})\nSlip at maximum torque: s_{m} = R_{2}/X_{2}\nMaximum torque does not depend on the rotor resistance.\nT is proportional to V^{2} at a given slip.\nEquivalent load resistance: R_{L} = R_{2}'(1 - s)/s\n\n## Starting\nStar-delta starter: starting current and starting torque are 1/3 of direct on line.\nAutotransformer starter with tap fraction x: starting current from the supply and starting torque are x^{2} times direct on line.\n\n@Topic: Power Plant\n\n## Load factors\nLoad factor = average load/peak load\nDemand factor = maximum demand/connected load\nDiversity factor = sum of the individual maximum demands/maximum demand of the system\nCapacity factor = energy generated/(installed capacity × hours)\nReserve capacity = installed capacity - peak load\nEnergy (kWh) = kW × hours\nTextbooks differ slightly in how they name plant factor, utilization factor and capacity factor, so check the definition in your reviewer.\n\n## Hydroelectric\nP (kW) = 9.81 Q H η, with Q in m^{3}/s and H in m\n\n## Thermal plants\nHeat rate (kJ/kWh) = 3600/η\nη = (electrical energy out)/(heat energy of the fuel in)\n\n## Wind and solar\nWind: P = (1/2) ρ A v^{3} C_{p}\nBetz limit: C_{p} ≤ 16/27 = 0.593\nSolar: P = G A η, with G the irradiance\n\n## Cost of energy\nCost per kWh = (annual fixed cost + annual operating cost)/(annual kWh generated)\n\n@Topic: Illuminations\n\n## Photometric quantities\nLuminous intensity: I = Φ/ω (candela), with ω the solid angle in steradian\nSolid angle: ω = A/r^{2}\nCone of half angle θ: ω = 2 π(1 - cos θ)\nPoint source in all directions: Φ = 4 π I\nIlluminance: E = Φ/A (lux = lm/m^{2})\n1 footcandle = 10.764 lux\nLuminous efficacy = lumens/watt\nLuminance: L = I/A (candela per m^{2}, A the projected area)\n\n## Laws of illumination\nInverse square law: E = I/d^{2}\nCosine law: E = I cos θ/d^{2}\nWith mounting height h: E = I cos^{3} θ/h^{2}\n\n## Lumen method\nN = E A/(Φ · CU · MF)\nRoom index: K = L W/(h_{m}(L + W))\nCU is the coefficient of utilization and MF the maintenance factor.\n\n@Topic: Transmission Lines\n\n## Line parameters\nR = (ρ ℓ)/A\nGMD = (D_{ab} D_{bc} D_{ca})^{1/3}\nGMR of a solid round conductor: r' = 0.7788 r\nInductance per phase: L = 2 × 10^{-7} ln(GMD/GMR) H/m\nSingle-phase loop: L = 4 × 10^{-7} ln(D/r') H/m\nCapacitance to neutral: C = 2 π ε_{0}/ln(GMD/r) F/m\nCharging current per phase: I_{c} = ω C V_{ph}\n\n## Two-port model\nV_{S} = A V_{R} + B I_{R}\nI_{S} = C V_{R} + D I_{R}\nA D - B C = 1\nShort line: A = D = 1, B = Z, C = 0\nNominal π: A = D = 1 + Z Y/2, B = Z, C = Y(1 + Z Y/4)\nNominal T: A = D = 1 + Z Y/2, B = Z(1 + Z Y/4), C = Y\nVoltage regulation = (|V_{S}|/|A| - |V_{R,FL}|)/|V_{R,FL}| × 100%\nEfficiency = P_{R}/P_{S} × 100%\n\n## Long line\nγ = sqrt(z y), Z_{c} = sqrt(z/y)\nA = D = cosh(γ ℓ)\nB = Z_{c} sinh(γ ℓ)\nC = sinh(γ ℓ)/Z_{c}\n\n## Power transfer\nP = |V_{S}||V_{R}| sin δ/X, with line-to-line voltages for the three-phase total\nSurge impedance loading: SIL = V_{LL}^{2}/Z_{c}, in MW for kV and ohms\n\n## Sag, corona and insulators\nLevel supports: S = w L^{2}/(8 T)\nLine length: ℓ = L + (8 S^{2})/(3 L)\nCritical disruptive voltage: V_{c} = 21.1 m_{o} δ r ln(D/r) kV per phase, rms, with r and D in cm\nString efficiency = (voltage across the string)/(n × voltage across the unit nearest the line) × 100%\n\n@Topic: Faults\n\n## Base quantities\nZ_{base} = kV^{2}/MVA\nI_{base} = MVA/(sqrt(3) kV)\nI_{f}(A) = I_{f}(pu) × I_{base}\nChange of base: Z_{pu,new} = Z_{pu,old}(MVA_{new}/MVA_{old})(kV_{old}/kV_{new})^{2}\n\n## Per-unit system\nZ_{pu} = Z_{actual}/Z_{base}\nZ_{base} = V_{base}^{2}/S_{base}\nI_{base} = S_{base}/V_{base}\nThree-phase: Z_{base} = (kV_{LL})^{2}/MVA_{3φ}\nChange of base: Z_{pu,new} = Z_{pu,old}(S_{new}/S_{old})(V_{old}/V_{new})^{2}\n\n## Three-phase fault\nI_{f} = V_{pre-fault}/Z_{th}\nI_{f}(pu) = 1/Z_{1,th}(pu)\nShort circuit MVA = MVA_{base}/Z_{pu} = sqrt(3) kV I_{sc}\nBreaker interrupting MVA = sqrt(3) × rated kV × interrupting current\n\n## Unsymmetrical faults (with fault impedance Z_{f})\nSingle line to ground: I_{a} = 3 I_{a0} = 3 E_{a}/(Z_{0} + Z_{1} + Z_{2} + 3 Z_{f})\nLine to line: I_{a1} = -I_{a2} = E_{a}/(Z_{1} + Z_{2} + Z_{f}), I_{a0} = 0\nLine to line fault current: |I_{b}| = sqrt(3) |I_{a1}|\nDouble line to ground: I_{a1} = E_{a}/[Z_{1} + Z_{2}(Z_{0} + 3 Z_{f})/(Z_{2} + Z_{0} + 3 Z_{f})]\nI_{a2} = -I_{a1}(Z_{0} + 3 Z_{f})/(Z_{2} + Z_{0} + 3 Z_{f})\nI_{a0} = -I_{a1} Z_{2}/(Z_{2} + Z_{0} + 3 Z_{f})\nGround fault current: I_{f} = 3 I_{a0}\n\n## Sequence networks\nOnly the positive sequence network has a source.\nA neutral impedance Z_{n} appears as 3 Z_{n} in the zero sequence network.\nFor a transformer, Z_{1} = Z_{2}.\n\n## Protection\nPlug setting multiplier = (fault current in the relay coil)/(relay current setting)\nRelay coil current = (fault current)/(CT ratio)\n\n@Section: Formulas\n@Source: Claude starter\n@Subject: ESAS\n@Topic: Engineering Economics\n\n## Geometric gradient\nPayment in period k: A(1 + g)^{k-1}, with A the first payment and g the growth rate per period\nP = A[1 - ((1 + g)/(1 + i))^{n}]/(i - g), when i ≠ g\nP = n A/(1 + i), when i = g\n\n## Present worth by summation\nOrdinary annuity: P = Σ A(1 + i)^{-k}, for k = 1 to n\nAnnuity due: P = Σ A(1 + i)^{-k}, for k = 0 to n - 1\nDeferred annuity, first payment at the end of period m + 1: P = Σ A(1 + i)^{-k}, for k = m + 1 to m + n\nArithmetic gradient: P = Σ [A + (k - 1) G](1 + i)^{-k}, for k = 1 to n\nGeometric gradient: P = Σ A(1 + g)^{k-1}(1 + i)^{-k}, for k = 1 to n\nNote: Each term is one payment brought back to time 0. The Calculator section shows how to add them with the Σ function.\n\n@Subject: ESAS\n@Topic: Mechanics 2\n\n## Projectile on level ground, solved for the speed or the angle\nv is the launch speed and θ is the launch angle.\nRange: R = v^{2} sin(2θ)/g\nMaximum height: h = (v sinθ)^{2}/(2g)\nTime of flight: t = 2 v sinθ/g\nTime to reach the maximum height = v sinθ/g, which is half of the time of flight\nMaximum range is at θ = 45°: R_{max} = v^{2}/g\nSolved for the speed: v = sqrt(R g/sin(2θ)), v = sqrt(2 g h)/sinθ, v = g t/(2 sinθ)\nSolved for the angle: sin(2θ) = R g/v^{2}, sinθ = sqrt(2 g h)/v, sinθ = g t/(2 v)\nNote: sin(2θ) = k gives two angles, θ and 90° - θ, and both give the same range.\n\n@Section: Formulas\n@Source: ESAS Formulas sheet\n\n@Subject: ESAS\n@Topic: Physics 1\n\n## Laws of motion\nFirst law, inertia: a body stays at rest or in uniform motion unless a net force acts on it\nSecond law, acceleration: F = m a\nThird law, reaction: every action has an equal and opposite reaction\n\n## Universal gravitation\nF = (G m_{1} m_{2})/d^{2}\nG is the gravitational constant, 6.673 × 10^{-11} in SI units (N m^{2} per kg^{2})\nNote: most books now give G = 6.674 × 10^{-11}. Use the value your problem or reviewer gives.\n\n## Work\nW = F d\nW = F d cosθ\nθ is the angle between the force and the displacement\n\n## Kinetic and potential energy\nKE_{translational} = (1/2) m v^{2}\nKE_{rotational} = (1/2) I ω^{2}\nv = r ω\nPE = m g h\n\n## Mass on a spring: period and frequency\nPeriod: T = 2π √(m/k)\nFrequency: f = 1/T = 1/(2π) √(k/m)\nAngular frequency: ω = 2π f = √(k/m)\nm is the mass and k is the spring constant (force constant, N/m)\n\n## Hooke's law\nF = k x\nx is the displacement of the spring (m)\n\n## Simple pendulum\nT = 2π √(L/g)\nω = 2π f = √(g/L)\nL is the length and g = 9.81 m/s^{2}\nNote: the sheet writes the unit of g as m/s. It is m/s^{2}.\n\n## Torsional pendulum\nT = 2π √(I/K)\nI is the moment of inertia and K is the torsional constant of the wire\n\n@Topic: Physics 2\n\n## Speed of a wave in a string and in a rod\nTransverse wave: v = √(T/μ)\nT is the tension (N) and μ is the mass per unit length (kg/m)\nLongitudinal wave: v = √(E/ρ)\nE is the modulus of elasticity (N/m^{2}) and ρ is the density (kg/m^{3})\n\n## Frequency and wavelength\nf = 1/T\nv = f λ\n\n## Intensity of a wave\nI = 2π^{2} v ρ f^{2} A^{2}\nv is the wave speed (m/s), f is the frequency (Hz), ρ is the density (kg/m^{3}) and A is the amplitude (m)\n\n## Intensity of sound\nIntensity = Energy/(Area × Time) = Power/Area\nWatch out: the sheet ends this line with Power/Time. Intensity is power per unit area, in W/m^{2}.\n\n## Threshold of hearing and the decibel\nThreshold of hearing: the lowest intensity the human ear can detect, about 1 × 10^{-12} W/m^{2}\nIntensity level in decibels: dB = 10 log(I/I_{0}), with I_{0} = 1 × 10^{-12} W/m^{2}\n\n## Snell's law and the speed of light\nn_{1} sinθ_{1} = n_{2} sinθ_{2}\nsinθ_{1}/sinθ_{2} = n_{2}/n_{1}\nSpeed of light: c = 3 × 10^{8} m/s\nNote: the sheet adds that this is constant 28 in its calculator's constants list. The numbering depends on the model, so check your own list.\n\n## Speed of sound\nThin rod: v = √(E/ρ)\nGas: v = √(γ P/ρ) = √(γ R T/M)\nγ is the ratio of specific heats, M is the molar mass and T is the absolute temperature\nIn air at 0 °C: v = 331 m/s = 1,100 ft/s\nIn air at any other temperature: v = 331 + 0.6 T, with T in °C\n\n## Mirrors and lenses: signs\nConcave (converging): + (real)\nConvex (diverging): − (virtual)\nNote: + is for the focal length of a converging mirror or lens and for a real image. − is for a diverging one and for a virtual image.\n\n## Focal length of a mirror\nf = ±(1/2) r\n\n## Mirror equation\n1/p + 1/q = 1/f\nf = r/2\np is the object distance, q is the image distance and r is the radius of curvature\n\n## Lens equation\n1/f = 1/d_{o} + 1/d_{i}\nd_{o} is the object distance and d_{i} is the image distance\n\n## Thick and thin lenses\nThick lens: 1/f = (n - 1)[1/R_{1} - 1/R_{2} + ((n - 1) d)/(n R_{1} R_{2})]\nThin lens: 1/f = (n - 1)[1/R_{1} - 1/R_{2}]\nf is the focal length, R_{1} and R_{2} are the radii of curvature, n is the index of refraction and d is the thickness of the lens\n\n## Doppler effect\nf_{o} = f_{s} (V - V_{o})/(V - V_{s})\nf_{o} is the frequency heard by the observer, f_{s} is the frequency of the source and V is the speed of sound\nNote: speeds are positive in the direction from the source toward the observer.\n\n## Magnification\nM = h_{i}/h_{o} = -d_{i}/d_{o} = -q/p\nM = image size/object size\nWatch out: the first line on the sheet has d_{i}/d_{o} without the minus sign. With the sign, a negative M means an inverted image.\n\n@Topic: Mechanics 2\n@IdTopic: Physics\n\n## Momentum and impulse\np = m v\nImpulse: F Δt = Δ(m v) = m v_{f} - m v_{i}\n\n## Coefficient of restitution\ne = (v_{2B} - v_{2A})/(v_{1A} - v_{1B})\nThe sheet writes this as a minus sign in front of the fraction with v_{2A} - v_{2B} on top, which is the same thing. Subscript 1 is before the impact and 2 is after; A and B are the two bodies.\nIn terms of the initial height and the bounce height: e = √(h_{bounce}/h_{initial})\nNote: e = 1 for a perfectly elastic impact and e = 0 for a perfectly plastic one.\n\n@Topic: Thermodynamics\n\n## Sensible heat\nQ = m C ΔT\nQ is the sensible heat and C is the specific heat\nΔT = T_{f} - T_{i}, or T_{2} - T_{1}\nNote: the sheet calls C the heat capacity. With the mass m in the formula, C is the heat capacity per unit mass (specific heat).\n\n## Conduction\nQ/t = (k A ΔT)/L = (A ΔT)/R\nk is the thermal conductivity, ΔT is the change in temperature across the material, L is the thickness of the material and A is the area\nΔT/L is the temperature gradient\nR = L/k is the thermal resistance\nNote: used with Q/t = A ΔT/R, this R is per unit area. The resistance of the whole piece is L/(k A).\n\n## Convection\nQ/t = h A ΔT\nh is the convection coefficient\n\n## Radiation\nQ/t = σ e A T^{4}\nP = σ e A T^{4}\nP_{net} = σ e A (T_{2}^{4} - T_{1}^{4})\nσ is the Stefan-Boltzmann constant, 5.67 × 10^{-8} in SI units, e is the emissivity and T is in kelvin\n\n## Enthalpy\nH = U + P V\n\n## Ideal gas law\nP V = n R T\nn = m/MW\nρ = m/V = P (MW)/(R T)\nP is the pressure, V is the volume, n is the number of moles, m is the mass and MW is the molecular weight\nR = 0.0821 L atm per (mol K), with P in atm, V in liters and T in kelvin\n\n## Laws of thermodynamics\nZeroth law: thermal equilibrium\nFirst law: conservation of energy\nSecond law: entropy\nThird law: absolute zero temperature\n\n## Kinetic theory of gases (Maxwell-Boltzmann)\nv = √(3 k T/m)\nT = m/(3 k) v_{rms}^{2}\nKE = (1/2) m v^{2} = (3/2) k T\nk is the Boltzmann constant, 1.38 × 10^{-23} J/K\nWatch out: the sheet writes the last factor as 2/3 k T. The average kinetic energy per molecule is (3/2) k T, which also fits v = √(3 k T/m).\n\n## Carnot engine, refrigerator and COP\nCarnot engine: η_{C} = 1 - T_{L}/T_{H}\nRefrigerator: η_{R} = T_{H}/T_{L} - 1\nCoefficient of performance: COP = 1/η\nSo for a refrigerator COP = 1/η_{R} = T_{L}/(T_{H} - T_{L})\nTemperatures must be absolute: °R = °F + 460 and K = °C + 273\nNote: the sheet writes the efficiency with a letter that looks like Z. It is read here as η.\n\n## Temperature conversion\nF = (9/5) C + 32\nK = C + 273.15\nC = (5/9)(F - 32)\nR = F + 459.67\nFahrenheit to kelvin: K = (F - 32)(5/9) + 273.15\nKelvin to Fahrenheit: F = (K - 273.15)(9/5) + 32\nRankine to Fahrenheit, rounded: R = F + 460\n\n## Temperature differences\nΔC = ΔK\nΔF = ΔR\nΔC = (5/9) ΔF\nWatch out: the sheet writes the last line with ΔF on both sides. It is read here as ΔC on the left.\n\n@Topic: Chemistry\n\n## Combined gas law\nP_{1} V_{1}/T_{1} = P_{2} V_{2}/T_{2}\n\n## Boyle's law, isothermal\nP_{1} V_{1} = P_{2} V_{2}\nP V = K, with the temperature constant\n\n## Charles's law, isobaric\nV/T = K\nV_{1}/T_{1} = V_{2}/T_{2}, with the pressure constant\n\n## Gay-Lussac's law, isometric\nP/T = K\nP_{1}/T_{1} = P_{2}/T_{2}, with the volume constant\n\n## Avogadro's law\nV/n = K\n\n## Dalton's law of partial pressures\nP_{total} = P_{1} + P_{2} + … + P_{n}\n\n## Graham's law of effusion\nr_{A}/r_{B} = √(M_{B}/M_{A})\nr is the rate of effusion and M is the molar mass\n\n## Raoult's law\nP_{solution} = X_{solvent} P_{solvent}\nX is the mole fraction of the solvent and P_{solvent} is the vapor pressure of the pure solvent\n\n## Henry's law\nS = K_{H} P\nS is the solubility of the gas, K_{H} is Henry's constant and P is the pressure of the gas\n\n@Topic: Mechanics 2\n\n## Rectilinear motion\na = (V_{f} - V_{0})/t\ns = V_{0} t + (1/2) a t^{2}\nV_{f}^{2} = V_{0}^{2} + 2 a s\n\n## Rotational motion\nα = (ω_{f} - ω_{0})/t, in rad/s^{2}\nθ = ω_{0} t + (1/2) α t^{2}, in rad\nω_{f}^{2} = ω_{0}^{2} + 2 α θ, in (rad/s)^{2}\nWatch out: the last line on the sheet looks like 2αt rather than 2αθ, with the unit written as rad/s.\n\n## General formula of a projectile\ny = x tanθ - g x^{2}/(2 V_{0}^{2} cos^{2}θ)\nWatch out: the sheet has an equals sign between x tanθ and the fraction. In the trajectory equation it is a minus sign.\n\n## Impulse-momentum theory\nF = m V/t\nNote: V is the change in velocity here, so F t = m (V_{f} - V_{0}).\n\n@Topic: Strength of Materials\n\n## Simple stress\nσ = F/A\nA = (π/4) d^{2} for a circular section\n\n## Safety factor\nSF = σ_{u}/σ_{A}, the ultimate stress over the allowable stress\n\n## Torsional stress and power\nSolid shaft: τ = (16 T)/(π D^{3})\nHollow shaft: τ = (16 T D)/(π (D^{4} - d^{4}))\nPower: P = (2π N T)/60\nN is in rev/min\n\n## Polar moment of inertia\nSolid: J = (π/32) d^{4}\nHollow: J = (π/32)(d_{o}^{4} - d_{i}^{4})\nd_{o} = d_{i} + 2 t\nd_{o} is the outside diameter, d_{i} is the inside diameter and t is the wall thickness\n\n## Angle of twist\nθ = (T L)/(J G)\nJ is the polar moment of inertia and G is the modulus of rigidity\nIn terms of the shear stress τ at the outer surface: θ = (2 τ L)/(d_{o} G)\nNote: the sheet writes the second one with 2TL on top, a torque T where the shear stress τ belongs. Only the shear stress τ makes the units come out dimensionless, so it is read as τ.\n\n## Modulus of rigidity and volume change\nG = E/(2(1 + μ))\nΔV/V = ε (1 - 2μ)\nε is the axial strain and μ is Poisson's ratio\nNote: the sheet writes the second one as V = ε(1 - 2μ) with ε marked as strain. It is read here as the volume change per unit volume.\n\n## Cylindrical and spherical tank stress\nCylindrical tank: σ_{c} = (P D)/(2 t)\nSpherical tank: σ_{s} = (P D)/(4 t)\nNote: the cylinder value is the hoop (circumferential) stress. The stress along the axis of a cylinder is (P D)/(4 t).\n\n## Maximum moment of a beam\nUniformly distributed load, simply supported: M = (w L^{2})/8\nConcentrated load at midspan: M = (P L)/4\nWatch out: the sheet gives the concentrated case as w L^{2}/4. For a load P at midspan the maximum moment is P L/4 (no square on L).\n\n## Axial deformation\nδ_{P} = (P L)/(A E)\nδ_{W} = (ρ g L^{2})/(2 E) = (m g L)/(2 A E)\nδ_{W} is the stretch of a hanging bar under its own weight\n\n@Topic: Fluid Mechanics\n\n## Bernoulli's energy theorem\nV_{1}^{2}/(2g) + P_{1}/γ + h_{1} = V_{2}^{2}/(2g) + P_{2}/γ + h_{2} + HL\nHL is the head loss\nIf the velocity heads and the pressure heads are the same at both points: h_{1} = h_{2} + HL\n\n## Power from flowing water\nP = Q γ h\n\n## Orifice coefficients\nV = C_{v} √(2 g h)\nV_{t} = √(2 g h)\nA = C_{c} A_{o}\nQ_{T} = A_{o} V_{t}\nQ = C_{c} A_{o} C_{v} √(2 g h)\nQ = C A_{o} √(2 g h)\nC = C_{c} C_{v}\nNote: the sheet writes the Q_{T} line as A_{o} V. Q_{T} is the theoretical discharge, so V is the theoretical velocity V_{t}.\n\n## Discharge, mass flow and gas density\nQ = A V\nM = ρ A V\nP V = m R T, with R = 0.287 kJ/(kg K) for air\nρ = m/V = P/(R T)\n\n## Density and specific volume\nρ = m/V\nv = 1/ρ = V/m\n\n## Specific weight and specific gravity\nγ = W/V = m g/V\nSG = γ_{object}/γ_{water} = ρ_{object}/ρ_{water}\nγ of water = 9.81 kN/m^{3} = 981 dyne/cm^{3} = 62.4 lb/ft^{3}\nρ of water = 1000 kg/m^{3} = 1 g/cm^{3} = 1 kg/L = 1.94 slug/ft^{3}\n\n## Pressure and gage pressure\np = F/A\nP_{gage} = γ_{fluid} h = ρ g h\nP_{abs} = P_{gage} + P_{atm}\nP_{2} = P_{1} + Σ γ h\nP_{2} is the pressure at the bottom and P_{1} is the pressure at the top\n\n## Absolute pressure\nP_{abs} = P_{atm} ± P_{g}\nUse − when the gage reads vacuum.\n\n## Viscosity\nF = (μ V A)/δ\nS = F/A\nS = μ (V/δ)\nF is the force, A is the area, S is the shear stress, μ is the absolute viscosity, V is the velocity and δ is the distance between the plates\n\n## Kinematic viscosity\nν = μ/ρ\n\n## Compressibility and bulk modulus\nCompressibility: β = (ΔV/V)/ΔP\nBulk modulus: E = ΔP/(ΔV/V)\nTake the volume change ratio ΔV/V as a positive number, which is what the sheet's bars around it mean.\n\n## Surface tension\nDroplet: σ = (r ΔP)/2\nBubble: σ = (r ΔP)/4\nΔP = P_{inside} - P_{outside}\nNote: the sheet adds in blue that the outside pressure is zero if the air is not specified. That is read here as P_{outside} = 0 in gage pressure.\nIf σ is not given: σ = 0.0712 N/m or 0.00518 lb/ft\nWatch out: these two values do not match each other. 0.0712 N/m is about 0.00488 lb/ft, and 0.00518 lb/ft is about 0.0756 N/m. Use the value your problem gives.\n\n## Capillarity\nh = (4 σ cosθ)/(γ d)\nσ is the surface tension, γ is the specific weight, d is the diameter and θ is the contact angle\n\n## Manometer\nP_{1} = P_{2}\nP_{A} + γ_{1} h_{1} = P_{B} + γ_{2} h_{2}\n\n## Hydraulic pressure\nP_{1} = P_{2}\nF_{1}/A_{1} = F_{2}/A_{2}\n\n## Archimedes' principle\nBF = γ_{fluid} V_{s}\nBF = SG_{fluid} γ_{water} V_{s}\nBF is the buoyant force and V_{s} is the volume submerged\n\n@Topic: Engineering Economics\n\n## Simple interest and exact simple interest\nI = P i n\nF = P(1 + i n)\nExact simple interest uses n = 365 days, or 366 days in a leap year\n\n## Compound interest and the effective rate\nF = P(1 + i)^{n}\nP = F(1 + i)^{-n}\ni = r/m\nEffective rate: ER = (1 + i)^{n} - 1\nValues of m on the sheet:\n- annually: 1\n- monthly: 12\n- quarterly: 4 (every 3 months)\n- semi-annually: 2 (every 6 months)\n- bi-monthly: 6\n- daily: 360\n- continuously: 999, a large number standing in for infinity\nNote: for the effective rate over one year, n = m.\n\n## Rate of discount and rate of interest\nROD = (F - P)/F\nROI = (F - P)/P, or d/(1 - d)\n\n## Annuity by summation\nF = A Σ (1 + i)^{x−1}, for x = 1 to n\nP = A Σ (1 + i)^{-x}, for x = 1 to n\n\n## Future worth with inflation\nF = P((1 + i)/(1 + f))^{n}\nf is the inflation rate\n\n## Continuous compounding\nF = P e^{i n}\nP = F e^{-i n}\nERI = e^{i} - 1\nERI is the effective rate of interest for one year.\n\n## Straight-line depreciation\nD_{n} = (n (C_{o} - C_{L}))/L\nD_{n} = n d, and D_{n} = C_{o} - C_{n}\nC_{o} is the first cost, C_{L} is the salvage value, L is the useful life and d is the yearly depreciation\nWatch out: the sheet starts with d = C_{o} - C_{L}, which is the total depreciation over the whole life. The yearly amount is that divided by L.\nCalculator technique on the sheet (written MODE 3:2, which is STAT then the linear A+BX type on the Casio it was written for). Enter two rows:\n- x = 0, y = first cost\n- x = useful life, y = salvage value\nThen ŷ gives the book value at any year x:\n- Book value at year n: enter n, then ŷ.\n- Total depreciation after year n: FC minus the book value (the sheet's red box).\n- Depreciation charge in one year: the ŷ of the earlier year minus the ŷ of the later year. The sheet's example is 5ŷ minus 6ŷ, for year 6.\nNote: on the Canon F-789SGA, use the Lin type in STAT (see the regression method in the Calculator section).\n\n## Declining balance depreciation\nd_{n} = C_{o}(1 - k)^{n−1} k\nC_{n} = C_{o}(1 - k)^{n} = C_{o}(C_{L}/C_{o})^{n/L}\nC_{L} = C_{o}(1 - k)^{L}\nk = 1 - (C_{n}/C_{o})^{1/n} = 1 - (C_{L}/C_{o})^{1/L}\nThe sheet writes these as an nth root and an Lth root.\nd_{n} is the depreciation in the nth year and k is the rate of depreciation\nCalculator technique on the sheet (written MODE 3:6, the exponential A·B^x type):\n- x = 0, y = first cost\n- x = useful life, y = salvage value\nThen ŷ gives the book value at any year x, and the total depreciation and the yearly charge come from ŷ as in the straight-line item.\n\n## Double declining balance depreciation\nd_{n} = C_{o}(1 - 2/L)^{n−1} (2/L)\nC_{n} = C_{o}(1 - 2/L)^{n}\nC_{L} = C_{o}(1 - 2/L)^{L}\nCalculator technique on the sheet (written MODE 3:6, the exponential type):\n- x = 0, y = first cost\n- x = 1, y = FC(1 - 2/L)\nThen ŷ gives the book value at any year x, and the total depreciation and the yearly charge come from ŷ as in the straight-line item.\n\n## Sum of the years digits depreciation\nd_{n} = (reverse digit ÷ sum of digits)(C_{o} - C_{L})\nFor a life of L years, the sum of the digits is L(L + 1)/2 and the reverse digit for year n is L - n + 1.\nWatch out: the sheet writes the last factor as (C_{n} - C_{L}). The total to be written off is C_{o} - C_{L}, so it is read as C_{o}.\nCalculator technique on the sheet (written MODE 3:3, the quadratic type). Enter three rows:\n- x = 0, y = first cost\n- x = the given year (the useful life), y = the second cost (salvage value)\n- x = the given year plus 1, y = the second cost (salvage value)\nThen ŷ gives the book value at any year x, and the total depreciation and the yearly charge come from ŷ as in the straight-line item.\n\n## Sinking fund depreciation\nD_{n} = d[((1 + i)^{n} - 1)/i]\nD_{n} = first cost − book value\n\n## Annuity due and deferred annuity (extra notes)\nAnnuity due, present worth: P = A Σ (1 + i)^{-x}, for x = 0 to n - 1\nAnnuity due, future worth: F = A Σ (1 + i)^{x}, for x = 1 to n\nWatch out: the sheet writes the sums from x = 1 to n for P and from x = 1 to n - 1 for F. Those limits give the ordinary annuity for P and leave out the last term for F, so compare them with your reviewer.\nDeferred annuity, as on the sheet: P = (A/i)[(1 - (1 + i)^{-n})/i](1 + i)^{m}\nDeferred annuity, future worth: F = (A/i)[(1 + i)^{n} - 1]\nWatch out: in the P line on the sheet the factor 1/i appears twice and the exponent of (1 + i) is positive. The usual form is P = A[(1 - (1 + i)^{-n})/i](1 + i)^{-m}. See the starter item on deferred annuities.\n\n@Subject: EE\n@Topic: Illuminations\n\n## Luminous flux and luminous intensity\nI = F/ω\nF is the luminous flux (lumen), ω is the solid angle (steradian) and I is the luminous intensity (candela)\nTotal flux from a point source: F = 4π I\nIn small steps: I = ΔΦ/Δω\n\n## Illuminance\nE = F/A\nE is the illuminance (lumen/m^{2}), F is the luminous flux (lumen) and A is the area (m^{2}). The sheet also writes the flux as Φ.\nLight from a point source: E = (I/S^{2}) cosθ\nS is the distance from the source and θ is the angle between the light ray and the normal to the surface\nWatch out: the sheet shows what looks like a 1 where the luminous intensity I belongs. It is read here as I.\n\n## Principle of photometry\nE is proportional to I/r^{2}\nI_{1}/r_{1}^{2} = I_{2}/r_{2}^{2}, the inverse square law (the same illuminance from two sources)\n\n## Luminance\nB = I/A\nB is the luminance (candela/m^{2}), I is the luminous intensity (candela) and A is the area (m^{2})\n\n## Candle power and specific output\nMean spherical candle power: MSCP = Φ/(4π)\nMean hemispherical candle power: MHCP = Φ/(2π)\nSpecific output (efficacy) = 4π × MSCP ÷ watts, in lumens per watt\n\n## Number of lamps\nn = (E A)/(F × N × CU × MF)\nF is the lumens per lamp, N is the lamps per luminaire, CU is the coefficient of utilization and MF is the maintenance factor\nNote: with the lamps per luminaire in the denominator, n counts luminaires. Multiply by the lamps per luminaire for the number of lamps.\n\n@Section: Formulas\n@Source: EE Formulas sheet\n\n@Subject: EE\n@Topic: AC Circuits 1\n\n## Circular mil and units\nArea in circular mils: A = d^{2}, with d in mils\n1 inch = 1000 mils\n1 MCM = 1000 CM\n\n## Resistance and resistivity\nR = (ρ L)/A = (ρ V)/A^{2} = (ρ L^{2})/V\nR is the resistance and ρ is the resistivity of the material\nL is the length of the conductor (m or ft) and V is the volume (m^{3} or ft^{3})\nA is the cross-sectional area (m^{2}, mil^{2} or CM)\n\n## Resistivity at 20 °C\nHard drawn copper: 1.77 × 10^{-8} Ω·m, or 10.66 Ω·CM per ft\nAnnealed copper: 1.72 × 10^{-8} Ω·m, or 10.5 Ω·CM per ft\nAluminum: 2.83 × 10^{-8} Ω·m, or 17.10 Ω·CM per ft\nWatch out: the sheet's own table gives copper as 10.37 Ω·CM per ft, and 1.72 × 10^{-8} Ω·m converts to about 10.35, so the 10.5 looks like a slip. 2.83 × 10^{-8} Ω·m converts to about 17.0, and the table gives 17.\n\n## Conductors that change shape\nVaries directly: R_{2}/R_{1} = (L_{2}/L_{1})^{2}\nVaries inversely: R_{2}/R_{1} = (d_{1}/d_{2})^{4}\nWatch out: the sheet does not say so, but these two hold only when the volume of the conductor stays the same, for example when a wire is stretched or drawn out. For the same cross-section, R is simply proportional to L.\n\n## Effect of temperature on resistance\nR_{2}/R_{1} = (T + t_{2})/(T + t_{1})\nR_{2}/R_{1} = 1 + α_{t1}(t_{2} - t_{1})\nα_{t1} = 1/(T + t_{1})\nα_{0} = 1/T\nT is the inferred absolute temperature, the temperature at which the resistance of the given material would be zero. α is the temperature coefficient of resistance. t_{1} and t_{2} are in °C.\nTable on the sheet (ρ in Ω·CM per ft, T in °C, α at 20 °C):\n- Silver: ρ = 9.9, T = 243, α = 0.0038\n- Copper: ρ = 10.37, T = 234.5, α = 0.00393\n- Aluminum: ρ = 17, T = 236, α = 0.0039\n- Tungsten: ρ = 33, T = 202, α = 0.0045\n- Zinc: ρ = 36, T = 250, α = 0.0037\n\n## Insulation resistance of a cable\nR = ρ/(2π L) × ln(r_{2}/r_{1})\nρ is the resistivity of the insulation, L is the length of the cable, r_{2} is the outer radius of the insulation and r_{1} is the inner radius\n\n## Ohm's law\nV = I R\nI = V/R\nR = V/I\nFormulated in 1826 by Georg Simon Ohm.\n\n## Electrical power\nP = W/t = (Q/t) E = E I\nThe unit of power is the watt (W), named after James Watt (1736 to 1819).\n1 W = 1 J/s = 1 VA\n1 HP = 746 W\n\n## Joule's law\nP = I^{2} R = E^{2}/R = E I\nThe power dissipated in a resistance element in a circuit. Formulated by James Prescott Joule (1818 to 1889), a British physicist.\n\n## Electrical energy\nW = P t\nW is the electric energy (joule), P is the electric power (watt) and t is the time (s)\n\n## Heat energy and conversions\nQ = m c ΔT\nΔT = t_{2} - t_{1}\n- 1 calorie = 4.186 joules\n- 1 BTU = 252 calories\n- 1 kWh = 3600 kJ = 3413 BTU = 860 kcal\n- 1 joule = 1 × 10^{7} ergs\nSpecific heat of water: 1 cal per g per °C = 1 kcal per kg per °C = 4186 J per kg per °C = 1 BTU per lb per °F\nNote: the sheet lists the last line under the conversions without a label. These are the specific heat of water in different units.\n\n## Series circuit\nI_{T} = I_{1} = I_{2} = I_{3}\nR_{T} = R_{1} + R_{2} + R_{3}\nE = V_{1} + V_{2} + V_{3}\nP_{T} = P_{1} + P_{2} + P_{3}\n\n## Parallel circuit\nE = V_{1} = V_{2} = V_{3} = … = V_{n}\nI_{T} = I_{1} + I_{2} + I_{3} + … + I_{n}\n1/R_{T} = 1/R_{1} + 1/R_{2} + 1/R_{3} + … + 1/R_{n}\nP_{T} = P_{1} + P_{2} + P_{3} + … + P_{n}\n\n## Delta to wye\nX = (A B)/(A + B + C)\nY = (B C)/(A + B + C)\nZ = (A C)/(A + B + C)\nIn general: R_{Y} = (product of the two adjacent delta resistors) ÷ (sum of the three delta resistors)\nA, B and C are the delta resistors. X, Y and Z are the wye resistors.\n\n## Wye to delta\nA = (X Y + Y Z + X Z)/Y\nB = (X Y + Y Z + X Z)/Z\nC = (X Y + Y Z + X Z)/X\nIn general: R_{Δ} = (sum of the cross products) ÷ (the wye resistor opposite to it)\n\n## Balanced delta and wye\nWye to delta: R_{Δ} = 3 R_{Y}\nDelta to wye: R_{Y} = R_{Δ}/3\n\n## Millman's theorem\nV_{AB} = (E_{1}/R_{1} + E_{2}/R_{2} + E_{3}/R_{3})/(1/R_{1} + 1/R_{2} + 1/R_{3})\n\n## Voltage division theorem\nV_{1} = E R_{1}/(R_{1} + R_{2})\nV_{2} = E R_{2}/(R_{1} + R_{2})\n\n## Current division theorem\nI_{1} = I_{T} R_{2}/(R_{1} + R_{2})\nI_{2} = I_{T} R_{1}/(R_{1} + R_{2})\n\n## Frequency, period and wavelength\n1 cycle per second = 1 Hz\nT = 1/f\nλ = v/f\nv = 3 × 10^{8} m/s for radio waves and 344 m/s for sound waves\n\n## Instantaneous value of a sine wave\nv = V_{m} sin 2πft = V_{m} sinωt = V_{m} sinθ\ni = I_{m} sin 2πft = I_{m} sinωt = I_{m} sinθ\n\n## Peak and peak-to-peak values\nV_{m} or V_{p} = √2 V_{rms} = 1.414 V_{rms}\nI_{m} or I_{p} = √2 I_{rms} = 1.414 I_{rms}\nV_{p-p} = 2 V_{p} = 2.828 V_{rms}\nI_{p-p} = 2 I_{p} = 2.828 I_{rms}\n\n## Average value of a sine wave\nV_{ave} = (2 V_{m})/π = 0.637 V_{m}\nI_{ave} = (2 I_{m})/π = 0.637 I_{m}\nThis is the average over a half cycle.\n\n## RMS or effective value\nRMS value = peak value × sin 45°\nV_{rms} = 0.707 V_{p} = V_{p}/√2\nI_{rms} = 0.707 I_{p} = I_{p}/√2\n\n## Form factor and peak factor\nForm factor = V_{rms}/V_{ave} = (0.707 V_{m})/(0.637 V_{m}) = 1.11\nPeak factor = V_{m}/V_{rms} = V_{m}/(0.707 V_{m}) = 1.4142\n\n## Common waveforms: RMS, average, form factor and peak factor\nA_{max} is the peak value of the wave.\n- Sine wave: RMS = 0.707 A_{max}, average (half cycle) = 0.636 A_{max}, form factor 1.11, peak factor 1.414\n- Half-wave rectified: RMS = 0.5 A_{max}, average = 0.318 A_{max}, form factor 1.57, peak factor 2.0\n- Full-wave rectified: RMS = 0.707 A_{max}, average = 0.636 A_{max}, form factor 1.11, peak factor 1.414\n- Rectangular wave: RMS = A_{max}, average = A_{max}, form factor 1.0, peak factor 1.0\n- Triangular wave: RMS = 0.577 A_{max}, average = 0.5 A_{max}, form factor 1.154, peak factor 1.732\n\n## Resistive load\nThe current is in phase with the voltage.\nI = V/R, or I_{rms} = V_{rms}/R\nP = V I = I^{2} R = V^{2}/R\n\n## Inductive load\nThe current lags the voltage across it by 90°.\nI = V/X_{L} = V/(2π f L)\ni = I_{m} sin(ωt - 90°)\n\n## Capacitive load\nThe current leads the voltage across it by 90°.\nI = V/X_{C} = 2π f C V\nX_{C} = 1/(2π f C)\ni = I_{m} sin(ωt + 90°)\nWatch out: the sheet writes the second form as V/(2πfC). Since X_{C} = 1/(2π f C), V/X_{C} is V × 2π f C.\n\n## Series RL circuit\nTotal voltage: V_{T} = V_{R} + j V_{L} = |V_{T}|∠θ\n|V_{T}| = √(V_{R}^{2} + V_{L}^{2})\nθ = tan^{-1}(V_{L}/V_{R})\nImpedance: Z = R + j X_{L} = |Z|∠θ\n|Z| = √(R^{2} + X_{L}^{2})\nθ = tan^{-1}(X_{L}/R)\nCurrent: I_{T} = V_{T}/Z\n\n## Series RC circuit\nTotal voltage: V_{T} = V_{R} - j V_{C} = |V_{T}|∠θ\n|V_{T}| = √(V_{R}^{2} + V_{C}^{2})\nθ = -tan^{-1}(V_{C}/V_{R})\nNote: -θ means the voltage lags behind the current.\nImpedance: Z = R - j X_{C} = |Z|∠θ\n|Z| = √(R^{2} + X_{C}^{2})\nθ = -tan^{-1}(X_{C}/R)\nCurrent: I_{T} = V_{T}/Z\n\n## Series RLC circuit\nTotal voltage: V_{T} = V_{R} + j V_{L} - j V_{C} = |V_{T}|∠θ\n|V_{T}| = √(V_{R}^{2} + (V_{L} - V_{C})^{2})\nθ = ±tan^{-1}((V_{L} - V_{C})/V_{R})\nImpedance: Z = R + j X_{L} - j X_{C} = |Z|∠θ\n|Z| = √(R^{2} + (X_{L} -
