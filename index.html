<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Board Reviewer</title>
<meta name="theme-color" content="#16202e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#edf1f5; --grid:#e3e9f0; --ink:#16202e; --mute:#566377; --card:#ffffff; --line:#cdd7e3;
  --math:#a8651a; --esas:#0e6f66; --ee:#8a2c5c; --ok:#1f7a3d; --bad:#b3261e; --warn:#8a6100; --soft:#f4f7fa; --uns:#6b7788; --bd2:#8a97a8; --info:#1d5fa8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1620; --grid:#131c29; --ink:#e6edf5; --mute:#9aa8ba; --card:#172130; --line:#2b394d;
    --math:#e6a955; --esas:#52c7b8; --ee:#e883b1; --ok:#62c987; --bad:#ff8f86; --warn:#e8c25a; --soft:#1b2738; --uns:#8e9bb0; --bd2:#5b6b84; --info:#7db3f0;
  }
}
:root[data-theme="dark"],:root[data-theme="black"]{
  --bg:#0f1620; --grid:#131c29; --ink:#e6edf5; --mute:#9aa8ba; --card:#172130; --line:#2b394d;
  --math:#e6a955; --esas:#52c7b8; --ee:#e883b1; --ok:#62c987; --bad:#ff8f86; --warn:#e8c25a; --soft:#1b2738; --uns:#8e9bb0; --bd2:#5b6b84; --info:#7db3f0;
}
:root[data-theme="black"]{ --bg:#000; --grid:#06080b; --card:#0b1018; --soft:#111823; --line:#212c3b; }
:root[data-theme="light"]{ color-scheme:light }
:root[data-theme="dark"],:root[data-theme="black"]{ color-scheme:dark }
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; min-height:100%; background-color:var(--bg); color:var(--ink);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:44px 44px;
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:16px; line-height:1.45;
}
.wrap{max-width:780px; margin:0 auto; padding:16px 14px 70px;}
button,select,input{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink); outline-offset:2px}

header.top{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:8px 0 14px;}
h1{font-size:2rem; line-height:1; margin:0; font-weight:800; letter-spacing:-0.03em;}
.pill{display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border:1.5px solid var(--line); border-radius:999px; background:var(--card); font-size:.85rem;}
.dot{width:9px; height:9px; border-radius:50%; background:var(--uns)}
.pill.on .dot{background:var(--ok)} .pill.off .dot{background:var(--bad)}

nav.tabs{display:flex; gap:6px; margin-bottom:14px}
nav.tabs button{flex:1; padding:10px 6px; border:1.5px solid var(--line); background:var(--card); border-radius:10px; font-weight:600; line-height:1.15}
nav.tabs button[aria-selected="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}

.searchbox{flex:1 1 100%; padding:8px 12px; border:1.5px solid var(--line); border-radius:10px; background:var(--soft); min-width:0}
.setans{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:10px}
.keys{text-align:center; margin:8px 0 0}
@media (hover:none){ .keys{display:none} }
.types{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:-4px 0 12px}
.typebtn{border:1.5px solid var(--line); background:var(--card); border-radius:10px; padding:7px 10px; text-align:left}
.typebtn b{display:block; font-size:.98rem; font-weight:800}
.typebtn span{display:block; font-size:.76rem; color:var(--mute)}
.typebtn[aria-pressed="true"]{border-color:var(--ink,currentColor); box-shadow:inset 0 0 0 1.5px var(--ink,currentColor); background:var(--soft)}
.modepill{display:inline-block; font-size:.72rem; font-weight:700; padding:1px 7px; border-radius:999px; border:1.5px solid currentColor; margin-left:6px; white-space:nowrap}
.modepill.Solving{color:var(--esas)} .modepill.Terms{color:var(--ee)} .modepill.Formulas{color:var(--math)}
.folders{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px}
.folder{border:1.5px solid var(--line); border-top-width:6px; background:var(--card); border-radius:4px 4px 10px 10px; padding:8px 8px 10px; text-align:left;}
.folder b{display:block; font-size:1.05rem; font-weight:800}
.folder span{font-size:.78rem; color:var(--mute); display:block}
.folder[data-s="Math"]{border-top-color:var(--math)} .folder[data-s="ESAS"]{border-top-color:var(--esas)}
.folder[data-s="EE"]{border-top-color:var(--ee)} .folder[data-s="All"]{border-top-color:var(--ink)} .folder[data-s="Unsorted"]{border-top-color:var(--uns)}
.folder[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.folder[aria-pressed="true"] span{color:inherit; opacity:.8}

.panel{background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px}
.controls{display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center}
.controls label{display:inline-flex; align-items:center; gap:6px; font-size:.92rem}
.controls select{padding:6px 8px; border:1.5px solid var(--line); border-radius:8px; background:var(--soft); max-width:100%; min-width:0}
.controls label:has(select){max-width:100%; min-width:0}
input[type=checkbox]{width:18px; height:18px; accent-color:var(--ink)}

.qhead{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; font-size:.85rem; color:var(--mute); flex-wrap:wrap}
.tag{display:inline-block; padding:2px 9px; border-radius:999px; border:1.5px solid currentColor; font-weight:600; font-size:.78rem}
.tag.Math{color:var(--math)} .tag.ESAS{color:var(--esas)} .tag.EE{color:var(--ee)} .tag.Unsorted{color:var(--uns)}
.stem{font-family:Newsreader,Georgia,serif; font-size:1.28rem; line-height:1.5; margin:0 0 14px; white-space:pre-wrap}
.choice{display:flex; gap:10px; width:100%; text-align:left; padding:11px 12px; margin-bottom:8px; border:1.5px solid var(--line); background:var(--soft); border-radius:10px;}
.choice .l{flex:0 0 1.6em; font-weight:800}
.choice .t{font-family:Newsreader,Georgia,serif; font-size:1.1rem}
.choice:disabled{cursor:default; color:inherit}
.choice.right{border-color:var(--ok); background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.choice.wrong{border-color:var(--bad); background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.solution{margin-top:12px; padding:12px; border-left:5px solid var(--ink); background:var(--soft); border-radius:0 10px 10px 0; font-family:Newsreader,Georgia,serif; font-size:1.05rem; white-space:pre-wrap}
.solution h4{margin:0 0 4px; font-family:"Bricolage Grotesque",sans-serif; font-size:.9rem}
.actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; align-items:center}
.btn{padding:9px 14px; border:1.5px solid var(--bd2); background:var(--card); border-radius:10px; font-weight:600; text-decoration:none; display:inline-block}
.btn:not(.primary):not([aria-pressed="true"]):not(:disabled):hover{border-color:var(--ink)}
a.btn:not(.primary){color:var(--ink)}   /* the web-search links were default blue, hard to read in dark mode */
.btn.primary{background:var(--ink); color:var(--bg)}
.btn.small{padding:5px 10px; font-size:.85rem}
.btn:disabled{opacity:.4; cursor:default}

.rate{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:14px}
.rate button{padding:9px 4px; border:1.5px solid var(--line); background:var(--soft); border-radius:10px; font-weight:700}
.rate button small{display:block; font-weight:400; color:var(--mute); font-size:.75rem}
.rate button[data-v="again"]{--rc:var(--bad)} .rate button[data-v="hard"]{--rc:var(--warn)} .rate button[data-v="good"]{--rc:var(--ok)} .rate button[data-v="easy"]{--rc:var(--info)}
.rate button[data-v]{box-shadow:inset 0 3px 0 var(--rc,transparent); background:color-mix(in srgb,var(--rc,transparent) 9%,var(--card)); border-color:color-mix(in srgb,var(--rc,var(--line)) 45%,var(--line))}
.rate button.hint{border-color:var(--ink); border-width:2.5px}
.rate button.was{outline:2px dashed var(--mute); outline-offset:2px}
.types.fm{grid-template-columns:repeat(2,1fr)} @media (min-width:640px){ .types.fm{grid-template-columns:repeat(4,1fr)} }
.solution .stbody{white-space:normal}
.note.again{margin:12px 0 0}
.lvl{display:inline-block; font-size:.72rem; font-weight:700; padding:1px 7px; border-radius:999px; border:1.5px solid currentColor; margin-left:6px; white-space:nowrap}
.lvl small{font-weight:600; opacity:.85; margin-left:5px; font-size:.68rem}
.lvl.Easy{color:var(--ok)} .lvl.Medium{color:var(--warn)} .lvl.Hard{color:var(--bad)}
.related{margin-top:12px; border:1.5px solid var(--line,#cfc8b8); border-radius:10px; overflow:hidden}
.relbar{display:flex; gap:8px; align-items:baseline; width:100%; text-align:left; padding:9px 12px; background:var(--soft); border:0; font:inherit; cursor:pointer; color:var(--ink)}
.relbar .relk{font-family:"Bricolage Grotesque",sans-serif; font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap}
.relbar .reln{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
.relitem{padding:10px 12px; border-top:1px solid var(--line,#cfc8b8)}
.relh{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap}
.reltag{font-size:.7rem; font-weight:700; padding:1px 7px; border-radius:999px; border:1.5px solid var(--math); color:var(--math); white-space:nowrap}
.related .stbody{white-space:normal; overflow-x:auto}
.related>.note{margin:0; padding:8px 12px; border-top:1px solid var(--line,#cfc8b8)}
[data-swipe]{touch-action:pan-y; position:relative}
[data-swipe] .choice:disabled{pointer-events:none}
[data-swipe].swiping{user-select:none; -webkit-user-select:none; will-change:transform}
[data-swipe][data-sw=right]{--sc:var(--ok); border-color:var(--ok)} [data-swipe][data-sw=left]{--sc:var(--bad); border-color:var(--bad)}
[data-swipe][data-sw]::after{content:attr(data-swl); position:absolute; top:-14px; padding:3px 12px; border-radius:999px; font-weight:800; font-size:.85rem; background:var(--card); color:var(--sc); border:2px solid var(--sc); opacity:.7; pointer-events:none; z-index:3}
[data-swipe][data-sw=right]::after{left:16px} [data-swipe][data-sw=left]::after{right:16px}   /* on the edge that stays in view as the card slides away */
[data-swipe][data-go]::after{opacity:1; background:var(--sc); color:var(--card)}
html.sw-on,html.sw-on body{overflow-x:hidden}

.check{margin-top:12px; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line); font-size:.93rem; background:var(--soft)}
.check b{display:block}
.check.verified{border-color:var(--ok)} .check.verified b{color:var(--ok)}
.check.wrong{border-color:var(--bad)} .check.wrong b{color:var(--bad)}
.check.disputed,.check.unclear,.check.suggested{border-color:var(--warn)} .check.disputed b,.check.unclear b,.check.suggested b{color:var(--warn)}
.check small{display:block; color:var(--mute); margin-top:4px}
.badge{font-size:.72rem; font-weight:700; padding:1px 7px; border-radius:999px; border:1.5px solid currentColor; margin-left:6px; white-space:nowrap}
.badge.verified{color:var(--ok)} .badge.wrong{color:var(--bad)} .badge.disputed,.badge.unclear,.badge.suggested{color:var(--warn)}

.tree .sub{width:100%; display:flex; justify-content:space-between; gap:8px; text-align:left; padding:10px 12px; border:1.5px solid var(--line); background:var(--card); border-radius:10px; margin-bottom:6px; font-weight:700}
.tree .sub span{font-weight:400; color:var(--mute); font-size:.85rem}
.tree .subj{border-left:6px solid var(--ink)}
.tree .subj.Math{border-left-color:var(--math)} .tree .subj.ESAS{border-left-color:var(--esas)} .tree .subj.EE{border-left-color:var(--ee)}
.tree .indent{margin-left:14px}
.tree .row{width:100%; display:flex; gap:8px; justify-content:space-between; text-align:left; padding:8px 10px; border:0; border-bottom:1px solid var(--line); background:transparent; font-family:Newsreader,Georgia,serif; font-size:1rem}
.tree .detail{padding:10px 10px 14px; border-bottom:1px solid var(--line); background:var(--soft); border-radius:0 0 8px 8px; margin-bottom:6px}

.drop{display:block; text-align:center; padding:28px 14px; border:2.5px dashed var(--ink); border-radius:12px; background:var(--card); cursor:pointer}
.drop.over{background:var(--soft)}
.drop b{font-size:1.15rem; display:block}
.drop span{color:var(--mute); font-size:.9rem}
.drop input{position:absolute; width:1px; height:1px; opacity:0}
.doc{display:flex; justify-content:space-between; gap:10px; align-items:center; padding:10px 0; border-top:1px solid var(--line)}
.doc:first-child{border-top:0}
.doc .n{font-weight:600; word-break:break-word}
.doc .m{font-size:.82rem; color:var(--mute)}
.doc .m.err{color:var(--bad)}
.doc .m.warn{color:var(--warn)}
.guide{margin:0 0 10px;font-size:.84rem;white-space:pre-wrap;max-height:340px;overflow:auto}
.empty{color:var(--mute); text-align:center; padding:26px 8px}
.note{font-size:.85rem; color:var(--mute); margin:6px 2px 12px}
.src{font-size:.78rem; color:var(--mute); margin:-4px 0 10px; display:flex; gap:0; min-width:0}
.src b{font-weight:400; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
.src span{white-space:nowrap; flex:none}
.detail .src{margin:0 0 8px}
pre.fmt{white-space:pre-wrap; background:var(--soft); padding:10px; border-radius:8px; font-size:.85rem; overflow-x:auto}
#syncpanel .sline{display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-top:1px solid var(--line); font-size:.93rem} #syncpanel .sline.first{border-top:0} #syncpanel .sline b{white-space:nowrap}
details summary{cursor:pointer; font-weight:600; margin-bottom:6px}
.live{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(14px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:999px; font-size:.88rem; opacity:0; pointer-events:none; transition:opacity .2s; max-width:92%; text-align:center}
.live.show{opacity:1}
sub,sup{font-size:.72em; line-height:0}
.frac{display:inline-block; vertical-align:middle; text-align:center; margin:.16em .14em; line-height:1.25; white-space:normal}
.frac>.fn{display:block; padding:0 .25em .06em; border-bottom:1.5px solid currentColor}
.frac>.fd{display:block; padding:.06em .25em 0}
.rt{display:inline-block; white-space:nowrap}
.rt>.ri{font-size:.6em; margin-right:-.12em}
.rt>.rr{display:inline-block}
.rt>.rc{display:inline-block; border-top:1.5px solid currentColor; padding:0 .12em; margin-left:-.04em}
.ss{display:inline-block; vertical-align:middle; font-size:.72em; line-height:1.15; text-align:left}
.ss>sup,.ss>sub{display:block; position:static; font-size:inherit; line-height:inherit; vertical-align:baseline}
.ov{border-top:1.5px solid currentColor}
.tree .sub.t{border-left-width:5px} .tree .sub.t.Math{border-left-color:var(--math)} .tree .sub.t.ESAS{border-left-color:var(--esas)} .tree .sub.t.EE{border-left-color:var(--ee)}
.tree .sub.l{margin-left:14px; width:calc(100% - 14px); font-size:.92rem; border-style:dashed}
.tree .dim{opacity:.45; cursor:default}
.btn[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.tbtn b{font-weight:800}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:-4px 0 12px}
.chip{padding:3px 10px; border:1.5px solid var(--bd2); background:var(--card); border-radius:999px; font-size:.82rem; font-weight:600}
.chip.clear{border-color:var(--line); color:var(--mute); font-weight:400}
.tpanel .thead{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:10px}
.tpanel .thead .m{font-size:.82rem; color:var(--mute); flex:1 1 auto}
.tpanel .searchbox{display:block; width:100%}
.tlist{max-height:min(52vh,420px); overflow:auto; margin-top:10px; padding-right:4px}
.tgroup{margin-bottom:10px}
.tgh{display:flex; align-items:center; gap:10px; margin:4px 0 4px}
.titem{display:flex; align-items:center; gap:10px; padding:7px 4px; border-bottom:1px solid var(--line); font-size:.96rem; cursor:pointer}
.titem .m{margin-left:auto; font-size:.82rem; color:var(--mute)}
.titem.dim{opacity:.5}
.titem[hidden],.tgroup[hidden]{display:none}
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px}
.stat{border:1.5px solid var(--line); background:var(--card); border-radius:10px; padding:8px 10px}
.stat span{display:block; font-size:.76rem; color:var(--mute)}
.stat b{display:block; font-size:1.5rem; font-weight:800; line-height:1.15}
.stat small{display:block; font-size:.76rem; color:var(--mute)}
.seg{display:flex; height:10px; border-radius:6px; overflow:hidden; background:var(--line)}
.seg i{display:block; height:100%}
.seg .l{background:var(--ok)} .seg .g{background:var(--warn)}
.seg.thin{height:6px}
.stat .seg{margin-top:6px}
.cov{border-top:1px solid var(--line); padding:10px 0}
.cov.first{border-top:0; padding-top:0}
.cov>summary{list-style:none; cursor:pointer; margin:0; display:block; font-weight:400}
.cov>summary::-webkit-details-marker{display:none}
.cov .covhead{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:6px}
.cov .covhead .tw::before{content:"\25B8"; display:inline-block; width:1.1em; color:var(--mute)}
.cov[open] .covhead .tw::before{content:"\25BE"}
.cov .m{font-size:.82rem; color:var(--mute)}
.covt{margin:8px 0 2px 1.1em}
.covrow{display:grid; grid-template-columns:minmax(0,1fr) minmax(70px,34%) 3.4em; gap:10px; align-items:center; padding:4px 0; font-size:.9rem}
.covrow .covn{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.covrow .m{text-align:right; font-variant-numeric:tabular-nums}
.covkey{display:flex; flex-wrap:wrap; gap:4px 14px; margin:0 0 10px; font-size:.8rem; color:var(--mute)}
.covkey i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; background:var(--line)}
.covkey .l{background:var(--ok)} .covkey .g{background:var(--warn)}
.reptag{display:inline-block; font-size:.72rem; font-weight:700; padding:1px 8px; border-radius:999px; background:var(--ink); color:var(--bg); margin-left:6px; white-space:nowrap}
.bars{display:flex; align-items:flex-end; gap:4px; height:76px; border-bottom:1.5px solid var(--line)}
.bars i{flex:1; background:var(--mute); opacity:.35; border-radius:3px 3px 0 0; min-height:3px}
.bars i.on{background:var(--ink); opacity:1}
.axis{display:flex; justify-content:space-between; font-size:.74rem; color:var(--mute); margin-top:3px}
.line{display:flex; justify-content:space-between; gap:10px; align-items:center; padding:9px 0; border-top:1px solid var(--line)}
.line.first{border-top:0; padding-top:0}
.line .m{font-size:.82rem; color:var(--mute)}
h3.sec{margin:0 0 10px; font-size:1rem}
.sess{margin:10px 0 4px; text-align:left; display:inline-block; font-size:.9rem}
.sess .note{margin:2px 0 0}
.types.four{grid-template-columns:repeat(4,1fr); gap:5px}
.types.four .typebtn{padding:7px 6px; text-align:center}
.types.four .typebtn b{font-size:.88rem}
.stsubs{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px}
.stgroup{display:flex; align-items:center; gap:8px; margin:16px 2px 8px; flex-wrap:wrap}
.stgroup b{font-size:1.02rem}
.stgroup .m{font-size:.82rem; color:var(--mute); margin-right:auto}
.tag.General{color:var(--uns)}
.qpanel{border-top:4px solid var(--sc,var(--line))}
.qpanel.s-Math{--sc:var(--math)} .qpanel.s-ESAS{--sc:var(--esas)} .qpanel.s-EE{--sc:var(--ee)} .qpanel.s-Unsorted,.qpanel.s-General{--sc:var(--uns)}

<script>
/* ================= constants ================= */
const SUBJECTS = ['Math','ESAS','EE'];
const LIBS = {
  mammoth:'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js',
  pdfjs:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfworker:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  tess:'https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js'
};
const W=s=>new RegExp('\\b('+s.replace(/~/g,'\\w*')+')\\b','gi');

const DB = {
  db:null, mem:{docs:[],questions:[]},
  async open(){
    try{
      this.db = await new Promise((res,rej)=>{
        const r = indexedDB.open('board-reviewer',1);
        r.onupgradeneeded = ()=>{ const d=r.result; d.createObjectStore('docs',{keyPath:'id'}); d.createObjectStore('questions',{keyPath:'id'}); };
        r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error);
      });
    }catch(e){ this.db=null; }
  },
  all(s){
    if(!this.db) return Promise.resolve([...this.mem[s]]);
    return new Promise((res,rej)=>{ const q=this.db.transaction(s).objectStore(s).getAll(); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); });
  },
  put(s,o){
    if(!this.db){ const a=this.mem[s]; const i=a.findIndex(x=>x.id===o.id); i>-1?a[i]=o:a.push(o); return Promise.resolve(); }
    return new Promise((res,rej)=>{ const t=this.db.transaction(s,'readwrite'); t.objectStore(s).put(o); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); });
  },
  putMany(s,list){   // several cards in one transaction
    if(!this.db){ for(const o of list){ const a=this.mem[s], i=a.findIndex(x=>x.id===o.id); i>-1?a[i]=o:a.push(o); } return Promise.resolve(); }
    return new Promise((res,rej)=>{ const t=this.db.transaction(s,'readwrite'), st=t.objectStore(s); for(const o of list) st.put(o); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); });
  },
  del(s,id){
    if(!this.db){ this.mem[s]=this.mem[s].filter(x=>x.id!==id); return Promise.resolve(); }
    return new Promise((res,rej)=>{ const t=this.db.transaction(s,'readwrite'); t.objectStore(s).delete(id); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); });
  }
};

function classify(c,docName,only){   // only: a list of topic names to choose from

  for(const [subj,topic,re] of TOPICS){

/* Physics used to be one topic. It is now Physics 1 (work, energy, gravitation, harmonic motion) and Physics 2 (waves, sound, light, mirrors, lenses).

const PHYS_NEW=['Physics 1','Physics 2'], PHYS_GENERIC=/^\s*physics\s*$/i;
function physicsTo(c){
  const o={front:String(c.front||''),back:String(c.back||''),answerText:String(c.answerText||''),solution:String(c.solution||''),choices:Array.isArray(c.choices)?c.choices.filter(x=>x&&typeof x.t==='string'):[],hint:'ESAS'};

function physicsFix(c){   // a card or record under the old topic: give it a new one; true when it changed
  if(!PHYS_GENERIC.test(c.topic||'')||!(c.subject==='ESAS'||c.subject==='Unsorted')) return false;

function fixChars(t){   // symbol-font glyphs, ligatures, invisible characters
  return t.replace(/[\uF020-\uF0FF]/g,ch=>{ const c=ch.charCodeAt(0)-0xF000; return c>=0x80?(SYMHI[c]||''):(SYM[String.fromCharCode(c)]||String.fromCharCode(c)); })
   .replace(/\uFB00/g,'ff').replace(/\uFB01/g,'fi').replace(/\uFB02/g,'fl').replace(/\uFB03/g,'ffi').replace(/\uFB04/g,'ffl')
   .replace(/[\u00AD\u200B-\u200D\uFEFF]/g,'').replace(/\u2044/g,'/').replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"');
}
function fixOCR(t){     // common scanner mistakes with units
  return t.replace(/(\d)\s?([kKM])Q\b/g,'$1 $2Ω').replace(/(\d)\s?Q(?=\s+(resistors?|resistance|loads?|impedance|in series|in parallel|each))/g,'$1 Ω')
   .replace(/\b(\d+(?:\.\d+)?)\s?u([FHAVs])\b/g,'$1 µ$2').replace(/(\d)\s?o\s?([CF])\b/g,'$1 °$2');
}
function chem(t){       // H2O, CO2, H2SO4, Fe2O3, P1V1 -> real subscripts
  return t.replace(/\b(?:\(?[A-Z][a-z]?\d*\)?\d*){2,}\b/g,tok=>{
    if(!/\d/.test(tok)) return tok;
    const p=tok.match(/[A-Z][a-z]?|\d+|[()]/g)||[];
    if(p.some(x=>/^[A-Z]/.test(x)&&!EL.has(x))) return tok;
    return p.map(x=>/^\d+$/.test(x)?'_{'+x+'}':x).join('');
  }).replace(/\b(H|O|N|Cl|F)2\b/g,'$1_{2}');
}
function pdfText(items){  // rebuilds a page, keeping subscripts/superscripts on their line as _{x} / ^{x}
  let out='',base=null,end=0,run=null;
  const flush=()=>{ if(run){ const v=run.s.trim(); if(v) out+=(run.k==='sub'?'_':'^')+'{'+v+'}'; run=null; } };
  for(const it of items){
    const size=Math.abs(it.transform[3])||it.height||10, x=it.transform[4], y=it.transform[5];
    if(it.str===''){ if(it.hasEOL){ flush(); out+='\n'; base=null; } continue; }
    let k='n';
    if(base){
      const dy=y-base.y;
      if(size<base.size*0.85&&Math.abs(dy)<base.size*0.8){ k=dy>base.size*0.2?'sup':dy<-base.size*0.05?'sub':'n'; }
      else if(Math.abs(dy)>base.size*0.5){ flush(); out+='\n'; base=null; }
    }
    if(k==='n'){
      flush();
      if(base&&x-end>size*0.18&&!/\s$/.test(out)&&!/^\s/.test(it.str)) out+=' ';
      if(!base) base={y,size};
      out+=it.str;
    }else{ if(run&&run.k!==k) flush(); if(!run) run={k,s:''}; run.s+=it.str; }
    end=x+it.width;
    if(it.hasEOL){ flush(); out+='\n'; base=null; }
  }

}
function greenBlobs(cv){   // finds green highlighter marks from the pixels, independent of what the OCR read
  const W=cv.width,H=cv.height,C=4,gw=Math.ceil(W/C),gh=Math.ceil(H/C); let d;
  try{ d=cv.getContext('2d').getImageData(0,0,W,H).data; }catch(e){ return []; }

  for(let y=0;y<H;y++){ const row=((y/C)|0)*gw; for(let x=0,i=y*W*4;x<W;x++,i+=4){ if(d[i+1]>135&&d[i+1]-d[i]>45&&d[i+1]-d[i+2]>18) cnt[row+((x/C)|0)]++; } }

  for(let s0=0;s0<cnt.length;s0++){
    if(seen[s0]||cnt[s0]<5) continue;
    const st=[s0]; let x0=1e9,y0=1e9,x1=0,y1=0,n=0; seen[s0]=1;
    while(st.length){ const c=st.pop(),cx=c%gw,cy=(c/gw)|0; n++; x0=Math.min(x0,cx); x1=Math.max(x1,cx); y0=Math.min(y0,cy); y1=Math.max(y1,cy);
      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ const nx=cx+dx,ny=cy+dy; if(nx<0||ny<0||nx>=gw||ny>=gh) continue; const k=ny*gw+nx; if(!seen[k]&&cnt[k]>=5){ seen[k]=1; st.push(k); } } }

}
function findGutter(W,width,lh){   // x position of the empty strip between two text columns, or null
  const n=100, rows=new Set(), bins=Array.from({length:n},()=>new Set());
  for(const x of W){ const r=Math.floor((x.y0+x.y1)/2/lh); rows.add(r);
    for(let i=Math.max(0,Math.floor(x.x0/width*n));i<=Math.min(n-1,Math.floor(x.x1/width*n));i++) bins[i].add(r); }
  let best=-1,bv=1e9; for(let i=Math.floor(n*.3);i<=Math.floor(n*.7);i++) if(bins[i].size<bv){ bv=bins[i].size; best=i; }
  if(best<0||bv>rows.size*0.2) return null;
  let a=best,e=best; while(a>0&&bins[a-1].size<=bv) a--; while(e<n-1&&bins[e+1].size<=bv) e++;

function redFrac(cv,x){   // share of strongly red pixels inside a word box (a coloured correct-answer label)

}
function cleanGreenPixels(d,W,H){   // paints the green highlighter white so the letter underneath is readable; returns how many pixels were green
  const m=new Uint8Array(W*H); let n=0;
  for(let i=0,p=0;i<d.length;i+=4,p++){ const r=d[i],g=d[i+1],b=d[i+2]; if(g>135&&g-r>45&&g-b>18){ m[p]=1; n++; } }

function whitenGreen(cv){   // copy of the page without the green highlighter (the original is kept to find the highlights)

    if(!cleanGreenPixels(img.data,W,H)) return null;
    const c2=document.createElement('canvas'); c2.width=W; c2.height=H; c2.getContext('2d').putImageData(img,0,0); return c2;

async function ocr(src){
  try{ await loadScript(LIBS.tess); const w=await Tesseract.createWorker('eng'); await w.setParameters({tessedit_pageseg_mode:'3'}); const r=await w.recognize(src); await w.terminate(); return fixOCR(r.data.text); }
  catch(e){ throw new Error('The OCR engine could not load here. Try again on another network.'); }
}
async function extractRaw(d){

function solveMode(p){

  const chs=(p.choices||[]).map(c=>String(c.t||''));

  const unitNums=(stem.match(/\d[\d,]*(?:\.\d+)?\s?(?:[kKMGm]?Hz|[kKMm]?W|[kKm]?V|mA|A|dB|dBm|ohms?|Ω|µF|pF|nF|F|mH|H|%|percent|kg|g|lb|km|cm|mm|ft|in\.?|m|s|sec|ms|hrs?|hours?|days?|weeks?|min|rpm|mph|kph|\$|₱)\b/g)||[]).length;

/* a spreadsheet CSV: quoted cells may hold commas, quotes ("") and line breaks */
function parseCSV(text){

    if(ch==='"'&&f===''){ q=true; i++; continue; }   // a quote only opens a cell when it comes first
    if(ch===','){ row.push(f); f=''; i++; continue; }
    if(ch==='\r'){ if(text[i+1]==='\n'){ i++; continue; } row.push(f); rows.push(row); row=[]; f=''; i++; continue; }
    if(ch==='\n'){ row.push(f); rows.push(row); row=[]; f=''; i++; continue; }

/* the link: only Google Sheets links, turned into the CSV address */
function bankUrl(input){
  let u; try{ u=new URL(String(input||'').trim()); }catch(e){ return {error:'That does not look like a link.'}; }
  if(u.protocol!=='https:'||u.hostname!=='docs.google.com') return {error:'Only Google Sheets links (docs.google.com) can be used here.'};
  const p=u.pathname;
  let m=/^\/spreadsheets\/d\/e\/([A-Za-z0-9_-]+)\/pub(?:html)?\/?$/.exec(p);
  if(m){ const gid=u.searchParams.get('gid'); return {url:`https://docs.google.com/spreadsheets/d/e/${m[1]}/pub?${gid?'gid='+encodeURIComponent(gid)+'&single=true&':''}output=csv`}; }
  m=/^\/spreadsheets\/d\/([A-Za-z0-9_-]+)(?:\/.*)?$/.exec(p);
  if(m&&m[1]!=='e'){ const g=(u.hash.match(/gid=(\d+)/)||[])[1]||u.searchParams.get('gid')||'0'; return {url:`https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv&gid=${encodeURIComponent(g)}`,viewer:true}; }

}

  finally{ clearTimeout(to); }
  if(!r.ok) throw bankErr('http',r.status===404?'Google could not find that sheet.':(r.status===401||r.status===403)?'Google would not share that sheet.':'Google answered with an error ('+r.status+').',r.status===404?'Check the link.':'Publish the sheet to the web as CSV, or share it with "anyone with the link can view".');
  let text; try{ text=await r.text(); }catch(e){ throw bankErr('network','The download was interrupted.','Try again.'); }
  const ct=(r.headers&&r.headers.get&&r.headers.get('content-type'))||'';
  if(/text\/html/i.test(ct)||/^\s*<(?:!doctype|html)/i.test(text)) throw bankErr('html','Google sent a web page instead of the sheet.','The sheet is probably not published. In Google Sheets choose File, Share, Publish to web, pick the Bank tab and CSV, then paste that link.');
  return text;
}

/* compare the sheet with what this device has: new, changed, taken over, unchanged, gone */
function bankPlan(parsed){
  const byBid=new Map(cards.filter(c=>c.bank).map(c=>[c.bid,c]));
  const keyOf=new Map(); for(const c of cards) if(!c.bank){ const k=cardKey(c); if(!keyOf.has(k)) keyOf.set(k,c); }
  const seen=new Set(parsed.cards.map(d=>d.bid)), goneKey=new Map();
  for(const c of byBid.values()) if(!seen.has(c.bid)){ const k=cardKey(c); if(!goneKey.has(k)) goneKey.set(k,c); }
  const plan={add:[],change:[],adopt:[],revive:[],reps:[],same:0,gone:[],problems:parsed.problems,warns:parsed.warns,rows:parsed.cards.length,total:parsed.total,sample:parsed.sample,guard:null};
  const taken=new Set();
  for(const d of parsed.cards){
    const ex=byBid.get(d.bid);
    if(ex&&d.rep&&d.rep.some(x=>!(ex.rep||[]).some(y=>y[0]===x[0]))) plan.reps.push({old:ex,rep:d.rep});
    if(ex){ if(ex.bh!==d.bh||(ex.pm&&(ex.topic!==d.topic||ex.lesson!==d.lesson||ex.subject!==d.subject))) plan.change.push({old:ex,def:d}); else if(ex.gone) plan.revive.push(ex); else plan.same++; continue; }
    const k=cardKey(d), loc=keyOf.get(k)&&!taken.has(keyOf.get(k).id)?keyOf.get(k):(goneKey.get(k)&&!taken.has(goneKey.get(k).id)?goneKey.get(k):null);   // same question already here: take it over, keep its progress
    if(loc){ taken.add(loc.id); plan.adopt.push({old:loc,def:d}); } else plan.add.push(d);
  }
  plan.gone=[...byBid.values()].filter(c=>!seen.has(c.bid)&&!taken.has(c.id));
  const prev=(S.bank.last&&S.bank.last.n)||0;
  if(prev>=20&&plan.rows<prev*0.5) plan.guard=`The sheet now has ${plan.rows} usable questions, but last time it had ${prev}. Someone may have deleted or filtered rows.`;
  return plan;
}

const clone=o=>JSON.parse(JSON.stringify(o));
function bankMake(def,prev){
  const c=mk({id:'bk:'+def.bid,bid:def.bid,bank:true,bh:def.bh,row:def.row,n:def.row,docId:def.docId,docName:def.docName,type:def.type,front:def.front,choices:def.choices,answer:def.answer,answerText:def.answerText,solution:def.solution,back:def.back,subject:def.subject,topic:def.topic,lesson:def.lesson,mode:def.mode,mv:1,tv:3,ks:def.ks});
  if(def.sl) c.sl=def.sl;
  if(def.rep) c.rep=def.rep.map(x=>[...x]);
  if(prev){   // what you did with the card stays; only the wording and labels come from the sheet
    if(prev.rn) c.rn=prev.rn; if(LV.includes(prev.lvl)) c.lvl=prev.lvl;
    c.sr=prev.sr; c.attempts=prev.attempts||0; c.correct=prev.correct||0; if(prev.star) c.star=true; if(prev.miss!==undefined) c.miss=prev.miss; if(prev.mod) c.mod=prev.mod;
    repFrom(c,prev,!prev.bank);   // a file card the sheet takes over still counts as a source
    if(!c.answer&&prev.manual&&prev.answer&&c.choices.some(x=>x.k===prev.answer)){ c.answer=prev.answer; c.manual=true; c.ok=true; c.ks=c.ks||'marked'; }
    if(prev.check&&prev.front===c.front&&prev.answer===c.answer) c.check=prev.check;
  }
  return c;
}
async function bankApply(){
  const plan=S.bank.plan; if(!plan||S.bank.busy) return;
  S.bank.busy=true; render();
  const snap={t:Date.now(),added:[],changed:[],adopted:[],gone:[],revived:[]}; let replacedEdits=0;
  try{
    for(const def of plan.add){ const c=bankMake(def); cards.push(c); snap.added.push(c.id); await DB.put('questions',c); }
    for(const {old,def} of plan.change){ snap.changed.push(clone(old)); const c=bankMake(def,old); if(old.manual&&(old.front!==c.front||old.answer!==c.answer)) replacedEdits++; const i=cards.indexOf(old); if(i>=0) cards[i]=c; else cards.push(c); await DB.put('questions',c); }
    for(const {old,def} of plan.adopt){ snap.adopted.push({old:clone(old),id:'bk:'+def.bid}); const c=bankMake(def,old); const i=cards.indexOf(old); if(i>=0) cards.splice(i,1); cards.push(c); await DB.del('questions',old.id); await DB.put('questions',c); }
    for(const c of plan.revive){ snap.revived.push(c.id); c.gone=false; await DB.put('questions',c); }
    for(const {old,rep:rr} of (plan.reps||[])){ let ch=false; for(const x of rr) if(repAdd(old,{k:x[0],n:x[1]})) ch=true; if(ch) await DB.put('questions',old); }   // repeats noticed in the sheet: quiet, nothing to undo
    for(const c of plan.gone) if(!c.gone){ snap.gone.push(c.id); c.gone=true; await DB.put('questions',c); }
    await Meta.set('undo',snap); await applyPending();
    S.bank.last={t:snap.t,n:plan.rows}; try{ localStorage.setItem('br-bank',JSON.stringify({url:S.bank.url,t:snap.t,n:plan.rows})); }catch(e){}
    S.bank.undo=bankSummary(snap); S.bank.plan=null; S.bank.busy=false; S.bank.done={add:snap.added.length,change:snap.changed.length,adopt:snap.adopted.length,replacedEdits,problems:plan.problems.length,gone:plan.gone.length};
    buildQueue(); render(); toast(`Synced: ${snap.added.length} new, ${snap.changed.length} updated, ${snap.adopted.length} kept your progress`);
  }catch(e){ S.bank.busy=false; S.bank.plan=null; S.bank.err='The sync stopped partway: '+(e.message||e); S.bank.hint='Press "Undo last sync" to put things back, then try again.'; try{ await Meta.set('undo',snap); S.bank.undo=bankSummary(snap); }catch(_){} buildQueue(); render(); }
}
const bankSummary=s=>({t:s.t,added:s.added.length,changed:s.changed.length,adopted:s.adopted.length});
async function bankUndo(){
  const snap=await Meta.get('undo'); if(!snap){ S.bank.undo=null; render(); return; }
  let kept=0;
  for(const id of snap.added){ const c=byId(id); if(!c) continue; if(c.sr&&c.sr.seen){ kept++; continue; } cards=cards.filter(x=>x!==c); await DB.del('questions',id); }   // a card you have already studied stays
  const keepProgress=(restored,cur)=>{ if(cur){ restored.sr=cur.sr; restored.attempts=cur.attempts; restored.correct=cur.correct; if(cur.star) restored.star=true; else delete restored.star; if(cur.miss!==undefined) restored.miss=cur.miss; if(cur.rn) restored.rn=cur.rn; else delete restored.rn; if(LV.includes(cur.lvl)) restored.lvl=cur.lvl; else delete restored.lvl; } return restored; };
  for(const old of snap.changed){ const cur=byId(old.id); const r=keepProgress(clone(old),cur); const i=cur?cards.indexOf(cur):-1; if(i>=0) cards[i]=r; else cards.push(r); await DB.put('questions',r); }
  for(const {old,id} of snap.adopted){ const cur=byId(id); const r=keepProgress(clone(old),cur); if(cur){ cards=cards.filter(x=>x!==cur); await DB.del('questions',id); } cards.push(r); await DB.put('questions',r); }
  for(const id of snap.revived){ const c=byId(id); if(c){ c.gone=true; await DB.put('questions',c); } }
  for(const id of snap.gone){ const c=byId(id); if(c){ c.gone=false; await DB.put('questions',c); } }
  await Meta.del('undo'); S.bank.undo=null; S.bank.done=null; S.bank.plan=null;
  buildQueue(); render(); toast('Last sync undone'+(kept?` (${kept} new card${kept===1?'':'s'} you already studied stayed)`:''));
}
async function bankRemoveGone(){
  const g=cards.filter(c=>c.gone); for(const c of g) await DB.del('questions',c.id);
  cards=cards.filter(c=>!c.gone); S.bank.confirmGone=false; buildQueue(); render(); toast(g.length+' cards removed');
}
const Meta={   // a tiny second database, so the main one never needs an upgrade
  db:null, failed:false, mem:{},
  async open(){ if(this.db||this.failed) return; try{ this.db=await new Promise((res,rej)=>{ const r=indexedDB.open('board-reviewer-meta',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); r.onblocked=()=>rej(new Error('blocked')); }); }catch(e){ this.failed=true; } },
  async get(k){ await this.open(); if(!this.db) return this.mem[k]||null; return new Promise(res=>{ try{ const q=this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }catch(e){ res(null); } }); },
  async set(k,v){ await this.open(); if(!this.db){ this.mem[k]=v; return; } return new Promise((res,rej)=>{ const t=this.db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); },
  async del(k){ await this.open(); if(!this.db){ delete this.mem[k]; return; } return new Promise(res=>{ const t=this.db.transaction('kv','readwrite'); t.objectStore('kv').delete(k); t.oncomplete=()=>res(); t.onerror=()=>res(); }); }
};

function cardsToCSV(list,idOf){

const ST_SEC={formula:{name:'Formulas',one:'formula',many:'formulas'},note:{name:'Notes',one:'note',many:'notes'},module:{name:'Modules',one:'module',many:'modules'},calc:{name:'Calculator',one:'method',many:'methods'}};
const ST_ORDER=['formula','note','module','calc'], ST_SUBJ=[...SUBJECTS,'General'];
const stSection=v=>{ v=String(v||'').toLowerCase().replace(/[^a-z]/g,''); return /^form/.test(v)?'formula':/^(note|review|summar)/.test(v)?'note':/^(mod|lesson|chapter|reading)/.test(v)?'module':/^(calc|method|shortcut|canon|casio)/.test(v)?'calc':null; };
/*STUDY_PACK_START*/const STUDY_PACK="@Section: Calculator\n@Source: Canon F-789SGA\n@Subject: General\n@Topic: Calculator basics\n\n## Which mode for which problem\nPress `Apps` to open the Apps menu (use the up and down arrow keys to change pages) and pick the mode by name or by its number on screen. Stay in COMP unless the problem needs one of these:\n- COMP: everyday calculations, SOLVE, CALC, derivative, integral, Σ and Π, Pol and Rec.\n- EQN: quadratic, cubic and quartic equations, and 2, 3 or 4 simultaneous equations.\n- CPLX: complex numbers (impedance, phasors, complex power).\n- STAT: mean, standard deviation, regression, normal distribution.\n- MATX: matrices (determinant, inverse, systems).\n- VCTR: vectors (dot product, cross product, length).\n- BASE: binary, octal, decimal, hexadecimal and logic.\n- TABLE: a table of f(x) values, up to 30 rows.\nWatch out: SOLVE, derivative and integral work in COMP only. CALC works in COMP and CPLX only. If a key does nothing, check the mode first.\n\n## Reset to a clean start\nDo this before an exam or when answers look strange. It is a good habit between topics.\n1. Open the Clear menu (see \"Initializing the Calculator\" in your manual for the keys on your model).\n2. Choose All, then press `YES`. This sets the mode to COMP and the angle unit to Degree, and clears the replay and variable memory.\n3. Choosing only the setup reset (then `YES`) puts the settings back but keeps what is stored in the variables.\nTip: after a reset, set the angle unit again if the problem uses radians.\n\n## Angle unit and display format\nPress `Set-up` to open the Set-up menu.\n- Angle unit: 3 Deg, 4 Rad, 5 Gra.\n- Display: 6 Fix (fixed decimal places), 7 Sci (significant digits), 8 Norm (normal, switches to powers of 10 for very large or small numbers).\n- Fraction format: 1 a b/c (mixed number), 2 d/c (improper fraction).\n- Complex format: 1 a+bi, 2 r∠θ.\nWatch out: trigonometry in calculus (derivative, integral, series) needs Rad. Triangle and surveying problems need Deg. A wrong angle unit is the most common wrong answer.\nTip: choose Fix only when you need to round to a stated number of places. Keep Norm while working so no digits are lost.\n\n## Test the answer choices with CALC\nFor a multiple-choice question you can often skip the algebra and try each choice.\n1. Type the equation as an expression using X, with everything moved to one side, for example 2X^2 - 7X - 15.\n2. Press `CALC`. The calculator asks for the value of X.\n3. Type a choice and press `=`. The choice that gives 0 (or makes both sides equal) is the answer.\n4. Press `CALC` again to try the next choice. The expression stays stored (up to 79 steps) until you start a new calculation, change mode or switch off.\nExample: for 2X^2 - 7X - 15 = 0 with choices 3, -3, 5, 1.5: X = 3 gives 18 - 21 - 15 = -18, which is not 0. X = 5 gives 50 - 35 - 15 = 0, so 5 is the answer.\nTip: for a word problem, build the formula once, then press `CALC` for each choice. This is faster and safer than repeating the whole key sequence.\n\n## Use the replay memory and the answer memory\n- Use the arrow keys to bring back the last expression (replay), change one number, and press `=` again. Use it when the same formula is repeated with a new value.\n- `Ans` is the last result. Start the next line with an operator such as × or + and Ans is placed in front for you.\n- Store a result in a variable with `STO` and a letter, and bring it back with `RCL` or `ALPHA` and the letter. Use A, B, C and so on for the values you will need again.\n- Clear all memory values from the Clear menu (the MCL choice) before a new problem set.\nTip: write the intermediate result on paper too. Memory is cleared when you reset.\n\n@Subject: Math\n@Topic: Algebra\n\n## Solve a quadratic, cubic or quartic equation (EQN)\nUse this when the equation is a polynomial. It gives all the roots at once.\n1. Press `Apps` and choose EQN.\n2. Choose 4 Quad EQN (ax^2 + bx + c = 0), 5 Cubic EQN (ax^3 + bx^2 + cx + d = 0) or 6 Quartic EQN.\n3. Type each coefficient and press `=` after it. Type 0 for a missing term. Keep the sign: -6, not 6.\n4. Press `=` (or the down arrow key) to show X1, then move on to X2, X3 (and X4 for a quartic).\nExample: x^3 - 6x^2 + 11x - 6 = 0. Enter 1, -6, 11, -6. The roots are 1, 2 and 3.\nExample: x^4 - 10x^3 + 35x^2 - 50x + 24 = 0. Enter 1, -10, 35, -50, 24. The roots are 1, 2, 3 and 4.\nExample: x^2 + 2x + 5 = 0. Enter 1, 2, 5. The roots are -1 + 2i and -1 - 2i (complex, shown in a+bi form).\nWatch out: move every term to the left first, so the right side is 0. The roots may appear in any order.\n\n## Solve two, three or four simultaneous equations (EQN)\n1. Press `Apps`, choose EQN, then 1 (2 unknowns), 2 (3 unknowns) or 3 (4 unknowns).\n2. Write each equation as a1x + b1y + c1z = d1 (for two unknowns: a1x + b1y = c1). Type the coefficients row by row, pressing `=` after each one. Type 0 for a missing unknown.\n3. After the last coefficient the answers are shown one at a time as X=, Y=, Z= (four unknowns use the letters shown on the screen).\nExample: x + y + z = 6, 2y + 5z = -4, 2x + 5y - z = 27. Enter 1, 1, 1, 6, then 0, 2, 5, -4, then 2, 5, -1, 27. The answers are x = 5, y = 3, z = -2.\nExample: 3x + 2y = 12 and x - y = 1 give x = 2.8 and y = 1.8.\nTip: for word problems, name the unknowns first and write all equations in the same order of unknowns, or the coefficient rows will not line up.\n\n## Solve any equation with SOLVE\nSOLVE finds a root of any equation, even ones with logs, exponents or trig. It uses Newton's method, so it is a numerical answer that depends on the starting guess.\n1. Stay in COMP mode. Type the equation with an equals sign, using X for the unknown, for example 1000(1+X)^5 = 1500.\n2. Start SOLVE (the key or shift function labelled SOLVE).\n3. If the equation has other letters, the calculator asks for their values (for example B?, C?). Type each and press `=`.\n4. Then it asks for a starting value for X. Type a guess near the expected answer and press `=` to see the solution.\n5. Press `=` again if it shows \"Continue\", to let it search further.\nExample: 1000(1+X)^5 = 1500 gives X = 0.0844717712 (an interest rate of 8.447% per period).\nExample: the number of years n for 800((1.08)^X - 1)/0.08 = 5000 gives X = 5.268446244.\nWatch out: \"Can't Solve ERROR\" means no root was found from that guess. Try another starting value, or check that the equation is typed correctly. \"Variable ERROR\" means the equation has no X.\nTip: if the equation has several roots, change the starting value to find the others. Use CALC to check the root.\n\n## Sum of a series with Σ and Π\n1. In COMP mode choose the Σ function (shift function). The form is Σ(f(X), start, end).\n2. Type the expression in X, the first X and the last X, and press `=`. Steps are always 1.\n3. The Π function works the same way and multiplies the terms.\nExample: Σ(2X + 1, 1, 10) = 120 (arithmetic series, 10 terms).\nExample: Σ(2^X, 0, 9) = 1023 (geometric series, first term 1, ratio 2).\nTip: use it to check S_n formulas. For an infinite series, add enough terms and watch where the sum settles.\n\n## Permutations, combinations and factorials\n1. Type n, then the nPr (permutation) or nCr (combination) function, then r, and press `=`.\n2. Use the factorial key after a number for n!.\nExample: 8P3 = 336. 10C4 = 210.\nWatch out: use permutations when order matters (arranging, ranking) and combinations when it does not (choosing a group).\n\n## GCD, LCM, prime factors and remainders\nThese come from the calculator's number functions in COMP mode.\n- GCD(84, 126) = 42 and LCM(12, 18) = 36.\n- Prime factorization: 360 = 2^3 × 3^2 × 5.\n- Quotient and remainder: 47 ÷ 5 = 9 remainder 2. Use Mod for the remainder alone.\nTip: GCD is the biggest number that divides all terms. LCM gives the common denominator for fractions.\n\n@Subject: Math\n@Topic: Trigonometry\n\n## Degrees, minutes and seconds (DMS)\n- To enter an angle, type degrees, press the °′″ key, then minutes, the key again, then seconds, the key again.\n- To convert a decimal angle, type it and press `=`, then use the DMS conversion so it shows degrees, minutes and seconds.\n- To change DMS to decimal, type the angle in DMS form and press `=` in Deg mode.\nExample: 35°45′ = 35.75°. 1.5° = 1°30′0″.\nWatch out: stay in Deg mode when the answer is in degrees.\n\n## Convert between rectangular and polar with Pol( and Rec(\nUse it for vectors, forces, phasors and complex numbers.\n1. In COMP mode, with the angle unit set to Deg, choose the Pol( or Rec( function.\n2. Pol(x, y) gives the length r and the angle θ. Rec(r, θ) gives x and y.\n3. The results are shown one after another and are also stored in the variables X and Y.\nExample: Rec(2, 60) gives X = 1 and Y = 1.732050808.\nExample: Pol(1, √3) gives r = 2 and θ = 60.\nWatch out: θ comes out between -180° and 180°. Add 360° if you need a positive angle.\n\n@Subject: Math\n@Topic: Differential Calculus\n\n## Derivative at a point\nThe form is d/dx(f(X), a, Δx). Δx is optional.\n1. In COMP mode choose the derivative function, then type the function in X, the point a and, if you like, Δx.\n2. Press `=`. The answer is the slope of f at X = a.\nExample: d/dx(X^3, 2) = 12.\nWatch out: set the angle unit to Rad when f has sin, cos or tan. A \"Time Out ERROR\" means the calculation was too long: try a simpler function.\nTip: use it to check a derivative you worked out by hand. Evaluate your answer at the same point and compare. To find a maximum or minimum, look for the value of X where the derivative is 0.\n\n@Subject: Math\n@Topic: Integral Calculus\n\n## Definite integral\nThe form is ∫(f(X), a, b, n). The last number n is optional.\n1. In COMP mode choose the integral function, then type the function in X, the lower limit a and the upper limit b.\n2. Press `=`. It gives the area under the curve from a to b.\nExample: ∫(X^2, 0, 1) = 0.3333333333 (that is 1/3).\nExample: with the angle unit set to Rad, ∫(sin(X), 0, π) = 2.\nWatch out: the answer is a numerical value, so give your answer to the number of places the problem wants. Set the angle unit to Rad for trig functions.\nTip: for an area between two curves, integrate the difference f(X) - g(X). For a volume by disks, integrate π(f(X))^2.\n\n@Subject: Math\n@Topic: Advanced Mathematics\n\n## Matrices: determinant, inverse and systems of equations\n1. Press `Apps` and choose MATX.\n2. Use the Dim choice to set the size of MatA (up to 4 × 4), then the Data choice to type its entries row by row.\n3. Do the same for MatB if you need a second matrix.\n4. In the calculation screen, bring the matrices in from the matrix menu (MatA, MatB, and the functions Det, Trn, Ide, Adj and Inv).\n5. Use Det(MatA) for the determinant, Inv(MatA) for the inverse, Trn for the transpose and Adj for the adjoint.\nExample: A = [[1, 1, 1], [0, 2, 5], [2, 5, -1]] and B = [[6], [-4], [27]].\nThe determinant is -21. The solution of AX = B is X = Inv(MatA) × MatB, which gives 5, 3 and -2.\nWatch out: matrices added or subtracted must be the same size. To multiply, the number of columns of the first must equal the number of rows of the second. A matrix with determinant 0 has no inverse.\nTip: for a system of 3 or 4 equations the EQN mode is quicker. Use matrices when you also need the determinant or the inverse.\n\n## Vectors: dot product, cross product and length\n1. Press `Apps` and choose VCTR.\n2. Use Dim to choose 2D or 3D for VctA, then Data to type the components. Do the same for VctB.\n3. In the calculation screen bring in VctA and VctB from the vector menu. Use the Dot function for the dot product, the × sign for the cross product, and Abs for the length.\nExample: A = (1, 2, 3) and B = (4, 5, 6). A · B = 32. A × B = (-3, 6, -3). |A| = 3.741657387.\nTip: the angle between vectors is cos^-1 of (A · B)/(|A||B|). The dot product is 0 when the vectors are perpendicular.\n\n@Subject: Math\n@Topic: Statistics and Probability\n\n## Mean and standard deviation (STAT, SD)\n1. Press `Apps` and choose STAT. Choose type 1 (SD, one variable).\n2. Type each data value into the table, pressing `=` after each one. If the table has a FREQ column, type the frequency too.\n3. Leave the table, open the STAT menu and use S-VAR for the results: the mean x̄, the population standard deviation σx and the sample standard deviation sx. S-SUM gives n, Σx and Σx².\nExample: data 75, 85, 90, 77, 79. n = 5, x̄ = 81.2, Σx = 406, Σx² = 33120. The population standard deviation is 5.528109984 and the sample standard deviation is 6.180614856.\nWatch out: use σ (divide by n) when the data is the whole population and s (divide by n - 1) when it is a sample. Read the problem to choose.\nTip: clear the old data before starting a new set (the Edit choice in the STAT menu).\n\n## Regression and estimates (STAT, Lin and Quad)\n1. Press `Apps`, choose STAT, then pick the type: 2 Lin (a straight line), 3 Quad, 4 Log, 5 e EXP, 6 ab EXP, 7 Pwr or 8 Inv.\n2. Type the x values in the X column and the y values in the Y column.\n3. Open the STAT menu: Reg gives the coefficients A, B (and C for Quad) and the correlation r for Lin. The same menu estimates y for a given x and x for a given y.\nExample (Lin): x = 1, 2, 3, 4, 5 and y = 2.1, 3.9, 6.2, 7.8, 10.1 give A = 0.05, B = 1.99 and r = 0.9986517556. The estimate at x = 6 is 11.99.\nExample (Quad): x = 18, 35, 40, 21, 19 and y = 38, 54, 59, 40, 38. The estimate of y at x = 30 is 48.69615715. For y = 50 the two values of x are 31.30538226 and -167.1096731.\nWatch out: r close to 1 or -1 means a straight line fits well. A quadratic fit can give two answers for x.\n\n## Normal distribution with P(, Q( and R(\n1. In STAT mode open the STAT menu and choose Distr. The choices are P(, Q(, R( and t.\n2. First convert your value to the standard score t = (x - mean)/σ and put it in t.\n3. P(t) is the area to the left of t. Q(t) is the area between the mean and t. R(t) is the area to the right of t.\nExample: P(1) = 0.8413447461, Q(1) = 0.3413447461, R(1) = 0.1586552539.\nTip: the area between two scores is P(t2) - P(t1). For a negative t, use P(t) directly.\n\n@Subject: Math\n@Topic: Numerical Solutions\n\n## Table of values to find roots and maxima (TABLE)\n1. Press `Apps` and choose TABLE.\n2. Type f(X), for example X^2 - 5X + 6, and press `=`. If a second function g(X) is offered, leave it empty.\n3. The calculator asks for Start (default 1), End (default 5) and Step (default 1). There is room for 30 values at most.\n4. Press `=` to see the table. Move with the arrow keys.\nExample: f(X) = X^2 - 5X + 6 with Start 0, End 6 and Step 1 gives 6, 2, 0, 0, 2, 6, 12. The zeros at X = 2 and X = 3 are the roots.\nTip: narrow Start and End and use a smaller Step to zoom into a root or a minimum. A sign change between two rows means a root lies between them (bisection and false position).\n\n## Check Newton-Raphson and iteration with SOLVE\nThe SOLVE function is itself Newton's method, so you can use it to check a hand solution.\n1. Type the equation in X and start SOLVE.\n2. Give the same starting value x0 as the problem, so the root found is the one the problem means.\n3. Compare with your last iteration. If they differ, one of your steps has an arithmetic slip.\nTip: for iteration like x_{n+1} = g(x_n), type g(Ans) after storing x0, and press `=` repeatedly. Each press gives the next iteration.\n\n@Subject: ESAS\n@Topic: Engineering Economics\n\n## Find the interest rate or the number of periods (SOLVE)\nUse SOLVE when the formula cannot be rearranged easily for i or n.\n1. Type the formula with X in place of the unknown, for example ((1+X)^5 - 1)/X = 6.25 for an annuity of 5 payments, or 1000(1+X)^5 = 1500 for a lump sum.\n2. Start SOLVE and give a starting guess (0.05 for a rate, 5 for a number of years).\n3. The result is the interest rate per period as a decimal, or the number of periods.\nExample: 1000(1+X)^5 = 1500 gives X = 0.0844717712, which is 8.447% per year.\nExample: ((1+X)^5 - 1)/X = 6.25 gives X = 0.1117890814 (starting guess 0.1), which is 11.18% per year. That is the rate at which 5 yearly payments of 800 amount to 5000.\nExample: an annuity of 800 per year at 8% amounts to 5000 after 5.268 years (800((1.08)^X - 1)/0.08 = 5000).\nWatch out: the annuity formulas count payments at the end of each period. Use the \"due\" formula when payments start immediately.\nTip: use CALC to compare several interest rates for the same cash flows.\n\n@Subject: ESAS\n@Topic: Mechanics\n\n## Resultant of forces with Pol( and Rec(\n1. Convert each force to x and y components with Rec(F, θ) in Deg mode. Write them down or store them in variables.\n2. Add all the x components and all the y components.\n3. Use Pol(Σx, Σy) to get the resultant R and its direction θ.\nExample: 100 N at 30° and 80 N at 120°. The components are (86.60, 50) and (-40, 69.28). The sum is (46.60, 119.28). The resultant is 128.06 N at 68.66° from the x-axis.\nTip: for forces at the same point, the resultant of two forces is also given by the law of cosines. The calculator gives both with the same answer. Use whichever is faster.\n\n@Subject: ESAS\n@Topic: Computer and Logic\n\n## Number bases and logic (BASE)\n1. Press `Apps` and choose BASE.\n2. Choose the number system for the input and the display: DEC (decimal), HEX (hexadecimal), BIN (binary) or OCT (octal). The same number is shown in the system you choose.\n3. Type the number and press `=`. Change the system to convert it.\n4. The logic functions are and, or, Xor, Xnor, Not and Neg.\nExample: 255 in decimal is FF in hexadecimal, 11111111 in binary and 377 in octal.\nExample: 1010 and 0110 gives 0010. 1010 Xor 0110 gives 1100. 1010 or 0110 gives 1110 (all in binary).\nWatch out: BASE mode has no decimals and no scientific functions. A binary or octal answer longer than 8 digits is shown in blocks, so look for the next-block mark.\n\n@Subject: EE\n@Topic: AC Circuits 1\n\n## Impedance and phasors in CPLX mode\n1. Press `Apps` and choose CPLX. In Set-up, choose the complex format: a+bi or r∠θ.\n2. Type rectangular numbers as a + b i. The calculator uses i for what you write as j. Type a polar number as r, the ∠ symbol, then θ (with the angle unit set to Deg).\n3. Add, subtract, multiply and divide as usual. The result is shown in the format you chose.\n4. Abs gives the magnitude, Arg the angle, Conjg the conjugate, and Real and Imag the parts.\nExample: 3 + 4i is 5∠53.13010235 in polar form (Abs 5, Arg 53.13010235°).\nExample (series): 10∠30° + 5∠-45° = 12.19578794 + 1.464466094i, which is 12.2834∠6.8473°.\nExample (parallel): Z1 = 3 + 4i and Z2 = 6 - 8i. Z1 Z2/(Z1 + Z2) = 4.639175258 + 2.06185567i, which is 5.0767∠23.9625°.\nWatch out: put brackets around each impedance when you divide, and around the sum in the denominator. Switch back to COMP for ordinary real-number work.\n\n@Subject: EE\n@Topic: AC Circuits 2\n\n## Complex power and the power triangle (Conjg)\n1. In CPLX mode type the voltage as V∠θv and the current as I∠θi.\n2. Apparent complex power S = V × Conjg(I). The conjugate flips the sign of the current angle.\n3. Read the answer: Real is the real power P in watts, Imag is the reactive power Q in vars, Abs is the apparent power S in VA, and Arg is the power factor angle.\nExample: V = 120∠0° and I = 5∠-30°. S = 519.6152423 + 300i. P = 519.6 W, Q = 300 var, S = 600 VA, power factor angle 30°, power factor cos 30° = 0.866 (lagging).\nWatch out: use the conjugate of the current, not of the voltage. For three-phase work, use line values with √3 or use the phase values with a factor of 3, and keep one choice for the whole problem.\nTip: use the same steps to add loads. Add the complex powers of each load and read P and Q from the total.\n\n@Section: Calculator\n@Source: Canon F-789SGA\n@Subject: ESAS\n@Topic: Engineering Economics\n\n## Present worth by summation: the idea\nThe present worth of a series of payments is the sum of every payment brought back to time 0. A payment of A made at the end of period k is worth A(1 + i)^{-k} now. The Σ function adds all of them in one go, so you do not need the long closed formulas.\n1. Find the interest rate i for one payment period (12% compounded monthly gives i = 0.01 a month) and the number of payments n.\n2. In COMP mode choose the Σ function. The form is Σ(f(X), start, end), and X counts the periods.\n3. For f(X) type one payment brought back to time 0, using X for the period number. Then type the first period and the last period in which a payment is made.\n4. Press `=`.\nExample: Σ(100(1.05)^(-X), 1, 3) is the present worth of Php 100 at the end of each of 3 years at 5%. It gives 272.3248029.\nWatch out: type the exponent with the negative sign key, not the minus key. The first X and the last X must be the periods of the first and last payment. That is the only part that changes between an ordinary annuity, an annuity due and a deferred annuity.\nTip: Use the sum to check an answer from a formula. To find an unknown rate or an unknown number of payments, use SOLVE with the closed formula instead. The manual does not allow Σ inside a SOLVE equation.\n\n## Summation: ordinary annuity\nPayments are made at the end of periods 1 to n.\nP = Σ A(1 + i)^{-X}, from X = 1 to n\n1. Type Σ(A(1 + i)^(-X), 1, n) with your numbers in place of A, i and n.\n2. Press `=`.\nExample: Php 5,000 at the end of each month for 3 years at 12% compounded monthly. Type Σ(5000(1.01)^(-X), 1, 36) and press `=`. The answer is 150,537.525, so P = Php 150,537.53. This is the same as the formula answer.\nTip: For a future worth, take the present worth and multiply by (1 + i)^{n}.\n\n## Summation: annuity due\nThe first payment is made at time 0 and the last one at the end of period n - 1.\nP = Σ A(1 + i)^{-X}, from X = 0 to n - 1\n1. Type Σ(A(1 + i)^(-X), 0, n - 1).\n2. Press `=`.\nExample: Php 5,000 at the start of each month for 3 years at 12% compounded monthly. Type Σ(5000(1.01)^(-X), 0, 35) and press `=`. The answer is 152,042.900, so P = Php 152,042.90.\nTip: The same answer comes from the ordinary annuity value times (1 + i): 150,537.53 (1.01) = 152,042.90.\n\n## Summation: deferred annuity\nIf the first payment is at the end of period m + 1, the payments are in periods m + 1 to m + n. Every payment is brought back the full distance to time 0, so no extra deferment factor is needed.\nP = Σ A(1 + i)^{-X}, from X = m + 1 to m + n\n1. Work out the period of the first payment and the period of the last payment.\n2. Type Σ(A(1 + i)^(-X), first period, last period).\n3. Press `=`.\nExample: Php 20,000 at the end of each year for 10 years, with the first payment at the end of year 4, at 10%. The payments are in years 4 to 13. Type Σ(20000(1.1)^(-X), 4, 13) and press `=`. The answer is 92,330.084, so P = Php 92,330.08.\nWatch out: A payment first made at the end of period 4 is deferred 3 periods, but the sum starts at X = 4, not X = 3.\n\n## Summation: arithmetic gradient\nThe payment in period k is A + (k - 1) G. It starts at A and rises by G every period.\nP = Σ [A + (X - 1) G](1 + i)^{-X}, from X = 1 to n\n1. Type Σ((A + (X - 1)G)(1 + i)^(-X), 1, n).\n2. Press `=`.\nExample: The first payment is Php 10,000 and every later payment is Php 2,000 more. There are 8 yearly payments and money is worth 10%. Type Σ((10000 + (X - 1)2000)(1.1)^(-X), 1, 8) and press `=`. The answer is 85,406.605, so P = Php 85,406.61.\nExample: A pure gradient has A = 0, so the first payment is 0 and the second is G. For G = 2,000, 8 years and 10%, type Σ((X - 1)2000(1.1)^(-X), 1, 8). The answer is 32,057.343, the same as (G/i)[(1 - (1 + i)^{-n})/i - n(1 + i)^{-n}].\nTip: If the payments go down by G each period, use -G.\n\n## Summation: geometric gradient\nThe payment in period k is A(1 + g)^{k-1}. It starts at A and grows by the same percentage g every period.\nP = Σ A(1 + g)^{X-1}(1 + i)^{-X}, from X = 1 to n\n1. Type Σ(A(1 + g)^(X - 1)(1 + i)^(-X), 1, n).\n2. Press `=`.\nExample: The first payment is Php 10,000 at the end of year 1 and the payments grow 5% a year for 10 years. Money is worth 8%. Type Σ(10000(1.05)^(X - 1)(1.08)^(-X), 1, 10) and press `=`. The answer is 81,835.539, so P = Php 81,835.54. The formula A[1 - ((1 + g)/(1 + i))^{n}]/(i - g) gives the same.\nTip: When i and g are equal, the formula divides by zero, but the sum still works. For i = g = 8%, n = 10 and A = 10,000, the sum is 92,592.59, which equals n A/(1 + i).\n\n@Subject: ESAS\n@Topic: Mechanics 2\n\n## Projectile: range, height and time of flight (SOLVE)\nFor a projectile launched from level ground with speed v at angle θ:\nR = v^{2} sin(2θ)/g\nh = (v sin θ)^{2}/(2g)\nt = 2 v sin θ/g\nPut each equation into SOLVE with the unknown as X on the left side and the known values as numbers. Use g = 9.81.\n1. Use COMP mode and set the angle unit to Deg.\n2. Type the equation with X in place of the unknown and the known result on the right side of the equals sign.\n3. Start SOLVE (the key or shift function labelled SOLVE). If the equation has other letters, it asks for their values first.\n4. Type a starting value near the expected answer, then press `=`.\nExample: The speed needed for a range of 100 m at 30°. Type X^2 sin(2 × 30)/9.81 = 100. The answer is X = 33.6565 m/s.\nExample: The launch angle for a range of 100 m at 35 m/s. Type 35^2 sin(2X)/9.81 = 100. A starting value of 20 gives X = 26.604°. A starting value of 70 gives the other angle, 63.396°. Both give the same range.\nExample: The speed needed for a maximum height of 20 m at 45°. Type (X sin(45))^2/(2 × 9.81) = 20. The answer is X = 28.0143 m/s.\nExample: The launch angle for a time of flight of 5 s at 40 m/s. Type 2 × 40 sin(X)/9.81 = 5. The answer is X = 37.8158°.\nWatch out: The three formulas are for landing at the same level as the launch. For other cases, use y = v sin θ × t - (1/2) g t^{2}. A ball launched at 20 m/s at 40° from the top of a 15 m cliff lands when 20 sin(40)X - 0.5 × 9.81 X^2 = -15. Start SOLVE with a positive guess such as 3 to get X = 3.4958 s. A starting value of 1 or 0 finds the negative root, -0.8748, which is not the answer.\nTip: sin(2θ) = k has two angles, θ and 90° - θ, so run SOLVE twice with a small and a large starting value. Check the answer with CALC.\n\n## Uniform acceleration: any unknown (SOLVE)\nThe same method works for the motion equations:\nv = v_{0} + a t\ns = v_{0} t + (1/2) a t^{2}\nv^{2} = v_{0}^{2} + 2 a s\n1. Pick the equation that has your unknown and the three known quantities.\n2. Type it with X for the unknown on the left side and the known value on the right side.\n3. Start SOLVE, give a starting value and press `=`.\nExample: The time to travel 150 m starting at 12 m/s with an acceleration of 3 m/s^{2}. Type 12X + 0.5 × 3 × X^2 = 150. With a positive starting value the answer is X = 6.7703 s.\nExample: The starting speed if the final speed is 30 m/s after 100 m at 3 m/s^{2}. Type X^2 + 2 × 3 × 100 = 30^2. The answer is X = 17.3205 m/s.\nWatch out: An equation with X^{2} has a positive and a negative root. Keep the physical one. In EQN mode, a quadratic gives both roots at once.\n\n@Section: Calculator\n@Source: Canon F-789SGA\n\n@Subject: General\n@Topic: Calculator basics\n\n## Parallel resistors and series capacitors in one line\nBoth use the same pattern: add the reciprocals, then take the reciprocal of the sum.\n1. Type each value to the power -1, add them inside brackets, and put the whole bracket to the power -1.\n2. Press `=`.\nExample: resistors of 6, 3 and 2 ohms in parallel: (6^(-1) + 3^(-1) + 2^(-1))^(-1) = 1 ohm.\nExample: capacitors of 4 µF and 6 µF in series: (4^(-1) + 6^(-1))^(-1) = 2.4 µF.\nTip: for only two values, product over sum is shorter: 12 × 4/(12 + 4) = 3. In CPLX mode the same line gives parallel impedances.\n\n## Constants and unit conversion (Const and Conv)\nThe calculator keeps 79 physical constants and 172 unit conversions, so you do not have to type them.\nConstants:\n1. In COMP mode open the constants menu (see your manual for the key on your model).\n2. Move through the pages, pick the constant and confirm it. You can also type the item number of the constant.\n3. It is placed in your expression like a number.\nConversions:\n1. Type the number.\n2. Open the conversion menu, choose the category page (distance, area, temperature, capacity, weight, energy, pressure or speed), then the pair of units.\n3. Press `=`.\nExample (from Canon's manual): 10 + (5 ft² → m²) = 10.4645152.\nWatch out: the stored value of gravity is 9.80665 m/s², so answers differ slightly from those worked with 9.81. Use the value your reviewer or the answer choices use. Constants cannot be rounded.\nTip: if a conversion result is too large, the calculator shows an error.\n\n## Store values in variables and use them in formulas\nThe calculator has 19 memory variables: 0 to 9, A to F, M, X and Y.\n1. Work out the value you want to keep.\n2. Press the store key (STO), then the letter key of the variable, for example A.\n3. Type A in later formulas like a number, or bring it back with the recall key.\n4. Pol( and Rec( put their two results in X and Y. A quotient with remainder puts them in C and D.\nExample: store 4.5 in A. Then π A² = 63.61725124, the area of a circle with radius 4.5. Change A to 6 and replay the line: π A² = 113.0973355.\nWatch out: X is also the unknown of SOLVE, CALC and TABLE. A reset clears every variable.\nTip: store the constants of a problem (the rate i, the gravity g, the gas constant R) once and type the formula with letters.\n\n@Subject: Math\n@Topic: Algebra\n\n## Exponential and logarithmic equations (SOLVE and Log)\nUse SOLVE when the unknown is in an exponent or inside a logarithm.\n1. Type the equation with X as the unknown, for example 5^X = 200.\n2. Start SOLVE, give a starting value, and press `=`.\n3. For a logarithm to another base, use the Log function that asks for the base and the number, or change the base: log_a(b) = log(b)/log(a).\nExample: 5^X = 200 gives X = 3.292030.\nExample: log(X) + log(X - 3) = 1 gives X = 5 (use a starting value above 3, because logarithms of negative numbers do not exist). The algebra also gives X = -2, which is rejected.\nExample: log base 2 of 32 is log(32)/log(2) = 5.\nWatch out: always check the answer in the original equation for a domain problem.\n\n## Word problems: mixture, motion and work (EQN and SOLVE)\nWrite one equation for each unknown and solve the pair with EQN (2 unknowns).\nMixture: x litres of 40% acid and y litres of 70% acid make 20 litres of 50% acid. The equations are x + y = 20 and 0.4x + 0.7y = 10. In EQN enter 1, 1, 20, then 0.4, 0.7, 10. The answers are x = 13.3333 and y = 6.6667.\nMotion: a boat goes 24 km downstream in 2 hours and back upstream in 3 hours. With boat speed b and current c: b + c = 12 and b - c = 8. The answers are b = 10 km/h and c = 2 km/h.\nWork: pipe A fills a tank in 6 hours and pipe B in 12 hours. Together, 1/X = 1/6 + 1/12 in SOLVE (starting value 3) gives X = 4 hours.\nTip: for work problems add the rates, not the times.\n\n## Binomial expansion terms with nCr\nThe term number r + 1 of (a + b)^n is nCr × a^(n - r) × b^r.\n1. Decide a, b, n and the term you want.\n2. Type n, the nCr function, r, then multiply by a^(n - r) and b^r.\nExample: the coefficient of x³ in (2x - 1)^7. Here a = 2x, b = -1, n = 7 and x³ means n - r = 3, so r = 4. Type 7 nCr 4 × 2^3 × (-1)^4 = 280.\nExample: the middle term of (x + y)^8 is the 5th term, r = 4: 8 nCr 4 = 70.\nWatch out: count r from 0, so the first term has r = 0. Keep the sign of b inside the brackets.\n\n## Remainder and factor theorems with CALC\nThe remainder of P(x) divided by (x - a) is P(a). If it is 0, (x - a) is a factor.\n1. Type the polynomial in X, for example X^3 - 4X^2 + X + 6.\n2. Press `CALC` and type a.\n3. The result is P(a).\nExample: P(x) = x³ - 4x² + x + 6. P(2) = 0, P(-1) = 0 and P(3) = 0, so (x - 2), (x + 1) and (x - 3) are factors. Dividing by (x + 2) leaves the remainder P(-2) = -20.\nTip: the factors of the last term (here ±1, ±2, ±3, ±6) are the first values to try.\n\n## Progressions: find n, a term or a sum\nArithmetic: a_n = a_1 + (n - 1)d. Geometric: a_n = a_1 r^(n - 1).\n1. Put the known values in the formula and use X for the unknown number of terms, then start SOLVE.\n2. For the sum, use the Σ function, or the sum formula.\nExample (arithmetic): 3 + (X - 1)4 = 99 gives X = 25. The sum is Σ(3 + (X - 1)4, 1, 25) = 1275.\nExample (geometric): in 2, 6, 18, ... find which term is 4374. 2 × 3^(X - 1) = 4374 gives X = 8. The sum of 8 terms is 2(3^8 - 1)/(3 - 1) = 6560.\nTip: if SOLVE gives a number that is not a whole number, the term is not in the progression.\n\n@Subject: Math\n@Topic: Trigonometry\n\n## Inverse trigonometric functions\n1. Set the angle unit (Deg for degrees).\n2. Use the sin⁻¹, cos⁻¹ and tan⁻¹ functions and type the ratio.\nExample: sin⁻¹(0.5) = 30°, cos⁻¹(-0.5) = 120°, tan⁻¹(-1) = -45°.\nWatch out: the calculator gives only the principal value. sin⁻¹ gives -90° to 90°, cos⁻¹ gives 0° to 180° and tan⁻¹ gives -90° to 90°. The same ratio can come from another quadrant, so check the problem.\nTip: to get an angle in the right quadrant from x and y, use Pol(x, y). Pol(-1, 1) gives r = 1.414214 and θ = 135°.\n\n## Solve a triangle: law of cosines and law of sines\nSet the angle unit to Deg.\nTwo sides and the included angle (SAS): c = √(a² + b² - 2ab cos C). Type √(7^2 + 9^2 - 2×7×9×cos(50)). With a = 7, b = 9 and C = 50° it gives c = 7.0006. The area is (1/2)ab sin C = (1/2)(7)(9) sin(50) = 24.1304.\nTwo angles and a side (AAS): from a = 12, A = 40° and B = 65°, b = a sin B/sin A. Type 12 sin(65)/sin(40) = 16.9196.\nThree sides (SSS): cos C = (a² + b² - c²)/(2ab). With 5, 6 and 7, C = cos⁻¹((5^2 + 6^2 - 7^2)/(2×5×6)) = 78.4630°.\nWatch out: when you know two sides and an angle that is not between them (SSA), there may be two triangles, one or none. Check with sin⁻¹ and the 180° - angle choice.\n\n## Trigonometric equations with SOLVE\nSOLVE finds one angle each time. The starting value decides which one, so run it again with other starting values.\n1. Set Deg. Type the equation with X as the angle, for example 2sin(X)^2 + sin(X) = 1.\n2. Start SOLVE with a guess near an angle you expect, then press `=`.\n3. Change the guess to find the other angles in the range.\nExample: 2sin²X + sinX - 1 = 0 has roots 30°, 150° and 270° between 0° and 360°. Starting values near 20, 140 and 260 should give them.\nExample: tan(X) = 2. The principal answer is 63.4349°. The other answer in 0° to 360° is 180° + 63.4349° = 243.4349°.\nTip: first solve for the function (here sin X = 1/2 or sin X = -1) with EQN or by hand, then use the inverse function and the quadrants.\n\n## Spherical triangles\nSet the angle unit to Deg. Capital letters are the angles and small letters are the sides, all measured as angles.\nLaw of cosines for sides: cos a = cos b cos c + sin b sin c cos A.\nLaw of cosines for angles: cos A = -cos B cos C + sin B sin C cos a.\nSpherical excess: E = A + B + C - 180°. Area = π R² E/180.\nExample: b = 60°, c = 70° and A = 50°. cos a = cos(60)cos(70) + sin(60)sin(70)cos(50), so a = cos⁻¹(cos(60)cos(70) + sin(60)sin(70)cos(50)) = 46.0437°.\nExample: a spherical triangle with angles 100°, 80° and 70° on a sphere of radius 10 has E = 70° and an area π(10)²(70)/180 = 122.1730.\nWatch out: the angle sum of a spherical triangle is more than 180°.\n\n@Subject: Math\n@Topic: Geometry\n\n## Triangle area: Heron's formula, inradius and circumradius\n1. Find the half perimeter s = (a + b + c)/2.\n2. Type √(s(s - a)(s - b)(s - c)) with the numbers.\n3. The inradius is r = Area/s and the circumradius is R = abc/(4 × Area).\nExample: sides 13, 14, 15. s = 21. Area = √(21×8×7×6) = 84. r = 4 and R = 13×14×15/(4×84) = 8.1250.\nTip: store s in A (see \"Store values in variables\") so the second and third factors only need the side.\n\n## Regular polygons: number of sides and area\nInterior angle of a regular polygon: (n - 2)(180°)/n.\n1. To find n from an interior angle, type (X - 2)×180/X = 156 and use SOLVE.\n2. Area from the side s: n s²/(4 tan(180/n)). Area from the circumradius R: (1/2) n R² sin(360/n).\nExample: (X - 2)×180/X = 156 gives X = 15 sides.\nExample: a regular hexagon with side 10. Area = 6(10^2)/(4 tan(30)) = 259.8076.\nExample: a regular octagon with circumradius 10. Area = (1/2)(8)(10^2) sin(45) = 282.8427.\nWatch out: use Deg for these formulas.\n\n## Circle sector and segment (SOLVE, Rad)\nWith the central angle θ in radians: sector area = (1/2) r² θ, arc length = r θ, segment area = (1/2) r²(θ - sin θ).\n1. Set the angle unit to Rad. Convert a degree angle with θ = degrees × π/180.\n2. To find θ from an area, put the formula in SOLVE with X as θ.\nExample: r = 10 and θ = 80° = 1.396263 rad. Sector area = 69.8132. Segment area = 50(1.396263 - sin(1.396263)) = 20.5728.\nExample: find θ for a segment area of 30 when r = 10. Type 0.5×100(X - sin(X)) = 30 in SOLVE (Rad, starting value 2). X = 1.5996 rad, which is 91.65°.\nWatch out: a calculator in Deg mode gives a wrong segment, because sin θ must use radians in this formula.\n\n## Frustum, sphere and cylinder: volume and surface\nType each formula once with π from the calculator.\n- Cone frustum: V = πh(R² + Rr + r²)/3 and lateral area = π(R + r)ℓ, where ℓ = √(h² + (R - r)²).\n- Sphere: V = 4πr³/3 and S = 4πr².\n- Cylinder: V = πr²h and lateral area = 2πrh.\nExample: a frustum with R = 5, r = 3 and h = 8. V = π(8)(25 + 15 + 9)/3 = 410.5014. ℓ = √(8² + 2²) = 8.2462 and the lateral area is π(8)(8.2462) = 207.2499.\nExample: a sphere of radius 6. V = 904.7787 and S = 452.3893.\nTip: to find a radius from a volume, use SOLVE: 4π X^3/3 = 1000 gives X = 6.2035.\n\n@Subject: Math\n@Topic: Analytics 1\n\n## Distance, direction, point-to-line distance and angle between lines\nDistance and direction: use Pol( with the differences in x and in y.\n1. Type Pol(x2 - x1, y2 - y1) in Deg mode. The first result is the distance and the second is the angle of the line.\nExample: A(1, 2) and B(7, 10). Pol(6, 8) gives distance 10 and direction 53.1301°. The slope is 8/6 = 1.3333.\nDistance from a point to a line: |Ax₀ + By₀ + C|/√(A² + B²). Type Abs(2×3 - 3×4 - 1)/√(2^2 + 3^2) for the point (3, 4) and the line 2x - 3y - 1 = 0: 1.9415.\nAngle between two lines with slopes m₁ and m₂: tan⁻¹ of the absolute value of (m₂ - m₁)/(1 + m₁m₂). For slopes 3 and 0.5: tan⁻¹(Abs((3 - 0.5)/(1 + 3×0.5))) = 45.0000°.\n\n## Circle through three points; intersection of two lines (EQN)\nThe circle x² + y² + Dx + Ey + F = 0 has three unknowns D, E and F. Each point gives one equation: Dx + Ey + F = -(x² + y²).\n1. Open EQN and choose 3 unknowns.\n2. Enter one row per point: x, y, 1, then -(x² + y²).\n3. The centre is (-D/2, -E/2) and the radius is √(D²/4 + E²/4 - F).\nExample: points (1, 2), (4, 6) and (7, -2). The rows are 1, 2, 1, -5 then 4, 6, 1, -52 then 7, -2, 1, -53. The answers are D = -10.5556, E = -3.8333 and F = 13.2222. The centre is (5.2778, 1.9167) and the radius is 4.2786.\nTwo lines meet where both equations hold. Use EQN with 2 unknowns: for 3x - 2y = 4 and x + 4y = 10, enter 3, -2, 4, then 1, 4, 10. The point is x = 2.5714, y = 1.8571.\n\n## Parabola through three points (EQN)\nA vertical parabola y = ax² + bx + c has three unknowns.\n1. Open EQN with 3 unknowns. Enter a row for each point: x², x, 1, y.\n2. The answers are a, b and c. The vertex is at x = -b/(2a).\nExample: points (1, 2), (2, 3) and (3, 6). The rows are 1, 1, 1, 2 then 4, 2, 1, 3 then 9, 3, 1, 6. The answers are a = 1, b = -2 and c = 3, so y = x² - 2x + 3. The vertex is at x = 1, y = 2.\nTip: check with CALC: type X^2 - 2X + 3 and press `CALC` for each point.\n\n@Subject: Math\n@Topic: Analytics 2\n\n## Direction cosines and angles in space (VCTR)\n1. Open VCTR, choose 3D and enter the vector, for example from the difference of two points.\n2. Abs(VctA) gives the lengt
